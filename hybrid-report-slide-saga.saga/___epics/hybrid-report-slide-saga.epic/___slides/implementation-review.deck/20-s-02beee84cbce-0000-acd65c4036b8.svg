<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Two documents with independent lifecycles under one Saga identity</title>
  <desc id="desc">A living requirements document and several implementation review decks are connected by revision-pinned explains relations while exact code evidence remains on Items.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#091224"/><stop offset="1" stop-color="#15102c"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65d7ff"/></marker>
    <style>
      .h{font:700 38px system-ui,sans-serif;fill:#f8fafc}.sub{font:500 18px system-ui,sans-serif;fill:#a9b7d0}.label{font:700 22px system-ui,sans-serif;fill:#f8fafc}.body{font:500 17px system-ui,sans-serif;fill:#c7d2e5}.tiny{font:600 14px system-ui,sans-serif;fill:#92a4c3}.box{fill:#111d36;stroke:#33476d;stroke-width:2}.accent{fill:#172c45;stroke:#65d7ff;stroke-width:2}.violet{fill:#241d45;stroke:#aa8cff;stroke-width:2}.amber{fill:#3a2915;stroke:#ffbf69;stroke-width:2}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text class="h" x="64" y="70">One Saga identity. Two document lifecycles.</text>
  <text class="sub" x="64" y="104">Requirements preserve product intent; decks explain one implementation comparison.</text>

  <g id="requirements-doc" filter="url(#shadow)">
    <rect class="accent" x="70" y="156" width="390" height="350" rx="28"/>
    <text class="label" x="105" y="205">Living requirements</text>
    <text class="tiny" x="105" y="234">PRODUCT INTENT · LONG-LIVED</text>
    <rect class="box" x="105" y="270" width="320" height="72" rx="14"/>
    <text class="body" x="128" y="300">Story: focused implementation review</text>
    <text class="tiny" x="128" y="325">revision r1 · lifecycle accepted</text>
    <path d="M145 385H380" stroke="#65d7ff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="155" cy="385" r="13" fill="#65d7ff"/><circle cx="260" cy="385" r="13" fill="#65d7ff"/><circle cx="370" cy="385" r="13" fill="#65d7ff"/>
    <text class="tiny" x="135" y="420">r1</text><text class="tiny" x="240" y="420">r2</text><text class="tiny" x="350" y="420">r3</text>
    <text class="body" x="105" y="466">Revised when user intent changes.</text>
  </g>

  <g id="review-decks" filter="url(#shadow)">
    <rect class="violet" x="820" y="156" width="390" height="350" rx="28"/>
    <text class="label" x="855" y="205">Implementation decks</text>
    <text class="tiny" x="855" y="234">REVIEW EXPLANATION · COMPARISON-BOUND</text>
    <rect class="box" x="900" y="276" width="245" height="120" rx="16" transform="rotate(4 1022 336)"/>
    <rect class="box" x="875" y="266" width="245" height="120" rx="16" transform="rotate(-3 997 326)"/>
    <rect class="violet" x="850" y="255" width="245" height="120" rx="16"/>
    <text class="body" x="880" y="300">Deck A · lifecycle model</text>
    <text class="body" x="880" y="332">Deck B · traceability</text>
    <text class="body" x="880" y="364">Deck C · reviewer UI</text>
    <text class="body" x="855" y="466">Replaced when implementation changes.</text>
  </g>

  <g id="explains-link">
    <path d="M470 286C590 220 690 220 810 286" fill="none" stroke="#65d7ff" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M810 370C690 438 590 438 470 370" fill="none" stroke="#aa8cff" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
    <rect class="box" x="527" y="285" width="226" height="80" rx="18"/>
    <text class="label" x="566" y="320">explains</text>
    <text class="tiny" x="551" y="346">pins story revision r1</text>
  </g>

  <g id="item-evidence">
    <rect class="amber" x="260" y="555" width="760" height="92" rx="22"/>
    <text class="label" x="295" y="594">Exact implementation evidence stays on Items</text>
    <text class="body" x="295" y="623">Item → saga-diff URI → code; the relation supplies the path back to accepted intent.</text>
  </g>

  <g id="lifecycle-surprise">
    <path d="M640 145V245" stroke="#ffbf69" stroke-width="3" stroke-dasharray="7 7"/>
    <rect class="amber" x="505" y="118" width="270" height="54" rx="14"/>
    <text class="tiny" x="536" y="151">Shared identity ≠ shared lifecycle</text>
  </g>
</svg>
