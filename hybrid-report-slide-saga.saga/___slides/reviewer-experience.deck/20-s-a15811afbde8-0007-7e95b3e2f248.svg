<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">A deck expands into rendered slide thumbnails and navigates within its own boundary</title>
  <desc id="desc">The Saga sidebar contains a named deck disclosure with three miniature rendered slides. The selected thumbnail points to the full slide in the main area. Previous and next navigation traverses only the active deck and stops before a neighboring deck.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#081725"/><stop offset="1" stop-color="#171029"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker>
    <style>.h{font:700 34px system-ui;fill:#f8fafc}.sub{font:500 16px system-ui;fill:#aab9cf}.label{font:700 17px system-ui;fill:#f8fafc}.body{font:500 14px system-ui;fill:#cbd6e7}.tiny{font:600 12px system-ui;fill:#9fb1cb}.frame{fill:#0d1728;stroke:#324765;stroke-width:2}.panel{fill:#121f34;stroke:#2f4668}.active{fill:#25304f;stroke:#8b9cff;stroke-width:2}.selected{fill:#15343c;stroke:#67e8f9;stroke-width:3}.thumb{fill:#f8fafc;stroke:#63738a;stroke-width:2}.line{stroke:#67e8f9;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text class="h" x="58" y="58">The deck expands into the slides themselves.</text>
  <text class="sub" x="58" y="90">Rendered thumbnails provide deck-shaped navigation; the main pane shows the selected slide at review scale.</text>

  <rect class="frame" x="52" y="122" width="1176" height="548" rx="22"/>
  <rect class="panel" x="52" y="122" width="1176" height="56" rx="22"/>
  <text class="tiny" x="82" y="156">☷  Saga</text><text class="tiny" x="176" y="156">Code Diff</text><text class="tiny" x="276" y="156">Coverage</text>

  <g id="deck-node">
    <rect class="panel" x="72" y="198" width="286" height="444" rx="16"/>
    <rect class="active" x="88" y="218" width="252" height="42" rx="10"/>
    <text class="label" x="107" y="245">⌄  ▱  Reviewer experience</text>
  </g>

  <g id="thumbnail-stack">
    <rect class="thumb" x="112" y="282" width="196" height="110" rx="7"/>
    <path d="M130 307h92M130 326h151M130 345h128" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
    <text x="112" y="412" font-family="system-ui" font-size="12" fill="#cbd6e7">1  Before: separate tab</text>
    <rect class="thumb" x="112" y="430" width="196" height="110" rx="7"/>
    <path d="M132 454h56v62h-56zM201 454h85v62h-85z" fill="#dbeafe" stroke="#64748b"/>
    <text x="112" y="560" font-family="system-ui" font-size="12" fill="#cbd6e7">2  Sidebar hierarchy</text>
  </g>
  <g id="selected-thumbnail">
    <rect class="selected" x="112" y="578" width="196" height="110" rx="7"/>
    <rect x="128" y="592" width="53" height="78" rx="5" fill="#e2e8f0"/>
    <rect x="193" y="592" width="99" height="78" rx="5" fill="#dbeafe"/>
    <text x="112" y="706" font-family="system-ui" font-size="12" fill="#67e8f9">3  Rendered thumbnails</text>
  </g>

  <path class="line" d="M314 628 C382 628 384 428 446 428"/>
  <g id="full-stage">
    <rect class="frame" x="426" y="208" width="766" height="430" rx="16"/>
    <rect x="451" y="233" width="716" height="380" rx="12" fill="#f8fafc"/>
    <text x="486" y="280" font-family="system-ui" font-size="25" font-weight="700" fill="#111827">Rendered thumbnails are the deck navigator</text>
    <rect x="486" y="315" width="180" height="240" rx="14" fill="#e8eef8" stroke="#94a3b8"/>
    <rect x="690" y="315" width="438" height="240" rx="14" fill="#dfe8ff" stroke="#667eea" stroke-width="2"/>
    <path d="M718 357h310M718 392h360M718 427h286" stroke="#94a3b8" stroke-width="11" stroke-linecap="round"/>
    <text x="506" y="352" font-family="system-ui" font-size="14" font-weight="700" fill="#334155">active deck</text>
    <rect x="506" y="378" width="140" height="78" rx="6" fill="#fff" stroke="#67e8f9" stroke-width="2"/>
    <rect x="506" y="470" width="140" height="78" rx="6" fill="#fff" stroke="#94a3b8"/>
  </g>

  <g id="deck-local-step">
    <path d="M680 590h260" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
    <text class="tiny" x="688" y="582">←  2 / 3  → stays inside Reviewer experience</text>
  </g>
  <g id="deck-boundary">
    <rect x="949" y="566" width="201" height="48" rx="12" fill="#352414" stroke="#ffbf69" stroke-width="2"/>
    <text class="tiny" x="972" y="588">STOP AT DECK EDGE</text>
    <text class="tiny" x="972" y="605">do not enter next deck</text>
  </g>
</svg>
