<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">One implementation deck with sectioned slide thumbnails</title>
  <desc id="desc">A single expandable Implementation review deck contains all slide thumbnails. Architecture and storage, Traceability, and Reviewer experience appear only as subtle dividers. The selected slide fills the main stage, navigation remains inside the deck, and hover changes only the outline so the preview stays visible.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#50d5ea"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#0d1326"/>
  <text x="48" y="62" fill="#f7f9ff" font-family="system-ui,sans-serif" font-size="34" font-weight="700">One deck disclosure. Sections only divide its slides.</text>
  <text x="48" y="91" fill="#aab8d5" font-family="system-ui,sans-serif" font-size="16">The deck owns the navigation boundary; section labels add scanability without creating nested decks.</text>

  <g id="deck-node">
    <rect x="48" y="126" width="370" height="536" rx="18" fill="#15243b" stroke="#49678f" stroke-width="2"/>
    <rect x="68" y="148" width="330" height="58" rx="11" fill="#263963" stroke="#8f9fff" stroke-width="2"/>
    <path d="M87 174h12l5 6h20v12H87Z" fill="none" stroke="#dbe3ff" stroke-width="2"/>
    <text x="138" y="183" fill="#f7f9ff" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Implementation review</text>
    <text x="374" y="184" fill="#dbe3ff" font-family="system-ui,sans-serif" font-size="18">⌃</text>
  </g>

  <g id="thumbnail-stack">
    <text x="76" y="239" fill="#8fa0c2" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="1">ARCHITECTURE AND STORAGE</text>
    <line x1="274" y1="235" x2="394" y2="235" stroke="#344765"/>
    <rect x="78" y="255" width="142" height="80" rx="7" fill="#edf3ff" stroke="#5f7598"/>
    <rect x="244" y="255" width="142" height="80" rx="7" fill="#edf3ff" stroke="#5f7598"/>
    <text x="76" y="367" fill="#8fa0c2" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="1">TRACEABILITY</text>
    <line x1="166" y1="363" x2="394" y2="363" stroke="#344765"/>
    <rect x="78" y="383" width="142" height="80" rx="7" fill="#edf3ff" stroke="#5f7598"/>
    <rect x="244" y="383" width="142" height="80" rx="7" fill="#edf3ff" stroke="#5f7598"/>
    <text x="76" y="495" fill="#8fa0c2" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="1">REVIEWER EXPERIENCE</text>
    <line x1="224" y1="491" x2="394" y2="491" stroke="#344765"/>
    <rect x="78" y="511" width="142" height="80" rx="7" fill="#edf3ff" stroke="#5f7598"/>
    <rect x="244" y="511" width="142" height="80" rx="7" fill="#edf3ff" stroke="#5f7598"/>
    <text x="78" y="623" fill="#7f91b4" font-family="system-ui,sans-serif" font-size="12">Hover = outline only · preview remains visible</text>
  </g>

  <g id="selected-thumbnail">
    <rect x="239" y="506" width="152" height="90" rx="9" fill="none" stroke="#51d9ea" stroke-width="4"/>
    <circle cx="371" cy="575" r="8" fill="#51d9ea"/>
    <path d="m367 575 3 3 6-7" fill="none" stroke="#0d1326" stroke-width="2"/>
  </g>

  <path d="M402 551 C470 551 478 420 536 420" fill="none" stroke="#50d5ea" stroke-width="4" marker-end="url(#arrow)"/>

  <g id="full-stage">
    <rect x="526" y="146" width="706" height="446" rx="18" fill="#15243b" stroke="#49678f" stroke-width="2"/>
    <rect x="554" y="176" width="650" height="366" rx="12" fill="#f8fbff"/>
    <text x="586" y="222" fill="#182337" font-family="system-ui,sans-serif" font-size="25" font-weight="700">Selected slide fills the main area</text>
    <rect x="586" y="256" width="210" height="220" rx="15" fill="#dce8fb" stroke="#a8bbd8"/>
    <rect x="828" y="256" width="342" height="220" rx="15" fill="#d7e0fb" stroke="#748cff" stroke-width="2"/>
    <line x1="862" y1="300" x2="1128" y2="300" stroke="#9aaac1" stroke-width="12" stroke-linecap="round"/>
    <line x1="862" y1="344" x2="1092" y2="344" stroke="#9aaac1" stroke-width="12" stroke-linecap="round"/>
    <line x1="862" y1="388" x2="1040" y2="388" stroke="#9aaac1" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g id="deck-local-step">
    <path d="M730 570 H1032" fill="none" stroke="#50d5ea" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="742" y="563" fill="#75cfe1" font-family="system-ui,sans-serif" font-size="13">6 / 8 stays inside Implementation review</text>
  </g>

  <g id="deck-boundary">
    <rect x="912" y="608" width="280" height="62" rx="12" fill="#3b2916" stroke="#f1ad45" stroke-width="2"/>
    <text x="936" y="635" fill="#ffd18b" font-family="system-ui,sans-serif" font-size="12" font-weight="700">SECTIONS ARE NOT DECKS</text>
    <text x="936" y="655" fill="#f6dfbd" font-family="system-ui,sans-serif" font-size="12">One collapse boundary · one sequence</text>
  </g>
</svg>
