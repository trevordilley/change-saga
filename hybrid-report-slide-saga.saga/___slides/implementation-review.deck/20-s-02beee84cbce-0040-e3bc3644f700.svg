<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">The reviewer keeps the living report and implementation decks as separate workspace surfaces</title>
  <desc id="desc">A reviewer workspace exposes Saga, Decks, Code Diff, and Coverage tabs. The Decks surface includes flush deck thumbnails, a focused slide, transparent Item hotspots, and a slide-level diff total whose hover reveals only evidence-bearing Items before it opens every referenced file in the linked code drawer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#081725"/><stop offset="1" stop-color="#171029"/></linearGradient>
    <style>.h{font:700 36px system-ui;fill:#f8fafc}.sub{font:500 17px system-ui;fill:#aab9cf}.label{font:700 18px system-ui;fill:#f8fafc}.body{font:500 14px system-ui;fill:#cbd6e7}.tiny{font:600 12px system-ui;fill:#9fb1cb}.frame{fill:#0d1728;stroke:#324765;stroke-width:2}.panel{fill:#121f34;stroke:#2f4668}.active{fill:#25304f;stroke:#8b9cff}.accent{fill:#15343c;stroke:#67e8f9;stroke-width:2}.hot{fill:transparent;stroke:#ffbf69;stroke-width:2;stroke-dasharray:7 5}</style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text class="h" x="64" y="62">Decks are a destination from the report, not pages inside it.</text>
  <text class="sub" x="64" y="94">The workspace preserves both reading modes and one evidence/review graph.</text>

  <rect class="frame" x="58" y="128" width="1164" height="530" rx="22"/>
  <rect class="panel" x="58" y="128" width="1164" height="58" rx="22"/>
  <g id="report-surface"><rect class="panel" x="88" y="145" width="120" height="32" rx="10"/><text class="tiny" x="128" y="166">Saga</text></g>
  <g id="decks-surface"><rect class="active" x="220" y="145" width="120" height="32" rx="10"/><text class="tiny" x="256" y="166">Decks</text></g>
  <rect class="panel" x="352" y="145" width="120" height="32" rx="10"/><text class="tiny" x="384" y="166">Code Diff</text>
  <rect class="panel" x="484" y="145" width="120" height="32" rx="10"/><text class="tiny" x="516" y="166">Coverage</text>

  <g id="deck-navigator"><rect class="panel" x="78" y="206" width="210" height="425" rx="16"/><text class="label" x="90" y="240">Lifecycle model</text><rect class="active" x="90" y="262" width="186" height="92" rx="12"/><rect class="panel" x="90" y="370" width="186" height="92" rx="12"/><text class="label" x="90" y="504">Traceability loop</text><rect class="panel" x="90" y="525" width="186" height="82" rx="12"/></g>

  <g id="slide-review"><rect class="panel" x="308" y="206" width="610" height="425" rx="16"/><text class="label" x="338" y="242">One Saga identity. Two document lifecycles.</text><rect class="accent" x="350" y="288" width="190" height="210" rx="20"/><rect class="active" x="686" y="288" width="190" height="210" rx="20"/><path d="M548 392H676" stroke="#67e8f9" stroke-width="4"/><circle cx="612" cy="392" r="28" fill="#17263e" stroke="#67e8f9"/><text class="tiny" x="585" y="396">explains</text><text class="body" x="356" y="538">Whole-slide approval</text><text class="body" x="680" y="538">Item-level evidence</text></g>
  <g id="item-hotspot"><rect class="hot" x="366" y="310" width="158" height="75" rx="12"/><rect class="hot" x="690" y="310" width="170" height="75" rx="12"/><path d="M1080 270C1010 270 965 315 870 338" fill="none" stroke="#ffbf69" stroke-width="2" stroke-dasharray="7 5"/><text class="tiny" x="563" y="277">hover total → reveal linked Items</text><text class="tiny" x="720" y="350">evidence Item</text></g>

  <g id="code-drawer"><rect class="frame" x="938" y="206" width="264" height="425" rx="16"/><text class="label" x="966" y="244">Linked code</text><rect x="1070" y="222" width="104" height="30" rx="9" fill="#25304f" stroke="#8b9cff"/><text class="tiny" x="1080" y="242">computed + / −</text><text class="tiny" x="966" y="277">unique referenced files</text><rect class="panel" x="958" y="294" width="224" height="46" rx="9"/><text class="tiny" x="974" y="322">internal/server/appjs.go</text><rect class="panel" x="958" y="350" width="224" height="46" rx="9"/><text class="tiny" x="974" y="378">internal/server/targetcode.go</text><rect class="panel" x="958" y="406" width="224" height="46" rx="9"/><text class="tiny" x="974" y="434">internal/server/styles.go</text><text class="body" x="966" y="494">Computed from the pinned diff;</text><text class="body" x="966" y="517">repeated references count once.</text><text class="body" x="966" y="556">Expand any file to see its full</text><text class="body" x="966" y="579">patch and linked highlights.</text></g>
  <g id="review-overlay"><rect x="775" y="565" width="120" height="42" rx="12" fill="#352414" stroke="#ffbf69"/><text class="tiny" x="795" y="591">comment Item</text></g>
</svg>
