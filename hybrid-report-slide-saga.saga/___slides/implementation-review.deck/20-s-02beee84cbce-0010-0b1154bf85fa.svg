<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid Git storage keeps report and decks independently mergeable</title>
  <desc id="desc">A version 3 report root contains living record directories and several independent embedded deck bundles while standalone version 4 remains flat and separate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#081827"/><stop offset="1" stop-color="#15102d"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6ee7d8"/></marker>
    <style>.h{font:700 38px system-ui;fill:#f8fafc}.sub{font:500 18px system-ui;fill:#a7b8d1}.label{font:700 21px system-ui;fill:#f8fafc}.body{font:500 17px system-ui;fill:#c9d5e8}.tiny{font:600 14px ui-monospace,monospace;fill:#9db1ce}.node{fill:#10233b;stroke:#36577d;stroke-width:2}.deck{fill:#271e48;stroke:#a78bfa;stroke-width:2}.good{fill:#103238;stroke:#6ee7d8;stroke-width:2}.boundary{fill:none;stroke:#ffbd69;stroke-width:3;stroke-dasharray:10 8}</style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text class="h" x="64" y="70">The parent stays a report; decks are independent bundles.</text>
  <text class="sub" x="64" y="104">Git boundaries preserve parallel authorship without inventing a second Saga identity.</text>

  <g id="v3-root">
    <rect class="good" x="70" y="150" width="220" height="86" rx="18"/>
    <text class="label" x="102" y="185">saga.json · v3</text>
    <text class="tiny" x="102" y="211">only container manifest</text>
    <path d="M180 236V292M180 292H520M180 292H180" fill="none" stroke="#6ee7d8" stroke-width="4"/>
  </g>

  <g id="living-records">
    <rect class="node" x="70" y="310" width="300" height="245" rx="22"/>
    <text class="label" x="102" y="352">Living report records</text>
    <text class="tiny" x="102" y="388">overview.fragment/</text>
    <text class="tiny" x="102" y="423">___requirements/</text>
    <text class="tiny" x="102" y="458">___design/</text>
    <text class="tiny" x="102" y="493">___workplan/</text>
    <text class="body" x="102" y="530">Own revision histories</text>
  </g>

  <g id="deck-bundles">
    <rect class="deck" x="430" y="310" width="390" height="245" rx="22"/>
    <text class="label" x="465" y="352">___slides/</text>
    <rect class="node" x="470" y="382" width="310" height="54" rx="12"/>
    <text class="tiny" x="494" y="416">lifecycle-model.deck/</text>
    <rect class="node" x="470" y="452" width="310" height="54" rx="12"/>
    <text class="tiny" x="494" y="486">traceability-loop.deck/</text>
    <text class="body" x="465" y="536">One flat v4-compatible record set per deck</text>
  </g>

  <g id="legacy-readers">
    <path d="M220 574V620H610" fill="none" stroke="#6ee7d8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect class="good" x="610" y="585" width="330" height="70" rx="16"/>
    <text class="label" x="640" y="617">Legacy readers remain valid</text>
    <text class="tiny" x="640" y="641">v2/v3 report paths unchanged</text>
  </g>

  <g id="v4-boundary">
    <rect class="boundary" x="875" y="150" width="335" height="405" rx="28"/>
    <text class="label" x="915" y="198">Standalone v4</text>
    <text class="body" x="915" y="229">Still slide-native and flat</text>
    <rect class="node" x="915" y="270" width="255" height="62" rx="14"/><text class="tiny" x="944" y="307">00-saga.json</text>
    <rect class="deck" x="915" y="354" width="255" height="62" rx="14"/><text class="tiny" x="944" y="391">10-d / 20-s / 30-i</text>
    <rect class="node" x="915" y="438" width="255" height="62" rx="14"/><text class="tiny" x="944" y="475">40-e / 80-review</text>
    <text class="tiny" x="915" y="535">No report conversion path</text>
  </g>
</svg>
