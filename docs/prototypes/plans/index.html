      if (r[6] && !showDone) return;
      shown++;
      html += '<tr class="' + (r[6] ? 'done-row' : '') + '"><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '<div class="bar"><i style="width:' + Math.round(r[3] * 100) + '%"></i></div></td><td>' + r[4] + '</td><td>' + r[5] + '</td></tr>';
    });
    html += '</tbody></table>';
    html += '<h2>Stories</h2><p class="note">' + Object.keys(STORIES).length + ' proposed stories. Each Task on a Plan names one of them.</p>';
    html += '<p class="note">A done Plan is implemented and merged. It is hidden here by default, and still opens if someone asks for it. <a href="#/cli">The CLI does the same.</a></p>';
    var el = document.getElementById('view-feature'); el.innerHTML = html;
    document.getElementById('plan-count').textContent = shown + ' shown';
    document.getElementById('toggle-done').onclick = function () { showDone = !showDone; renderFeature(); };
  }

  function planHead(tab) {
    var tabs = [['deck/whole', 'deck', 'Deck'], ['graph', 'graph', 'Dependencies'], ['tasks', 'tasks', 'Tasks'], ['compare', 'compare', 'Plan vs Reviews'], ['prototypes', 'prototypes', 'Prototypes'], ['guide', 'guide', 'Guide']];
    var el = document.getElementById('plan-head'); el.hidden = false;
    el.innerHTML = '<div class="eyebrow">Plan, not a review. Describes intended work</div><h1>Plans and Tasks: first version</h1><p class="sub">Goes with <a href="#/feature">Plans: map out a feature’s work before building it</a>. ' + doneCount(TASKS) + ' of ' + TASKS.length + ' Tasks done.</p><nav class="tabs">' +
      tabs.map(function (t) { return '<a href="#/plan/' + t[0] + '" class="' + (t[1] === tab ? 'on' : '') + '">' + t[2] + '</a>'; }).join('') + '</nav>';
  }

  function parallelNow() { return TASKS.filter(canStart); }

  function slideBody(s) {
    if (s.body === 'phases') {
      return '<table><thead><tr><th>Phase</th><th>Tasks done</th><th>Can start now</th></tr></thead><tbody>' + PHASES.map(function (p) {
        var ts = TASKS.filter(function (t) { return t.phase === p.id; });
        return '<tr><td>' + esc(p.title) + '</td><td>' + doneCount(ts) + ' of ' + ts.length + '<div class="bar"><i style="width:' + Math.round(doneCount(ts) / ts.length * 100) + '%"></i></div></td><td>' + ts.filter(canStart).length + '</td></tr>';
      }).join('') + '</tbody></table>';
    }
    if (s.body === 'parallel') {
      var now = parallelNow();
      return '<div class="para"><strong>' + now.length + ' Tasks can start now</strong>, in parallel: ' + now.map(function (t) { return esc(t.short); }).join(', ') + '.</div><p>Open the <a href="#/plan/graph">dependency graph</a> to see why.</p>';
    }
    return s.body;
  }

  function renderDeck(id) {
    var s = SLIDES.filter(function (x) { return x.id === id; })[0] || SLIDES[0];
    var out = '<nav class="outline" aria-label="Slides by phase">', last = '';
    SLIDES.forEach(function (x) {
      if (x.section !== last) { last = x.section; out += '<h4>' + esc(x.section === 'Overview' ? 'Overview' : phaseOf(x.section).title) + '</h4>'; }
      var ts = x.tasks.map(function (t) { return BY_ID[t]; });
      out += '<a href="#/plan/deck/' + x.id + '" class="' + (x.id === s.id ? 'on' : '') + '">' + esc(x.title) + (ts.length ? '<small>' + doneCount(ts) + ' of ' + ts.length + ' Tasks done</small>' : '') + '</a>';
    });
    out += '</nav>';
    var ts = s.tasks.map(function (t) { return BY_ID[t]; });
    var body = '<article class="slide"><div class="eyebrow">' + esc(s.section === 'Overview' ? 'Overview' : phaseOf(s.section).title) + '</div><h2>' + esc(s.title) + '</h2><p class="take">' + esc(s.take) + '</p>' + slideBody(s);
    if (s.section !== 'Overview') {
      var inPhase = TASKS.filter(function (t) { return t.phase === s.section; }), now = inPhase.filter(canStart);
      body += '<div class="para">' + (now.length > 1 ? '<strong>' + now.length + ' Tasks in this phase can run in parallel now:</strong> ' + now.map(function (t) { return esc(t.short); }).join(', ') + '.' : now.length === 1 ? 'One Task in this phase can start now: ' + esc(now[0].short) + '.' : 'Nothing further in this phase can start right now.') + ' <a href="#/plan/graph">See why</a>.</div>';
    }
    if (ts.length) {
      body += '<div class="tasks-on" id="slide-tasks"><div class="eyebrow">Tasks on this slide</div>' + ts.map(function (t) {
        return '<div class="row"><span>' + taskLink(t) + '</span>' + chip(t) + '</div>';
      }).join('') + '</div>';
    }
    body += '</article>';
    document.getElementById('view-deck').innerHTML = '<div class="deck">' + out + body + '</div>';
  }

  function renderGraph() {
    var depth = {};
    function d(t) { if (depth[t.id] === undefined) { depth[t.id] = t.deps.length ? 1 + Math.max.apply(null, t.deps.map(function (x) { return d(BY_ID[x]); })) : 0; } return depth[t.id]; }
    TASKS.forEach(d);
    var ORDER = ['plan-record', 'merge-grammar', 'plan-deck', 'task-extends-item', 'feature-lists-plans', 'plan-review-link', 'plan-prototypes',
      'slide-task-refs', 'task-done-cmd', 'task-story-link', 'task-page', 'dep-graph', 'task-sizing', 'hide-done', 'done-on-slides', 'comparison', 'guide'];
    var cols = []; ORDER.forEach(function (id) { var t = BY_ID[id]; (cols[depth[t.id]] = cols[depth[t.id]] || []).push(t); });
    var W = 172, H = 54, GX = 50, GY = 10, M = 20, TOP = 36, pos = {};
    cols.forEach(function (c, i) { c.forEach(function (t, j) { pos[t.id] = { x: M + i * (W + GX), y: TOP + j * (H + GY) }; }); });
    var rowsMax = Math.max.apply(null, cols.map(function (c) { return c.length; }));
    var width = M * 2 + cols.length * W + (cols.length - 1) * GX, height = TOP + rowsMax * (H + GY) + 10;
    var svg = '<svg role="img" aria-label="Task dependency graph" viewBox="0 0 ' + width + ' ' + height + '" width="' + width + '" height="' + height + '">';
    svg += '<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--edge)"/></marker></defs>';
    cols.forEach(function (c, i) { svg += '<text x="' + (M + i * (W + GX)) + '" y="24" font-size="12" font-weight="600" fill="var(--muted)">' + (i === 0 ? 'No dependencies' : i + (i === 1 ? ' step' : ' steps') + ' in') + '</text>'; });
    TASKS.forEach(function (t) {
      t.deps.forEach(function (dep) {
        var a = pos[dep], b = pos[t.id], x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x - 2, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
        svg += '<path class="edge" data-from="' + dep + '" data-to="' + t.id + '" d="M' + x1 + ' ' + y1 + 'C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2 + '" fill="none" stroke="var(--edge)" stroke-width="1.5" marker-end="url(#arrow)"/>';
      });
    });
    var colours = { 's-done': ['--done-bg', '--done'], 's-ready': ['--ready-bg', '--ready'], 's-work': ['--work-bg', '--work'], 's-wait': ['--wait-bg', '--wait'] };
    TASKS.forEach(function (t) {
      var p = pos[t.id], s = status(t), c = colours[s.cls];
      svg += '<g class="node" tabindex="0" role="link" aria-label="' + esc(t.title + ': ' + s.word) + '" data-id="' + t.id + '" transform="translate(' + p.x + ' ' + p.y + ')">' +
        '<rect width="' + W + '" height="' + H + '" rx="8" fill="var(' + c[0] + ')" stroke="var(' + c[1] + ')" stroke-width="' + (canStart(t) ? 2.5 : 1) + '"/>' +
        '<text x="11" y="21" font-size="13.5" font-weight="600" fill="var(--ink)">' + esc(t.short) + '</text>' +
        '<text x="11" y="41" font-size="12" font-weight="600" fill="var(' + c[1] + ')">' + s.word + '</text>' +
        '<text x="' + (W - 10) + '" y="41" font-size="11" text-anchor="end" fill="var(--muted)">' + t.phase.toUpperCase() + '</text></g>';
    });
    svg += '</svg>';
    var now = parallelNow();
    document.getElementById('view-graph').innerHTML =
      '<div class="para"><strong>' + now.length + ' Tasks can start now, at the same time.</strong> Every Task they depend on is done. Assign each to its own agent or workspace.</div>' +
      '<div class="legend"><span class="chip s-done">✓ Done</span><span class="chip s-work">In progress</span><span class="chip s-ready">Can start now</span><span class="chip s-wait">Waiting</span><span class="note">P1 to P5 is the Task’s phase. Hover a Task to trace it; click to open it.</span></div>' +
      '<div class="graph-wrap">' + svg + '</div>' +
      '<p class="note">Columns come from the dependencies, not from phases: a Task in a later phase can start early if nothing holds it back. Try marking a Task done on its page and coming back.</p>';
    var root = document.getElementById('view-graph');
    function chain(id) {
      var keep = {}; keep[id] = 1;
      (function up(x) { BY_ID[x].deps.forEach(function (d) { keep[d] = 1; up(d); }); })(id);
      (function down(x) { blocks(BY_ID[x]).forEach(function (o) { keep[o.id] = 1; down(o.id); }); })(id);
      return keep;
    }
    function highlight(id) {
      var keep = id ? chain(id) : null;
      root.querySelectorAll('.node').forEach(function (n) { n.classList.toggle('dim', !!keep && !keep[n.getAttribute('data-id')]); });
      root.querySelectorAll('.edge').forEach(function (e) { e.classList.toggle('dim', !!keep && !(keep[e.getAttribute('data-from')] && keep[e.getAttribute('data-to')])); });
    }
    root.querySelectorAll('.node').forEach(function (n) {
      var id = n.getAttribute('data-id');
      n.addEventListener('mouseenter', function () { highlight(id); });
      n.addEventListener('mouseleave', function () { highlight(null); });
      n.addEventListener('focus', function () { highlight(id); });
      n.addEventListener('blur', function () { highlight(null); });
      n.addEventListener('click', function () { location.hash = '#/task/' + id; });
      n.addEventListener('keydown', function (e) { if (e.key === 'Enter') location.hash = '#/task/' + id; });
    });
  }

  function renderTasks() {
    var unsized = TASKS.filter(function (t) { return t.sizing !== 'within'; });
    var html = '<div class="para"><strong>' + unsized.length + ' of ' + TASKS.length + ' Tasks are not yet confidently two days or less:</strong> ' + unsized.map(function (t) { return esc(t.short); }).join(', ') + '. The sizing goal is a test of understanding.</div>';
    PHASES.forEach(function (p) {
      html += '<h3>' + esc(p.title) + '</h3><table style="table-layout:fixed"><colgroup><col style="width:46%"><col style="width:17%"><col style="width:22%"><col></colgroup><tbody>';
      TASKS.filter(function (t) { return t.phase === p.id; }).forEach(function (t) {
        html += '<tr><td>' + taskLink(t) + '</td><td>' + chip(t) + '</td><td>' + sizingChip(t) + '</td><td class="note">' + (t.deps.length ? 'Needs ' + t.deps.length : 'No dependencies') + '</td></tr>';
      });
      html += '</tbody></table>';
    });
    document.getElementById('view-tasks').innerHTML = html;
  }

  function renderTask(id) {
    var t = BY_ID[id] || TASKS[0];
    var slides = SLIDES.filter(function (s) { return s.tasks.indexOf(t.id) >= 0; });
    var refs = t.code.length ? t.code.map(function (c) { return '<span class="ref"><code>' + esc(c[0]) + (c[1] ? ':' + esc(c[1]) : '') + '</code><br><span class="note">' + esc(c[2]) + '</span></span>'; }).join('') : '<p class="note">No code references: nothing here exists to point at yet.</p>';
    var list = function (ts, none) { return ts.length ? '<ul>' + ts.map(function (o) { return '<li>' + taskLink(o) + ' ' + chip(o) + '</li>'; }).join('') + '</ul>' : '<p class="note">' + none + '</p>'; };
    var cmd = 'change-saga task done --task ' + t.id + ' change.saga';
    document.getElementById('view-task').innerHTML =
      '<div class="eyebrow">Task in <a href="#/plan/deck/whole">Plans and Tasks: first version</a>, ' + esc(phaseOf(t.phase).title) + '</div><h1>' + esc(t.title) + '</h1>' +
      '<p>' + chip(t) + ' ' + sizingChip(t) + '</p><div class="cols"><div><h2>Essay</h2><p>' + esc(t.essay) + '</p><h2>Code that matters</h2>' + refs +
      '<h2>Mark it done</h2><p class="note">This is what an agent would run as it finishes. Try it here: its slides and the graph update.</p><code class="cmd">' + esc(cmd) + '</code><button class="primary" id="mark-done"' + (isDone(t) ? ' disabled' : '') + '>' + (isDone(t) ? 'Done' : 'Mark done, as an agent would') + '</button></div>' +
      '<aside class="side"><h3>User story</h3><p><a href="#/feature">' + esc(STORIES[t.story]) + '</a></p><h3>Depends on</h3>' + list(t.deps.map(function (d) { return BY_ID[d]; }), 'Nothing: it could start any time.') +
      '<h3>Blocks</h3>' + list(blocks(t), 'Nothing is waiting on it.') + '<h3>Slides that show it</h3>' + (slides.length ? '<ul>' + slides.map(function (s) { return '<li><a href="#/plan/deck/' + s.id + '">' + esc(s.title) + '</a></li>'; }).join('') + '</ul>' : '<p class="note">None.</p>') + '</aside></div>';
    var button = document.getElementById('mark-done');
    if (button && !isDone(t)) button.onclick = function () { t.state = 'done'; renderTask(t.id); };
  }

  function renderCompare() {
    var rows = [
      ['Add the Plan record under its feature', 'Plans load with their feature. <span class="note">pr-101, slide 2</span>', 's-done', 'Delivered', ''],
      ['Merge the work plan’s verbs into plan and task', 'Verbs moved; old ones print where they went. <span class="note">pr-101, slide 3</span>', 's-work', 'Departed', 'Kept old verbs as aliases for one release, which the Plan did not say.'],
      ['Extend work items into Tasks', 'Plan link, essay and code references added. <span class="note">pr-101, slide 4</span>', 's-work', 'Departed', 'Sizing moved to its own record, because it changes more often than the rest.'],
      ['List a feature’s Plans on its page', 'Plans section on the feature page. <span class="note">pr-101, slide 5</span>', 's-done', 'Delivered', ''],
      ['Give a Plan a deck grouped by phase', 'New deck role; sections name phases. <span class="note">pr-104, slide 1</span>', 's-done', 'Delivered', ''],
      ['Show the dependency graph', '<span class="note">Nothing delivered yet.</span>', 's-wait', 'Not delivered', ''],
      ['<span class="note">Not in the Plan</span>', 'Reader cache change needed for new pages. <span class="note">pr-104, slide 3</span>', 's-warn', 'Not planned', 'Pages were too slow once Plans listed Tasks.']
    ];
    document.getElementById('view-compare').innerHTML =
      '<div class="stats"><span class="chip s-done">3 delivered</span><span class="chip s-work">2 departed</span><span class="chip s-wait">1 not delivered</span><span class="chip s-warn">1 not planned</span></div>' +
      '<p class="note">Implemented by <a href="#/plan/compare">pr-101</a> (merged) and <a href="#/plan/compare">pr-104</a> (open). A few rows shown. This reports differences; it never blocks a merge, and a person still judges whether the work matches.</p>' +
      '<table class="compare"><thead><tr><th>What we said (Plan)</th><th>What we did (Reviews)</th><th>Result</th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td><span class="chip ' + r[2] + '">' + r[3] + '</span>' + (r[4] ? '<div class="why">' + esc(r[4]) + '</div>' : '') + '</td></tr>'; }).join('') + '</tbody></table>';
  }

  function renderPrototypes() {
    document.getElementById('view-prototypes').innerHTML =
      '<p class="sub">A Plan has prototypes showing what it will build.</p><div class="card"><strong>Plans in the reader</strong> <span class="chip s-ready">This page</span><p class="note">The page you are looking at: feature list, deck, dependencies, Task page and comparison.</p></div><div class="card"><strong>Task board on the Roadmap</strong> <span class="chip s-wait">Illustrative</span><p class="note">A later Plan’s prototype would appear here. Each opens on its own page, sandboxed, as prototypes do today.</p></div>';
  }

  function renderGuide() {
    document.getElementById('view-guide').innerHTML =
      '<p class="sub">How an author might reach a Plan they trust. Where this runs (skill, command, or both) is an open question; this shows the conversation, not a screen design.</p>' +
      '<div class="step"><i>1</i><div><strong>Research.</strong> Read 11 stories for this feature. Found <code>internal/workplan</code> already has waves, dependencies and progress. The reader shows none of it.</div></div>' +
      '<div class="step"><i>2</i><div><strong>Ask.</strong> Should a Plan own its work items, or link to them? <span class="note">Your answer: own them.</span></div></div>' +
      '<div class="step"><i>3</i><div><strong>Prototype.</strong> The graph was unclear, so I drew one. <a href="#/plan/graph">See it.</a></div></div>' +
      '<div class="step"><i>4</i><div><strong>Size.</strong> Drafted ' + TASKS.length + ' Tasks. I am confident of ' + TASKS.filter(function (t) { return t.sizing === 'within'; }).length + ' as two days or less.</div></div>' +
      '<div class="step"><i>5</i><div><strong>Not ready yet:</strong><ul>' + TASKS.filter(function (t) { return t.sizing !== 'within'; }).map(function (t) { return '<li>' + taskLink(t) + ' ' + sizingChip(t) + '</li>'; }).join('') + '</ul></div></div>';
  }

  function renderCli() {
    var ready = TASKS.filter(canStart).map(function (t) { return '  ' + t.id; }).join('\n');
    document.getElementById('view-cli').innerHTML =
      '<div class="eyebrow">Design sketch. None of the new commands exist</div><h1>Proposed grammar</h1><p class="sub">change-saga plan is already the work plan, so its verbs move here and the two ideas merge.</p>' +
      '<pre class="cmd"><span class="c"># Plans</span>\nchange-saga plan create --feature plans --id first-version --title TEXT\nchange-saga plan list [--feature ID] [--all]        <span class="c"># done Plans hidden without --all</span>\nchange-saga plan link-review --plan ID --review pr-101\nchange-saga plan add-prototype --plan ID --prototype URN\nchange-saga plan add-phase --plan ID --id ID --title TEXT   <span class="c"># today: plan add-wave</span>\nchange-saga plan guide --feature ID                 <span class="c"># the wizard</span>\n\n<span class="c"># Its deck: the existing commands, pointed at a Plan</span>\nchange-saga apply-slide --plan ID --from SLIDE.json\nchange-saga deck overview --plan ID --file OVERVIEW.json\n\n<span class="c"># Tasks</span>\nchange-saga task add --plan ID --phase ID --id ID --title TEXT --story URN   <span class="c"># today: plan add-item</span>\nchange-saga task depend --task ID --on ID           <span class="c"># today: plan add-dependency</span>\nchange-saga task set --task ID --essay-source FILE --code PATH:START-END --sizing within-2-days\nchange-saga task done --task ID [--summary TEXT]    <span class="c"># today: plan progress --to done</span>\nchange-saga task list --plan ID [--ready]</pre>' +
      '<h2>Done Plans are filtered by default</h2><pre class="cmd">$ change-saga plan list --feature plans\nfirst-version        in progress   ' + doneCount(TASKS) + ' of ' + TASKS.length + ' Tasks   pr-101, pr-104\nroadmap-progress     not started   0 of 6 Tasks\n1 done Plan hidden; --all shows it.</pre>' +
      '<h2>What can start now</h2><pre class="cmd">$ change-saga task list --plan first-version --ready\n' + ready + '</pre>';
  }

  function route() {
    var parts = (location.hash.replace(/^#\/?/, '') || 'feature').split('/');
    var head = document.getElementById('plan-head'); head.hidden = true;
    var crumbs = '<a href="#/feature">Plans feature</a>';
    if (parts[0] === 'plan') {
      var tab = parts[1] || 'deck';
      planHead(tab); crumbs += ' / Plans and Tasks: first version';
      if (tab === 'deck') renderDeck(parts[2]); if (tab === 'graph') renderGraph(); if (tab === 'tasks') renderTasks(); if (tab === 'compare') renderCompare(); if (tab === 'prototypes') renderPrototypes(); if (tab === 'guide') renderGuide();
      show(tab);
    } else if (parts[0] === 'task') {
      renderTask(parts[1]); show('task'); crumbs += ' / <a href="#/plan/deck/whole">Plans and Tasks: first version</a> / Task';
    } else if (parts[0] === 'cli') {
      renderCli(); show('cli'); crumbs += ' / CLI';
    } else { renderFeature(); show('feature'); }
    document.getElementById('crumbs').innerHTML = crumbs + (parts[0] === 'cli' ? '' : ' <span class="note"> | <a href="#/cli">Proposed CLI</a></span>');
    window.scrollTo(0, 0);
  }

  var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  function applyTheme() { document.documentElement.classList.toggle('dark', dark); document.getElementById('theme').textContent = dark ? 'Light' : 'Dark'; }
  document.getElementById('theme').onclick = function () { dark = !dark; applyTheme(); };
  document.getElementById('reset').onclick = function () { TASKS.forEach(function (t) { t.state = t.initial; }); route(); };
  window.addEventListener('hashchange', route);
  applyTheme(); route();
})();
</script>
</body>
</html>
