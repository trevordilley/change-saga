<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="40" y="52" font-size="30" font-weight="bold" fill="#0f172a">Viewing a code reference pinned at P from commit V</text>
  <text x="40" y="84" font-size="18" fill="#475569">Resolve decides current (possibly moved) or stale; a stale reference accounts for nothing until re-authored.</text>

  <!-- input -->
  <g id="input">
    <rect x="40" y="130" width="230" height="84" rx="10" fill="#e2e8f0" stroke="#334155"/>
    <text x="155" y="164" font-size="18" text-anchor="middle" fill="#0f172a">reference {commit P,</text>
    <text x="155" y="190" font-size="18" text-anchor="middle" fill="#0f172a">path, L10-L20, digest}</text>
  </g>

  <g id="pin-missing">
    <rect x="330" y="120" width="260" height="104" rx="10" fill="#fef9c3" stroke="#a16207"/>
    <text x="460" y="156" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">Is P in the repository?</text>
    <text x="460" y="182" font-size="16" text-anchor="middle" fill="#334155">no: search V's file for the digest;</text>
    <text x="460" y="204" font-size="16" text-anchor="middle" fill="#334155">only a unique match is current</text>
  </g>

  <g id="verify-digest">
    <rect x="650" y="120" width="260" height="104" rx="10" fill="#fef9c3" stroke="#a16207"/>
    <text x="780" y="156" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">Digest matches at P?</text>
    <text x="780" y="182" font-size="16" text-anchor="middle" fill="#334155">no: stale, the pin itself</text>
    <text x="780" y="204" font-size="16" text-anchor="middle" fill="#334155">no longer names these bytes</text>
  </g>

  <g id="unchanged-path">
    <rect x="970" y="120" width="270" height="104" rx="10" fill="#dcfce7" stroke="#15803d"/>
    <text x="1105" y="156" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">Path untouched P..V?</text>
    <text x="1105" y="182" font-size="16" text-anchor="middle" fill="#334155">yes: current at V, same lines</text>
    <text x="1105" y="204" font-size="16" text-anchor="middle" fill="#334155">(V = P is current too)</text>
  </g>

  <g id="file-level-stale">
    <rect x="970" y="300" width="270" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="1105" y="336" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">File deleted or binary?</text>
    <text x="1105" y="362" font-size="16" text-anchor="middle" fill="#334155">stale. A whole-file reference</text>
    <text x="1105" y="384" font-size="16" text-anchor="middle" fill="#334155">survives only a pure rename</text>
  </g>

  <g id="remap-range">
    <rect x="560" y="300" width="330" height="110" rx="10" fill="#dcfce7" stroke="#15803d"/>
    <text x="725" y="336" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">Remap the range across hunks</text>
    <text x="725" y="362" font-size="16" text-anchor="middle" fill="#334155">hunks wholly before L10 shift it:</text>
    <text x="725" y="384" font-size="16" text-anchor="middle" fill="#334155">L10-L20 at P becomes L13-L23 at V</text>
  </g>

  <g id="range-touched">
    <rect x="160" y="300" width="330" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="325" y="336" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">A hunk touches L10-L20</text>
    <text x="325" y="362" font-size="16" text-anchor="middle" fill="#334155">stale, with the reason and</text>
    <text x="325" y="384" font-size="16" text-anchor="middle" fill="#334155">the diff since the pin</text>
  </g>

  <!-- edges -->
  <line id="edge-in" x1="270" y1="172" x2="326" y2="172" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="172" x2="646" y2="172" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="618" y="160" font-size="14" text-anchor="middle" fill="#334155">yes</text>
  <line x1="910" y1="172" x2="966" y2="172" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="938" y="160" font-size="14" text-anchor="middle" fill="#334155">yes</text>
  <line x1="1105" y1="224" x2="1105" y2="296" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1115" y="266" font-size="14" fill="#334155">changed</text>
  <line x1="970" y1="355" x2="894" y2="355" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="932" y="343" font-size="14" text-anchor="middle" fill="#334155">text</text>
  <line id="edge-touched" x1="560" y1="355" x2="494" y2="355" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="527" y="343" font-size="14" text-anchor="middle" fill="#b91c1c">fails</text>

  <!-- surprise callout -->
  <g id="insertion-inside">
    <rect x="160" y="470" width="730" height="150" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="185" y="506" font-size="19" font-weight="bold" fill="#9a3412">Surprise: adding one line inside the range makes it stale</text>
    <text x="185" y="538" font-size="17" fill="#1f2937">Expect: a function that only grew still points at the same code.</text>
    <text x="185" y="564" font-size="17" fill="#1f2937">Actual: any insertion inside L10-L20 fails the remap, so the Item goes stale.</text>
    <text x="185" y="590" font-size="17" fill="#1f2937">Why: the explanation may no longer describe that code; the author re-authors it.</text>
    <line x1="325" y1="470" x2="325" y2="414" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <text x="40" y="680" font-size="15" fill="#64748b">Saga-only commits change no code, so they never move or stale a reference.</text>
</svg>
