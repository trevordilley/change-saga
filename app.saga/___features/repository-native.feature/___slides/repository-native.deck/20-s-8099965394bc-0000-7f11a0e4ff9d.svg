<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Repository-native and companion Sagas</title><desc id="desc">A canonical repository identity and optional companion cursor keep documentation tied to exact source.</desc><rect width="1280" height="720" fill="#f7f8fb"/><text x="70" y="78" font-family="system-ui" font-size="38" font-weight="700" fill="#17233b">One source identity; two repository placements</text><g font-family="system-ui"><rect id="source" x="70" y="190" width="300" height="260" rx="24" fill="#dce8ff" stroke="#315ca8" stroke-width="3"/><text x="105" y="250" font-size="28" font-weight="700">Source repository</text><text x="105" y="300" font-size="21">canonical remote</text><text x="105" y="338" font-size="21">commit + path + digest</text><rect id="saga" x="490" y="190" width="300" height="260" rx="24" fill="#e5f5ea" stroke="#2f7a4f" stroke-width="3"/><text x="525" y="250" font-size="28" font-weight="700">App Saga</text><text x="525" y="300" font-size="21">inside source or adjacent</text><rect id="cursor" x="910" y="190" width="300" height="260" rx="24" fill="#fff0d8" stroke="#a86516" stroke-width="3"/><text x="945" y="250" font-size="28" font-weight="700">Companion cursor</text><text x="945" y="300" font-size="21">exact documented commit</text><text x="945" y="338" font-size="21">advanced with Saga change</text><path d="M370 320H490M790 320H910" stroke="#17233b" stroke-width="6" marker-end="url(#arrow)"/><text x="70" y="565" font-size="24" fill="#4b5563">Repository verification prevents evidence from silently resolving in the wrong checkout.</text></g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17233b"/></marker></defs></svg>
