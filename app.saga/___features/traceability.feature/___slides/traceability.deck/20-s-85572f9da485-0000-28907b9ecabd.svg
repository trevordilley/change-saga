<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Transitive traceability</title><desc id="desc">Pinned relations join requirements, designs, explanations and exact code, with reverse impact lookup.</desc><rect width="1280" height="720" fill="#f7f8fb"/><text x="70" y="78" font-family="system-ui" font-size="38" font-weight="700" fill="#17233b">Persist the adjacent links; derive the long path</text><g font-family="system-ui"><rect id="requirement" x="60" y="205" width="250" height="190" rx="22" fill="#dce8ff" stroke="#315ca8" stroke-width="3"/><text x="95" y="270" font-size="27" font-weight="700">Requirement</text><text x="95" y="315" font-size="20">revision pin</text><rect id="relations" x="390" y="205" width="250" height="190" rx="22" fill="#eee5ff" stroke="#7048a8" stroke-width="3"/><text x="425" y="270" font-size="27" font-weight="700">Design</text><text x="425" y="315" font-size="20">content digest</text><rect id="explanation" x="720" y="205" width="250" height="190" rx="22" fill="#e5f5ea" stroke="#2f7a4f" stroke-width="3"/><text x="755" y="270" font-size="27" font-weight="700">Explanation</text><text x="755" y="315" font-size="20">semantic Item</text><rect id="evidence" x="1050" y="205" width="170" height="190" rx="22" fill="#fff0d8" stroke="#a86516" stroke-width="3"/><text x="1083" y="270" font-size="27" font-weight="700">Code</text><text x="1083" y="315" font-size="20">commit pin</text><path d="M310 300H390M640 300H720M970 300H1050" stroke="#17233b" stroke-width="6" marker-end="url(#arrow)"/><path d="M1135 430C950 600 320 600 185 430" fill="none" stroke="#c43b4d" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#redarrow)"/><text x="438" y="585" font-size="22" fill="#9f2437">Reverse lookup reveals affected intent and stale blockers</text></g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17233b"/></marker><marker id="redarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c43b4d"/></marker></defs></svg>
