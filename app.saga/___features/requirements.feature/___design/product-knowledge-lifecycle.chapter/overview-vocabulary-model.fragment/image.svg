<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Overview and vocabulary model</title>
  <desc id="desc">A bidirectional information model connecting the application overview, term definitions, feature navigation, stories, source locations, currency warnings, and optional vocabulary growth.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7890bc"/></marker>
    <style>.bg{fill:#0b1020}.panel{fill:#151e34;stroke:#40557f;stroke-width:2}.blue{fill:#142d43;stroke:#58c6ff;stroke-width:3}.gold{fill:#32291e;stroke:#f8bd68;stroke-width:3}.green{fill:#12342f;stroke:#5bd5aa;stroke-width:2}.purple{fill:#292541;stroke:#b99cff;stroke-width:2}.warn{fill:#3a272e;stroke:#ff829d;stroke-width:2}.line{fill:none;stroke:#7890bc;stroke-width:3;marker-end:url(#arrow)}.bi{fill:none;stroke:#7dcfb6;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}.dash{fill:none;stroke:#9a86c8;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}.t{font-family:Inter,system-ui,sans-serif;fill:#f5f7ff}.h{font-size:30px;font-weight:700}.sh{font-size:20px;font-weight:700}.b{font-size:16px}.small{font-size:14px;fill:#c6d0e7}.cap{font-size:13px;fill:#91a2c6;letter-spacing:.08em}.pill{fill:#233150;stroke:#667aa8;stroke-width:1.5}</style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="28"/>
  <text class="t h" x="56" y="62">Overview and vocabulary are the front door, not a glossary appendix</text>
  <text class="t small" x="56" y="91">A newcomer starts broad, follows domain words into intent and source, and can travel back from either place.</text>

  <g id="overview-parts">
    <rect class="blue" x="56" y="132" width="330" height="192" rx="22"/>
    <text class="t cap" x="82" y="167">APPLICATION OVERVIEW</text>
    <text class="t sh" x="82" y="203">Name → pitch → description</text>
    <text class="t b" x="82" y="239">Purpose before structure</text>
    <text class="t b" x="82" y="269">Shared terms beside the explanation</text>
    <text class="t small" x="82" y="299">The current app, in its own language</text>
  </g>

  <g id="term-shape">
    <rect class="gold" x="475" y="132" width="330" height="192" rx="22"/>
    <text class="t cap" x="501" y="167">TERM RECORD</text>
    <text class="t sh" x="501" y="203">Name</text>
    <text class="t b" x="501" y="237">Plain-language definition</text>
    <text class="t b" x="501" y="267">Aliases people may encounter</text>
    <rect class="pill" x="501" y="284" width="267" height="25" rx="12"/>
    <text class="t small" x="515" y="302">Stable identity survives rewording</text>
  </g>
  <path class="line" d="M386 228 H475"/>

  <g id="feature-navigation">
    <rect class="panel" x="894" y="132" width="330" height="192" rx="22"/>
    <text class="t cap" x="920" y="167">FEATURE DESTINATION</text>
    <text class="t sh" x="920" y="203">One durable domain</text>
    <g transform="translate(920 226)">
      <rect class="pill" width="122" height="34" rx="12"/><text class="t small" x="34" y="22">Product</text>
      <rect class="pill" x="136" width="122" height="34" rx="12"/><text class="t small" x="174" y="22">Design</text>
      <rect class="pill" y="48" width="122" height="34" rx="12"/><text class="t small" x="35" y="70">Quality</text>
      <rect class="pill" x="136" y="48" width="122" height="34" rx="12"/><text class="t small" x="156" y="70">Implementation</text>
    </g>
  </g>
  <path class="line" d="M805 228 H894"/>

  <g id="bidirectional-links">
    <rect class="panel" x="250" y="392" width="780" height="124" rx="22"/>
    <text class="t cap" x="276" y="425">BIDIRECTIONAL INDEX</text>
    <rect class="green" x="276" y="444" width="172" height="48" rx="14"/><text class="t b" x="325" y="474">Story intent</text>
    <path class="bi" d="M448 468 H556"/>
    <rect class="gold" x="556" y="444" width="168" height="48" rx="14"/><text class="t b" x="603" y="474">Term</text>
    <path class="bi" d="M724 468 H832"/>
    <rect class="purple" x="832" y="444" width="172" height="48" rx="14"/><text class="t b" x="870" y="474">Source location</text>
  </g>

  <g id="vocabulary-currency">
    <rect class="warn" x="56" y="566" width="552" height="96" rx="18"/>
    <text class="t sh" x="82" y="602">Currency is explicit</text>
    <text class="t small" x="82" y="626">A changed source definition marks the link stale.</text>
    <text class="t small" x="82" y="647">Vocabulary never drifts silently.</text>
  </g>
  <g id="vocabulary-growth">
    <rect class="purple" x="640" y="566" width="584" height="96" rx="18"/>
    <text class="t sh" x="666" y="602">New words are suggestions, not debt</text>
    <text class="t small" x="666" y="626">Comparison can suggest likely domain words.</text>
    <text class="t small" x="666" y="647">An author decides whether they belong.</text>
  </g>
  <path class="dash" d="M640 516 C540 542 380 538 320 566"/>
  <path class="dash" d="M640 516 C740 542 900 538 930 566"/>
</svg>
