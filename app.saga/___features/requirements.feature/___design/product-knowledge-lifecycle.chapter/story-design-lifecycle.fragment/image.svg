<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Story, criterion, prototype, and design lifecycle</title>
  <desc id="desc">A lifecycle diagram showing append-only story revisions, explicit lifecycle states, prototype feedback, criterion-level UX and technical design before implementation, relationship currency, and quality evidence distinct from progress.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7f91bc"/></marker>
    <style>.bg{fill:#0b1020}.panel{fill:#151e34;stroke:#40557f;stroke-width:2}.blue{fill:#142d43;stroke:#58c6ff;stroke-width:3}.green{fill:#12342f;stroke:#5bd5aa;stroke-width:2}.gold{fill:#33291d;stroke:#f7bc65;stroke-width:2}.purple{fill:#2a2541;stroke:#b89bff;stroke-width:2}.warn{fill:#3b2830;stroke:#ff829d;stroke-width:2}.line{fill:none;stroke:#7f91bc;stroke-width:3;marker-end:url(#arrow)}.thin{fill:none;stroke:#6e7fa6;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#9a86c8;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}.t{font-family:Inter,system-ui,sans-serif;fill:#f5f7ff}.h{font-size:30px;font-weight:700}.sh{font-size:19px;font-weight:700}.b{font-size:15px}.small{font-size:13px;fill:#c6d0e7}.cap{font-size:12px;fill:#91a2c6;letter-spacing:.08em}.pill{fill:#233150;stroke:#667aa8;stroke-width:1.5}</style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="28"/>
  <text class="t h" x="48" y="58">Intent matures before code—and remains explainable after it changes</text>
  <text class="t small" x="48" y="85">Identity is stable; definitions, lifecycle events, relations, and evidence are versioned independently.</text>

  <g id="revision-lineage">
    <rect class="panel" x="48" y="116" width="730" height="144" rx="20"/>
    <text class="t cap" x="72" y="145">APPEND-ONLY REVISION LINEAGE</text>
    <rect class="blue" x="74" y="168" width="92" height="54" rx="14"/><text class="t sh" x="107" y="201">r1</text>
    <path class="thin" d="M166 185 H250"/><path class="thin" d="M166 207 H250"/>
    <g id="concurrent-revisions">
      <rect class="gold" x="250" y="153" width="112" height="46" rx="14"/><text class="t b" x="279" y="182">r2-A</text>
      <rect class="purple" x="250" y="205" width="112" height="46" rx="14"/><text class="t b" x="279" y="234">r2-B</text>
      <text class="t small" x="382" y="244">Both heads remain until explicit reconciliation.</text>
    </g>
    <path class="thin" d="M362 176 C500 176 498 195 574 195"/><path class="thin" d="M362 228 C500 228 498 205 574 205"/>
    <rect class="green" x="574" y="172" width="164" height="58" rx="14"/><text class="t b" x="601" y="196">r3 reconciled</text><text class="t small" x="597" y="216">parents: r2-A, r2-B</text>
  </g>

  <g id="story-lifecycle">
    <rect class="panel" x="806" y="116" width="426" height="144" rx="20"/>
    <text class="t cap" x="830" y="145">INDEPENDENT LIFECYCLE</text>
    <rect class="pill" x="830" y="168" width="92" height="40" rx="12"/><text class="t b" x="846" y="194">proposed</text>
    <path class="thin" d="M922 188 H974"/><rect class="green" x="974" y="168" width="92" height="40" rx="12"/><text class="t b" x="991" y="194">accepted</text>
    <path class="thin" d="M1066 188 H1118"/><rect class="purple" x="1118" y="168" width="88" height="40" rx="12"/><text class="t b" x="1130" y="194">retired</text>
    <text class="t small" x="830" y="236">Other explicit outcomes: deferred · rejected</text>
  </g>

  <g id="stable-story-move">
    <rect class="blue" x="48" y="292" width="292" height="106" rx="18"/>
    <text class="t cap" x="72" y="321">STABLE STORY IDENTITY</text>
    <text class="t sh" x="72" y="351">Feature A → Feature B</text>
    <text class="t small" x="72" y="378">Move domains; keep identity + links.</text>
  </g>
  <g id="criterion-identity">
    <rect class="gold" x="362" y="292" width="292" height="106" rx="18"/>
    <text class="t cap" x="386" y="321">STABLE OBLIGATION</text>
    <text class="t sh" x="386" y="351">criterion: checkout-safe</text>
    <text class="t small" x="386" y="378">Keep identity when duty is unchanged.</text>
  </g>
  <g id="citation-provenance">
    <rect class="purple" x="676" y="292" width="292" height="106" rx="18"/>
    <text class="t cap" x="700" y="321">PROVENANCE</text>
    <text class="t sh" x="700" y="351">Why is this required?</text>
    <text class="t small" x="700" y="378">A citation names the authoritative source.</text>
  </g>
  <g id="retired-story-history">
    <rect class="panel" x="990" y="292" width="242" height="106" rx="18"/>
    <text class="t cap" x="1014" y="321">HISTORY</text>
    <text class="t sh" x="1014" y="351">Retired ≠ deleted</text>
    <text class="t small" x="1014" y="378">Past intent remains inspectable.</text>
  </g>

  <g id="prototype-loop">
    <rect class="purple" x="48" y="448" width="210" height="92" rx="18"/>
    <text class="t cap" x="72" y="477">PROTOTYPE</text>
    <text class="t b" x="72" y="505">Local interaction</text>
    <text class="t b" x="72" y="527">or external state</text>
  </g>
  <path class="line" d="M258 494 H326"/>
  <g id="prototype-annotation">
    <rect class="gold" x="326" y="448" width="196" height="92" rx="18"/>
    <text class="t cap" x="350" y="477">ANNOTATION</text>
    <text class="t b" x="350" y="505">Identifiable state</text>
    <text class="t small" x="350" y="527">→ story or criterion</text>
  </g>
  <path class="line" d="M522 494 H590"/>
  <g id="design-before-implementation">
    <rect class="blue" x="590" y="432" width="270" height="124" rx="20"/>
    <text class="t cap" x="614" y="462">REVIEWABLE DESIGN INTENT</text>
    <text class="t sh" x="614" y="492">UX + technical design</text>
    <text class="t b" x="614" y="519">criterion-level addressable element</text>
    <text class="t small" x="614" y="541">Exists before implementation evidence.</text>
  </g>
  <path class="line" d="M860 494 H928"/>
  <g id="quality-proof">
    <rect class="green" x="928" y="432" width="304" height="124" rx="20"/>
    <text class="t cap" x="952" y="462">QUALITY EVIDENCE</text>
    <text class="t sh" x="952" y="491">Test case → run result</text>
    <text class="t b" x="952" y="518">Policy: satisfied · excluded · missing</text>
    <text class="t small" x="952" y="541">Progress is never proof.</text>
  </g>

  <g id="design-currency">
    <rect class="warn" x="48" y="596" width="562" height="76" rx="16"/>
    <text class="t sh" x="72" y="627">Either endpoint changes → relation becomes stale</text>
    <text class="t small" x="72" y="651">Pinned links never silently claim yesterday.s alignment.</text>
  </g>
  <g id="design-navigation">
    <rect class="panel" x="638" y="596" width="594" height="76" rx="16"/>
    <text class="t sh" x="662" y="627">Requirement ⇄ design</text>
    <text class="t small" x="662" y="651">Both surfaces expose the same pinned relationship; neither duplicates the other.</text>
  </g>
  <path class="dash" d="M424 540 C390 580 306 580 306 596"/>
  <path class="dash" d="M726 556 C740 578 820 580 820 596"/>
</svg>
