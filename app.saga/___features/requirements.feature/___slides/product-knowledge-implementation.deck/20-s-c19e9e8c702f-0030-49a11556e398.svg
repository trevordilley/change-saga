<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter,Helvetica,Arial,sans-serif">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="52" y="58" font-size="30" font-weight="700" fill="#0f172a">Quality evidence is versioned independently from work progress</text>
  <text x="52" y="92" font-size="17" fill="#475569">Definition, execution, and policy are separate records so confidence cannot be inferred from activity.</text>
  <g id="test-definitions">
    <rect x="58" y="148" width="352" height="430" rx="20" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="84" y="192" font-size="22" font-weight="700" fill="#312e81">Test definition</text>
    <text x="84" y="235" font-size="16" fill="#334155">criterion revisions verified</text>
    <text x="84" y="271" font-size="16" fill="#334155">ordered steps with stable IDs</text>
    <text x="84" y="307" font-size="16" fill="#334155">one expected result</text>
    <line x1="84" y1="338" x2="384" y2="338" stroke="#a5b4fc"/>
    <text x="84" y="380" font-size="15" fill="#475569">Revisions are complete snapshots.</text>
    <text x="84" y="412" font-size="15" fill="#475569">Lifecycle activation is explicit.</text>
    <text x="84" y="530" font-size="13" fill="#64748b">Landmark: quality-proof</text>
  </g>
  <g id="run-currency">
    <rect x="464" y="148" width="352" height="430" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="490" y="192" font-size="22" font-weight="700" fill="#064e3b">Run + evidence currency</text>
    <rect x="498" y="232" width="284" height="96" rx="12" fill="#fff" stroke="#34d399"/>
    <text x="640" y="269" text-anchor="middle" font-size="16" font-weight="600" fill="#064e3b">run pins test revision</text>
    <text x="640" y="298" text-anchor="middle" font-size="14" fill="#475569">and source/evidence heads</text>
    <text x="490" y="378" font-size="15" fill="#334155">revised test → old pass stale</text>
    <text x="490" y="412" font-size="15" fill="#334155">failure stays visible until superseded</text>
    <text x="490" y="464" font-size="15" font-weight="600" fill="#b91c1c">progress never substitutes for proof</text>
    <text x="490" y="530" font-size="13" fill="#64748b">quality-proof · quality-not-progress</text>
  </g>
  <g id="quality-policy">
    <rect x="870" y="148" width="352" height="430" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="896" y="192" font-size="22" font-weight="700" fill="#9a3412">Criterion policy</text>
    <text x="896" y="235" font-size="16" fill="#334155">required test kinds</text>
    <rect x="904" y="273" width="284" height="62" rx="10" fill="#dcfce7" stroke="#22c55e"/>
    <text x="1046" y="311" text-anchor="middle" font-size="16" fill="#166534">satisfied</text>
    <rect x="904" y="354" width="284" height="62" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="1046" y="392" text-anchor="middle" font-size="16" fill="#92400e">excluded + rationale + source</text>
    <rect x="904" y="435" width="284" height="62" rx="10" fill="#fee2e2" stroke="#ef4444"/>
    <text x="1046" y="473" text-anchor="middle" font-size="16" fill="#991b1b">missing</text>
    <text x="896" y="530" font-size="13" fill="#64748b">quality-proof · quality-not-progress</text>
  </g>
  <text x="52" y="652" font-size="16" fill="#64748b">These code references explain the implemented quality model; they do not create quality cases or claim any unrecorded run passed.</text>
</svg>
