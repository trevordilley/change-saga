<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Merge-friendly Saga storage</title><desc id="desc">Partitioned immutable records are published atomically and merged through Git with explicit conflicts.</desc><rect width="1280" height="720" fill="#f6f4ef"/><text x="70" y="78" font-family="system-ui" font-size="38" font-weight="700" fill="#17233b">Partition locally; reconcile explicitly</text><g font-family="system-ui"><rect id="record" x="70" y="190" width="300" height="260" rx="24" fill="#dce8ff" stroke="#315ca8" stroke-width="3"/><text x="105" y="250" font-size="28" font-weight="700">Independent records</text><text x="105" y="300" font-size="21">revision · event · relation</text><text x="105" y="338" font-size="21">stable identity</text><rect id="writer" x="490" y="190" width="300" height="260" rx="24" fill="#e5f5ea" stroke="#2f7a4f" stroke-width="3"/><text x="525" y="250" font-size="28" font-weight="700">Atomic writer</text><text x="525" y="300" font-size="21">bounded lock</text><text x="525" y="338" font-size="21">stage → publish</text><rect id="git" x="910" y="190" width="300" height="260" rx="24" fill="#fff0d8" stroke="#a86516" stroke-width="3"/><text x="945" y="250" font-size="28" font-weight="700">Git merge</text><text x="945" y="300" font-size="21">parallel authors</text><text x="945" y="338" font-size="21">explicit competing heads</text><path d="M370 320H490M790 320H910" stroke="#17233b" stroke-width="6" marker-end="url(#arrow)"/><text x="70" y="565" font-size="24" fill="#4b5563">A failed local mutation exposes no partial destination.</text></g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17233b"/></marker></defs></svg>
