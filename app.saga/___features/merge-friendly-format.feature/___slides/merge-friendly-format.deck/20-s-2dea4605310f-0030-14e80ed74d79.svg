<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Revision conflict state machine</title>
  <desc id="desc">A unique revision head can fork after Git merges concurrent children; the loader exposes both heads, refuses a synthesized current revision, and requires reconciliation to name every head.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#26344d"/></marker><style>.t{font-family:Inter,system-ui,sans-serif;fill:#17233b}.h{font-size:38px;font-weight:750}.sh{font-size:23px;font-weight:700}.b{font-size:18px}.sm{font-size:16px;fill:#46546c}.e{stroke:#26344d;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1280" height="720" fill="#f7f5ef"/><text class="t h" x="62" y="66">Conflict is a graph state, not a last-writer choice</text>
  <g id="unique-head"><circle cx="178" cy="270" r="78" fill="#e8f7ec" stroke="#2f7a4f" stroke-width="4"/><text class="t sh" x="143" y="264">r1</text><text class="t sm" x="121" y="292">one head</text></g>
  <g id="concurrent-fork"><path class="e" d="M250 240C324 196 354 176 438 176"/><path class="e" d="M250 300C324 344 354 364 438 364"/><rect x="438" y="126" width="178" height="96" rx="20" fill="#e8f1ff" stroke="#315ca8" stroke-width="4"/><text class="t sh" x="492" y="170">r2-A</text><text class="t sm" x="470" y="198">parent r1</text><rect x="438" y="316" width="178" height="96" rx="20" fill="#e8f1ff" stroke="#315ca8" stroke-width="4"/><text class="t sh" x="492" y="360">r2-B</text><text class="t sm" x="470" y="388">parent r1</text></g>
  <g id="explicit-conflict"><path class="e" d="M616 176C678 176 688 228 746 248"/><path class="e" d="M616 364C678 364 688 312 746 292"/><polygon points="746,205 914,205 956,270 914,335 746,335 704,270" fill="#fff0d8" stroke="#a86516" stroke-width="4"/><text class="t sh" x="748" y="260">2 heads</text><text class="t sm" x="737" y="288">Current = nil</text></g>
  <g id="shortcut-blocked"><path d="M786 352V492" stroke="#c34840" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#a)"/><rect x="644" y="492" width="290" height="92" rx="18" fill="#fff0ef" stroke="#c34840" stroke-width="4"/><text class="t sh" x="685" y="530">Shortcut blocked</text><text class="t sm" x="680" y="556">single-parent or inherited revise</text></g>
  <g id="reconcile-all-heads"><path class="e" d="M956 270H1070"/><rect x="1070" y="205" width="160" height="130" rx="24" fill="#efe8ff" stroke="#7356a8" stroke-width="4"/><text class="t sh" x="1115" y="250">r3</text><text class="t sm" x="1090" y="281">parents:</text><text class="t sm" x="1090" y="307">r2-A + r2-B</text></g>
  <g id="restored-current"><path class="e" d="M1150 335V486"/><rect x="1034" y="486" width="216" height="92" rx="46" fill="#e8f7ec" stroke="#2f7a4f" stroke-width="4"/><text class="t sh" x="1082" y="526">unique head</text><text class="t sm" x="1090" y="552">Current = r3</text></g>
  <text class="t sm" x="78" y="642">Git may merge the files cleanly; the application still surfaces semantic divergence until an author reconciles the graph.</text>
</svg>
