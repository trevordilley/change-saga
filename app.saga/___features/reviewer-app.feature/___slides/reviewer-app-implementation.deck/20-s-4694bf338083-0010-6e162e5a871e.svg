<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Documentation and Review are lasting navigation sides</title>
  <desc id="desc">Documentation exposes overview and features; Review exposes overview and pull request reviews. Stable links and derived bridges preserve context without merging the two meanings.</desc>
  <defs><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#334155;stroke-width:3}.doc{fill:#e0f2fe}.review{fill:#ede9fe}.bridge{fill:#dcfce7}.resume{fill:#fef3c7}.h{font:700 25px system-ui;fill:#0f172a}.t{font:17px system-ui;fill:#334155}.title{font:700 34px system-ui;fill:#0f172a}.line{stroke:#475569;stroke-width:4}</style></defs>
  <rect class="bg" width="1200" height="700"/><text class="title" x="60" y="70">Two meanings, one stable shell</text>
  <g id="documentation-side"><rect class="card doc" x="60" y="125" width="450" height="220" rx="20"/><text class="h" x="95" y="180">Documentation</text><text class="t" x="95" y="225">Overview + features</text><text class="t" x="95" y="265">Current product truth</text><text class="t" x="95" y="305">No review controls</text></g>
  <g id="review-side"><rect class="card review" x="690" y="125" width="450" height="220" rx="20"/><text class="h" x="725" y="180">Review</text><text class="t" x="725" y="225">Overview + pull request reviews</text><text class="t" x="725" y="265">One comparison and its decisions</text><text class="t" x="725" y="305">Historical after merge</text></g>
  <g id="related-reviews"><rect class="card bridge" x="425" y="410" width="350" height="110" rx="18"/><text class="h" x="465" y="455">Derived bridge</text><text class="t" x="465" y="490">Changed code intersects documented ownership</text></g>
  <g id="resume-context"><rect class="card resume" x="325" y="570" width="550" height="80" rx="18"/><text class="h" x="365" y="620">URLs and browser history retain context</text></g>
  <line class="line" x1="510" y1="235" x2="690" y2="235"/><line class="line" x1="600" y1="345" x2="600" y2="410"/>
</svg>
