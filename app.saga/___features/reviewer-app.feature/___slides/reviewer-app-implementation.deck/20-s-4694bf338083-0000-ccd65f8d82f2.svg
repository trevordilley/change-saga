<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Safe local review trust boundaries</title>
  <desc id="desc">Untrusted Saga content crosses bounded parsing into the local reviewer. Interactive content stays in a networkless opaque sandbox, while only validated messages reach the parent application. Loopback, origin checks, redaction, and resource limits protect the host.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#475569"/></marker>
    <style>.bg{fill:#f8fafc}.zone{fill:#fff;stroke:#334155;stroke-width:3}.untrusted{fill:#fee2e2}.trusted{fill:#dcfce7}.sandbox{fill:#fef3c7}.h{font:700 24px system-ui;fill:#0f172a}.t{font:16px system-ui;fill:#334155}.label{font:700 16px system-ui;fill:#991b1b}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.deny{stroke:#b91c1c;stroke-width:4}</style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <g id="untrusted-content"><rect class="zone untrusted" x="55" y="125" width="270" height="420" rx="20"/><text class="h" x="85" y="175">Untrusted branch</text><text class="t" x="85" y="220">Markdown · SVG · HTML</text><text class="t" x="85" y="255">Images · review records</text><text class="label" x="85" y="500">Never executable authority</text></g>
  <g id="local-server"><rect class="zone trusted" x="445" y="75" width="310" height="520" rx="20"/><text class="h" x="480" y="130">Local reviewer</text><text class="t" x="480" y="175">Loopback bind</text><text class="t" x="480" y="210">Host + site checks</text><text class="t" x="480" y="245">Bounded parsing</text><text class="t" x="480" y="280">Path redaction</text><text class="t" x="480" y="315">Local assets only</text><rect class="zone sandbox" x="485" y="385" width="230" height="150" rx="14"/><text class="h" x="510" y="425">Opaque sandbox</text><text class="t" x="510" y="463">No network or parent</text><text class="t" x="510" y="493">Validated messages only</text></g>
  <g id="host-boundary"><rect class="zone" x="875" y="125" width="270" height="420" rx="20"/><text class="h" x="910" y="175">Reviewer host</text><text class="t" x="910" y="220">Repository source</text><text class="t" x="910" y="255">Browser state</text><text class="t" x="910" y="290">Network identity</text><line class="deny" x1="900" y1="390" x2="1120" y2="390"/><text class="label" x="910" y="430">No ambient access</text></g>
  <path class="line" d="M325 335 H435"/><path class="line" d="M755 335 H865"/>
  <text class="t" x="345" y="315">bounded input</text><text class="t" x="765" y="315">sanitized UI</text>
</svg>
