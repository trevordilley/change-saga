<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Review decisions and attribution</title><desc id="desc">Append-only slide decisions retain history and currency, while explicit delegated human authority is incomplete.</desc><rect width="1280" height="720" fill="#f6f4ef"/><text x="70" y="78" font-family="system-ui" font-size="38" font-weight="700" fill="#17233b">Keep decisions; recompute their currency</text><g font-family="system-ui"><rect id="decision" x="70" y="190" width="300" height="260" rx="24" fill="#dce8ff" stroke="#315ca8" stroke-width="3"/><text x="105" y="250" font-size="28" font-weight="700">Decision event</text><text x="105" y="300" font-size="21">slide · state · head</text><text x="105" y="338" font-size="21">content digest</text><rect id="currency" x="490" y="190" width="300" height="260" rx="24" fill="#e5f5ea" stroke="#2f7a4f" stroke-width="3"/><text x="525" y="250" font-size="28" font-weight="700">Current projection</text><text x="525" y="300" font-size="21">latest per reviewer seat</text><text x="525" y="338" font-size="21">current · out of date</text><rect id="attribution-gap" x="910" y="190" width="300" height="260" rx="24" fill="#fff0d8" stroke="#c43b4d" stroke-width="4"/><text x="945" y="250" font-size="28" font-weight="700">Attribution</text><text x="945" y="300" font-size="21">Git actor + AI seat</text><text x="945" y="338" font-size="21" fill="#9f2437">human principal missing</text><path d="M370 320H490M790 320H910" stroke="#17233b" stroke-width="6" marker-end="url(#arrow)"/><text x="70" y="565" font-size="24" fill="#4b5563">A later decision changes the projection without deleting history.</text></g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17233b"/></marker></defs></svg>
