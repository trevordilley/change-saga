<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Decision failure branches</title>
  <desc id="desc">A branching decision flow shows token, review range, frozen state, and payload validation failures stopping before storage. A separate post-write callout shows how attribution can later degrade when Git history or local identity is unavailable.</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#465463"/></marker><marker id="warn" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#d0722d"/></marker></defs>
  <rect width="1280" height="720" fill="#fbfaf7"/>
  <text x="58" y="64" fill="#1c2933" font-family="system-ui" font-size="35" font-weight="760">Failures stop before the event store</text>
  <text x="58" y="98" fill="#667581" font-family="system-ui" font-size="17">Every solid rejection branch is enforced. Attribution is resolved later and may degrade visibly.</text>
  <g font-family="system-ui">
    <rect x="52" y="291" width="156" height="76" rx="38" fill="#dcecf4" stroke="#56839a" stroke-width="3"/><text x="130" y="337" text-anchor="middle" fill="#21485b" font-size="20" font-weight="750">POST decision</text>
    <path d="M208 329H282" stroke="#465463" stroke-width="4" marker-end="url(#a)"/>
    <polygon points="350,248 420,329 350,410 280,329" fill="#e9e7f5" stroke="#716b9f" stroke-width="3"/><text x="350" y="319" text-anchor="middle" fill="#403b6a" font-size="17" font-weight="750">token</text><text x="350" y="343" text-anchor="middle" fill="#403b6a" font-size="17" font-weight="750">valid?</text>
    <path d="M420 329H496" stroke="#465463" stroke-width="4" marker-end="url(#a)"/><text x="458" y="314" text-anchor="middle" fill="#65727b" font-size="14">yes</text>
    <polygon points="564,248 634,329 564,410 494,329" fill="#e9e7f5" stroke="#716b9f" stroke-width="3"/><text x="564" y="309" text-anchor="middle" fill="#403b6a" font-size="16" font-weight="750">review open</text><text x="564" y="333" text-anchor="middle" fill="#403b6a" font-size="16" font-weight="750">and head</text><text x="564" y="357" text-anchor="middle" fill="#403b6a" font-size="16" font-weight="750">resolves?</text>
    <path d="M634 329H710" stroke="#465463" stroke-width="4" marker-end="url(#a)"/><text x="672" y="314" text-anchor="middle" fill="#65727b" font-size="14">yes</text>
    <polygon points="778,248 848,329 778,410 708,329" fill="#e9e7f5" stroke="#716b9f" stroke-width="3"/><text x="778" y="309" text-anchor="middle" fill="#403b6a" font-size="16" font-weight="750">state + seat</text><text x="778" y="333" text-anchor="middle" fill="#403b6a" font-size="16" font-weight="750">+ body</text><text x="778" y="357" text-anchor="middle" fill="#403b6a" font-size="16" font-weight="750">valid?</text>
    <path d="M848 329H935" stroke="#465463" stroke-width="4" marker-end="url(#a)"/><text x="891" y="314" text-anchor="middle" fill="#65727b" font-size="14">yes</text>
  </g>
  <g id="token-failure" font-family="system-ui"><path d="M350 410V490" stroke="#b74b53" stroke-width="4" marker-end="url(#a)"/><text x="362" y="452" fill="#9f3740" font-size="14">no</text><rect x="260" y="500" width="180" height="78" rx="18" fill="#f8dfe1" stroke="#d95f67" stroke-width="3"/><text x="350" y="532" text-anchor="middle" fill="#7b2930" font-size="18" font-weight="750">403 forbidden</text><text x="350" y="557" text-anchor="middle" fill="#9a4047" font-size="14">no record written</text></g>
  <g id="history-failure" font-family="system-ui"><path d="M564 410V490" stroke="#b74b53" stroke-width="4" marker-end="url(#a)"/><text x="576" y="452" fill="#9f3740" font-size="14">no</text><rect x="474" y="500" width="180" height="78" rx="18" fill="#f8dfe1" stroke="#d95f67" stroke-width="3"/><text x="564" y="532" text-anchor="middle" fill="#7b2930" font-size="18" font-weight="750">409 conflict</text><text x="564" y="557" text-anchor="middle" fill="#9a4047" font-size="14">history stays read-only</text></g>
  <g id="validation-failure" font-family="system-ui"><path d="M778 410V490" stroke="#b74b53" stroke-width="4" marker-end="url(#a)"/><text x="790" y="452" fill="#9f3740" font-size="14">no</text><rect x="688" y="500" width="180" height="78" rx="18" fill="#f8dfe1" stroke="#d95f67" stroke-width="3"/><text x="778" y="532" text-anchor="middle" fill="#7b2930" font-size="18" font-weight="750">400 / CLI error</text><text x="778" y="557" text-anchor="middle" fill="#9a4047" font-size="14">no record written</text></g>
  <g id="append-success" font-family="system-ui"><rect x="938" y="275" width="266" height="108" rx="24" fill="#dff2e8" stroke="#4ca875" stroke-width="3"/><text x="1071" y="315" text-anchor="middle" fill="#265d40" font-size="20" font-weight="750">append event</text><text x="1071" y="344" text-anchor="middle" fill="#367b57" font-size="16">create-only JSON write</text><text x="1071" y="367" text-anchor="middle" fill="#367b57" font-size="14">then 303 / CLI success</text></g>
  <g id="principal-bypass" font-family="system-ui"><path d="M1071 383V412" fill="none" stroke="#d0722d" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#warn)"/><rect x="928" y="420" width="276" height="158" rx="18" fill="#fff0df" stroke="#d9823f" stroke-width="3" stroke-dasharray="9 7"/><text x="1066" y="450" text-anchor="middle" fill="#8b4c1d" font-size="16" font-weight="750">LATER ATTRIBUTION LOOKUP</text><text x="950" y="480" fill="#9e5b28" font-size="14">committed → introducing committer</text><text x="950" y="505" fill="#9e5b28" font-size="14">uncommitted → local Git identity</text><text x="950" y="530" fill="#9e5b28" font-size="14">rewritten → visible degraded status</text><text x="950" y="555" fill="#9e5b28" font-size="14">unavailable → visible degraded status</text></g>
  <text x="58" y="650" fill="#7a858d" font-family="system-ui" font-size="15">Solid branches are tested containment. The dashed callout is read-time degradation, not a mutation bypass.</text>
</svg>
