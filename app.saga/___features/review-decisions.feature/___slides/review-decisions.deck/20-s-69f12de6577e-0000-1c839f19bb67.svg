<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Review decision ownership architecture</title>
  <desc id="desc">Browser and CLI entry paths cross a mutation boundary, append immutable decision events, and feed a read-time projection. Composite provenance combines the Git or local actor with direct-human or named-AI reviewer metadata.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#102b3f"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#74d3ff"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".28"/></filter></defs>
  <rect width="1280" height="720" fill="url(#bg)"/><text x="64" y="70" fill="#f5fbff" font-family="system-ui" font-size="36" font-weight="750">Who owns a review decision?</text><text x="64" y="104" fill="#a9c4d6" font-family="system-ui" font-size="18">Write ownership and read ownership are deliberately separate.</text>
  <rect x="44" y="142" width="366" height="410" rx="28" fill="#0d2035" stroke="#355670" stroke-width="2" stroke-dasharray="9 8"/><text x="68" y="178" fill="#8eb7cd" font-family="system-ui" font-size="15" font-weight="700" letter-spacing="1.2">MUTATION ENTRY BOUNDARY</text>
  <g id="browser-human" filter="url(#shadow)"><rect x="76" y="212" width="300" height="118" rx="20" fill="#173d52" stroke="#63d2ff" stroke-width="2"/><circle cx="111" cy="252" r="15" fill="#63d2ff"/><path d="M91 295c4-22 36-22 40 0" fill="none" stroke="#63d2ff" stroke-width="10" stroke-linecap="round"/><text x="146" y="252" fill="#f5fbff" font-family="system-ui" font-size="23" font-weight="700">Browser reviewer</text><text x="146" y="282" fill="#b8d3df" font-family="system-ui" font-size="17">always a human seat</text></g>
  <g id="cli-seat" filter="url(#shadow)"><rect x="76" y="374" width="300" height="132" rx="20" fill="#1b3357" stroke="#91a8ff" stroke-width="2"/><path d="M103 422l14 14-14 14M126 450h24" fill="none" stroke="#91a8ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="421" fill="#f5fbff" font-family="system-ui" font-size="23" font-weight="700">CLI reviewer seat</text><text x="170" y="451" fill="#c5cdfa" font-family="system-ui" font-size="17">human or named AI</text><text x="170" y="478" fill="#8ea3c8" font-family="system-ui" font-size="15">agent + exact model for AI</text></g>
  <g id="write-path"><path d="M376 271H493M376 440H450Q493 440 493 397V347" fill="none" stroke="#74d3ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="412" y="295" width="104" height="40" rx="20" fill="#0b1727" stroke="#355670"/><text x="464" y="321" text-anchor="middle" fill="#c9eaff" font-family="system-ui" font-size="13" font-weight="700">shared write</text></g>
  <g id="event-store" filter="url(#shadow)"><ellipse cx="650" cy="228" rx="124" ry="34" fill="#183f3a" stroke="#63e6be" stroke-width="3"/><path d="M526 228v194c0 19 56 34 124 34s124-15 124-34V228" fill="#15352f" stroke="#63e6be" stroke-width="3"/><ellipse cx="650" cy="422" rx="124" ry="34" fill="#183f3a" stroke="#63e6be" stroke-width="3"/><text x="650" y="305" text-anchor="middle" fill="#effff9" font-family="system-ui" font-size="25" font-weight="750">Decision events</text><text x="650" y="342" text-anchor="middle" fill="#b8e8d8" font-family="system-ui" font-size="17">one JSON file per action</text><text x="650" y="373" text-anchor="middle" fill="#8cc6b2" font-family="ui-monospace, monospace" font-size="15">head + slide digest</text></g>
  <g id="read-projection" filter="url(#shadow)"><path d="M774 325H880" fill="none" stroke="#74d3ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="885" y="205" width="330" height="244" rx="24" fill="#28224f" stroke="#b6a2ff" stroke-width="3"/><text x="925" y="258" fill="#faf8ff" font-family="system-ui" font-size="25" font-weight="750">Read-time projection</text><text x="925" y="301" fill="#d9d0ff" font-family="system-ui" font-size="18">latest event per reviewer seat</text><text x="925" y="335" fill="#d9d0ff" font-family="system-ui" font-size="18">+ current / out of date / unknown</text><line x1="925" y1="366" x2="1172" y2="366" stroke="#665f91"/><text x="925" y="399" fill="#a9a0d6" font-family="system-ui" font-size="15">No aggregate pull-request</text><text x="925" y="423" fill="#a9a0d6" font-family="system-ui" font-size="15">verdict is produced.</text></g>
  <g id="authority-gap"><path d="M864 520l20-18 20 18" fill="none" stroke="#63e6be" stroke-width="4"/><rect x="815" y="520" width="400" height="132" rx="20" fill="#15352f" stroke="#63e6be" stroke-width="3"/><text x="850" y="561" fill="#c8fff0" font-family="system-ui" font-size="19" font-weight="750">Composite provenance</text><text x="850" y="594" fill="#ddfff6" font-family="system-ui" font-size="17">AI seat + Git or local author</text><text x="850" y="621" fill="#a8decf" font-family="system-ui" font-size="17">UI: “AI … for AUTHOR”</text></g>
  <text x="64" y="670" fill="#7697aa" font-family="system-ui" font-size="15">Event history is owned by storage; visible meaning is owned by the projection.</text>
</svg>
