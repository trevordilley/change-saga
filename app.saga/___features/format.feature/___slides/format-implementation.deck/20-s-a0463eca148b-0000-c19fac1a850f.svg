<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter,Helvetica,Arial,sans-serif">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="56" y="62" font-size="30" font-weight="700" fill="#0f172a">Feature flags are a release overlay, not a second product model</text>
  <text x="56" y="96" font-size="17" fill="#475569">Immutable definitions and lifecycle events project into explicit availability while the documented story remains intact.</text>
  <g id="flag-records">
    <rect x="72" y="158" width="480" height="370" rx="20" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="104" y="205" font-size="23" font-weight="700" fill="#312e81">Flag record graph</text>
    <rect x="112" y="244" width="182" height="82" rx="12" fill="#fff" stroke="#818cf8"/>
    <text x="203" y="278" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1b4b">stable identity</text>
    <text x="203" y="304" text-anchor="middle" font-size="15" fill="#475569">flag URN</text>
    <rect x="330" y="244" width="182" height="82" rx="12" fill="#fff" stroke="#818cf8"/>
    <text x="421" y="278" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1b4b">revision heads</text>
    <text x="421" y="304" text-anchor="middle" font-size="15" fill="#475569">targets + description</text>
    <rect x="112" y="366" width="400" height="108" rx="12" fill="#fff" stroke="#818cf8"/>
    <text x="312" y="402" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1b4b">append-only lifecycle heads</text>
    <text x="312" y="432" text-anchor="middle" font-size="16" fill="#475569">off · on · retired</text>
    <text x="312" y="457" text-anchor="middle" font-size="14" fill="#64748b">retirement preserves the preceding graph</text>
  </g>
  <path d="M570 344 H676" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <g id="release-projection">
    <rect x="700" y="158" width="508" height="370" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="732" y="205" font-size="23" font-weight="700" fill="#064e3b">Current release projection</text>
    <rect x="744" y="244" width="420" height="72" rx="12" fill="#fff" stroke="#34d399"/>
    <text x="954" y="275" text-anchor="middle" font-size="18" font-weight="600" fill="#064e3b">target expansion</text>
    <text x="954" y="300" text-anchor="middle" font-size="14" fill="#475569">feature target → all current feature stories</text>
    <rect x="744" y="346" width="420" height="118" rx="12" fill="#fff" stroke="#34d399"/>
    <text x="954" y="378" text-anchor="middle" font-size="18" font-weight="600" fill="#064e3b">availability is explicit</text>
    <text x="954" y="408" text-anchor="middle" font-size="15" fill="#475569">implemented + off → implemented, not enabled</text>
    <text x="954" y="435" text-anchor="middle" font-size="15" fill="#475569">retired → history, not current release</text>
  </g>
  <rect x="72" y="574" width="1136" height="82" rx="14" fill="#fff7ed" stroke="#ea580c"/>
  <text x="98" y="608" font-size="17" font-weight="700" fill="#9a3412">Design landmarks realized</text>
  <text x="98" y="636" font-size="15" fill="#475569">flag-targets · flag-state · off-visible · retired-flag-history</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs>
</svg>
