<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">One living Saga and its release visibility</title>
  <desc id="desc">An architecture diagram showing app-wide orientation feeding durable feature slices, a current-versus-history lens, and feature flags that overlay availability without deleting documentation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f7f9f"/></marker>
    <style>
      .bg{fill:#0b1020}.panel{fill:#141c31;stroke:#42557d;stroke-width:2}.accent{fill:#182d45;stroke:#55c2ff;stroke-width:3}.warm{fill:#30251f;stroke:#ffb86b;stroke-width:3}.muted{fill:#1b2236;stroke:#65708b;stroke-width:2}.good{fill:#12352f;stroke:#55d6a7;stroke-width:2}.off{fill:#3a2830;stroke:#ff7c9d;stroke-width:2}.history{fill:#2b273d;stroke:#b69cff;stroke-width:2}.line{fill:none;stroke:#6f7f9f;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#8d99b8;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}.t{font-family:Inter,system-ui,sans-serif;fill:#f4f7ff}.h{font-size:30px;font-weight:700}.sh{font-size:20px;font-weight:700}.b{font-size:16px}.small{font-size:14px;fill:#c7d0e8}.cap{font-size:13px;fill:#8fa0c2;letter-spacing:.08em}.pill{fill:#24324f;stroke:#657aa6;stroke-width:1.5}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="28"/>
  <text class="t h" x="56" y="62">One living Saga: current truth with retained history</text>
  <text class="t small" x="56" y="91">Release state changes what is available; it never erases what the product means.</text>

  <g id="app-root">
    <rect class="accent" x="56" y="130" width="276" height="228" rx="22"/>
    <text class="t cap" x="80" y="164">APP-WIDE ORIENTATION</text>
    <text class="t sh" x="80" y="198">Change Saga</text>
    <text class="t b" x="80" y="231">Name · pitch · description</text>
    <text class="t b" x="80" y="261">People · vocabulary</text>
    <text class="t b" x="80" y="291">Feature flags · onboarding</text>
    <rect class="pill" x="80" y="315" width="214" height="25" rx="12"/>
    <text class="t small" x="94" y="333">One entry point for orientation</text>
  </g>

  <path class="line" d="M332 244 H405"/>

  <g id="feature-slices">
    <rect class="panel" x="405" y="130" width="474" height="228" rx="22"/>
    <text class="t cap" x="431" y="164">DURABLE FEATURE SLICES</text>
    <text class="t sh" x="431" y="198">Browse behavior as a coherent domain</text>
    <g transform="translate(431 224)">
      <rect class="pill" width="92" height="58" rx="14"/><text class="t b" x="18" y="35">Product</text>
      <rect class="pill" x="104" width="92" height="58" rx="14"/><text class="t b" x="124" y="35">Design</text>
      <rect class="pill" x="208" width="92" height="58" rx="14"/><text class="t b" x="225" y="35">Quality</text>
      <rect class="pill" x="312" width="112" height="58" rx="14"/><text class="t b" x="327" y="35">Implementation</text>
      <path class="line" d="M92 29 H104"/><path class="line" d="M196 29 H208"/><path class="line" d="M300 29 H312"/>
    </g>
    <text class="t small" x="431" y="319">Stable identities let knowledge move or evolve without breaking links.</text>
  </g>

  <g id="current-history">
    <rect class="history" x="56" y="407" width="823" height="118" rx="20"/>
    <text class="t cap" x="80" y="440">LIVING PROJECTION</text>
    <text class="t sh" x="80" y="472">Current application view</text>
    <text class="t small" x="80" y="499">Only current accepted knowledge leads.</text>
    <path class="dash" d="M505 466 H608"/>
    <text class="t sh" x="636" y="472">Append-only history</text>
    <text class="t small" x="636" y="499">Earlier revisions remain.</text>
  </g>

  <path class="line" d="M879 244 H942"/>
  <g id="flag-targets">
    <rect class="warm" x="942" y="130" width="282" height="228" rx="22"/>
    <text class="t cap" x="968" y="164">RELEASE OVERLAY</text>
    <text class="t sh" x="968" y="198">Flag → targets</text>
    <text class="t b" x="968" y="230">Feature</text>
    <text class="t b" x="968" y="258">Story</text>
    <path class="dash" d="M1046 225 H1165"/>
    <path class="dash" d="M1046 253 H1165"/>
    <text class="t small" x="968" y="307">Availability overlays knowledge;</text>
    <text class="t small" x="968" y="329">it never creates a second copy.</text>
  </g>

  <g id="flag-state">
    <rect class="panel" x="942" y="407" width="282" height="118" rx="20"/>
    <text class="t cap" x="968" y="438">VISIBLE STATE</text>
    <rect class="good" x="968" y="456" width="64" height="40" rx="12"/><text class="t b" x="987" y="482">ON</text>
    <rect class="off" x="1044" y="456" width="66" height="40" rx="12"/><text class="t b" x="1060" y="482">OFF</text>
    <rect class="history" x="1122" y="456" width="78" height="40" rx="12"/><text class="t small" x="1133" y="481">RETIRED</text>
  </g>

  <g id="off-visible">
    <rect class="off" x="56" y="570" width="568" height="96" rx="18"/>
    <text class="t sh" x="80" y="606">Off means documented, visibly unavailable</text>
    <text class="t small" x="80" y="630">Readers see intent plus the disabled state.</text>
    <text class="t small" x="80" y="650">Unavailable never looks like missing implementation.</text>
  </g>
  <g id="retired-flag-history">
    <rect class="history" x="656" y="570" width="568" height="96" rx="18"/>
    <text class="t sh" x="680" y="606">Retired means historical, not erased</text>
    <text class="t small" x="680" y="630">The current view stops advertising the flag.</text>
    <text class="t small" x="680" y="650">Its lifecycle remains inspectable.</text>
  </g>
  <path class="dash" d="M1076 525 C1020 560 520 548 340 570"/>
  <path class="dash" d="M1125 525 C1135 546 1060 554 1000 570"/>
</svg>
