<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Scoped, filtered inventory reads</title><desc id="desc">Filters narrow resolvable records; unresolved candidates keep their own page.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306687"/></marker></defs><rect width="1280" height="720" fill="#f1f5f8"/><g font-family="Arial,sans-serif"><text x="50" y="48" font-size="16" fill="#47647a" font-weight="normal" text-anchor="start">TECHNICAL INVENTORY / IMPLEMENTED READS</text><text x="50" y="94" font-size="34" fill="#20384b" font-weight="bold" text-anchor="start">Scoped, filtered inventory reads</text><text x="50" y="128" font-size="19" fill="#20384b" font-weight="normal" text-anchor="start">Filters narrow resolvable records; unresolved candidates keep their own page.</text><g id="scope"><rect x="50" y="170" width="300" height="150" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="64" y="198" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Candidates</text><text x="64" y="224" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">kind / target, or feature scope:</text><text x="64" y="246" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">Item pin -&gt; declared member,</text><text x="64" y="268" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">holder or relationship pins</text><text x="64" y="290" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">at each saved revision</text></g><path d="M350 245L420 245" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g><rect x="420" y="190" width="230" height="110" rx="10" fill="#dce8f0" stroke="#9fb7c8" stroke-width="1.5"/><text x="434" y="218" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Select exact revisions</text><text x="434" y="244" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">current head, or exactly</text><text x="434" y="266" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">the scoped pins</text></g><path d="M650 225L730 225" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="690" y="213" font-size="14" fill="#536b7d" font-weight="normal" text-anchor="middle">resolvable</text><g id="filters"><rect x="730" y="160" width="250" height="130" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="744" y="188" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Explicit intent filter</text><text x="744" y="214" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">proposed | implemented |</text><text x="744" y="236" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">unspecified (legacy)</text><text x="744" y="258" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">never inferred</text></g><path d="M980 225L1030 225" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g><rect x="1030" y="170" width="200" height="110" rx="10" fill="#dce8f0" stroke="#9fb7c8" stroke-width="1.5"/><text x="1044" y="198" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Records page</text><text x="1044" y="224" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">snapshot-bound</text><text x="1044" y="246" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">cursor</text></g><path d="M535 300L535 420" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="620" y="365" font-size="14" fill="#536b7d" font-weight="normal" text-anchor="middle">missing / conflicted</text><g id="unresolved"><rect x="330" y="420" width="410" height="150" rx="10" fill="#fbeee6" stroke="#c98b63" stroke-width="1.5"/><text x="344" y="448" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Unresolved page</text><text x="344" y="474" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">own --conflict-cursor; reasons and</text><text x="344" y="496" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">heads kept; never removed by</text><text x="344" y="518" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">intent or newness filters</text></g><g id="newness"><rect x="820" y="360" width="410" height="250" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="834" y="388" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Newness vs named base</text><text x="834" y="414" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">--new requires --against</text><text x="834" y="436" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">base Saga read -&gt; new / existing</text><text x="834" y="458" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">Saga absent at base -&gt; all new</text><text x="834" y="480" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">unreadable base -&gt; unknown;</text><text x="834" y="502" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">--new refuses: baseline_unknown</text><text x="834" y="524" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">independent of intent</text></g><path d="M855 290L855 360" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/></g></svg>