<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Count once, keep every owner</title><desc id="desc">A proposed shared selection resolver checks exact pins, source subsets and currency, then contributes current selected code to a deduplicated union. Stale or unresolved selections contribute no current coverage. Each report names its measurement scope and retains every explanation path.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#476079"/></marker></defs>
<rect width="1280" height="720" fill="#f6f8fa"/>
<g font-family="Arial,sans-serif" fill="#142638">
<text x="60" y="52" font-size="18" fill="#925b14">TECHNICAL INVENTORY · PROPOSED DESIGN / 5</text>
<text x="60" y="110" font-size="40">Count once, keep every owner</text>
<g id="scope"><text x="60" y="153" font-size="22" fill="#486173">Every result names its source view, code scope and coverage kind.</text><text x="60" y="188" font-size="18">Inventory coverage ≠ implementation-deck coverage ≠ PR review coverage</text></g>
<g id="inputs"><rect x="60" y="270" width="280" height="154" rx="10" fill="white" stroke="#245d8c" stroke-width="2"/><text x="80" y="307" font-size="24">Declared selections</text><text x="80" y="345" font-size="20">Direct Item evidence</text><text x="80" y="379" font-size="20">+ selected inventory paths</text><text x="80" y="410" font-size="17" fill="#925b14">The latter is proposed work</text></g>
<g id="resolver"><path d="M555 235L750 347L555 459L360 347Z" fill="#fff6e8" stroke="#a56615" stroke-width="2" stroke-dasharray="8 5"/><text x="555" y="318" text-anchor="middle" font-size="23">Resolve selected path</text><text x="555" y="352" text-anchor="middle" font-size="19">Exact pins + subset digest</text><text x="555" y="384" text-anchor="middle" font-size="18">Current in this view?</text></g>
<g id="current"><rect x="840" y="245" width="380" height="160" rx="10" fill="#edf6f0" stroke="#48745b" stroke-width="2"/><text x="860" y="280" font-size="23">Union of selected code</text><text x="860" y="317" font-size="20">Count each location only once</text><text x="860" y="351" font-size="20">Retain every Item → entity path</text><text x="860" y="384" font-size="18">Show overlaps; never hide their owners</text></g>
<g id="blocked"><rect x="385" y="511" width="410" height="105" rx="10" fill="#fff0ee" stroke="#a15348" stroke-width="2"/><text x="405" y="547" font-size="23">Needs reconciliation</text><text x="405" y="583" font-size="19">Missing / changed / unresolved → no credit</text></g>
<g id="flow"><g fill="none" stroke="#476079" stroke-width="2" marker-end="url(#arrow)"><path d="M340 347H360"/><path d="M750 347H840"/><path d="M555 459V511"/></g><text x="770" y="332" font-size="18">yes</text><text x="572" y="490" font-size="18">no / unknown</text></g>
<g id="reuse"><text x="60" y="655" font-size="21">Reuse today's byte resolver and coverage union; add inspectable selection provenance.</text><text x="60" y="689" font-size="18" fill="#486173">HEAD health is separate from diff coverage: a valid deletion-side reference does not prove current documentation.</text></g>
</g></svg>
