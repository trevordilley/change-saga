<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Reviewer runtime media and evidence paths</title>
  <desc id="desc">The media decision selects iframe or image rendering. Both rendering branches converge on one semantic Item overlay, which opens exact code or saved Component/System explanations on demand.</desc>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#213650"/></marker></defs>
  <rect width="1280" height="720" fill="#f4f8f7"/>
  <text x="62" y="62" font-family="system-ui" font-size="32" font-weight="760" fill="#16243a">Two media paths converge on one semantic overlay</text>
  <text x="62" y="97" font-family="system-ui" font-size="18" fill="#526276">Rendering differs by media; Item focus opens exact code or its saved technical definition.</text>

  <g id="projector">
    <path d="M60 205H290V505H60Z" fill="#e8f0ff" stroke="#3769b0" stroke-width="4"/>
    <text x="95" y="252" font-family="system-ui" font-size="21" font-weight="760" fill="#294f84">Projected slide</text>
    <text x="94" y="306" font-family="system-ui" font-size="15" fill="#405976">Fragment view</text>
    <text x="94" y="338" font-family="system-ui" font-size="15" fill="#405976">Item landmarks</text>
    <text x="94" y="370" font-family="system-ui" font-size="15" fill="#405976">Evidence + saved pin</text>
    <path d="M94 404H256" stroke="#9ab5df" stroke-width="2"/>
    <text x="94" y="442" font-family="ui-monospace,monospace" font-size="13" fill="#294f84">/f/{slide}/{asset}</text>
  </g>
  <g id="media-switch">
    <path d="M290 355H377" stroke="#213650" stroke-width="4" marker-end="url(#arr)"/>
    <path d="M462 270L547 355L462 440L377 355Z" fill="#fff2ca" stroke="#d8951b" stroke-width="4"/>
    <text x="420" y="349" font-family="system-ui" font-size="18" font-weight="760" fill="#68480f">media</text>
    <text x="426" y="375" font-family="system-ui" font-size="16" fill="#68480f">type?</text>
  </g>
  <g id="iframe-branch">
    <path d="M507 310C555 242 598 213 650 213" fill="none" stroke="#7057b8" stroke-width="4" marker-end="url(#arr)"/>
    <rect x="650" y="150" width="275" height="130" rx="24" fill="#f0ebff" stroke="#7057b8" stroke-width="4"/>
    <text x="686" y="194" font-family="system-ui" font-size="21" font-weight="760" fill="#51466d">SVG or HTML</text>
    <text x="686" y="229" font-family="ui-monospace,monospace" font-size="14" fill="#51466d">iframe allow-scripts</text>
    <text x="686" y="255" font-family="system-ui" font-size="13" fill="#665a82">no same-origin capability</text>
    <path d="M925 215C985 215 1000 260 1027 300" fill="none" stroke="#7057b8" stroke-width="4" marker-end="url(#arr)"/>
  </g>
  <g id="image-branch">
    <path d="M507 400C555 467 598 492 650 492" fill="none" stroke="#2a7c59" stroke-width="4" marker-end="url(#arr)"/>
    <rect x="650" y="430" width="275" height="124" rx="24" fill="#e5f6ed" stroke="#2a7c59" stroke-width="4"/>
    <text x="686" y="477" font-family="system-ui" font-size="21" font-weight="760" fill="#245b45">PNG · JPEG · WebP</text>
    <text x="686" y="516" font-family="ui-monospace,monospace" font-size="15" fill="#245b45">&lt;img src="…"&gt;</text>
    <path d="M925 492C985 492 1000 447 1027 409" fill="none" stroke="#2a7c59" stroke-width="4" marker-end="url(#arr)"/>
  </g>
  <g id="item-overlay">
    <rect x="1025" y="282" width="220" height="146" rx="25" fill="#fff" stroke="#d8951b" stroke-width="4"/>
    <circle cx="1066" cy="327" r="20" fill="#f3b83f"/>
    <path d="M1056 327H1076M1066 317V337" stroke="#68480f" stroke-width="4"/>
    <text x="1094" y="322" font-family="system-ui" font-size="18" font-weight="760" fill="#68480f">Semantic</text>
    <text x="1094" y="345" font-family="system-ui" font-size="18" font-weight="760" fill="#68480f">Item overlay</text>
    <text x="1053" y="387" font-family="system-ui" font-size="13" fill="#68480f">selector + focus target</text>
  </g>
  <g id="code-drawer">
    <path d="M1135 428V510" stroke="#213650" stroke-width="4" marker-end="url(#arr)"/>
    <rect x="980" y="510" width="265" height="96" rx="19" fill="#16243a"/>
    <text x="1010" y="547" font-family="system-ui" font-size="18" font-weight="760" fill="white">Code or definition</text>
    <text x="1010" y="576" font-family="system-ui" font-size="13" fill="#cfdbea">lazy fetch · saved pin</text>
  </g>
</svg>
