<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Ownership architecture of a visual implementation deck</title>
  <desc id="desc">Authoring publishes a flat Git bundle. The loader projects its semantic records into the reviewer, where each Item retains its exact commit-pinned source evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#183153"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#183153" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1280" height="720" fill="#f7f3ea"/>
  <text x="64" y="70" font-family="system-ui" font-size="34" font-weight="760" fill="#16243a">One model crosses four ownership boundaries</text>
  <text x="64" y="106" font-family="system-ui" font-size="19" fill="#506174">Stable identity flows left to right; exact code stays owned by the semantic Item.</text>

  <g id="author" filter="url(#shadow)">
    <rect x="60" y="185" width="235" height="300" rx="28" fill="#fff7df" stroke="#d79020" stroke-width="3"/>
    <circle cx="105" cy="230" r="20" fill="#d79020"/>
    <text x="98" y="238" font-family="system-ui" font-size="21" font-weight="800" fill="white">1</text>
    <text x="140" y="237" font-family="system-ui" font-size="22" font-weight="760" fill="#16243a">Authoring CLI</text>
    <text x="91" y="300" font-family="ui-monospace,monospace" font-size="16" fill="#6c4b15">add-slide</text>
    <text x="91" y="344" font-family="ui-monospace,monospace" font-size="16" fill="#6c4b15">add-item</text>
    <text x="91" y="388" font-family="ui-monospace,monospace" font-size="16" fill="#6c4b15">cover</text>
    <path d="M91 419H263" stroke="#e8c675" stroke-width="2"/>
    <text x="91" y="454" font-family="system-ui" font-size="16" fill="#4e5867">stable IDs + media</text>
  </g>

  <g id="bundle" filter="url(#shadow)">
    <path d="M350 170H600L638 208V485H350Z" fill="#eaf7f0" stroke="#27805a" stroke-width="3"/>
    <path d="M600 170V208H638" fill="none" stroke="#27805a" stroke-width="3"/>
    <text x="386" y="231" font-family="system-ui" font-size="22" font-weight="760" fill="#16243a">Flat Git bundle</text>
    <text x="386" y="283" font-family="ui-monospace,monospace" font-size="15" fill="#245b45">10-d  deck</text>
    <text x="386" y="321" font-family="ui-monospace,monospace" font-size="15" fill="#245b45">20-s  slide + asset</text>
    <text x="386" y="359" font-family="ui-monospace,monospace" font-size="15" fill="#245b45">30-i  semantic Item</text>
    <text x="386" y="397" font-family="ui-monospace,monospace" font-size="15" fill="#245b45">40-e  code evidence</text>
    <path d="M386 425H602" stroke="#8ac9aa" stroke-width="2"/>
    <text x="386" y="457" font-family="system-ui" font-size="15" fill="#405d50">independently mergeable</text>
  </g>

  <g id="loader" filter="url(#shadow)">
    <path d="M690 195H910L940 335L910 475H690L660 335Z" fill="#e8f0ff" stroke="#3769b0" stroke-width="3"/>
    <text x="715" y="252" font-family="system-ui" font-size="21" font-weight="760" fill="#16243a">Loader + projector</text>
    <text x="711" y="305" font-family="system-ui" font-size="15" fill="#405976">Deck → Section → Slide</text>
    <text x="711" y="342" font-family="system-ui" font-size="15" fill="#405976">Slide → Fragment</text>
    <text x="711" y="379" font-family="system-ui" font-size="15" fill="#405976">Item → Landmark</text>
    <rect x="711" y="411" width="178" height="28" rx="14" fill="#d4e2fb"/>
    <text x="730" y="430" font-family="system-ui" font-size="13" font-weight="700" fill="#294f84">target URN preserved</text>
  </g>

  <g id="reviewer" filter="url(#shadow)">
    <rect x="990" y="185" width="230" height="300" rx="28" fill="#f1edff" stroke="#7057b8" stroke-width="3"/>
    <rect x="1013" y="218" width="184" height="112" rx="14" fill="white" stroke="#b8aae2" stroke-width="2"/>
    <path d="M1034 303L1082 258L1120 290L1174 242" fill="none" stroke="#7057b8" stroke-width="5"/>
    <circle cx="1120" cy="290" r="10" fill="#f3b83f" stroke="#8c6110" stroke-width="2"/>
    <text x="1018" y="379" font-family="system-ui" font-size="21" font-weight="760" fill="#16243a">Reviewer surface</text>
    <text x="1018" y="414" font-family="system-ui" font-size="15" fill="#51466d">visual first</text>
    <text x="1018" y="440" font-family="system-ui" font-size="15" fill="#51466d">source on demand</text>
  </g>

  <g id="evidence-edge">
    <path d="M295 335H350" stroke="#183153" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M638 335H660" stroke="#183153" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M940 335H990" stroke="#183153" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="644" y="312" font-family="system-ui" font-size="13" font-weight="700" fill="#183153">records</text>
    <text x="947" y="312" font-family="system-ui" font-size="13" font-weight="700" fill="#183153">projection</text>
    <rect x="725" y="550" width="495" height="92" rx="20" fill="#fff" stroke="#d79020" stroke-width="3"/>
    <text x="750" y="585" font-family="system-ui" font-size="17" font-weight="760" fill="#6c4b15">Exact evidence boundary</text>
    <text x="750" y="616" font-family="ui-monospace,monospace" font-size="14" fill="#4e5867">Item target → commit:path#Lstart-Lend</text>
    <path d="M1105 485V550" stroke="#d79020" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
