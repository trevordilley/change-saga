<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Visual implementation pipeline</title><desc id="desc">Authoring commands create visual slides with semantic items and exact code evidence for reviewers.</desc><rect width="1280" height="720" fill="#f6f4ef"/><text x="70" y="78" font-family="system-ui" font-size="38" font-weight="700" fill="#17233b">Visual explanations carry exact evidence</text><g font-family="system-ui"><rect id="author" x="70" y="190" width="300" height="250" rx="24" fill="#dce8ff" stroke="#315ca8" stroke-width="3"/><text x="105" y="250" font-size="28" font-weight="700">Author</text><text x="105" y="300" font-size="21">Deck → slide → Item</text><text x="105" y="338" font-size="21">SVG · image · HTML</text><rect id="bundle" x="490" y="190" width="300" height="250" rx="24" fill="#e5f5ea" stroke="#2f7a4f" stroke-width="3"/><text x="525" y="250" font-size="28" font-weight="700">Evidence bundle</text><text x="525" y="300" font-size="21">Semantic visual targets</text><text x="525" y="338" font-size="21">Commit-pinned source</text><rect id="reviewer" x="910" y="190" width="300" height="250" rx="24" fill="#fff0d8" stroke="#a86516" stroke-width="3"/><text x="945" y="250" font-size="28" font-weight="700">Reviewer</text><text x="945" y="300" font-size="21">System model first</text><text x="945" y="338" font-size="21">Exact code on demand</text><path d="M370 315H490M790 315H910" stroke="#17233b" stroke-width="6" marker-end="url(#arrow)"/><text x="70" y="555" font-size="24" fill="#4b5563">One visual argument per slide; code belongs to the element that explains it.</text></g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17233b"/></marker></defs></svg>
