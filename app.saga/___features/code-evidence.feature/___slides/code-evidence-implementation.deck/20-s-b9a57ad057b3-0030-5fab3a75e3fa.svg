<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect width="1280" height="720" fill="#f8fafc"/><text x="48" y="54" font-size="30" font-weight="700" fill="#0f172a">Claims and verification remain separate</text><text x="48" y="85" font-size="17" fill="#475569">The assertion is immutable context; independent observations accumulate beside it.</text>
<g id="claim-contract"><rect x="70" y="160" width="360" height="360" rx="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="100" y="205" font-size="21" font-weight="700" fill="#075985">Author claim</text><text x="100" y="255" font-size="17">one falsifiable statement</text><text x="100" y="295" font-size="17">one explanation target</text><text x="100" y="335" font-size="17">exact source references</text><rect x="105" y="385" width="290" height="78" rx="10" fill="#fff" stroke="#94a3b8"/><text x="125" y="417" font-size="15" fill="#0f172a">“At most one sampler runs.”</text><text x="125" y="444" font-size="14" fill="#475569">worker.go L41–L56 · current</text></g>
<path d="M430 340H545" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><text x="487" y="325" text-anchor="middle" font-size="14" fill="#475569">tested by</text>
<g id="verification-entry"><rect x="545" y="160" width="300" height="360" rx="22" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="575" y="205" font-size="21" font-weight="700" fill="#166534">Independent result</text><text x="575" y="255" font-size="17">verified / failed / inconclusive</text><text x="575" y="295" font-size="17">method</text><text x="575" y="335" font-size="17">summary</text><rect x="580" y="385" width="230" height="78" rx="10" fill="#fff" stroke="#94a3b8"/><text x="600" y="417" font-size="15">failed · test</text><text x="600" y="444" font-size="14" fill="#475569">race reproduced on retry</text></g>
<path d="M845 340H940" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<g id="verification-history"><rect x="940" y="135" width="270" height="410" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="970" y="180" font-size="21" font-weight="700" fill="#6d28d9">Append-only history</text><line x1="1000" y1="225" x2="1000" y2="480" stroke="#7c3aed" stroke-width="3"/><circle cx="1000" cy="260" r="10" fill="#dc2626"/><text x="1030" y="266" font-size="16">failed</text><circle cx="1000" cy="340" r="10" fill="#f59e0b"/><text x="1030" y="346" font-size="16">inconclusive</text><circle cx="1000" cy="420" r="10" fill="#16a34a"/><text x="1030" y="426" font-size="16">verified</text><text x="970" y="510" font-size="14" fill="#475569">Earlier failures never disappear.</text></g>
<text x="70" y="620" font-size="17" fill="#0f172a">A newer result does not rewrite the claim, select a winner, or turn author evidence into independent proof.</text></svg>
