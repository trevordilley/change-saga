<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect width="1280" height="720" fill="#f8fafc"/><text x="48" y="54" font-size="30" font-weight="700" fill="#0f172a">Repair is inspectable and atomic</text><text x="48" y="85" font-size="17" fill="#475569">Every step exposes its basis; failure preserves the original evidence record and pin.</text>
<path d="M250 295H360M580 295H690M910 295H1020" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<g id="scrutiny-ranking"><circle cx="150" cy="295" r="100" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="150" y="270" text-anchor="middle" font-size="19" font-weight="700" fill="#075985">1 · Rank</text><text x="150" y="300" text-anchor="middle" font-size="16">breadth · overlap</text><text x="150" y="325" text-anchor="middle" font-size="16">stale · thin note</text></g>
<g id="stale-diagnosis"><rect x="360" y="195" width="220" height="200" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="470" y="235" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3412">2 · Diagnose</text><text x="470" y="278" text-anchor="middle" font-size="16">captured source</text><text x="470" y="306" text-anchor="middle" font-size="16">viewed candidate</text><text x="470" y="334" text-anchor="middle" font-size="16">smallest safe diff</text><text x="470" y="370" text-anchor="middle" font-size="14" fill="#475569">or an explicit no-candidate reason</text></g>
<g id="atomic-replacement"><rect x="690" y="195" width="220" height="200" rx="20" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="800" y="235" text-anchor="middle" font-size="19" font-weight="700" fill="#166534">3 · Replace</text><text x="800" y="278" text-anchor="middle" font-size="16">validate full batch</text><text x="800" y="306" text-anchor="middle" font-size="16">write replacement</text><text x="800" y="334" text-anchor="middle" font-size="16">retire original</text><text x="800" y="370" text-anchor="middle" font-size="14" fill="#475569">all succeed—or nothing changes</text></g>
<g id="post-merge-refresh"><circle cx="1120" cy="295" r="100" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1120" y="270" text-anchor="middle" font-size="19" font-weight="700" fill="#6d28d9">4 · Rebind</text><text x="1120" y="300" text-anchor="middle" font-size="16">landed commit</text><text x="1120" y="325" text-anchor="middle" font-size="16">branch reasons retained</text></g>
<g id="failure-preserves"><rect x="285" y="500" width="710" height="120" rx="16" fill="#fff1f2" stroke="#be123c" stroke-width="2"/><text x="315" y="540" font-size="19" font-weight="700" fill="#9f1239">Failure path</text><text x="315" y="575" font-size="17" fill="#0f172a">invalid target, repository, digest, range, or write → rollback → old evidence remains authoritative</text><text x="315" y="602" font-size="15" fill="#475569">Unresolvable landing candidates keep their old pins and stay stale; no guessed rewrite.</text></g>
</svg>
