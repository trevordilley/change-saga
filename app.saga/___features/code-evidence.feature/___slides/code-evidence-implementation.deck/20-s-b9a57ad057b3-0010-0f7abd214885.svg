<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs>
<rect width="1280" height="720" fill="#f8fafc"/><text x="48" y="54" font-size="30" font-weight="700" fill="#0f172a">One evidence graph, traversed both ways</text><text x="48" y="85" font-size="17" fill="#475569">Authored adjacent links stay explicit; current paths are derived without guessing across stale or missing hops.</text>
<g id="forward-trace"><rect x="70" y="150" width="790" height="170" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="96" y="184" font-size="18" font-weight="700" fill="#075985">Forward trace</text><text x="115" y="245" font-size="19" fill="#0f172a">person → story → criterion → design → explanation → source</text><path d="M145 270H790" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="96" y="300" font-size="15" fill="#475569">The criterion also branches to test case → run evidence.</text></g>
<g id="reverse-lookup"><rect x="70" y="365" width="500" height="170" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="96" y="400" font-size="18" font-weight="700" fill="#166534">Reverse lookup</text><text x="96" y="438" font-size="17" fill="#0f172a">source → exact owning Items</text><text x="96" y="470" font-size="17" fill="#0f172a">→ design → criteria → stories → people</text><path d="M470 500H135" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/></g>
<g id="impact-projection"><rect x="620" y="365" width="590" height="170" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="646" y="400" font-size="18" font-weight="700" fill="#6d28d9">Changed-code impact</text><text x="646" y="438" font-size="17" fill="#0f172a">changed atom → current owner → requirement/person</text><text x="646" y="470" font-size="16" fill="#475569">Stale edges remain visible as uncertain boundaries.</text><path d="M680 500H1130" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/></g>
<g id="path-health"><rect x="900" y="150" width="310" height="170" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="926" y="184" font-size="18" font-weight="700" fill="#9a3412">Hop health</text><circle cx="945" cy="225" r="9" fill="#16a34a"/><text x="966" y="231" font-size="16">Current</text><circle cx="945" cy="263" r="9" fill="#f59e0b"/><text x="966" y="269" font-size="16">Missing</text><circle cx="1055" cy="263" r="9" fill="#dc2626"/><text x="1076" y="269" font-size="16">Stale</text><text x="926" y="300" font-size="14" fill="#475569">No score hides the failing hop.</text></g>
<g id="visible-gap"><rect x="250" y="585" width="780" height="80" rx="14" fill="#fff1f2" stroke="#be123c" stroke-width="2"/><text x="280" y="620" font-size="18" font-weight="700" fill="#9f1239">Visible gap</text><text x="410" y="620" font-size="17" fill="#0f172a">an active persona with no accepted story remains a named destination</text><text x="280" y="647" font-size="15" fill="#475569">The author gets one focused next action; the reviewer keeps the surrounding context.</text></g>
</svg>
