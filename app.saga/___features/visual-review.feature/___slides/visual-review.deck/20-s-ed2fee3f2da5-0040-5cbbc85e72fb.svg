<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Contextual comments and spatial review annotations</title>
  <desc id="desc">A review visual supports slide and Item discussion plus normalized drawing and note anchors. Both persist as append-only comment threads. Prototype annotations separately link visuals to requirements.</desc>
  <defs>
    <style>.ui{font-family:Inter,system-ui,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,monospace}.h{font-size:30px;font-weight:750;fill:#10213d}.sub{font-size:15px;fill:#526178}.label{font-size:21px;font-weight:750;fill:#152542}.small{font-size:14px;fill:#445570}.ok{fill:none;stroke:#3f8059;stroke-width:5;marker-end:url(#g)}.gap{fill:none;stroke:#b4384b;stroke-width:5;stroke-dasharray:11 8;marker-end:url(#r)}</style>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3f8059"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#b4384b"/></marker>
    <pattern id="stripe" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 12L12-2M4 16L16 4" stroke="#f6d9de" stroke-width="1.5"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text class="ui h" x="58" y="56">Comments and drawing share the same review history</text>
  <text class="ui sub" x="58" y="83">Review marks belong to discussion; prototype annotations remain requirement links.</text>

  <g id="slide" class="ui">
    <rect x="70" y="160" width="350" height="410" rx="24" fill="#e8f1ff" stroke="#4d76b0" stroke-width="3"/>
    <text class="label" x="102" y="203">Review visual</text>
    <rect x="102" y="232" width="286" height="190" rx="16" fill="#fff" stroke="#9db6da" stroke-width="2"/>
    <path d="M132 379L204 302L257 348L318 274L358 316" fill="none" stroke="#7695c3" stroke-width="5"/>
    <circle cx="204" cy="302" r="8" fill="#4d76b0"/><circle cx="318" cy="274" r="8" fill="#4d76b0"/>
    <text class="small" x="102" y="458">ordered slide + semantic Items</text>
    <text class="small" x="102" y="485">exact code references</text>
    <text class="mono small" x="102" y="526">target: slide/item</text>
  </g>

  <path class="ok" d="M420 296H604"/><text class="ui small" x="467" y="278" fill="#2d6b47">implemented</text>
  <g id="comment" class="ui">
    <rect x="604" y="160" width="300" height="250" rx="24" fill="#eaf8ef" stroke="#43805a" stroke-width="3"/>
    <text class="label" x="636" y="203">Contextual comments</text>
    <rect x="636" y="232" width="236" height="58" rx="12" fill="#fff" stroke="#83ad92"/>
    <text class="small" x="654" y="258">“Index on status?”</text><text class="small" x="654" y="279">Human · open</text>
    <rect x="668" y="310" width="204" height="58" rx="12" fill="#fff" stroke="#83ad92"/>
    <text class="small" x="686" y="336">“Added.”</text><text class="small" x="686" y="357">reply · resolved</text>
    <text class="mono small" x="636" y="394">comments/&lt;event&gt;.json</text>
  </g>

  <path class="ok" d="M420 455C572 455 571 520 650 520"/><text class="ui small" x="473" y="444" fill="#9a2d40">append-only</text>
  <g id="annotation-gap" class="ui">
    <rect x="650" y="448" width="560" height="190" rx="24" fill="#eaf8ef" stroke="#43805a" stroke-width="3"/>
    <rect x="670" y="463" width="520" height="158" rx="16" fill="#fff" fill-opacity=".94"/>
    <text class="label" x="684" y="491" fill="#8d2536">Spatial annotations</text>
    <text class="small" x="684" y="516" fill="#6f3d47">Normalized geometry + note text, attached to a review thread.</text>
    <g transform="translate(686 532)"><path d="M0 32C35-12 70 70 106 20S176 65 212 18" fill="none" stroke="#b4384b" stroke-width="5"/><rect x="244" y="0" width="84" height="62" rx="8" fill="none" stroke="#b4384b" stroke-width="4"/><text class="small" x="350" y="18" fill="#8d2536">draw · highlight · note</text><text class="small" x="350" y="40" fill="#8d2536">thread discussion</text><text class="small" x="350" y="61" fill="#8d2536">source unchanged</text></g>
    <text class="small" x="684" y="614" fill="#8d2536">Create → append update / delete → reload projected state</text>
  </g>
</svg>
