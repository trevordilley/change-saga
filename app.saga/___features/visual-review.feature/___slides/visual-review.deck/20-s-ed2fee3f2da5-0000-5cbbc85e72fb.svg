<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Visual review collaboration</title><desc id="desc">Review slides and semantic items support contextual comments, while spatial drawing remains unimplemented.</desc><rect width="1280" height="720" fill="#f7f8fb"/><text x="70" y="78" font-family="system-ui" font-size="32" font-weight="700" fill="#17233b">Contextual discussion exists; spatial markup does not</text><g font-family="system-ui"><rect id="slide" x="70" y="190" width="300" height="260" rx="24" fill="#dce8ff" stroke="#315ca8" stroke-width="3"/><text x="105" y="250" font-size="28" font-weight="700">Review visual</text><text x="105" y="300" font-size="21">slide + semantic Items</text><rect id="comment" x="490" y="190" width="300" height="260" rx="24" fill="#e5f5ea" stroke="#2f7a4f" stroke-width="3"/><text x="525" y="250" font-size="28" font-weight="700">Contextual thread</text><text x="525" y="300" font-size="21">target · replies · state</text><rect id="annotation-gap" x="910" y="190" width="300" height="260" rx="24" fill="#ffe2e5" stroke="#c43b4d" stroke-width="4" stroke-dasharray="12 9"/><text x="945" y="250" font-size="28" font-weight="700" fill="#8d1f31">Missing overlay</text><text x="945" y="300" font-size="21">freehand · shapes · text</text><text x="945" y="338" font-size="21">no record or tool yet</text><path d="M370 320H490" stroke="#17233b" stroke-width="6" marker-end="url(#arrow)"/><path d="M790 320H910" stroke="#c43b4d" stroke-width="6" stroke-dasharray="12 9" marker-end="url(#redarrow)"/><text x="70" y="565" font-size="24" fill="#4b5563">Annotations must remain separate from the underlying source visual.</text></g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17233b"/></marker><marker id="redarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c43b4d"/></marker></defs></svg>
