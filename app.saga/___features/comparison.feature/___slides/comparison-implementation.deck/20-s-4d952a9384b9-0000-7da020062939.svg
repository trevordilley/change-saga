<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect width="1280" height="720" fill="#f8fafc"/><text x="48" y="54" font-size="30" font-weight="700" fill="#0f172a">One opening context scopes comparison</text><text x="48" y="85" font-size="17" fill="#475569">The named ref resolves to a merge base and head once, then feeds every projection.</text>
<g id="merge-base-context"><line x1="90" y1="230" x2="630" y2="230" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><circle cx="210" cy="230" r="22" fill="#0ea5e9"/><circle cx="560" cy="230" r="22" fill="#7c3aed"/><text x="210" y="185" text-anchor="middle" font-size="18" font-weight="700">merge base</text><text x="560" y="185" text-anchor="middle" font-size="18" font-weight="700">selected head</text><text x="335" y="272" font-size="16" fill="#475569">resolved comparison range</text></g>
<g id="same-context-surfaces"><rect x="720" y="135" width="470" height="270" rx="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="750" y="180" font-size="20" font-weight="700" fill="#075985">Shared consumers</text><rect x="770" y="220" width="115" height="95" rx="12" fill="#fff" stroke="#94a3b8"/><text x="828" y="274" text-anchor="middle" font-size="17">browser</text><rect x="900" y="220" width="115" height="95" rx="12" fill="#fff" stroke="#94a3b8"/><text x="958" y="274" text-anchor="middle" font-size="17">status</text><rect x="1030" y="220" width="115" height="95" rx="12" fill="#fff" stroke="#94a3b8"/><text x="1088" y="274" text-anchor="middle" font-size="17">query</text><text x="750" y="365" font-size="15" fill="#475569">All echo the same base/head OIDs.</text></g>
<path d="M630 230H715" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<g id="current-vs-compare"><rect x="90" y="370" width="540" height="150" rx="20" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="120" y="410" font-size="20" font-weight="700" fill="#166534">Current state</text><text x="120" y="445" font-size="16">no range → no layers or per-change coverage</text><text x="120" y="485" font-size="20" font-weight="700" fill="#6d28d9">Comparison</text><text x="270" y="485" font-size="16">range → Changed · Affected · Code</text></g>
<g id="related-reviews"><rect x="720" y="450" width="470" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="750" y="485" font-size="18" font-weight="700" fill="#6d28d9">Related reviews</text><text x="750" y="515" font-size="15">derived from code links; frozen comparisons stay reachable</text></g>
<g id="mode-ui-gap"><rect x="230" y="595" width="820" height="75" rx="14" fill="#fff1f2" stroke="#be123c" stroke-width="2"/><text x="260" y="628" font-size="18" font-weight="700" fill="#9f1239">Known gap</text><text x="375" y="628" font-size="16">no complete persistent mode label + deep-link restoration contract in the browser yet.</text><text x="260" y="653" font-size="14" fill="#475569">The range is real; the designed navigation continuity is not claimed as delivered.</text></g></svg>
