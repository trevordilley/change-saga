<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect width="1280" height="720" fill="#f8fafc"/><text x="48" y="54" font-size="30" font-weight="700" fill="#0f172a">One range, three complementary layers</text><text x="48" y="85" font-size="17" fill="#475569">Each lane answers a different review question; none is a renamed copy of another.</text>
<rect x="55" y="145" width="250" height="410" rx="22" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="180" y="190" text-anchor="middle" font-size="20" font-weight="700">merge base → head</text><text x="180" y="245" text-anchor="middle" font-size="16">Saga inventories</text><text x="180" y="315" text-anchor="middle" font-size="16">pinned graph</text><text x="180" y="385" text-anchor="middle" font-size="16">source atoms</text><path d="M305 245H390M305 315H390M305 385H390" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<g id="changed-records"><rect x="390" y="135" width="790" height="125" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="420" y="175" font-size="20" font-weight="700" fill="#075985">Changed</text><text x="550" y="175" font-size="17">semantic record adds · revisions · moves · retirements</text><text x="420" y="215" font-size="15" fill="#475569">before/after snapshots; replacements may pair conservatively</text></g>
<g id="affected-records"><rect x="390" y="290" width="790" height="125" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="420" y="330" font-size="20" font-weight="700" fill="#9a3412">Affected</text><text x="550" y="330" font-size="17">unchanged knowledge reached from changed pins or source</text><text x="420" y="370" font-size="15" fill="#475569">each row keeps its cause; stale boundaries stay uncertain</text></g>
<g id="code-ownership"><rect x="390" y="445" width="790" height="125" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="420" y="485" font-size="20" font-weight="700" fill="#166534">Code</text><text x="550" y="485" font-size="17">changed atoms grouped under every current explanation</text><text x="420" y="525" font-size="15" fill="#475569">unreferenced atoms stay explicit; stale references count as context, not coverage</text></g>
<g id="layer-query"><rect x="330" y="615" width="620" height="65" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="365" y="655" font-size="17" font-weight="700" fill="#6d28d9">Same contract</text><text x="510" y="655" font-size="16">browser rendering · human status · structured layer query</text></g></svg>
