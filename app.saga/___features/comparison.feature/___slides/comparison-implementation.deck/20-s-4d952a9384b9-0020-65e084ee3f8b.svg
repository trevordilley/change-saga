<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect width="1280" height="720" fill="#f8fafc"/><text x="48" y="54" font-size="30" font-weight="700" fill="#0f172a">History keeps transitions beside their effects</text><text x="48" y="85" font-size="17" fill="#475569">Current documentation stays clean while Git and merge metadata preserve the path that produced it.</text>
<line x1="115" y1="300" x2="1160" y2="300" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
<g id="conservative-pairing"><circle cx="190" cy="300" r="85" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="190" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">Pair</text><text x="190" y="310" text-anchor="middle" font-size="15">shared trace role</text><text x="190" y="334" text-anchor="middle" font-size="15">or explicit link</text></g>
<g id="reason-attribution"><rect x="390" y="205" width="250" height="190" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="515" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">Attribute reasons</text><text x="515" y="292" text-anchor="middle" font-size="15">record files touched</text><text x="515" y="322" text-anchor="middle" font-size="15">code lines introduced</text><text x="515" y="352" text-anchor="middle" font-size="15">no synthesized intent</text></g>
<g id="node-history"><rect x="745" y="205" width="250" height="190" rx="20" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="870" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Node history</text><text x="870" y="292" text-anchor="middle" font-size="15">introduced</text><text x="870" y="322" text-anchor="middle" font-size="15">replaced</text><text x="870" y="352" text-anchor="middle" font-size="15">open the change</text></g>
<g id="branch-reasons"><circle cx="1110" cy="300" r="85" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1110" y="275" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">Land</text><text x="1110" y="305" text-anchor="middle" font-size="15">new source pin</text><text x="1110" y="330" text-anchor="middle" font-size="15">branch reasons kept</text></g>
<g id="ambiguity-stop"><rect x="250" y="505" width="780" height="110" rx="16" fill="#fff1f2" stroke="#be123c" stroke-width="2"/><text x="280" y="545" font-size="18" font-weight="700" fill="#9f1239">Ambiguity is a stop, not a guess</text><text x="280" y="580" font-size="16">several replacement candidates or unverifiable branch mapping → report candidates and require an explicit relation</text></g></svg>
