<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12213a"/></linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#94a3b8"/></marker>
    <style>.title{font:700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}.eyebrow{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#41d3bd;letter-spacing:2px}.h{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}.b{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}.small{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}.take{font:600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#dbeafe}.node{fill:#15243a;stroke:#60a5fa;stroke-width:2}.edge{fill:none;stroke:#94a3b8;stroke-width:2.3;marker-end:url(#arr)}</style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text class="eyebrow" x="70" y="52">STATE MODEL · FOUR INDEPENDENT GRAPHS</text>
  <text class="title" x="70" y="96">Append-only heads preserve ambiguity instead of guessing</text>

  <g id="lifecycle-state">
    <rect x="60" y="140" width="1160" height="126" rx="20" fill="#101e31" stroke="#334155"/>
    <text class="small" x="82" y="168">LIFECYCLE STATE MACHINE</text>
    <rect class="node" x="105" y="190" width="150" height="44" rx="22"/><text class="h" x="144" y="218">proposed</text>
    <rect class="node" x="365" y="190" width="150" height="44" rx="22"/><text class="h" x="414" y="218">active</text>
    <rect class="node" x="625" y="190" width="150" height="44" rx="22"/><text class="h" x="652" y="218">deprecated</text>
    <rect x="955" y="190" width="150" height="44" rx="22" fill="#3a1822" stroke="#fb7185" stroke-width="2"/><text class="h" x="1002" y="218">retired</text>
    <path class="edge" d="M255 212 H355"/><path class="edge" d="M515 202 H615"/><path class="edge" d="M625 226 H525"/><path class="edge" d="M775 212 H945"/>
    <text class="small" x="280" y="202">activate</text><text class="small" x="541" y="192">deprecate</text><text class="small" x="543" y="248">restore</text><text class="small" x="820" y="202">terminal</text>
  </g>

  <g id="revision-dag">
    <rect x="60" y="300" width="355" height="246" rx="20" fill="#121d32" stroke="#8b5cf6"/>
    <text class="small" x="83" y="329">DEFINITION REVISIONS</text>
    <circle cx="112" cy="391" r="27" fill="#8b5cf6" opacity=".2" stroke="#8b5cf6"/><text class="h" x="101" y="397">r1</text>
    <circle cx="235" cy="359" r="27" fill="#8b5cf6" opacity=".2" stroke="#8b5cf6"/><text class="h" x="219" y="365">r2a</text>
    <circle cx="235" cy="435" r="27" fill="#8b5cf6" opacity=".2" stroke="#8b5cf6"/><text class="h" x="219" y="441">r2b</text>
    <circle cx="350" cy="397" r="27" fill="#41d3bd" opacity=".2" stroke="#41d3bd"/><text class="h" x="338" y="403">r3</text>
    <path class="edge" d="M139 382 L202 365"/><path class="edge" d="M139 400 L202 428"/><path class="edge" d="M262 365 L319 386"/><path class="edge" d="M262 429 L319 408"/>
    <text class="b" x="87" y="510">Two heads = no current definition.</text>
  </g>

  <g id="evidence-dag">
    <rect x="447" y="300" width="355" height="246" rx="20" fill="#121d32" stroke="#60a5fa"/>
    <text class="small" x="470" y="329">EVIDENCE SUPERSESSION</text>
    <rect class="node" x="488" y="373" width="112" height="52" rx="14"/><text class="h" x="519" y="404">ev 1</text>
    <rect class="node" x="653" y="373" width="112" height="52" rx="14"/><text class="h" x="684" y="404">ev 2</text>
    <path class="edge" d="M600 399 H643"/>
    <text class="b" x="486" y="467">Only an unsuperseded head pinned</text>
    <text class="b" x="486" y="490">to the current revision is current.</text>
  </g>

  <g id="run-dag">
    <rect x="834" y="300" width="386" height="246" rx="20" fill="#121d32" stroke="#f5b942"/>
    <text class="small" x="857" y="329">RUN HISTORY</text>
    <circle cx="885" cy="399" r="27" fill="#fb7185" opacity=".2" stroke="#fb7185"/><text class="small" x="867" y="403">fail</text>
    <circle cx="1009" cy="361" r="27" fill="#41d3bd" opacity=".2" stroke="#41d3bd"/><text class="small" x="994" y="365">pass</text>
    <circle cx="1009" cy="437" r="27" fill="#fb7185" opacity=".2" stroke="#fb7185"/><text class="small" x="990" y="441">manual</text>
    <circle cx="1156" cy="399" r="27" fill="#41d3bd" opacity=".2" stroke="#41d3bd"/><text class="small" x="1140" y="403">pass</text>
    <path class="edge" d="M912 391 L978 369"/><path class="edge" d="M912 408 L978 429"/><path class="edge" d="M1036 369 L1125 390"/><path class="edge" d="M1036 429 L1125 408"/>
    <text class="b" x="862" y="510">Failure stays in history after reconciliation.</text>
  </g>

  <g id="conflict-rule"><rect x="247" y="571" width="786" height="56" rx="16" fill="#3a1822" stroke="#fb7185"/><text class="h" x="286" y="606">Projection rule: exactly one head → current; multiple heads → explicit conflict.</text></g>
  <line x1="70" y1="650" x2="1210" y2="650" stroke="#334155"/>
  <text class="take" x="70" y="687">A merge may introduce competing files; the model withholds “current” until a successor names every head.</text>
</svg>
