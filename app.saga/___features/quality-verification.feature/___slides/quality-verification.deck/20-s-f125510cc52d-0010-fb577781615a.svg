<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12213a"/></linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#94a3b8"/></marker>
    <style>.title{font:700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}.eyebrow{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#41d3bd;letter-spacing:2px}.h{font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}.b{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}.small{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}.take{font:600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#dbeafe}</style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text class="eyebrow" x="70" y="52">RUNTIME PATH · SEQUENCE</text>
  <text class="title" x="70" y="96">Recording a run is a guarded append</text>
  <g id="runner-caller"><rect x="70" y="135" width="170" height="44" rx="12" fill="#3a2b16" stroke="#f5b942"/><text class="h" x="102" y="163">CI / author</text><line x1="155" y1="179" x2="155" y2="578" stroke="#f5b942" stroke-dasharray="7 7" opacity=".55"/></g>
  <g id="cli-parse"><rect x="286" y="135" width="170" height="44" rx="12" fill="#12303a" stroke="#41d3bd"/><text class="h" x="323" y="163">quality CLI</text><line x1="371" y1="179" x2="371" y2="578" stroke="#41d3bd" stroke-dasharray="7 7" opacity=".55"/></g>
  <g id="source-pin"><rect x="502" y="135" width="170" height="44" rx="12" fill="#172b46" stroke="#60a5fa"/><text class="h" x="538" y="163">Git resolver</text><line x1="587" y1="179" x2="587" y2="578" stroke="#60a5fa" stroke-dasharray="7 7" opacity=".55"/></g>
  <g id="lock-refresh"><rect x="718" y="135" width="170" height="44" rx="12" fill="#251d42" stroke="#8b5cf6"/><text class="h" x="742" y="163">quality mutation</text><line x1="803" y1="179" x2="803" y2="578" stroke="#8b5cf6" stroke-dasharray="7 7" opacity=".55"/></g>
  <g id="immutable-append"><rect x="934" y="135" width="170" height="44" rx="12" fill="#172b46" stroke="#60a5fa"/><text class="h" x="984" y="163">store</text><line x1="1019" y1="179" x2="1019" y2="578" stroke="#60a5fa" stroke-dasharray="7 7" opacity=".55"/></g>

  <g id="already-executed"><path d="M155 219 H360" stroke="#f5b942" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)"/><text class="b" x="184" y="209">1 · submit claimed result + command + evidence</text><text class="small" x="184" y="238">command already ran outside this process</text></g>
  <g id="resolve-source"><path d="M371 286 H576" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/><text class="b" x="406" y="276">2 · resolve HEAD/ref → full OID</text><path d="M587 316 H382" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/><text class="small" x="439" y="339">repository + commit</text></g>
  <g id="mutation-guard"><path d="M371 375 H792" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/><text class="b" x="465" y="365">3 · RecordRun(input)</text><rect x="735" y="394" width="136" height="62" rx="10" fill="#8b5cf6" opacity=".15"/><text class="small" x="757" y="417">pre-load</text><text class="small" x="757" y="436">lock · reload</text></g>
  <g id="graph-guard"><rect x="713" y="458" width="180" height="65" rx="10" fill="#3a1822" stroke="#fb7185"/><text class="small" x="733" y="482">GUARD</text><text class="b" x="733" y="505">all current run heads</text><path d="M803 544 H1008" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/><text class="b" x="828" y="534">4 · exclusive create</text></g>
  <g id="result-return"><path d="M1019 580 H166" stroke="#41d3bd" stroke-width="2.5" marker-end="url(#arr)"/><text class="b" x="505" y="570">5 · immutable run URN + new head</text></g>

  <line x1="70" y1="623" x2="1210" y2="623" stroke="#334155"/>
  <text class="take" x="70" y="667">The write is serialized and immutable; stale or competing heads must be named before a successor can land.</text>
</svg>
