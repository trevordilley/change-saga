<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">AI application contract</title><desc id="desc">An AI caller uses published command grammar and a bounded JSON query adapter over the application session.</desc><rect width="1280" height="720" fill="#f7f8fb"/><text x="70" y="78" font-family="system-ui" font-size="38" font-weight="700" fill="#17233b">Domain operations replace filesystem scraping</text><g font-family="system-ui"><rect id="caller" x="70" y="190" width="300" height="250" rx="24" fill="#eee5ff" stroke="#7048a8" stroke-width="3"/><text x="105" y="250" font-size="28" font-weight="700">AI client</text><text x="105" y="300" font-size="21">stable URNs</text><text x="105" y="338" font-size="21">request + cursor</text><rect id="query" x="490" y="190" width="300" height="250" rx="24" fill="#dce8ff" stroke="#315ca8" stroke-width="3"/><text x="525" y="250" font-size="28" font-weight="700">CLI adapter</text><text x="525" y="300" font-size="21">change-saga.ai/v1</text><text x="525" y="338" font-size="21">typed errors</text><rect id="session" x="910" y="190" width="300" height="250" rx="24" fill="#e5f5ea" stroke="#2f7a4f" stroke-width="3"/><text x="945" y="250" font-size="28" font-weight="700">Application session</text><text x="945" y="300" font-size="21">validated snapshot</text><text x="945" y="338" font-size="21">bounded projections</text><path d="M370 315H490M790 315H910" stroke="#17233b" stroke-width="6" marker-end="url(#arrow)"/><text x="70" y="555" font-size="24" fill="#4b5563">Purpose, usage, pagination and errors are published with each operation.</text></g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17233b"/></marker></defs></svg>
