<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Coverage reporting and automation contracts</title>
  <desc id="desc">Four implementation boundaries separate independent coverage areas, trustworthy evaluation, structured bounded reads, and explicitly selected policy checks.</desc>
  <defs><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#334155;stroke-width:3}.blue{fill:#e0f2fe}.green{fill:#dcfce7}.amber{fill:#fef3c7}.violet{fill:#ede9fe}.h{font:700 25px system-ui;fill:#0f172a}.t{font:17px system-ui;fill:#334155}.title{font:700 34px system-ui;fill:#0f172a}</style></defs>
  <rect class="bg" width="1200" height="700"/><text class="title" x="60" y="70">One report, four explicit boundaries</text>
  <g id="six-areas"><rect class="card blue" x="60" y="125" width="500" height="190" rx="20"/><text class="h" x="95" y="175">Six independent areas</text><text class="t" x="95" y="215">Implementation · stories · personas</text><text class="t" x="95" y="250">Design · quality · health</text><text class="t" x="95" y="285">Counts plus concrete covered and uncovered entries</text></g>
  <g id="trust-boundary"><rect class="card amber" x="640" y="125" width="500" height="190" rx="20"/><text class="h" x="675" y="175">Trustworthy report boundary</text><text class="t" x="675" y="215">Gaps succeed; malformed or ambiguous input fails</text><text class="t" x="675" y="250">No blended score and no release verdict</text></g>
  <g id="query-envelope"><rect class="card violet" x="60" y="390" width="500" height="190" rx="20"/><text class="h" x="95" y="440">Bounded structured reads</text><text class="t" x="95" y="480">Stable envelope · snapshot · page metadata</text><text class="t" x="95" y="515">Changed snapshots reject old cursors</text></g>
  <g id="selected-policy"><rect class="card green" x="640" y="390" width="500" height="190" rx="20"/><text class="h" x="675" y="440">Selected policy only</text><text class="t" x="675" y="480">check consults only named areas</text><text class="t" x="675" y="515">Incomplete coverage returns only those gaps</text></g>
</svg>
