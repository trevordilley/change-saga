<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Reconcile the current explanation after reviewing a change</title>
<desc id="desc">Two separate lanes distinguish the review comparison from current documentation. Current references and declared impact feed a reassessment queue, followed by typed repairs and another check.</desc>
<defs><style>text{font-family:system-ui,sans-serif;fill:#193451}.title{font-size:32px;font-weight:750}.label{font-size:23px;font-weight:700}.small{font-size:17px}.note{font-size:15px;fill:#506479}.edge{fill:none;stroke:#387b86;stroke-width:3;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#387b86"/></marker></defs>
<rect width="1280" height="720" fill="#f4f7fa"/>
<text x="60" y="68" class="title">From scattered status to a reconciliation queue</text>
<text x="60" y="104" class="small">New CLI workflow: independent reports → reasoned repairs → another check</text>
<g id="review"><rect x="60" y="145" width="1160" height="96" rx="16" fill="#e4eaf6" stroke="#8b9fc0"/><text x="86" y="183" class="label">Review comparison</text><text x="86" y="214" class="small">Old and new diff sides can both supply evidence.</text><text x="650" y="183" class="label">Independent coverage</text><text x="650" y="214" class="small">A complete review deck does not make the living docs current.</text></g>
<g id="currency"><rect x="60" y="288" width="356" height="160" rx="18" fill="#e7f4ee" stroke="#82ab96"/><text x="86" y="327" class="label">HEAD currency</text><text x="86" y="363" class="small">Resolve exact references now.</text><text x="86" y="393" class="small">Keep baseline debt + regressions visible.</text><text x="86" y="423" class="note">Moved bytes can remain current.</text></g>
<g id="impact"><rect x="60" y="480" width="356" height="155" rx="18" fill="#e7f4ee" stroke="#82ab96"/><text x="86" y="518" class="label">Declared impact</text><text x="86" y="554" class="small">Code → docs → linked intent</text><text x="86" y="584" class="small">Requirements → code / test reassessment</text><text x="86" y="614" class="note">Undeclared dependencies stay unknown.</text></g>
<g id="reassess"><path d="M416 368H530V451H595M416 557H530V451" class="edge"/><path d="M710 349L834 451L710 553L586 451Z" fill="#fff1cf" stroke="#c79d3e" stroke-width="2"/><text x="710" y="439" text-anchor="middle" class="label">Reassess</text><text x="710" y="468" text-anchor="middle" class="small">Meaning or</text><text x="710" y="493" text-anchor="middle" class="small">evidence changed?</text><text x="520" y="670" class="note">Affected does not always mean an edit is needed.</text></g>
<g id="repair"><path d="M834 451H904" class="edge"/><rect x="914" y="346" width="306" height="210" rx="18" fill="#fff" stroke="#8ba8b1"/><text x="940" y="387" class="label">Typed repair → recheck</text><text x="940" y="427" class="small">Inspect the record and its links.</text><text x="940" y="459" class="small">Revise only what no longer holds.</text><text x="940" y="491" class="small">Snapshot → apply-slide, if managed.</text><text x="940" y="529" class="note">Fresh pins are not semantic proof.</text><path d="M1060 346V266H240V288" class="edge"/></g>
</svg>
