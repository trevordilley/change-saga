<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Writers: validate everything, then write</title><desc id="desc">The CLI resolves commits once; the requirements writer owns the lock and all checks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306687"/></marker><marker id="warnarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a4b0f"/></marker></defs><rect width="1280" height="720" fill="#f1f5f8"/><g font-family="Arial,sans-serif"><text x="50" y="48" font-size="17" fill="#47647a">REVIEW · INVENTORY RECORDS AUTHORING · da5101a6..a0cb6cbe</text><text x="50" y="97" font-size="34" fill="#20384b">Writers: validate everything, then write</text><text x="50" y="132" font-size="20" fill="#20384b">The CLI resolves commits once; the requirements writer owns the lock and all checks.</text><g id="writer"><rect x="50" y="170" width="700" height="200" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="68" y="198" font-size="15" fill="#47647a">internal/requirements/inventory_mutation.go</text><text x="68" y="228" font-size="18" fill="#20384b">WriteTechnicalRevision under the Saga lock: replay,</text><text x="68" y="253" font-size="18" fill="#20384b">all-head parents, candidate history, new-pin currency,</text><text x="68" y="278" font-size="18" fill="#20384b">ERD/overlay references, then technicalpolicy for intent;</text><text x="68" y="303" font-size="18" fill="#20384b">content-addressed SVG written last, removed on failure</text></g><g id="cli"><rect x="800" y="170" width="430" height="200" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="818" y="198" font-size="15" fill="#47647a">internal/cli/inventory.go, cli.go, main.go, grammar</text><text x="818" y="228" font-size="18" fill="#20384b">data-entity, erd, erd-overlay</text><text x="818" y="253" font-size="18" fill="#20384b">commands; --delivery once;</text><text x="818" y="278" font-size="18" fill="#20384b">--visual; inventory</text><text x="818" y="303" font-size="18" fill="#20384b">adopt-format</text></g><path d="M800 270L754 270" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g id="adapters"><rect x="50" y="400" width="1180" height="130" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="68" y="428" font-size="15" fill="#47647a">Mechanical adaptations</text><text x="68" y="458" font-size="18" fill="#20384b">query_inventory.go and server/inventory.go pass requirements.References(...) or ref.Reference; test literals wrap</text><text x="68" y="483" font-size="18" fill="#20384b">Evidence; the schema test helper is shared; skill_test registers the new commands. No behavior change.</text></g><text x="50" y="580" font-size="18" fill="#20384b">Expectation: WriteTechnical still exists with its old signature for legacy callers; it now delegates to WriteTechnicalRevision.</text><g id="intent-required"><rect x="40" y="590" width="1200" height="34" rx="6" fill="#fbeedd"/><text x="50" y="613" font-size="18" fill="#8a4b0f">Surprise: after adoption an intent-less Component/System revise is refused, so no new revision is silently unspecified.</text></g></g></svg>