<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Proof and what remains open</title><desc id="desc">Targeted suites pass; the known baseline failure and absent checks are stated, not hidden.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306687"/></marker><marker id="warnarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a4b0f"/></marker></defs><rect width="1280" height="720" fill="#f1f5f8"/><g font-family="Arial,sans-serif"><text x="50" y="48" font-size="17" fill="#47647a">REVIEW · INVENTORY RECORDS AUTHORING · da5101a6..a0cb6cbe</text><text x="50" y="97" font-size="34" fill="#20384b">Proof and what remains open</text><text x="50" y="132" font-size="20" fill="#20384b">Targeted suites pass; the known baseline failure and absent checks are stated, not hidden.</text><g id="record-tests"><rect x="50" y="170" width="560" height="170" rx="10" fill="#e3f1e5" stroke="#306687" stroke-width="1.5"/><text x="68" y="198" font-size="15" fill="#2f6b3a">internal/requirements/inventory_format_test.go</text><text x="68" y="228" font-size="18" fill="#20384b">legacy/unspecified, opt-in refusal, baseline</text><text x="68" y="253" font-size="18" fill="#20384b">ancestry, per-kind rule table, SVG safety,</text><text x="68" y="278" font-size="18" fill="#20384b">selection codes, overlay composition, schemas</text></g><g id="cli-tests"><rect x="670" y="170" width="560" height="170" rx="10" fill="#e3f1e5" stroke="#306687" stroke-width="1.5"/><text x="688" y="198" font-size="15" fill="#2f6b3a">internal/cli/inventory_lifecycle_test.go, inventory_item_test.go</text><text x="688" y="228" font-size="18" fill="#20384b">temp Git: lifecycle, drift, movement, forged digest,</text><text x="688" y="253" font-size="18" fill="#20384b">foreign repo, mixed intent, ERDs; selections on</text><text x="688" y="278" font-size="18" fill="#20384b">review/implementation/transaction; saved views</text></g><g id="fixture"><rect x="50" y="370" width="560" height="150" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="68" y="398" font-size="15" fill="#47647a">internal/testfixture/inventory.go (+ test)</text><text x="68" y="428" font-size="18" fill="#20384b">WriteInventoryFixture: realistic format-2</text><text x="68" y="453" font-size="18" fill="#20384b">inventory through the real writers, for the</text><text x="68" y="478" font-size="18" fill="#20384b">query and UI slices</text></g><g id="gaps"><rect x="670" y="370" width="560" height="150" rx="10" fill="#fbeedd" stroke="#306687" stroke-width="1.5"/><text x="688" y="398" font-size="15" fill="#8a4b0f">NOT CLAIMED</text><text x="688" y="428" font-size="18" fill="#20384b">full race suite (baseline help test fails); browser</text><text x="688" y="453" font-size="18" fill="#20384b">visual QA (no Playwright here); app.saga adoption;</text><text x="688" y="478" font-size="18" fill="#20384b">companion-repo saved views; query, coverage, UI</text></g></g></svg>