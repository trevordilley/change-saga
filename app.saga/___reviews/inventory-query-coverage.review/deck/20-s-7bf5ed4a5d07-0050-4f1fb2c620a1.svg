<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Inventory impact in reconciliation</title><desc id="desc">Each entry says why it needs attention; unreferenced definitions ask the user.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306687"/></marker></defs><rect width="1280" height="720" fill="#f1f5f8"/><g font-family="Arial,sans-serif"><text x="50" y="48" font-size="16" fill="#47647a" font-weight="normal" text-anchor="start">TECHNICAL INVENTORY / IMPLEMENTED RECONCILIATION</text><text x="50" y="94" font-size="34" fill="#20384b" font-weight="bold" text-anchor="start">Inventory impact in reconciliation</text><text x="50" y="128" font-size="19" fill="#20384b" font-weight="normal" text-anchor="start">Each entry says why it needs attention; unreferenced definitions ask the user.</text><g><rect x="50" y="160" width="260" height="360" rx="10" fill="#dce8f0" stroke="#9fb7c8" stroke-width="1.5"/><text x="64" y="188" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Comparison</text><text x="64" y="214" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">base .. head</text><text x="64" y="236" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">head inventory</text><text x="64" y="258" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">+ base inventory</text><text x="64" y="280" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">(unknown if unreadable)</text><text x="64" y="302" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start"></text><text x="64" y="324" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">declared Item pins</text><text x="64" y="346" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">and saved selections</text></g><path d="M310 225L380 225" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M310 415L380 415" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M345 225L345 320L805 320L805 225L830 225" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M805 320L805 440L830 440" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g id="debt"><rect x="380" y="150" width="400" height="150" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="394" y="178" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Definition evidence at head</text><text x="394" y="204" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">stale refs classified vs base:</text><text x="394" y="226" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">regression / introduced /</text><text x="394" y="248" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">pre-existing / baseline unknown</text></g><g id="pins"><rect x="830" y="150" width="400" height="150" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="844" y="178" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Item documentation pins</text><text x="844" y="204" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">stale, retired, missing or</text><text x="844" y="226" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">conflicted -&gt; reassess the slide;</text><text x="844" y="248" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">saved pins kept</text></g><g id="selections"><rect x="380" y="340" width="400" height="150" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="394" y="368" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Item selections</text><text x="394" y="394" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">unresolved / selected bytes stale /</text><text x="394" y="416" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">outside-subset change -&gt; the Item;</text><text x="394" y="438" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">no evidence-file repair</text></g><g id="unreferenced"><rect x="830" y="340" width="400" height="280" rx="10" fill="#fbeee6" stroke="#c98b63" stroke-width="1.5"/><text x="844" y="368" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">No implementation use?</text><text x="844" y="394" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">explicitly proposed -&gt; exempt</text><text x="844" y="416" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">new vs readable base -&gt; exempt</text><text x="844" y="438" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">otherwise: ask the user</text><text x="844" y="460" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">(reference, propose or retire);</text><text x="844" y="482" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">never delete, reclassify or</text><text x="844" y="504" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">attach to a feature;</text><text x="844" y="526" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">unknown base exempts nothing</text></g><path d="M580 490L580 540" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g><rect x="380" y="540" width="400" height="80" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="394" y="568" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Read-only queue entries</text><text x="394" y="594" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">inspect + revise shapes; no writes, no approvals</text></g></g></svg>