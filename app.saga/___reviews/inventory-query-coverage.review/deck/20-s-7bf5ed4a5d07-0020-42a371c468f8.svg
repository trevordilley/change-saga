<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Declared reverse uses</title><desc id="desc">Uses come from declared links and say where the walk stopped.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306687"/></marker></defs><rect width="1280" height="720" fill="#f1f5f8"/><g font-family="Arial,sans-serif"><text x="50" y="48" font-size="16" fill="#47647a" font-weight="normal" text-anchor="start">TECHNICAL INVENTORY / IMPLEMENTED READS</text><text x="50" y="94" font-size="34" fill="#20384b" font-weight="bold" text-anchor="start">Declared reverse uses</text><text x="50" y="128" font-size="19" fill="#20384b" font-weight="normal" text-anchor="start">Uses come from declared links and say where the walk stopped.</text><g id="index"><rect x="50" y="160" width="340" height="170" rx="10" fill="#dce8f0" stroke="#9fb7c8" stroke-width="1.5"/><text x="64" y="188" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Declared links index</text><text x="64" y="214" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">implementation + review Item pins</text><text x="64" y="236" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">System members, data holders,</text><text x="64" y="258" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">relationship destinations,</text><text x="64" y="280" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">ERD directory / overlay pins</text></g><g><rect x="470" y="165" width="220" height="80" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="484" y="193" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Checkout Item</text><text x="484" y="219" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">implementation deck</text></g><path 