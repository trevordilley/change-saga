e="19" fill="#20384b" font-weight="bold" text-anchor="start">Review Item</text><text x="484" y="384" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">role review_item</text></g><path d="M690 370L780 370" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><g id="completeness"><rect x="50" y="470" width="560" height="170" rx="10" fill="#fbeee6" stroke="#c98b63" stroke-width="1.5"/><text x="64" y="498" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Explicit completeness</text><text x="64" y="524" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">depth_cut: owners exist beyond --depth</text><text x="64" y="546" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">cycle_cut: a declared cycle was cut</text><text x="64" y="568" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">truncated: 10,000-visit budget reached</text><text x="64" y="590" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">complete only when none happened</text></g><g id="query"><rect x="660" y="480" width="570" height="160" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="674" y="508" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">query inventory-uses</text><text x="674" y="534" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">Item, slide, deck and feature URNs,</text><text x="674" y="556" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">pin status and the declared path;</text><text x="674" y="578" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">role filter; snapshot-bound cursor</text></g></g></svg>