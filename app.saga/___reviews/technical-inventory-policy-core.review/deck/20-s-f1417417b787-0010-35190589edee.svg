<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Proof at the policy boundary</title><desc id="desc">Temporary fixtures test the helper; public writer integration remains future work.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306687"/></marker></defs><rect width="1280" height="720" fill="#f1f5f8"/><g font-family="Arial,sans-serif"><text x="50" y="48" font-size="17" fill="#47647a">TECHNICAL INVENTORY / INTERNAL FOUNDATION</text><text x="50" y="97" font-size="36" fill="#20384b">Proof at the policy boundary</text><text x="50" y="134" font-size="21" fill="#20384b">Temporary fixtures test the helper; public writer integration remains future work.</text><g id="pin-tests"><rect x="50" y="194" width="1180" height="101" rx="10" fill="#ffffff"/><text x="70" y="222" font-size="17" fill="#47647a">SAVED-VIEW MATRIX</text><text x="70" y="256" font-size="22" fill="#20384b">Current / historical pin</text><path d="M380 249H431" stroke="#306687" stroke-width="2.5" marker-end="url(#arrow)"/><text x="455" y="256" font-size="22" fill="#20384b">Missing or conflicted view</text><path d="M788 249H838" stroke="#306687" stroke-width="2.5" marker-end="url(#arrow)"/><text x="860" y="256" font-size="22" fill="#20384b">Exact admission reason</text><text x="70" y="282" font-size="16" fill="#536b7d">Global retirement does not rewrite a valid saved view; invalid selected views never fall back.</text></g><g id="candidate-tests"><rect x="50" y="332" width="1180" height="101" rx="10" fill="#ffffff"/><text x="70" y="360" font-size="17" fill="#47647a">CANDIDATE MATRIX</text><text x="70" y="394" font-size="22" fill="#20384b">Mixed explicit intent</text><path d="M380 387H431" stroke="#306687" stroke-width="2.5" marker-end="url(#arrow)"/><text x="455" y="394" font-size="22" fill="#20384b">Bounds + evidence gates</text><path d="M788 387H838" stroke="#306687" stroke-width="2.5" marker-end="url(#arrow)"/><text x="860" y="394" font-size="22" fill="#20384b">Ordered diagnostics</text><text x="70" y="420" font-size="16" fill="#536b7d">64 accepted / 65 refused, unknown inputs, own edge evidence, exact endpoints, input immutability.</text></g><g id="git-tests"><rect x="50" y="470" width="1180" height="101" rx="10" fill="#ffffff"/><text x="70" y="498" font-size="17" fill="#47647a">TEMPORARY GIT MATRIX</text><text x="70" y="532" font-size="22" fill="#20384b">Original source bytes</text><path d="M380 525H431" stroke="#306687" stroke-width="2.5" marker-end="url(#arrow)"/><text x="455" y="532" font-size="22" fill="#20384b">Move / edit / delete</text><path d="M788 525H838" stroke="#306687" stroke-width="2.5" marker-end="url(#arrow)"/><text x="860" y="532" font-size="22" fill="#20384b">Pass / stale / refuse</text><text x="70" y="558" font-size="16" fill="#536b7d">Matching delivery bytes cannot replace original proof. Retained edges are checked again.</text></g><g id="scope"><rect x="50" y="610" width="1180" height="76" rx="10" fill="#dce8f0"/><text x="70" y="640" font-size="16" fill="#20384b">NO REAL SAGA OR REVIEW MUTATIONS IN TESTS</text><text x="70" y="670" font-size="21" fill="#20384b">Source HEAD, worktree status and object counts remain unchanged during policy evaluation.</text></g></g></svg>