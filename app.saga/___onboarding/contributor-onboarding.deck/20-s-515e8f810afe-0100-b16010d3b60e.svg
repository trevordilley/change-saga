<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">A code change also has a knowledge impact</title><desc id="desc">Inspect and commit only your intended code/test changes before authoring commit-pinned evidence. Uncommitted source edits are not part of a committed comparison. Status and the affected layer derive downstream work from changed source and pinned links. Missing unrelated growth is not a reason to invent requirements. Read the changed obligation or source, update its explanation, then replace or repin only the affected evidence or relations. A clean warning is not a substitute for a correct explanation. Run the displayed commands on a feature branch. Use the actual PR base if it differs from main; validation is structural, while references and status expose currency and gaps. Use query for reading, and CLI writers such as revise-item, set-slide-content, replace-coverage, term revise and relation repin for edits. Onboarding Items link to records rather than code.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#087e83"/></marker></defs><rect width="1280" height="720" fill="#f6f4ed"/><path d="M0 0 H1280 V8 H0Z" fill="#087e83"/><text x="64" y="48" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="64" dy="0">CHANGE SAGA  /  ITERATE</tspan></text><text x="1129" y="48" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1129" dy="0">11 / 12</tspan></text><text x="64" y="110" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400"><tspan x="64" dy="0">A code change also has a knowledge impact</tspan></text><g id="commit"><rect x="64" y="177" width="341" height="132" rx="14" fill="#dfefea" stroke="#a8babc" stroke-width="2"/><text x="86" y="216" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="86" dy="0">1  Commit a focused change</tspan></text><text x="86" y="256" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400"><tspan x="86" dy="0">Review git diff first.</tspan><tspan x="86" dy="29">Evidence pins committed code.</tspan></text></g><g id="inspect"><rect x="470" y="177" width="341" height="132" rx="14" fill="#fffefa" stroke="#a8babc" stroke-width="2"/><text x="492" y="216" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="492" dy="0">2  Derive the work queue</tspan></text><text x="492" y="256" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400"><tspan x="492" dy="0">Changed / Affected / Code</tspan><tspan x="492" dy="29">Do not infer impact from prose.</tspan></text><path d="M405 245 H458" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/></g><g id="repair"><rect x="876" y="177" width="340" height="132" rx="14" fill="#fff0d4" stroke="#a8babc" stroke-width="2"/><text x="898" y="216" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="898" dy="0">3  Reconcile precisely</tspan></text><text x="898" y="256" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400"><tspan x="898" dy="0">Revise the owning element.</tspan><tspan x="898" dy="29">Refresh only its stale evidence.</tspan></text><path d="M811 245 H864" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/></g><g id="commands"><rect x="64" y="351" width="1152" height="211" rx="14" fill="#142e3a" stroke="#142e3a" stroke-width="2"/><text x="86" y="384" fill="#a9ddd8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="86" dy="0">FROM YOUR FEATURE BRANCH · compare committed HEAD with its merge base against main</tspan></text><text x="86" y="420" fill="#f6f4ed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan x="86" dy="0">./bin/change-saga status --json --against main app.saga</tspan><tspan x="86" dy="28">./bin/change-saga query layers --saga app.saga --against main --layer affected</tspan><tspan x="86" dy="28">./bin/change-saga references --stale --diff app.saga</tspan><tspan x="86" dy="28">./bin/change-saga validate --json app.saga</tspan></text></g><g id="writer"><text x="64" y="604" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="64" dy="0">Use CLI writers. Keep code links on exact implementation Items; never hand-edit Saga JSON.</tspan></text></g><path d="M64 647 H1216" stroke="#a8babc"/><text x="64" y="684" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="64" dy="0">Commit the code, derive what is affected, then update only the records and exact evidence that need to change.</tspan></text></svg>
