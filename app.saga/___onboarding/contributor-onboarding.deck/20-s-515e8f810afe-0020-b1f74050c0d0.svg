<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">A link has an owner—and a version</title><desc id="desc">A relation pins the story revision it relied on, preferably a specific criterion rather than the whole story. The Stories and Code controls on a diagram element expose separate intent links and implementation evidence. A code reference identifies selected source bytes at a commit; it is distinct from a requirement relation. Line movement can remap a reference while its selected bytes remain current. Edits to selected bytes make evidence stale and prompt a targeted documentation update. Changing the linked obligation can stale a relation; repinning means confirming the new meaning, not clearing a warning blindly.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#087e83"/></marker></defs><rect width="1280" height="720" fill="#f6f4ed"/><path d="M0 0 H1280 V8 H0Z" fill="#087e83"/><text x="64" y="48" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="64" dy="0">CHANGE SAGA  /  UNDERSTAND</tspan></text><text x="1129" y="48" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1129" dy="0">03 / 12</tspan></text><text x="64" y="110" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400"><tspan x="64" dy="0">A link has an owner—and a version</tspan></text><g id="intent"><rect x="64" y="192" width="295" height="169" rx="14" fill="#dfefea" stroke="#a8babc" stroke-width="2"/><text x="86" y="231" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="86" dy="0">Story + criterion</tspan></text><text x="86" y="268" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="86" dy="0">The obligation</tspan><tspan x="86" dy="31">Pinned story revision</tspan></text></g><g id="element"><rect x="491" y="192" width="295" height="169" rx="14" fill="#fffefa" stroke="#a8babc" stroke-width="2"/><text x="513" y="231" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="513" dy="0">Diagram element</tspan></text><text x="513" y="269" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="513" dy="0">The explanation</tspan><tspan x="513" dy="31">Stories ≠ Code controls</tspan></text><path d="M491 276 H370" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><text x="384" y="253" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="384" dy="0">explains</tspan></text></g><g id="code"><rect x="918" y="192" width="298" height="169" rx="14" fill="#fff0d4" stroke="#a8babc" stroke-width="2"/><text x="940" y="231" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="940" dy="0">Code reference</tspan></text><text x="940" y="269" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="940" dy="0">Commit + path + lines</tspan><tspan x="940" dy="31">Digest of selected bytes</tspan></text><path d="M786 276 H907" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><text x="801" y="253" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="801" dy="0">references</tspan></text></g><g id="same"><path d="M1065 361 V400 H211 V435" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="448" width="295" height="128" rx="14" fill="#dfefea" stroke="#a8babc" stroke-width="2"/><text x="86" y="484" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="86" dy="0">Same bytes</tspan></text><text x="86" y="520" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400"><tspan x="86" dy="0">Still current</tspan><tspan x="86" dy="29">Even if line numbers move</tspan></text></g><g id="changed"><path d="M1065 400 H638 V435" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><rect x="491" y="448" width="295" height="128" rx="14" fill="#fff0d4" stroke="#a8babc" stroke-width="2"/><text x="513" y="484" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="513" dy="0">Changed bytes</tspan></text><text x="513" y="520" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400"><tspan x="513" dy="0">Stale code reference</tspan><tspan x="513" dy="29">Re-author the explanation</tspan></text></g><g id="meaning"><path d="M211 361 V422 H1065 V435" fill="none" stroke="#b3483b" stroke-width="3" marker-end="url(#arrow)"/><rect x="918" y="448" width="298" height="128" rx="14" fill="#fae6df" stroke="#a8babc" stroke-width="2"/><text x="940" y="484" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="940" dy="0">Changed obligation</tspan></text><text x="940" y="520" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400"><tspan x="940" dy="0">A relation may go stale</tspan><tspan x="940" dy="29">Read it before repinning</tspan></text></g><path d="M64 647 H1216" stroke="#a8babc"/><text x="64" y="684" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="64" dy="0">Follow an element’s Stories and Code controls separately; a link is not proof that a requirement is satisfied.</tspan></text></svg>
