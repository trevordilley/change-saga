<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">First exercise: a tiny Terms-page change</title><desc id="desc">Create a fresh practice branch and change only the term-detail Code heading to Defining code. This is an optional contributor exercise, not a product requirement or a change made by this deck. In internal/server/template.go locate the terms-page template and its term-code-list section; avoid replacing unrelated Code headings. Extend TestATermPageShowsItsDefinitionStoriesAndCode in internal/server/terms_test.go to expect the new heading. Run it before the implementation edit to see the intended failure, then after to see it pass. Run the exact named test at the repository root, then rebuild and restart as shown on the iteration slide. Open /terms/pagination-cursor on your own server. The final check is a visible new heading with working story and code links, a passing targeted assertion, and no unrelated modifications.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#087e83"/></marker></defs><rect width="1280" height="720" fill="#f6f4ed"/><path d="M0 0 H1280 V8 H0Z" fill="#087e83"/><text x="64" y="48" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="64" dy="0">CHANGE SAGA  /  ITERATE</tspan></text><text x="1129" y="48" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1129" dy="0">10 / 12</tspan></text><text x="64" y="110" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400"><tspan x="64" dy="0">First exercise: a tiny Terms-page change</tspan></text><g id="scope"><rect x="64" y="173" width="1152" height="91" rx="14" fill="#dfefea" stroke="#087e83" stroke-width="2"/><text x="88" y="212" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="88" dy="0">Goal: make the term detail heading say “Defining code” instead of “Code”.</tspan></text><text x="88" y="244" fill="#506773" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan x="88" dy="0">Work on a fresh branch: git switch -c practice/term-heading</tspan></text></g><g id="locate"><rect x="64" y="298" width="544" height="129" rx="14" fill="#fffefa" stroke="#a8babc" stroke-width="2"/><text x="86" y="338" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="86" dy="0">1  Locate the term-detail template</tspan></text><text x="86" y="379" fill="#142e3a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan x="86" dy="0">internal/server/template.go</tspan><tspan x="86" dy="28">Inside terms-page → term-code-list</tspan></text></g><g id="assert"><rect x="672" y="298" width="544" height="129" rx="14" fill="#fffefa" stroke="#a8babc" stroke-width="2"/><text x="694" y="338" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="694" dy="0">2  Add a focused expectation</tspan></text><text x="694" y="379" fill="#142e3a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18"><tspan x="694" dy="0">internal/server/terms_test.go</tspan><tspan x="694" dy="25">TestATermPageShowsItsDefinitionStoriesAndCode</tspan></text><path d="M608 362 H660" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/></g><g id="run"><rect x="64" y="461" width="1152" height="105" rx="14" fill="#142e3a" stroke="#142e3a" stroke-width="2"/><text x="86" y="494" fill="#a9ddd8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="86" dy="0">3  TEST · then rebuild, restart and inspect /terms/pagination-cursor</tspan></text><text x="86" y="530" fill="#f6f4ed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan x="86" dy="0">go test ./internal/server -run '^TestATermPageShowsItsDefinitionStoriesAndCode$'</tspan></text></g><g id="finish"><text x="64" y="610" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="64" dy="0">4  Confirm the heading changed and the story/code links still work. Keep the diff small.</tspan></text></g><path d="M64 647 H1216" stroke="#a8babc"/><text x="64" y="684" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="64" dy="0">Practice one complete loop on a small UI label before changing a domain rule.</tspan></text></svg>
