<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Leave a trail the next person can follow</title><desc id="desc">Before changing behavior identify the relevant persona, story and criterion. Definitions in Terms and vocabulary connect language back to intent and code. A contributor should be able to build and run the app and distinguish source edits, binary rebuilds and process restarts. Use the smallest truthful test and an actual browser check; reconcile changes to affected stories, definitions, diagrams and evidence. Hand off a focused commit or branch with code, tests and current explanations. Coverage reports omissions; it never approves a change on behalf of a person.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#087e83"/></marker></defs><rect width="1280" height="720" fill="#f6f4ed"/><path d="M0 0 H1280 V8 H0Z" fill="#087e83"/><text x="64" y="48" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="64" dy="0">CHANGE SAGA  /  APPLY</tspan></text><text x="1129" y="48" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1129" dy="0">12 / 12</tspan></text><text x="64" y="110" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400"><tspan x="64" dy="0">Leave a trail the next person can follow</tspan></text><g id="product"><rect x="64" y="184" width="353" height="174" rx="14" fill="#dfefea" stroke="#a8babc" stroke-width="2"/><text x="88" y="226" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400"><tspan x="88" dy="0">I can explain why</tspan></text><text x="88" y="268" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="88" dy="0">Find the persona + story.</tspan><tspan x="88" dy="31">Name the acceptance criterion.</tspan><tspan x="88" dy="31">Use the team’s vocabulary.</tspan></text></g><g id="run"><rect x="465" y="184" width="351" height="174" rx="14" fill="#fffefa" stroke="#a8babc" stroke-width="2"/><text x="489" y="226" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400"><tspan x="489" dy="0">I can run it</tspan></text><text x="489" y="268" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="489" dy="0">Build the Go executable.</tspan><tspan x="489" dy="31">Start my loopback server.</tspan><tspan x="489" dy="31">Know what must restart.</tspan></text></g><g id="prove"><rect x="864" y="184" width="352" height="174" rx="14" fill="#fff0d4" stroke="#a8babc" stroke-width="2"/><text x="888" y="226" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400"><tspan x="888" dy="0">I can change it safely</tspan></text><text x="888" y="268" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="888" dy="0">Choose a focused test.</tspan><tspan x="888" dy="31">Inspect the browser result.</tspan><tspan x="888" dy="31">Trace the knowledge impact.</tspan></text></g><g id="handoff"><path d="M241 358 V406 H640 V445" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 358 V445" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><path d="M1040 358 V406 H650" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><rect x="253" y="458" width="774" height="125" rx="14" fill="#142e3a" stroke="#142e3a" stroke-width="2"/><text x="282" y="500" fill="#fffefa" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400"><tspan x="282" dy="0">Handoff = code + tests + current explanation</tspan></text><text x="282" y="543" fill="#a9ddd8" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400"><tspan x="282" dy="0">Commit your work; preserve history; let people make the review decision.</tspan></text></g><path d="M64 647 H1216" stroke="#a8babc"/><text x="64" y="684" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="64" dy="0">You are ready to iterate when you can explain the intent, run the app, test a change, and keep its documentation honest.</tspan></text></svg>
