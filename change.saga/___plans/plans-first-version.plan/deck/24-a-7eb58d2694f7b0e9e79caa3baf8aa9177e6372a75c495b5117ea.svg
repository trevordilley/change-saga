<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">The old work plan goes, so there is one way to plan work</title>
  <desc id="diagram-desc">It was connected but unused, with part of it unreachable. Keeping the idea and rebuilding small leaves one task system, and Git as its history.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-tint:#e8f1ff;--diagram-gray-accent:#475569;--diagram-gray-tint:#f1f5f9;--diagram-green-accent:#15803d;--diagram-green-ink:#052e16;--diagram-green-tint:#e7f8eb;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-on-accent:#ffffff;--diagram-title-ink:#172033;--diagram-yellow-accent:#a16207;--diagram-yellow-ink:#3f2d00;--diagram-yellow-tint:#fff8d6;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-tint:#121d2f;--diagram-gray-accent:#9198a1;--diagram-gray-tint:#1c2128;--diagram-green-accent:#56d364;--diagram-green-ink:#d2f8d9;--diagram-green-tint:#12261e;--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-on-accent:#0d1117;--diagram-title-ink:#e6edf3;--diagram-yellow-accent:#e3b341;--diagram-yellow-ink:#fff5b1;--diagram-yellow-tint:#2b2508;}}</style>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">The old work plan goes, so there is one way to plan work</tspan></text>
  </g>
  <g id="g-kept" data-diagram-kind="group" transform="translate(40 90)" role="group" aria-label="Kept: the idea">
    <title>Kept: the idea</title>
    <rect width="590" height="365" rx="10" fill="#e7f8eb" stroke="#15803d" stroke-width="1" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H130.74A10 10 0 0 1 140.74 10V34.5Z" fill="#15803d" style="fill:var(--diagram-green-accent,#15803d)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Kept: the idea</tspan></text>
    <g id="k1" data-diagram-kind="node" transform="translate(20 50)" role="group" aria-label="A work item is what a Task is">
      <rect width="550" height="70" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">A work item is what a Task is</tspan></text>
    </g>
    <g id="k2" data-diagram-kind="node" transform="translate(20 130)" role="group" aria-label="A wave is what a Phase is">
      <rect width="550" height="70" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">A wave is what a Phase is</tspan></text>
    </g>
    <g id="k3" data-diagram-kind="node" transform="translate(20 210)" role="group" aria-label="Dependencies, and cycles refused">
      <rect width="550" height="70" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">Dependencies, and cycles refused</tspan></text>
    </g>
    <g id="k4" data-diagram-kind="node" transform="translate(20 290)" role="group" aria-label="Retries are safe: adding twice is refused">
      <rect width="550" height="60" rx="8" fill="#fff8d6" stroke="#a16207" stroke-width="2" style="fill:var(--diagram-yellow-tint,#fff8d6);stroke:var(--diagram-yellow-accent,#a16207)"/>
      <text x="18" y="35" font-size="17" fill="#3f2d00" xml:space="preserve" style="fill:var(--diagram-yellow-ink,#3f2d00)"><tspan x="18" y="35">Retries are safe: adding twice is refused</tspan></text>
    </g>
  </g>
  <g id="g-gone" data-diagram-kind="group" transform="translate(650 90)" role="group" aria-label="Gone: the machinery">
    <title>Gone: the machinery</title>
    <rect width="590" height="365" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1" style="fill:var(--diagram-gray-tint,#f1f5f9);stroke:var(--diagram-gray-accent,#475569)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H188.915A10 10 0 0 1 198.915 10V34.5Z" fill="#475569" style="fill:var(--diagram-gray-accent,#475569)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Gone: the machinery</tspan></text>
    <g id="x1" data-diagram-kind="node" transform="translate(20 50)" role="group" aria-label="Revisions, event graphs, heads: Git instead">
      <rect width="550" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Revisions, event graphs, heads: Git instead</tspan></text>
    </g>
    <g id="x2" data-diagram-kind="node" transform="translate(20 130)" role="group" aria-label="Merge units and events: a Plan's Reviews instead">
      <rect width="550" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Merge units and events: a Plan's Reviews instead</tspan></text>
    </g>
    <g id="x3" data-diagram-kind="node" transform="translate(20 210)" role="group" aria-label="Contracts and workspaces: back only if needed">
      <rect width="550" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Contracts and workspaces: back only if needed</tspan></text>
    </g>
    <g id="x4" data-diagram-kind="node" transform="translate(20 290)" role="group" aria-label="The implements relation, and four queries">
      <rect width="550" height="60" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">The implements relation, and four queries</tspan></text>
    </g>
  </g>
  <g id="g-tasks" data-diagram-kind="group" transform="translate(40 470)" role="group" aria-label="Tasks on this slide">
    <title>Tasks on this slide</title>
    <rect width="1200" height="200" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="1" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H169.87A10 10 0 0 1 179.87 10V34.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Tasks on this slide</tspan></text>
    <g id="t-stop-reading-work-plan" data-diagram-kind="node" transform="translate(14 44)" role="group" aria-label="Stop reading work items&#10;Readiness now counts Tasks">
      <rect width="285" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Stop reading work items</tspan><tspan x="18" y="51.75">Readiness now counts Tasks</tspan></text>
    </g>
    <g id="t-remove-commands" data-diagram-kind="node" transform="translate(309 44)" role="group" aria-label="Remove the old verbs&#10;And the work queries">
      <rect width="285" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Remove the old verbs</tspan><tspan x="18" y="51.75">And the work queries</tspan></text>
    </g>
    <g id="t-remove-package" data-diagram-kind="node" transform="translate(604 44)" role="group" aria-label="Remove the package&#10;Schemas and ___workplan">
      <rect width="285" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Remove the package</tspan><tspan x="18" y="51.75">Schemas and ___workplan</tspan></text>
    </g>
    <g id="t-remove-docs" data-diagram-kind="node" transform="translate(899 44)" role="group" aria-label="Remove the docs&#10;Feature and terms in the Saga">
      <rect width="285" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Remove the docs</tspan><tspan x="18" y="51.75">Feature and terms in the Saga</tspan></text>
    </g>
  </g>
</svg>
