<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">The deck holds the technical design, and shows the work's progress</title>
  <desc id="diagram-desc">A Plan's deck uses the review deck's path with a new role. Slide Items name Tasks, and done state is read when the page opens, so nobody republishes a slide to report progress.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-ink:#172554;--diagram-blue-tint:#e8f1ff;--diagram-gray-accent:#475569;--diagram-gray-tint:#f1f5f9;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-on-accent:#ffffff;--diagram-secondary-ink:#526174;--diagram-secondary-stroke:#94a3b8;--diagram-title-ink:#172033;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-ink:#cae8ff;--diagram-blue-tint:#121d2f;--diagram-gray-accent:#9198a1;--diagram-gray-tint:#1c2128;--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-on-accent:#0d1117;--diagram-secondary-ink:#9198a1;--diagram-secondary-stroke:#6e7681;--diagram-title-ink:#e6edf3;}}</style>
    <marker id="diagram-head-f-e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-f-e2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-f-e3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">The deck holds the technical design, and shows the work's progress</tspan></text>
  </g>
  <g id="g-flow" data-diagram-kind="group" transform="translate(40 90)" role="group" aria-label="From an agent finishing work to the slide">
    <title>From an agent finishing work to the slide</title>
    <rect width="1200" height="190" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1" style="fill:var(--diagram-gray-tint,#f1f5f9);stroke:var(--diagram-gray-accent,#475569)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H353.154A10 10 0 0 1 363.154 10V34.5Z" fill="#475569" style="fill:var(--diagram-gray-accent,#475569)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">From an agent finishing work to the slide</tspan></text>
    <g id="f1" data-diagram-kind="node" transform="translate(20 60)" role="group" aria-label="Agent finishes work&#10;task done">
      <rect width="250" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="35" font-size="17" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="35">Agent finishes work</tspan><tspan x="18" y="56.25">task done</tspan></text>
    </g>
    <g id="f2" data-diagram-kind="node" transform="translate(340 60)" role="group" aria-label="Task's state&#10;In task.json">
      <rect width="250" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="35" font-size="17" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="35">Task's state</tspan><tspan x="18" y="56.25">In task.json</tspan></text>
    </g>
    <g id="f3" data-diagram-kind="node" transform="translate(660 60)" role="group" aria-label="Slide Item&#10;Names the Task">
      <rect width="230" height="90" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Slide Item</tspan><tspan x="18" y="56.25">Names the Task</tspan></text>
    </g>
    <g id="f4" data-diagram-kind="node" transform="translate(950 60)" role="group" aria-label="Reader&#10;Shows Done">
      <rect width="220" height="90" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Reader</tspan><tspan x="18" y="56.25">Shows Done</tspan></text>
    </g>
  </g>
  <g id="f-e1" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="writes" data-from="f1" data-to="f2">
    <path d="M310 195 L380 195" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-f-e1)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="312" y="183" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="312" y="183">writes</tspan></text>
  </g>
  <g id="f-e2" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="read by" data-from="f2" data-to="f3">
    <path d="M630 195 L700 195" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-f-e2)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="628" y="183" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="628" y="183">read by</tspan></text>
  </g>
  <g id="f-e3" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="f3 to f4" data-from="f3" data-to="f4">
    <path d="M930 195 L990 195" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-f-e3)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="g-role" data-diagram-kind="group" transform="translate(40 295)" role="group" aria-label="A new deck role">
    <title>A new deck role</title>
    <rect width="1200" height="160" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1" style="fill:var(--diagram-gray-tint,#f1f5f9);stroke:var(--diagram-gray-accent,#475569)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H148.063A10 10 0 0 1 158.063 10V34.5Z" fill="#475569" style="fill:var(--diagram-gray-accent,#475569)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">A new deck role</tspan></text>
    <g id="role-note" data-diagram-kind="text" transform="translate(20 44)" role="group" aria-label="A Plan's Items carry no evidence or criterion links, because no code has been written. Code references live on Tasks. apply-slide, deck overview, and diagram commands all work on a Plan's slides, and a delivered Plan refuses them.">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">A Plan's Items carry no evidence or criterion links, because no code has been written. Code references live on Tasks. apply-slide, deck overview, and</tspan><tspan x="0" y="36">diagram commands all work on a Plan's slides, and a delivered Plan refuses them.</tspan></text>
    </g>
  </g>
  <g id="g-tasks" data-diagram-kind="group" transform="translate(40 470)" role="group" aria-label="Tasks in this phase">
    <title>Tasks in this phase</title>
    <rect width="1200" height="200" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="1" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H175.281A10 10 0 0 1 185.281 10V34.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Tasks in this phase</tspan></text>
    <g id="t-plan-deck" data-diagram-kind="node" transform="translate(14 44)" role="group" aria-label="A Plan's deck&#10;Holds its technical design">
      <rect width="285" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">A Plan's deck</tspan><tspan x="18" y="51.75">Holds its technical design</tspan></text>
    </g>
    <g id="t-phase-sections" data-diagram-kind="node" transform="translate(309 44)" role="group" aria-label="Slides by phase&#10;Sections name phases">
      <rect width="285" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Slides by phase</tspan><tspan x="18" y="51.75">Sections name phases</tspan></text>
    </g>
    <g id="t-slides-show-tasks" data-diagram-kind="node" transform="translate(604 44)" role="group" aria-label="Tasks on slides&#10;With their done state">
      <rect width="285" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Tasks on slides</tspan><tspan x="18" y="51.75">With their done state</tspan></text>
    </g>
    <g id="t-plans-on-stories" data-diagram-kind="node" transform="translate(899 44)" role="group" aria-label="Plans on stories&#10;And on features">
      <rect width="285" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Plans on stories</tspan><tspan x="18" y="51.75">And on features</tspan></text>
    </g>
  </g>
</svg>
