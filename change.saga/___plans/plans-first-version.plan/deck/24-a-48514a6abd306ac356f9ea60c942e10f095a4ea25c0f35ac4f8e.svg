<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">A guide builds confidence before work starts</title>
  <desc id="diagram-desc">plan guide gives an agent the workflow, then names the Tasks it cannot yet be confident of, so what is not ready gets named.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-tint:#e8f1ff;--diagram-gray-accent:#475569;--diagram-gray-tint:#f1f5f9;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-on-accent:#ffffff;--diagram-title-ink:#172033;--diagram-yellow-accent:#a16207;--diagram-yellow-tint:#fff8d6;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-tint:#121d2f;--diagram-gray-accent:#9198a1;--diagram-gray-tint:#1c2128;--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-on-accent:#0d1117;--diagram-title-ink:#e6edf3;--diagram-yellow-accent:#e3b341;--diagram-yellow-tint:#2b2508;}}</style>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">A guide builds confidence before work starts</tspan></text>
  </g>
  <g id="g-guide" data-diagram-kind="group" transform="translate(40 90)" role="group" aria-label="The workflow">
    <title>The workflow</title>
    <rect width="1200" height="190" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1" style="fill:var(--diagram-gray-tint,#f1f5f9);stroke:var(--diagram-gray-accent,#475569)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H125.15A10 10 0 0 1 135.15 10V34.5Z" fill="#475569" style="fill:var(--diagram-gray-accent,#475569)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">The workflow</tspan></text>
    <g id="g0" data-diagram-kind="node" transform="translate(14 50)" role="group" aria-label="Research&#10;Stories and code">
      <rect width="160" height="120" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Research</tspan><tspan x="18" y="51.75">Stories and code</tspan></text>
    </g>
    <g id="g1" data-diagram-kind="node" transform="translate(183 50)" role="group" aria-label="Ask&#10;What code cannot say">
      <rect width="160" height="120" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Ask</tspan><tspan x="18" y="51.75">What code cannot</tspan><tspan x="18" y="70.5">say</tspan></text>
    </g>
    <g id="g2" data-diagram-kind="node" transform="translate(352 50)" role="group" aria-label="Draft&#10;Top-down Tasks">
      <rect width="160" height="120" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Draft</tspan><tspan x="18" y="51.75">Top-down Tasks</tspan></text>
    </g>
    <g id="g3" data-diagram-kind="node" transform="translate(521 50)" role="group" aria-label="Prototype&#10;What is unclear">
      <rect width="160" height="120" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Prototype</tspan><tspan x="18" y="51.75">What is unclear</tspan></text>
    </g>
    <g id="g4" data-diagram-kind="node" transform="translate(690 50)" role="group" aria-label="Size&#10;Or split it">
      <rect width="160" height="120" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Size</tspan><tspan x="18" y="51.75">Or split it</tspan></text>
    </g>
    <g id="g5" data-diagram-kind="node" transform="translate(859 50)" role="group" aria-label="Explain&#10;Deck and essay">
      <rect width="160" height="120" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Explain</tspan><tspan x="18" y="51.75">Deck and essay</tspan></text>
    </g>
    <g id="g6" data-diagram-kind="node" transform="translate(1028 50)" role="group" aria-label="Check&#10;plan guide --plan">
      <rect width="160" height="120" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Check</tspan><tspan x="18" y="51.75">plan guide --plan</tspan></text>
    </g>
  </g>
  <g id="g-why" data-diagram-kind="group" transform="translate(40 295)" role="group" aria-label="An exception in the skill">
    <title>An exception in the skill</title>
    <rect width="1200" height="160" rx="10" fill="#fff8d6" stroke="#a16207" stroke-width="1" style="fill:var(--diagram-yellow-tint,#fff8d6);stroke:var(--diagram-yellow-accent,#a16207)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H212.916A10 10 0 0 1 222.916 10V34.5Z" fill="#a16207" style="fill:var(--diagram-yellow-accent,#a16207)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">An exception in the skill</tspan></text>
    <g id="why-note" data-diagram-kind="text" transform="translate(20 44)" role="group" aria-label="The skill tells agents to author Saga content near completion, at pull request time. A Plan is the deliberate exception: it is written before the code exists, and its Tasks are marked done as the work happens.">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">The skill tells agents to author Saga content near completion, at pull request time. A Plan is the deliberate exception: it is written before the code exists, and</tspan><tspan x="0" y="36">its Tasks are marked done as the work happens.</tspan></text>
    </g>
  </g>
  <g id="g-tasks" data-diagram-kind="group" transform="translate(40 470)" role="group" aria-label="Tasks in this phase">
    <title>Tasks in this phase</title>
    <rect width="1200" height="200" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="1" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H175.281A10 10 0 0 1 185.281 10V34.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Tasks in this phase</tspan></text>
    <g id="t-plan-prototypes" data-diagram-kind="node" transform="translate(14 44)" role="group" aria-label="Attach prototypes&#10;A list of URNs and a tab">
      <rect width="581" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Attach prototypes</tspan><tspan x="18" y="51.75">A list of URNs and a tab</tspan></text>
    </g>
    <g id="t-guidance-wizard" data-diagram-kind="node" transform="translate(605 44)" role="group" aria-label="plan guide, and the skill's route&#10;Names what is not ready">
      <rect width="581" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">plan guide, and the skill's route</tspan><tspan x="18" y="51.75">Names what is not ready</tspan></text>
    </g>
  </g>
</svg>
