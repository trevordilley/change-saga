<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">Each Plan reads as an essay and a deck, then Tasks and Coverage</title>
  <desc id="diagram-desc">Deck, Tasks, and Coverage sit in the header, as a review's views do. Coverage ends every path at a story, and selecting a node marks the path to it.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-ink:#172554;--diagram-blue-tint:#e8f1ff;--diagram-gray-accent:#475569;--diagram-gray-tint:#f1f5f9;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-on-accent:#ffffff;--diagram-title-ink:#172033;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-ink:#cae8ff;--diagram-blue-tint:#121d2f;--diagram-gray-accent:#9198a1;--diagram-gray-tint:#1c2128;--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-on-accent:#0d1117;--diagram-title-ink:#e6edf3;}}</style>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">Each Plan reads as an essay and a deck, then Tasks and Coverage</tspan></text>
  </g>
  <g id="g-views" data-diagram-kind="group" transform="translate(40 90)" role="group" aria-label="Three views in the header">
    <title>Three views in the header</title>
    <rect width="1200" height="240" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="1" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H230.483A10 10 0 0 1 240.483 10V34.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Three views in the header</tspan></text>
    <g id="v-deck" data-diagram-kind="node" transform="translate(20 60)" role="group" aria-label="Deck&#10;The essay, then the slides. A slide's Tasks open in a slide-out.">
      <rect width="370" height="150" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Deck</tspan><tspan x="18" y="56.25">The essay, then the slides. A slide's</tspan><tspan x="18" y="77.5">Tasks open in a slide-out.</tspan></text>
    </g>
    <g id="v-tasks" data-diagram-kind="node" transform="translate(410 60)" role="group" aria-label="Tasks&#10;A list by phase, with what each needs, unblocks, and leads to.">
      <rect width="370" height="150" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Tasks</tspan><tspan x="18" y="56.25">A list by phase, with what each needs,</tspan><tspan x="18" y="77.5">unblocks, and leads to.</tspan></text>
    </g>
    <g id="v-coverage" data-diagram-kind="node" transform="translate(800 60)" role="group" aria-label="Coverage&#10;A whiteboard of Tasks by phase, ending at the stories.">
      <rect width="380" height="150" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Coverage</tspan><tspan x="18" y="56.25">A whiteboard of Tasks by phase, ending at</tspan><tspan x="18" y="77.5">the stories.</tspan></text>
    </g>
  </g>
  <g id="g-select" data-diagram-kind="group" transform="translate(40 345)" role="group" aria-label="Selecting a node on Coverage">
    <title>Selecting a node on Coverage</title>
    <rect width="1200" height="110" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1" style="fill:var(--diagram-gray-tint,#f1f5f9);stroke:var(--diagram-gray-accent,#475569)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H267.338A10 10 0 0 1 277.338 10V34.5Z" fill="#475569" style="fill:var(--diagram-gray-accent,#475569)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Selecting a node on Coverage</tspan></text>
    <g id="select-note" data-diagram-kind="text" transform="translate(20 44)" role="group" aria-label="A Task shows its detail. A story shows every Task it takes, by phase. Either way the path to it is marked, a dashed line shows where it leads, and the detail sits beside the board.">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">A Task shows its detail. A story shows every Task it takes, by phase. Either way the path to it is marked, a dashed line shows where it leads, and the detail</tspan><tspan x="0" y="36">sits beside the board.</tspan></text>
    </g>
  </g>
  <g id="g-tasks" data-diagram-kind="group" transform="translate(40 470)" role="group" aria-label="Tasks in this phase">
    <title>Tasks in this phase</title>
    <rect width="1200" height="200" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="1" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H175.281A10 10 0 0 1 185.281 10V34.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Tasks in this phase</tspan></text>
    <g id="t-phases-run-in-parallel" data-diagram-kind="node" transform="translate(14 44)" role="group" aria-label="Parallel phases&#10;Depend on earlier ones">
      <rect width="158" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Parallel phases</tspan><tspan x="18" y="51.75">Depend on</tspan><tspan x="18" y="70.5">earlier ones</tspan></text>
    </g>
    <g id="t-plan-deck-viewer" data-diagram-kind="node" transform="translate(182 44)" role="group" aria-label="The deck viewer&#10;Essay first">
      <rect width="158" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">The deck viewer</tspan><tspan x="18" y="51.75">Essay first</tspan></text>
    </g>
    <g id="t-plan-header-views" data-diagram-kind="node" transform="translate(350 44)" role="group" aria-label="Header views&#10;Deck, Tasks, Coverage">
      <rect width="158" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Header views</tspan><tspan x="18" y="51.75">Deck, Tasks,</tspan><tspan x="18" y="70.5">Coverage</tspan></text>
    </g>
    <g id="t-slide-tasks-out" data-diagram-kind="node" transform="translate(518 44)" role="group" aria-label="Slide-out&#10;A slide's Tasks">
      <rect width="158" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Slide-out</tspan><tspan x="18" y="51.75">A slide's Tasks</tspan></text>
    </g>
    <g id="t-tasks-by-phase" data-diagram-kind="node" transform="translate(686 44)" role="group" aria-label="Tasks by phase&#10;With their chain">
      <rect width="158" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Tasks by phase</tspan><tspan x="18" y="51.75">With their chain</tspan></text>
    </g>
    <g id="t-coverage-whiteboard" data-diagram-kind="node" transform="translate(854 44)" role="group" aria-label="The whiteboard&#10;Ends at stories">
      <rect width="158" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">The whiteboard</tspan><tspan x="18" y="51.75">Ends at stories</tspan></text>
    </g>
    <g id="t-select-a-node" data-diagram-kind="node" transform="translate(1022 44)" role="group" aria-label="Select a node&#10;Path and detail">
      <rect width="158" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Select a node</tspan><tspan x="18" y="51.75">Path and detail</tspan></text>
    </g>
  </g>
</svg>
