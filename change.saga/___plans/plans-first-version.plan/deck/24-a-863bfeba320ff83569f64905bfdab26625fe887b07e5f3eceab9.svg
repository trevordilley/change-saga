<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">A Plan and its Reviews reference each other, and delivery is explicit</title>
  <desc id="diagram-desc">A review Item naming a Task says it delivers that Task. The comparison reads those links and only reports. A Plan is delivered by a command that checks the work is finished.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-tint:#e8f1ff;--diagram-gray-accent:#475569;--diagram-gray-tint:#f1f5f9;--diagram-green-accent:#15803d;--diagram-green-ink:#052e16;--diagram-green-tint:#e7f8eb;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-on-accent:#ffffff;--diagram-title-ink:#172033;--diagram-yellow-accent:#a16207;--diagram-yellow-ink:#3f2d00;--diagram-yellow-tint:#fff8d6;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-tint:#121d2f;--diagram-gray-accent:#9198a1;--diagram-gray-tint:#1c2128;--diagram-green-accent:#56d364;--diagram-green-ink:#d2f8d9;--diagram-green-tint:#12261e;--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-on-accent:#0d1117;--diagram-title-ink:#e6edf3;--diagram-yellow-accent:#e3b341;--diagram-yellow-ink:#fff5b1;--diagram-yellow-tint:#2b2508;}}</style>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">A Plan and its Reviews reference each other, and delivery is explicit</tspan></text>
  </g>
  <g id="g-cmp" data-diagram-kind="group" transform="translate(40 90)" role="group" aria-label="What the comparison reads">
    <title>What the comparison reads</title>
    <rect width="780" height="365" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1" style="fill:var(--diagram-gray-tint,#f1f5f9);stroke:var(--diagram-gray-accent,#475569)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H243.629A10 10 0 0 1 253.629 10V34.5Z" fill="#475569" style="fill:var(--diagram-gray-accent,#475569)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">What the comparison reads</tspan></text>
    <g id="cm1" data-diagram-kind="node" transform="translate(20 50)" role="group" aria-label="A review Item names a Task&#10;Delivered">
      <rect width="740" height="80" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">A review Item names a Task</tspan><tspan x="18" y="56.25">Delivered</tspan></text>
    </g>
    <g id="cm2" data-diagram-kind="node" transform="translate(20 145)" role="group" aria-label="A callout names a Task&#10;Departed, with the reason">
      <rect width="740" height="80" rx="8" fill="#fff8d6" stroke="#a16207" stroke-width="2" style="fill:var(--diagram-yellow-tint,#fff8d6);stroke:var(--diagram-yellow-accent,#a16207)"/>
      <text x="18" y="35" font-size="17" fill="#3f2d00" xml:space="preserve" style="fill:var(--diagram-yellow-ink,#3f2d00)"><tspan x="18" y="35">A callout names a Task</tspan><tspan x="18" y="56.25">Departed, with the reason</tspan></text>
    </g>
    <g id="cm3" data-diagram-kind="node" transform="translate(20 240)" role="group" aria-label="No Item names a Task&#10;Not delivered">
      <rect width="360" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">No Item names a Task</tspan><tspan x="18" y="51.75">Not delivered</tspan></text>
    </g>
    <g id="cm4" data-diagram-kind="node" transform="translate(400 240)" role="group" aria-label="A review slide names no Task&#10;Not in the Plan">
      <rect width="360" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">A review slide names no Task</tspan><tspan x="18" y="51.75">Not in the Plan</tspan></text>
    </g>
  </g>
  <g id="g-del" data-diagram-kind="group" transform="translate(840 90)" role="group" aria-label="plan deliver">
    <title>plan deliver</title>
    <rect width="400" height="365" rx="10" fill="#e7f8eb" stroke="#15803d" stroke-width="1" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H111.923A10 10 0 0 1 121.923 10V34.5Z" fill="#15803d" style="fill:var(--diagram-green-accent,#15803d)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">plan deliver</tspan></text>
    <g id="del-note" data-diagram-kind="text" transform="translate(20 50)" role="group" aria-label="Refused until every Task is done, a Review is linked, and every linked Review has merged. A delivered Plan is hidden as a merged review is, still reads, and no longer changes.">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">Refused until every Task is done, a Review is</tspan><tspan x="0" y="36">linked, and every linked Review has merged. A</tspan><tspan x="0" y="56">delivered Plan is hidden as a merged review is,</tspan><tspan x="0" y="76">still reads, and no longer changes.</tspan></text>
    </g>
    <g id="del-note2" data-diagram-kind="text" transform="translate(20 220)" role="group" aria-label="plan list: 1 delivered plan hidden; --all shows them.">
      <text x="0" y="18" font-size="18" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="18">plan list: 1 delivered plan hidden; --all</tspan><tspan x="0" y="40.5">shows them.</tspan></text>
    </g>
  </g>
  <g id="g-tasks" data-diagram-kind="group" transform="translate(40 470)" role="group" aria-label="Tasks on this slide">
    <title>Tasks on this slide</title>
    <rect width="1200" height="200" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="1" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H169.87A10 10 0 0 1 179.87 10V34.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Tasks on this slide</tspan></text>
    <g id="t-compare-with-reviews" data-diagram-kind="node" transform="translate(14 44)" role="group" aria-label="Plan vs Reviews&#10;Reads links Reviews can already hold">
      <rect width="581" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Plan vs Reviews</tspan><tspan x="18" y="51.75">Reads links Reviews can already hold</tspan></text>
    </g>
    <g id="t-deliver-plans" data-diagram-kind="node" transform="translate(605 44)" role="group" aria-label="Mark Plans delivered&#10;The filter merged reviews use">
      <rect width="581" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Mark Plans delivered</tspan><tspan x="18" y="51.75">The filter merged reviews use</tspan></text>
    </g>
  </g>
</svg>
