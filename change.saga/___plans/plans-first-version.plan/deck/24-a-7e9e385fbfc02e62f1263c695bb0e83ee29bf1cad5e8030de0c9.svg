<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">A Plan stands on its own, and reaches stories through its Tasks</title>
  <desc id="diagram-desc">A Plan belongs to no feature. Its stories come from its Tasks and its features from those stories, so nobody keeps those lists by hand.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-ink:#172554;--diagram-blue-tint:#e8f1ff;--diagram-gray-accent:#475569;--diagram-gray-tint:#f1f5f9;--diagram-green-accent:#15803d;--diagram-green-ink:#052e16;--diagram-green-tint:#e7f8eb;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-on-accent:#ffffff;--diagram-secondary-stroke:#94a3b8;--diagram-title-ink:#172033;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-ink:#cae8ff;--diagram-blue-tint:#121d2f;--diagram-gray-accent:#9198a1;--diagram-gray-tint:#1c2128;--diagram-green-accent:#56d364;--diagram-green-ink:#d2f8d9;--diagram-green-tint:#12261e;--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-on-accent:#0d1117;--diagram-secondary-stroke:#6e7681;--diagram-title-ink:#e6edf3;}}</style>
    <marker id="diagram-head-e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-e2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-e3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">A Plan stands on its own, and reaches stories through its Tasks</tspan></text>
  </g>
  <g id="g-sides" data-diagram-kind="group" transform="translate(40 90)" role="group" aria-label="Three sides of the header">
    <title>Three sides of the header</title>
    <rect width="430" height="350" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1" style="fill:var(--diagram-gray-tint,#f1f5f9);stroke:var(--diagram-gray-accent,#475569)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H227.964A10 10 0 0 1 237.964 10V34.5Z" fill="#475569" style="fill:var(--diagram-gray-accent,#475569)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Three sides of the header</tspan></text>
    <g id="docs" data-diagram-kind="node" transform="translate(20 50)" role="group" aria-label="Documentation&#10;What is">
      <rect width="390" height="80" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="35" font-size="17" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="35">Documentation</tspan><tspan x="18" y="56.25">What is</tspan></text>
    </g>
    <g id="plans" data-diagram-kind="node" transform="translate(20 145)" role="group" aria-label="Plans&#10;What we will do">
      <rect width="390" height="80" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Plans</tspan><tspan x="18" y="56.25">What we will do</tspan></text>
    </g>
    <g id="reviews" data-diagram-kind="node" transform="translate(20 240)" role="group" aria-label="Reviews&#10;What we did">
      <rect width="390" height="80" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">Reviews</tspan><tspan x="18" y="56.25">What we did</tspan></text>
    </g>
  </g>
  <g id="g-links" data-diagram-kind="group" transform="translate(490 90)" role="group" aria-label="What links to what">
    <title>What links to what</title>
    <rect width="750" height="350" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="1" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H167.514A10 10 0 0 1 177.514 10V34.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">What links to what</tspan></text>
    <g id="n-plan" data-diagram-kind="node" transform="translate(20 60)" role="group" aria-label="Plan">
      <rect width="150" height="90" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Plan</tspan></text>
    </g>
    <g id="n-task" data-diagram-kind="node" transform="translate(200 60)" role="group" aria-label="Tasks">
      <rect width="150" height="90" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Tasks</tspan></text>
    </g>
    <g id="n-story" data-diagram-kind="node" transform="translate(380 60)" role="group" aria-label="Stories">
      <rect width="150" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="35" font-size="17" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="35">Stories</tspan></text>
    </g>
    <g id="n-feature" data-diagram-kind="node" transform="translate(560 60)" role="group" aria-label="Features">
      <rect width="150" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="35" font-size="17" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="35">Features</tspan></text>
    </g>
    <g id="links-note" data-diagram-kind="text" transform="translate(20 180)" role="group" aria-label="Only the first two links are authored. A story's Plans and a feature's Plans are read back from these, so they cannot drift. A Plan can cross features, and a feature can have several Plans.">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">Only the first two links are authored. A story's Plans and a feature's Plans are read back from</tspan><tspan x="0" y="36">these, so they cannot drift. A Plan can cross features, and a feature can have several Plans.</tspan></text>
    </g>
    <g id="git-note" data-diagram-kind="text" transform="translate(20 280)" role="group" aria-label="No revisions or events: Git is the history of a Plan.">
      <text x="0" y="18" font-size="18" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="18">No revisions or events: Git is the history of a Plan.</tspan></text>
    </g>
  </g>
  <g id="e1" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="n-plan to n-task" data-from="n-plan" data-to="n-task">
    <path d="M660 195 L690 195" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-e1)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="e2" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="n-task to n-story" data-from="n-task" data-to="n-story">
    <path d="M840 195 L870 195" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-e2)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="e3" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="n-story to n-feature" data-from="n-story" data-to="n-feature">
    <path d="M1020 195 L1050 195" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-e3)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="g-tasks" data-diagram-kind="group" transform="translate(40 470)" role="group" aria-label="Tasks in this phase">
    <title>Tasks in this phase</title>
    <rect width="1200" height="200" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="1" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H175.281A10 10 0 0 1 185.281 10V34.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Tasks in this phase</tspan></text>
    <g id="t-plan-record" data-diagram-kind="node" transform="translate(14 44)" role="group" aria-label="Add the Plan record&#10;One record and its loader">
      <rect width="384" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Add the Plan record</tspan><tspan x="18" y="51.75">One record and its loader</tspan></text>
    </g>
    <g id="t-plan-commands" data-diagram-kind="node" transform="translate(408 44)" role="group" aria-label="plan create, plan list&#10;Delivered Plans hidden by default">
      <rect width="384" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">plan create, plan list</tspan><tspan x="18" y="51.75">Delivered Plans hidden by default</tspan></text>
    </g>
    <g id="t-plans-section" data-diagram-kind="node" transform="translate(802 44)" role="group" aria-label="A Plans section&#10;Beside Documentation and Reviews">
      <rect width="384" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">A Plans section</tspan><tspan x="18" y="51.75">Beside Documentation and Reviews</tspan></text>
    </g>
  </g>
</svg>
