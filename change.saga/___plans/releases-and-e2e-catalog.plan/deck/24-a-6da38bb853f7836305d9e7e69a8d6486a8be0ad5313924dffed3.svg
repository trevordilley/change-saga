<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">Reader pages show what the CLI already knows</title>
  <desc id="diagram-desc">Each page renders data that earlier phases compute, so a page never holds logic of its own.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-tint:#e8f1ff;--diagram-green-accent:#15803d;--diagram-green-tint:#e7f8eb;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-on-accent:#ffffff;--diagram-primary-fill:#edf5ff;--diagram-primary-ink:#153869;--diagram-primary-stroke:#2563eb;--diagram-title-ink:#172033;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-tint:#121d2f;--diagram-green-accent:#56d364;--diagram-green-tint:#12261e;--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-on-accent:#0d1117;--diagram-primary-fill:#0c2d6b;--diagram-primary-ink:#cae8ff;--diagram-primary-stroke:#4493f8;--diagram-title-ink:#e6edf3;}}</style>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(40 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">Reader pages show what the CLI already knows</tspan></text>
  </g>
  <g id="g-r" data-diagram-kind="group" transform="translate(40 88)" role="group" aria-label="Releases">
    <rect width="1200" height="332" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 39.5V10A10 10 0 0 1 10 0H110.428A10 10 0 0 1 120.428 10V39.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="28" font-size="22" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="28">Releases</tspan></text>
  </g>
  <g id="t-release-list-page" data-diagram-kind="node" transform="translate(52 128)" role="group" aria-label="Show the list of releases">
    <rect width="1176" height="64" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">Show the list of releases</tspan></text>
  </g>
  <g id="t-release-page" data-diagram-kind="node" transform="translate(52 200)" role="group" aria-label="Show a release: stories, notes and checklist">
    <rect width="1176" height="64" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">Show a release: stories, notes and checklist</tspan></text>
  </g>
  <g id="t-template-page" data-diagram-kind="node" transform="translate(52 272)" role="group" aria-label="Show the template and versioning scheme">
    <rect width="1176" height="64" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">Show the template and versioning scheme</tspan></text>
  </g>
  <g id="t-prove-with-tests" data-diagram-kind="node" transform="translate(52 344)" role="group" aria-label="Record that the chosen tests were run">
    <rect width="1176" height="64" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">Record that the chosen tests were run</tspan></text>
  </g>
  <g id="g-e" data-diagram-kind="group" transform="translate(40 432)" role="group" aria-label="End-to-end tests">
    <rect width="1200" height="260" rx="10" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
    <path d="M0 39.5V10A10 10 0 0 1 10 0H193.676A10 10 0 0 1 203.676 10V39.5Z" fill="#15803d" style="fill:var(--diagram-green-accent,#15803d)"/>
    <text x="12" y="28" font-size="22" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="28">End-to-end tests</tspan></text>
  </g>
  <g id="t-qa-coverage-views" data-diagram-kind="node" transform="translate(52 472)" role="group" aria-label="Show kinds per entry and per criterion">
    <rect width="1176" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Show kinds per entry and per criterion</tspan></text>
  </g>
  <g id="t-qa-filters-page" data-diagram-kind="node" transform="translate(52 544)" role="group" aria-label="Filter the catalog in the reader">
    <rect width="1176" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Filter the catalog in the reader</tspan></text>
  </g>
  <g id="t-criterion-on-story" data-diagram-kind="node" transform="translate(52 616)" role="group" aria-label="Show a criterion's end-to-end tests on its story">
    <rect width="1176" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Show a criterion's end-to-end tests on its story</tspan></text>
  </g>
</svg>
