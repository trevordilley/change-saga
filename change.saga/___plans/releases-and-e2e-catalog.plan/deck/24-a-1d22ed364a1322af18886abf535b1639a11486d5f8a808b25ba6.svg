<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">What the tests prove, and how to run them</title>
  <desc id="diagram-desc">Tests print in a form a runner accepts, and the measures people asked for are computed from existing records.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-green-accent:#15803d;--diagram-green-tint:#e7f8eb;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-on-accent:#ffffff;--diagram-title-ink:#172033;}@media (prefers-color-scheme:dark){:root{--diagram-green-accent:#56d364;--diagram-green-tint:#12261e;--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-on-accent:#0d1117;--diagram-title-ink:#e6edf3;}}</style>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(40 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">What the tests prove, and how to run them</tspan></text>
  </g>
  <g id="g-e" data-diagram-kind="group" transform="translate(40 112)" role="group" aria-label="End-to-end tests">
    <rect width="840" height="580" rx="10" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
    <path d="M0 39.5V10A10 10 0 0 1 10 0H193.676A10 10 0 0 1 203.676 10V39.5Z" fill="#15803d" style="fill:var(--diagram-green-accent,#15803d)"/>
    <text x="12" y="28" font-size="22" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="28">End-to-end tests</tspan></text>
  </g>
  <g id="t-runnable-formats" data-diagram-kind="node" transform="translate(60 162)" role="group" aria-label="Runnable output">
    <rect width="800" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Runnable output</tspan></text>
  </g>
  <g id="t-kinds-data" data-diagram-kind="node" transform="translate(60 266)" role="group" aria-label="Kinds per criterion">
    <rect width="800" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Kinds per criterion</tspan></text>
  </g>
  <g id="t-criteria-coverage-data" data-diagram-kind="node" transform="translate(60 370)" role="group" aria-label="Criterion to test">
    <rect width="800" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Criterion to test</tspan></text>
  </g>
  <g id="t-one-entry-reports" data-diagram-kind="node" transform="translate(60 474)" role="group" aria-label="Entry reports">
    <rect width="800" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Entry reports</tspan></text>
  </g>
  <g id="t-uncatalogued" data-diagram-kind="node" transform="translate(60 578)" role="group" aria-label="Uncatalogued tests">
    <rect width="800" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Uncatalogued tests</tspan></text>
  </g>
</svg>
