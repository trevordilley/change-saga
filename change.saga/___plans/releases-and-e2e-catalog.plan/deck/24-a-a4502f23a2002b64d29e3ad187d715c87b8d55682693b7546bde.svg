<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">Notes and links say what a release means</title>
  <desc id="diagram-desc">Internal and public notes, story links, a milestone and a range each get a small command.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-tint:#e8f1ff;--diagram-on-accent:#ffffff;--diagram-primary-fill:#edf5ff;--diagram-primary-ink:#153869;--diagram-primary-stroke:#2563eb;--diagram-title-ink:#172033;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-tint:#121d2f;--diagram-on-accent:#0d1117;--diagram-primary-fill:#0c2d6b;--diagram-primary-ink:#cae8ff;--diagram-primary-stroke:#4493f8;--diagram-title-ink:#e6edf3;}}</style>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(40 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">Notes and links say what a release means</tspan></text>
  </g>
  <g id="g-r" data-diagram-kind="group" transform="translate(40 100)" role="group" aria-label="Releases">
    <rect width="1200" height="464" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 39.5V10A10 10 0 0 1 10 0H110.428A10 10 0 0 1 120.428 10V39.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="28" font-size="22" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="28">Releases</tspan></text>
  </g>
  <g id="t-internal-note-commands" data-diagram-kind="node" transform="translate(58 146)" role="group" aria-label="Add internal notes linked to stories">
    <rect width="1164" height="72" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">Add internal notes linked to stories</tspan></text>
  </g>
  <g id="t-public-note-commands" data-diagram-kind="node" transform="translate(58 228)" role="group" aria-label="Write public notes in any voice">
    <rect width="1164" height="72" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">Write public notes in any voice</tspan></text>
  </g>
  <g id="t-story-link-commands" data-diagram-kind="node" transform="translate(58 310)" role="group" aria-label="Link stories to a release as delivered or affected">
    <rect width="1164" height="72" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">Link stories to a release as delivered or affected</tspan></text>
  </g>
  <g id="t-milestone-link" data-diagram-kind="node" transform="translate(58 392)" role="group" aria-label="Place a release in a milestone">
    <rect width="1164" height="72" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">Place a release in a milestone</tspan></text>
  </g>
  <g id="t-release-range" data-diagram-kind="node" transform="translate(58 474)" role="group" aria-label="Record a release's Git range">
    <rect width="1164" height="72" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">Record a release's Git range</tspan></text>
  </g>
</svg>
