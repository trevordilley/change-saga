<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">A checkpoint is a phase</title>
  <desc id="diagram-desc">One new kind of phase, then commands that report, pass, and hold it, then what a reader sees.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-ink:#172554;--diagram-blue-tint:#e8f1ff;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-ink:#cae8ff;--diagram-blue-tint:#121d2f;}}</style>
  </defs>
  <g id="checkpoint-phase" data-diagram-kind="node" transform="translate(40 300)" role="group" aria-label="A checkpoint phase">
    <rect width="250" height="100" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="18" y="36" font-size="18" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="36">A checkpoint phase</tspan></text>
  </g>
  <g id="checkpoint-report" data-diagram-kind="node" transform="translate(350 80)" role="group" aria-label="Checkpoint report">
    <rect width="250" height="100" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="18" y="36" font-size="18" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="36">Checkpoint report</tspan></text>
  </g>
  <g id="pass-a-checkpoint" data-diagram-kind="node" transform="translate(350 230)" role="group" aria-label="Pass and merge">
    <rect width="250" height="100" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="18" y="36" font-size="18" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="36">Pass and merge</tspan></text>
  </g>
  <g id="hold-past-checkpoint" data-diagram-kind="node" transform="translate(350 380)" role="group" aria-label="Hold past it">
    <rect width="250" height="100" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="18" y="36" font-size="18" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="36">Hold past it</tspan></text>
  </g>
  <g id="board-by-checkpoint" data-diagram-kind="node" transform="translate(660 530)" role="group" aria-label="Board by checkpoint">
    <rect width="250" height="100" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="18" y="36" font-size="18" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="36">Board by checkpoint</tspan></text>
  </g>
  <g id="checkpoint-review-view" data-diagram-kind="node" transform="translate(660 80)" role="group" aria-label="Checkpoint review">
    <rect width="250" height="100" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="18" y="36" font-size="18" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="36">Checkpoint review</tspan></text>
  </g>
  <g id="plan-changes-since-pass" data-diagram-kind="node" transform="translate(660 230)" role="group" aria-label="Plan changes since">
    <rect width="250" height="100" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="18" y="36" font-size="18" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="36">Plan changes since</tspan></text>
  </g>
  <g id="checkpoint-guidance" data-diagram-kind="node" transform="translate(970 230)" role="group" aria-label="Guidance">
    <rect width="250" height="100" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="18" y="36" font-size="18" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="36">Guidance</tspan></text>
  </g>
  <g id="checkpoint-phase-to-checkpoint-report" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="checkpoint-phase to checkpoint-report" data-from="checkpoint-phase" data-to="checkpoint-report">
    <path d="M290 350 L350 130" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round" style="stroke:var(--diagram-blue-accent,#1d4ed8)"/>
  </g>
  <g id="checkpoint-phase-to-pass-a-checkpoint" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="checkpoint-phase to pass-a-checkpoint" data-from="checkpoint-phase" data-to="pass-a-checkpoint">
    <path d="M290 350 L350 280" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round" style="stroke:var(--diagram-blue-accent,#1d4ed8)"/>
  </g>
  <g id="checkpoint-phase-to-hold-past-checkpoint" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="checkpoint-phase to hold-past-checkpoint" data-from="checkpoint-phase" data-to="hold-past-checkpoint">
    <path d="M290 350 L350 430" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round" style="stroke:var(--diagram-blue-accent,#1d4ed8)"/>
  </g>
  <g id="checkpoint-phase-to-board-by-checkpoint" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="checkpoint-phase to board-by-checkpoint" data-from="checkpoint-phase" data-to="board-by-checkpoint">
    <path d="M290 350 L660 580" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round" style="stroke:var(--diagram-blue-accent,#1d4ed8)"/>
  </g>
  <g id="checkpoint-report-to-checkpoint-review-view" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="checkpoint-report to checkpoint-review-view" data-from="checkpoint-report" data-to="checkpoint-review-view">
    <path d="M600 130 L660 130" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round" style="stroke:var(--diagram-blue-accent,#1d4ed8)"/>
  </g>
  <g id="pass-a-checkpoint-to-plan-changes-since-pass" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="pass-a-checkpoint to plan-changes-since-pass" data-from="pass-a-checkpoint" data-to="plan-changes-since-pass">
    <path d="M600 280 L660 280" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round" style="stroke:var(--diagram-blue-accent,#1d4ed8)"/>
  </g>
  <g id="pass-a-checkpoint-to-checkpoint-guidance" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="pass-a-checkpoint to checkpoint-guidance" data-from="pass-a-checkpoint" data-to="checkpoint-guidance">
    <path d="M600 280 L970 280" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round" style="stroke:var(--diagram-blue-accent,#1d4ed8)"/>
  </g>
</svg>
