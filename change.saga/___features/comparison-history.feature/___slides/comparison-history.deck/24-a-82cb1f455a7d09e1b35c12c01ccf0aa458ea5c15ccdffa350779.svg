<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">A renamed Saga keeps its history</title>
  <desc id="diagram-desc">A Saga that moved keeps one lineage: readers of any past commit find it where it was, and a pure move revises nothing.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-primary-fill:#edf5ff;--diagram-primary-ink:#153869;--diagram-primary-stroke:#2563eb;--diagram-secondary-ink:#526174;--diagram-secondary-stroke:#94a3b8;--diagram-title-ink:#172033;}@media (prefers-color-scheme:dark){:root{--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-primary-fill:#0c2d6b;--diagram-primary-ink:#cae8ff;--diagram-primary-stroke:#4493f8;--diagram-secondary-ink:#9198a1;--diagram-secondary-stroke:#6e7681;--diagram-title-ink:#e6edf3;}}</style>
    <marker id="diagram-head-then-move" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-then-change" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-to-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-to-eras" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-path-used" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-moves-used" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 32)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">A renamed Saga keeps its history</tspan></text>
  </g>
  <g id="app-era" data-diagram-kind="node" transform="translate(60 105)" role="group" aria-label="app.saga era">
    <rect width="380" height="64" rx="8" fill="none" stroke="#94a3b8" stroke-width="2" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="18" y="36" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="18" y="36">app.saga era</tspan></text>
  </g>
  <g id="move" data-diagram-kind="node" transform="translate(490 105)" role="group" aria-label="Move commit">
    <rect width="260" height="64" rx="8" fill="none" stroke="#94a3b8" stroke-width="2" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="18" y="36" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="18" y="36">Move commit</tspan></text>
  </g>
  <g id="change-era" data-diagram-kind="node" transform="translate(800 105)" role="group" aria-label="change.saga era">
    <rect width="430" height="64" rx="8" fill="none" stroke="#94a3b8" stroke-width="2" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="18" y="36" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="18" y="36">change.saga era</tspan></text>
  </g>
  <g id="then-move" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="app-era to move" data-from="app-era" data-to="move">
    <path d="M440 137 L490 137" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-then-move)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="then-change" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="move to change-era" data-from="move" data-to="change-era">
    <path d="M750 137 L800 137" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-then-change)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="lineage-of" data-diagram-kind="node" transform="translate(60 220)" role="group" aria-label="sagalineage.Of">
    <rect width="300" height="240" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">sagalineage.Of</tspan></text>
    <text x="18" y="73" font-size="15" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="73">verified moves and birth, cached per</tspan><tspan x="18" y="91.75">repository, path and head</tspan></text>
  </g>
  <g id="path-at-commit" data-diagram-kind="node" transform="translate(450 220)" role="group" aria-label="PathAt(commit)">
    <rect width="360" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">PathAt(commit)</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">where the Saga was, or not yet born</tspan></text>
  </g>
  <g id="eras-history" data-diagram-kind="node" transform="translate(450 360)" role="group" aria-label="Eras">
    <rect width="360" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Eras</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">one commit range per path</tspan></text>
  </g>
  <g id="saved-view-renamed" data-diagram-kind="node" transform="translate(900 220)" role="group" aria-label="Saved views">
    <rect width="330" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Saved views</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">read where the Saga was then</tspan></text>
  </g>
  <g id="move-reasons" data-diagram-kind="node" transform="translate(900 360)" role="group" aria-label="Change reasons">
    <rect width="330" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Change reasons</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">a pure move revises nothing</tspan></text>
  </g>
  <g id="to-path" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="lineage-of to path-at-commit" data-from="lineage-of" data-to="path-at-commit">
    <path d="M360 270 L450 270" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-to-path)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="to-eras" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="lineage-of to eras-history" data-from="lineage-of" data-to="eras-history">
    <path d="M360 410 L450 410" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-to-eras)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="path-used" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="path-at-commit to saved-view-renamed" data-from="path-at-commit" data-to="saved-view-renamed">
    <path d="M810 270 L900 270" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-path-used)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="moves-used" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="eras-history to move-reasons" data-from="eras-history" data-to="move-reasons">
    <path d="M810 410 L900 410" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-moves-used)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="init-change-saga" data-diagram-kind="node" transform="translate(60 520)" role="group" aria-label="init creates change.saga, named after the repository it records">
    <rect width="1170" height="80" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">init creates change.saga, named after the repository it records</tspan></text>
  </g>
  <g id="same-saga" data-diagram-kind="text" transform="translate(60 628)" aria-hidden="true">
    <text x="0" y="15" font-size="15" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="0" y="15">A move is followed only when the manifest id is unchanged and most files arrive byte for byte; a reused name is not the same Saga.</tspan></text>
  </g>
</svg>
