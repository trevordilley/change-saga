<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12213a"/></linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#94a3b8"/></marker>
    <style>.title{font:700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}.eyebrow{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fb7185;letter-spacing:2px}.h{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}.b{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}.small{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}.take{font:600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#dbeafe}</style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text class="eyebrow" x="70" y="52">FAILURE BOUNDARIES · IMPLEMENTED VS MISSING</text>
  <text class="title" x="70" y="96">Storage truth is hard; execution truth is caller-asserted</text>

  <g id="strict-loader">
    <rect x="62" y="156" width="332" height="318" rx="24" fill="#10293a" stroke="#41d3bd" stroke-width="2"/>
    <text class="small" x="88" y="190">IMPLEMENTED · INPUT BOUNDARY</text>
    <path d="M104 235 h66 l14 16 v77 h-80z" fill="#41d3bd" opacity=".16" stroke="#41d3bd"/>
    <path d="M170 235 v17 h14" fill="none" stroke="#41d3bd"/>
    <text class="h" x="205" y="260">Strict loader</text>
    <text class="b" x="88" y="359">✓ rejects symlinks and unknown entries</text>
    <text class="b" x="88" y="389">✓ rejects unknown fields, null, oversize</text>
    <text class="b" x="88" y="419">✓ validates bounded acyclic graphs</text>
    <text class="b" x="88" y="449">✓ writes atomically with rollback</text>
  </g>

  <g id="recorded-run">
    <rect x="474" y="186" width="332" height="258" rx="24" fill="#251d42" stroke="#8b5cf6" stroke-width="2"/>
    <text class="small" x="500" y="220">IMPLEMENTED · RECORD BOUNDARY</text>
    <text class="h" x="500" y="263">Run record</text>
    <text class="b" x="500" y="298">result: passed</text>
    <text class="b" x="500" y="326">command: go test ./...</text>
    <text class="b" x="500" y="354">source.commit: 7fa399…</text>
    <text class="b" x="500" y="382">evidence: current heads</text>
    <path d="M405 315 H464" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>
  </g>

  <g id="execution-gap">
    <rect x="886" y="146" width="332" height="148" rx="24" fill="#3a1822" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text class="small" x="912" y="180">MISSING · EXECUTION BOUNDARY</text>
    <text class="h" x="912" y="212">No command execution</text>
    <text class="h" x="912" y="234">or output capture</text>
    <text class="b" x="912" y="268">The CLI records the caller’s claimed result.</text>
    <path d="M817 246 H876" stroke="#fb7185" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  </g>

  <g id="commit-freshness-gap">
    <rect x="886" y="322" width="332" height="148" rx="24" fill="#3a1822" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text class="small" x="912" y="356">MISSING · SOURCE CURRENCY</text>
    <text class="h" x="912" y="388">No run-commit vs</text>
    <text class="h" x="912" y="410">observed-HEAD check</text>
    <text class="b" x="912" y="438">Syntax and repository are checked;</text>
    <text class="b" x="912" y="461">commit freshness is not projected.</text>
    <path d="M817 392 H876" stroke="#fb7185" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  </g>

  <g id="readiness-consequence">
    <path d="M640 444 V520 H1052 V480" fill="none" stroke="#f5b942" stroke-width="3" marker-end="url(#arr)"/>
    <rect x="302" y="520" width="676" height="92" rx="20" fill="#3a2b16" stroke="#f5b942" stroke-width="2"/>
    <text class="small" x="329" y="550">CONSEQUENCE</text>
    <text class="h" x="329" y="578">A caller-supplied “passed” run can satisfy quality</text>
    <text class="h" x="329" y="601">when all implemented pins are current.</text>
  </g>

  <line x1="70" y1="640" x2="1210" y2="640" stroke="#334155"/>
  <text class="take" x="70" y="680">The deck marks these as absent behavior: no executor and no observed-HEAD freshness gate exist today.</text>
</svg>
