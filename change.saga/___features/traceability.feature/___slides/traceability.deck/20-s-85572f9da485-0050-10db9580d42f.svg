<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Traceability delivery readiness boundary</title>
  <desc id="desc">A pipeline showing that accepted criteria, design, implementation slides, and commit-pinned code exist, while work items and immutable delivery evidence are absent, so delivered remains false.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#334155"/></marker></defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="58" y="62" font-family="system-ui" font-size="36" font-weight="750" fill="#0f172a">Source exists; the delivery chain is still open</text>
  <text x="58" y="96" font-family="system-ui" font-size="18" fill="#475569">Current Saga observation: all six traceability criteria lack work items and immutable delivery evidence.</text>

  <g id="accepted-criteria">
    <circle cx="130" cy="300" r="82" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="130" y="279" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="750" fill="#1e3a8a">6 accepted</text>
    <text x="130" y="307" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="750" fill="#1e3a8a">criteria</text>
    <text x="130" y="339" text-anchor="middle" font-family="system-ui" font-size="14" fill="#1e40af">3 confirmed stories</text>
  </g>

  <g id="design-present">
    <rect x="285" y="230" width="190" height="140" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="380" y="275" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="750" fill="#4c1d95">Design</text>
    <text x="380" y="307" text-anchor="middle" font-family="system-ui" font-size="17" fill="#6d28d9">present</text>
    <text x="380" y="338" text-anchor="middle" font-family="system-ui" font-size="14" fill="#7e22ce">pinned-graph-design</text>
    <path d="M212 300H272" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g id="implementation-present">
    <rect x="535" y="205" width="230" height="190" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="650" y="242" text-anchor="middle" font-family="system-ui" font-size="17" font-weight="750" fill="#14532d">Implementation evidence</text>
    <text x="650" y="276" text-anchor="middle" font-family="system-ui" font-size="16" fill="#166534">runtime source + tests</text>
    <text x="650" y="310" text-anchor="middle" font-family="system-ui" font-size="16" fill="#166534">commit-pinned Items</text>
    <text x="650" y="344" text-anchor="middle" font-family="system-ui" font-size="14" fill="#15803d">query paths are inspectable</text>
    <path d="M475 300H522" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g id="work-item-gap">
    <rect x="835" y="180" width="190" height="150" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4" stroke-dasharray="10 7"/>
    <text x="930" y="225" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#9a3412">WORK ITEM</text>
    <text x="930" y="259" text-anchor="middle" font-family="system-ui" font-size="18" fill="#c2410c">MISSING</text>
    <text x="930" y="294" text-anchor="middle" font-family="ui-monospace" font-size="14" fill="#c2410c">planned = false</text>
    <path d="M765 275H822" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g id="delivery-evidence-gap">
    <rect x="835" y="385" width="190" height="150" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 7"/>
    <text x="930" y="429" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="800" fill="#991b1b">IMMUTABLE</text>
    <text x="930" y="458" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="800" fill="#991b1b">EVIDENCE MISSING</text>
    <text x="930" y="496" text-anchor="middle" font-family="ui-monospace" font-size="14" fill="#b91c1c">progress != proof</text>
    <path d="M765 325C800 325 800 460 822 460" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g id="not-delivered">
    <circle cx="1150" cy="355" r="92" fill="#0f172a" stroke="#dc2626" stroke-width="5"/>
    <text x="1150" y="337" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#fca5a5">DELIVERED</text>
    <text x="1150" y="375" text-anchor="middle" font-family="ui-monospace" font-size="27" font-weight="800" fill="#f8fafc">false</text>
    <text x="1150" y="405" text-anchor="middle" font-family="system-ui" font-size="14" fill="#cbd5e1">readiness contract</text>
    <path d="M1025 255C1085 255 1075 310 1065 325" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1025 460C1085 460 1075 405 1065 390" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <rect x="92" y="575" width="1096" height="78" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="640" y="607" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="750" fill="#164e63">This is not a claim that runtime code is absent.</text>
  <text x="640" y="636" text-anchor="middle" font-family="system-ui" font-size="16" fill="#155e75">It is an explicit gap in planning and immutable delivery proof; this task does not create those records.</text>
</svg>
