<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Reverse impact ownership and failure boundaries</title>
  <desc id="desc">An ownership flow from incoming code atoms through pinned evidence owners and persisted relations to affected requirements and tests, with separate branches for contextual additions, unowned content, and incomplete baselines.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#334155"/></marker></defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="58" y="62" font-family="system-ui" font-size="36" font-weight="750" fill="#0f172a">Reverse impact follows ownership, not filenames</text>
  <text x="58" y="96" font-family="system-ui" font-size="18" fill="#475569">Old-line intersections are authoritative; nearby additions are advisory; unowned atoms stay visibly unclaimed.</text>

  <g font-family="system-ui" font-size="14" font-weight="700" fill="#475569">
    <text x="145" y="145" text-anchor="middle">SOURCE CHANGE</text>
    <text x="445" y="145" text-anchor="middle">EVIDENCE OWNERSHIP</text>
    <text x="755" y="145" text-anchor="middle">PERSISTED GRAPH</text>
    <text x="1080" y="145" text-anchor="middle">REVIEW OUTPUT</text>
  </g>
  <path d="M290 128V638M600 128V638M915 128V638" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/>

  <g id="incoming-atoms">
    <rect x="45" y="190" width="210" height="150" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="150" y="230" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="750" fill="#1e3a8a">Incoming atoms</text>
    <text x="150" y="265" text-anchor="middle" font-family="ui-monospace" font-size="15" fill="#1e40af">old line / new line</text>
    <text x="150" y="292" text-anchor="middle" font-family="ui-monospace" font-size="15" fill="#1e40af">rename / add event</text>
    <text x="150" y="320" text-anchor="middle" font-family="system-ui" font-size="14" fill="#2563eb">content is not inferred</text>
  </g>

  <g id="pinned-index">
    <rect x="335" y="190" width="220" height="150" rx="22" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="445" y="230" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="750" fill="#312e81">Resolved pin index</text>
    <text x="445" y="265" text-anchor="middle" font-family="system-ui" font-size="15" fill="#4338ca">Item + landmark owners</text>
    <text x="445" y="292" text-anchor="middle" font-family="system-ui" font-size="15" fill="#4338ca">test-case evidence owners</text>
    <text x="445" y="320" text-anchor="middle" font-family="system-ui" font-size="14" fill="#6366f1">at incoming base commit</text>
    <path d="M255 265H322" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g id="direct-intersection">
    <rect x="330" y="395" width="230" height="100" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="445" y="432" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="750" fill="#991b1b">Direct intersection</text>
    <text x="445" y="463" text-anchor="middle" font-family="ui-monospace" font-size="15" fill="#b91c1c">must_update</text>
    <path d="M445 340V382" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g id="contextual-addition">
    <rect x="45" y="395" width="210" height="100" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="150" y="432" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="750" fill="#78350f">Nearby new line</text>
    <text x="150" y="463" text-anchor="middle" font-family="ui-monospace" font-size="15" fill="#92400e">consider_update</text>
    <path d="M150 340C150 370 150 382 150 382" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M255 445H285V520H875V455" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g id="graph-projection">
    <rect x="645" y="190" width="220" height="305" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="755" y="230" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="750" fill="#4c1d95">Recorded edges only</text>
    <text x="755" y="272" text-anchor="middle" font-family="ui-monospace" font-size="15" fill="#6d28d9">addresses / explains</text>
    <text x="755" y="303" text-anchor="middle" font-family="ui-monospace" font-size="15" fill="#6d28d9">verifies</text>
    <path d="M685 336H825" stroke="#a78bfa" stroke-width="3"/>
    <text x="755" y="375" text-anchor="middle" font-family="system-ui" font-size="15" fill="#6b21a8">deck/slide descendants</text>
    <text x="755" y="404" text-anchor="middle" font-family="system-ui" font-size="15" fill="#6b21a8">expand to their Items</text>
    <text x="755" y="452" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="650" fill="#581c87">No path-name inference</text>
    <path d="M560 445C602 445 603 343 632 343" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g id="affected-output">
    <rect x="965" y="190" width="265" height="305" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="1097" y="230" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="750" fill="#14532d">Affected records</text>
    <text x="1097" y="275" text-anchor="middle" font-family="system-ui" font-size="17" fill="#166534">requirements + criteria</text>
    <text x="1097" y="309" text-anchor="middle" font-family="system-ui" font-size="17" fill="#166534">test cases + evidence</text>
    <text x="1097" y="343" text-anchor="middle" font-family="system-ui" font-size="17" fill="#166534">must / consider update</text>
    <path d="M1015 375H1180" stroke="#86efac" stroke-width="3"/>
    <text x="1097" y="414" text-anchor="middle" font-family="system-ui" font-size="15" fill="#15803d">each result retains its</text>
    <text x="1097" y="440" text-anchor="middle" font-family="system-ui" font-size="15" fill="#15803d">exact route and changes</text>
    <path d="M865 343H952" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g id="incomplete-boundary">
    <rect x="45" y="555" width="1185" height="95" rx="20" fill="#0f172a"/>
    <text x="78" y="591" font-family="system-ui" font-size="19" font-weight="750" fill="#f8fafc">Failure boundaries stay explicit</text>
    <text x="78" y="623" font-family="system-ui" font-size="16" fill="#fca5a5">Unowned atoms → new_content</text>
    <text x="405" y="623" font-family="system-ui" font-size="16" fill="#fde68a">Incomplete baseline → diagnostic; results may omit impact</text>
    <text x="955" y="623" font-family="system-ui" font-size="16" fill="#c4b5fd">Stale pins → no owner</text>
  </g>
</svg>
