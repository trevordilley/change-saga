<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#f6f8fa"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#245d8c"/></marker></defs>
<text x="60" y="55" font-family="Arial,sans-serif" font-size="18" fill="#486173">TECHNICAL INVENTORY · IMPLEMENTATION</text>
<text x="60" y="111" font-family="Arial,sans-serif" font-size="38" fill="#142638">History preserves the version you explained</text>
<text x="60" y="157" font-family="Arial,sans-serif" font-size="21" fill="#486173">Append revisions and lifecycle events; keep every head explicit and retain saved pins.</text>
<g id="read"><rect x="60" y="235" width="330" height="130" rx="10" fill="white" stroke="#245d8c" stroke-width="2"/>
<text x="78" y="271" font-family="Arial,sans-serif" font-size="25" fill="#245d8c">Load bounded records</text>
<text x="78" y="308" font-family="Arial,sans-serif" font-size="20" fill="#142638">Strict JSON and real files</text>
<text x="78" y="341" font-family="Arial,sans-serif" font-size="18" fill="#486173">Identity + immutable history</text>
<path d="M390 300H850" fill="none" stroke="#245d8c" stroke-width="3" marker-end="url(#arrow)"/>
</g>
<g id="append"><rect x="850" y="235" width="330" height="130" rx="10" fill="white" stroke="#245d8c" stroke-width="2"/>
<text x="868" y="271" font-family="Arial,sans-serif" font-size="25" fill="#245d8c">Append under lock</text>
<text x="868" y="308" font-family="Arial,sans-serif" font-size="20" fill="#142638">Atomic creation; exact retries</text>
<text x="868" y="341" font-family="Arial,sans-serif" font-size="18" fill="#486173">Explicit observed parents</text>
<path d="M1015 365V410H225V455" fill="none" stroke="#245d8c" stroke-width="3" marker-end="url(#arrow)"/>
</g>
<g id="heads"><rect x="60" y="455" width="330" height="130" rx="10" fill="white" stroke="#245d8c" stroke-width="2"/>
<text x="78" y="491" font-family="Arial,sans-serif" font-size="25" fill="#245d8c">Resolve current heads</text>
<text x="78" y="528" font-family="Arial,sans-serif" font-size="20" fill="#142638">One head: current definition</text>
<text x="78" y="561" font-family="Arial,sans-serif" font-size="18" fill="#486173">Multiple heads: visible conflict</text>
</g>
<g id="lifecycle"><rect x="850" y="455" width="330" height="130" rx="10" fill="white" stroke="#245d8c" stroke-width="2"/>
<text x="868" y="491" font-family="Arial,sans-serif" font-size="25" fill="#245d8c">Active ↔ retired</text>
<text x="868" y="528" font-family="Arial,sans-serif" font-size="20" fill="#142638">Reason + parent event required</text>
<text x="868" y="561" font-family="Arial,sans-serif" font-size="18" fill="#486173">Definitions remain readable</text>
<path d="M850 520H390" fill="none" stroke="#245d8c" stroke-width="3" marker-end="url(#arrow)"/>
</g>
<text x="445" y="406" font-family="Arial,sans-serif" font-size="21" fill="#486173">immutable history</text>
<text x="60" y="683" font-family="Arial,sans-serif" font-size="20" fill="#486173">Saved definitions never silently repin slides or approve reviews.</text>
</svg>