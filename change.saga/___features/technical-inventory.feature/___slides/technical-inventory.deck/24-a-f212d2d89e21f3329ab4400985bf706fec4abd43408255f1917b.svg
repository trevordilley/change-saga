<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Selective entities, owned edges, authored ERD</title><desc id="desc">Resources hold data; edges carry their own meaning and intent; the ERD is a view.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306687"/></marker><marker id="warnarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a4b0f"/></marker></defs><rect width="1280" height="720" fill="#f1f5f8"/><g font-family="Arial,sans-serif"><text x="50" y="48" font-size="17" fill="#47647a">TECHNICAL INVENTORY / RECORDS IMPLEMENTATION</text><text x="50" y="97" font-size="34" fill="#20384b">Selective entities, owned edges, authored ERD</text><text x="50" y="132" font-size="20" fill="#20384b">Resources hold data; edges carry their own meaning and intent; the ERD is a view.</text><g id="holder-queue"><rect x="50" y="175" width="250" height="95" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="68" y="203" font-size="15" fill="#47647a">COMPONENT (HOLDER)</text><text x="68" y="233" font-size="18" fill="#20384b">Job queue r1</text></g><g id="holder-store"><rect x="50" y="390" width="250" height="95" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="68" y="418" font-size="15" fill="#47647a">COMPONENT (HOLDER)</text><text x="68" y="448" font-size="18" fill="#20384b">Record store r3</text></g><g id="job"><rect x="380" y="160" width="330" height="125" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5" stroke-dasharray="7 5"/><text x="398" y="188" font-size="15" fill="#47647a">DATA ENTITY · PROPOSED</text><text x="398" y="218" font-size="18" fill="#20384b">PDF job</text><text x="398" y="243" font-size="18" fill="#20384b">fields: id (primary), template</text></g><g id="entity"><rect x="380" y="375" width="330" height="125" rx="10" fill="#e3f1e5" stroke="#306687" stroke-width="1.5"/><text x="398" y="403" font-size="15" fill="#2f6b3a">DATA ENTITY · IMPLEMENTED</text><text x="398" y="433" font-size="18" fill="#20384b">PDF report</text><text x="398" y="458" font-size="18" fill="#20384b">id (primary), JobID (foreign)</text></g><path d="M300 222L376 222" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="304" y="212" font-size="15" fill="#47647a">holds</text><path d="M300 437L376 437" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="304" y="427" font-size="15" fill="#47647a">holds</text><g id="relationship"><path d="M545 371L545 290" stroke="#8a4b0f" stroke-width="2.5" fill="none" marker-end="url(#warnarrow)" stroke-dasharray="8 6"/><rect x="560" y="310" width="150" height="46" rx="6" fill="#fbeedd"/><text x="570" y="330" font-size="13" fill="#8a4b0f">production · proposed</text><text x="570" y="348" font-size="13" fill="#8a4b0f">"rendered from", no FK</text></g><g id="erd"><rect x="790" y="160" width="440" height="175" rx="10" fill="#dce8f0" stroke="#306687" stroke-width="1.5"/><text x="808" y="188" font-size="15" fill="#47647a">ERD ROOT (NO INTENT)</text><text x="808" y="218" font-size="17" fill="#20384b">offline SVG at assets/&lt;sha256&gt;.svg</text><text x="808" y="242" font-size="17" fill="#20384b">directory: data-entity pins</text><text x="808" y="266" font-size="17" fill="#20384b">bindings: element id → entity or</text><text x="808" y="290" font-size="17" fill="#20384b">relationship; visual ⊆ directory</text></g><g id="overlay"><rect x="790" y="360" width="440" height="140" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5" stroke-dasharray="7 5"/><text x="808" y="388" font-size="15" fill="#47647a">ERD OVERLAY</text><text x="808" y="418" font-size="17" fill="#20384b">exact ERD revision + feature</text><text x="808" y="442" font-size="17" fill="#20384b">pins replace or add; removals</text><text x="808" y="466" font-size="17" fill="#20384b">propose; ERD never rewritten</text></g><path d="M1010 360L1010 339" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g id="data-tests"><rect x="50" y="540" width="1180" height="150" rx="10" fill="#e3f1e5" stroke="#306687" stroke-width="1.5"/><text x="68" y="568" font-size="15" fill="#2f6b3a">TESTS</text><text x="68" y="598" font-size="17" fill="#20384b">implemented edge to a proposed entity refused; the same entity with a proposed edge is accepted</text><text x="68" y="622" font-size="17" fill="#20384b">holder pin to a missing revision refused; binding outside the directory refused; unsafe SVG refused</text><text x="68" y="646" font-size="17" fill="#20384b">overlay composition substitutes and removes pins while the canonical ERD directory is unchanged</text></g></g></svg>