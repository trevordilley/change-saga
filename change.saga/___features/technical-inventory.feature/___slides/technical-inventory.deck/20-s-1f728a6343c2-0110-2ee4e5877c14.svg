<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Model identity, pin intent</title><desc id="desc">Proposed data-entity contract: a stable identity owns immutable revisions. Each revision describes selected fields and keys, pins its storage resource and related entities, and is reused by diagram and directory bindings.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#245d8c"/></marker></defs>
<rect width="1280" height="720" fill="#f6f8fa"/><g font-family="Arial,sans-serif" fill="#142638">
<text x="60" y="52" font-size="18" fill="#925b14">TECHNICAL INVENTORY · PROPOSED DESIGN / 7</text>
<text x="60" y="110" font-size="40">Model identity, pin intent</text><text x="60" y="153" font-size="22" fill="#486173">One canonical entity; shared revision rules for Systems, Components and data.</text><g id="identity"><rect x="60" y="210" width="260" height="120" rx="10" fill="#fff6e8" stroke="#a56615" stroke-width="2" stroke-dasharray="8 5"/><text x="80" y="240" font-size="16" fill="#925b14">STABLE IDENTITY</text><text x="80" y="276" font-size="24">Data entity</text><text x="80" y="309" font-size="19">Not a feature-local copy</text></g><g id="revision"><rect x="415" y="210" width="410" height="335" rx="10" fill="#fff6e8" stroke="#a56615" stroke-width="2" stroke-dasharray="8 5"/><text x="435" y="240" font-size="16" fill="#925b14">IMMUTABLE REVISION</text><text x="435" y="276" font-size="24">Intent + selected structure</text><text x="435" y="309" font-size="19">Parents + explicit baseline pin</text><text x="435" y="338" font-size="19">Proposed / implemented</text><text x="435" y="367" font-size="19">Purpose; meaningful fields + keys</text><text x="435" y="396" font-size="19">Scoped code: optional if proposed</text><text x="435" y="425" font-size="19">Outgoing relationship definitions</text></g><g id="resource"><rect x="920" y="210" width="300" height="150" rx="10" fill="#fff6e8" stroke="#a56615" stroke-width="2" stroke-dasharray="8 5"/><text x="940" y="240" font-size="16" fill="#925b14">PINNED COMPONENT</text><text x="940" y="276" font-size="24">Holding resource</text><text x="940" y="309" font-size="19">Queue, database, object store</text><text x="940" y="338" font-size="19">Separate from the data itself</text></g><g id="relationship"><rect x="920" y="420" width="300" height="150" rx="10" fill="#fff6e8" stroke="#a56615" stroke-width="2" stroke-dasharray="8 5"/><text x="940" y="450" font-size="16" fill="#925b14">OWNED RELATIONSHIP</text><text x="940" y="486" font-size="24">Entity @ saved revision</text><text x="940" y="519" font-size="19">Stable edge ID + meaning</text><text x="940" y="548" font-size="19">Cardinality / explicit unknown</text></g><g id="bindings"><rect x="60" y="420" width="260" height="150" rx="10" fill="#fff6e8" stroke="#a56615" stroke-width="2" stroke-dasharray="8 5"/><text x="80" y="450" font-size="16" fill="#925b14">SAVED REVISION PINS</text><text x="80" y="486" font-size="24">Diagram + directory</text><text x="80" y="519" font-size="19">Open the same definition</text><text x="80" y="548" font-size="19">Deck Items reuse identity</text></g><g id="links" fill="none" stroke="#245d8c" stroke-width="2"><path d="M320 270H415" marker-end="url(#arrow)"/><path d="M825 280H920" marker-end="url(#arrow)"/><path d="M825 495H920" marker-end="url(#arrow)"/><path d="M320 490H415" marker-end="url(#arrow)"/><g stroke="none" fill="#486173"><text x="338" y="254" font-size="16">owns</text><text x="334" y="474" font-size="16">pin</text></g></g><g id="foundation"><rect x="60" y="612" width="1160" height="88" rx="10" fill="#e6eef5"/><text x="80" y="646" font-size="21">Existing foundation: immutable definitions and revision-pinned links.</text><text x="80" y="677" font-size="19">Extension only: phase, data structure, resources and relationship meaning are not implemented yet.</text></g></g></svg>
