<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Adoption is explicit, history is untouched</title><desc id="desc">One marker gates every new structure; legacy revisions are read, never rewritten.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306687"/></marker><marker id="warnarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a4b0f"/></marker></defs><rect width="1280" height="720" fill="#f1f5f8"/><g font-family="Arial,sans-serif"><text x="50" y="48" font-size="17" fill="#47647a">TECHNICAL INVENTORY / RECORDS IMPLEMENTATION</text><text x="50" y="97" font-size="34" fill="#20384b">Adoption is explicit, history is untouched</text><text x="50" y="132" font-size="20" fill="#20384b">One marker gates every new structure; legacy revisions are read, never rewritten.</text><g id="legacy"><rect x="50" y="170" width="340" height="190" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="68" y="198" font-size="15" fill="#47647a">EXISTING V5 RECORDS (FORMAT 1)</text><text x="68" y="228" font-size="19" fill="#20384b">Component/System revisions</text><text x="68" y="254" font-size="19" fill="#20384b">unchanged bytes, no evidence IDs</text><text x="68" y="280" font-size="19" fill="#20384b">read intent: unspecified</text><text x="68" y="306" font-size="19" fill="#20384b">(never inferred)</text></g><g id="marker"><rect x="470" y="170" width="340" height="190" rx="10" fill="#dce8f0" stroke="#306687" stroke-width="1.5"/><text x="488" y="198" font-size="15" fill="#47647a">EXPLICIT ADOPTION</text><text x="488" y="228" font-size="19" fill="#20384b">inventory adopt-format --format 2</text><text x="488" y="254" font-size="19" fill="#20384b">writes ___inventory/format.json</text><text x="488" y="280" font-size="19" fill="#20384b">rewrites no record</text><text x="488" y="306" font-size="19" fill="#20384b">saga.json stays version 5</text></g><g id="format-two"><rect x="890" y="170" width="340" height="190" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="908" y="198" font-size="15" fill="#47647a">FORMAT 2 CONTENT</text><text x="908" y="228" font-size="19" fill="#20384b">intent, baseline, delivery</text><text x="908" y="254" font-size="19" fill="#20384b">evidence ids, data entities,</text><text x="908" y="280" font-size="19" fill="#20384b">ERDs, overlays, Item</text><text x="908" y="306" font-size="19" fill="#20384b">selections + saved views</text></g><path d="M390 265L466 265" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M810 265L886 265" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g id="loader"><rect x="50" y="400" width="760" height="150" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="68" y="428" font-size="15" fill="#47647a">CURRENT READER: LoadInventory</text><text x="68" y="458" font-size="18" fill="#20384b">reads format 1 and 2; refuses format-2 records or Item fields without</text><text x="68" y="483" font-size="18" fill="#20384b">the marker, unknown markers (format 3) and unknown directories;</text><text x="68" y="508" font-size="18" fill="#20384b">after adoption every new Component/System revision states intent</text></g><g id="older"><rect x="890" y="400" width="340" height="150" rx="10" fill="#fbeedd" stroke="#306687" stroke-width="1.5"/><text x="908" y="428" font-size="15" fill="#8a4b0f">OLDER CHANGE-SAGA</text><text x="908" y="458" font-size="18" fill="#20384b">rejects the marker, new dirs</text><text x="908" y="483" font-size="18" fill="#20384b">and Item fields: it refuses,</text><text x="908" y="508" font-size="18" fill="#20384b">it does not drop content</text></g><g id="refusal-tests"><rect x="50" y="590" width="1180" height="100" rx="10" fill="#e3f1e5" stroke="#306687" stroke-width="1.5"/><text x="68" y="618" font-size="15" fill="#2f6b3a">TESTS</text><text x="68" y="648" font-size="18" fill="#20384b">legacy stays unspecified before and after adoption; intent or entities without the marker refuse; format 3 and unknown dirs refuse</text></g></g></svg>