<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Show the data story, not every field</title><desc id="desc">Illustrative PDF domain, not Change Saga's own data. A PDF generation job carried by a queue produces a report stored in a database. Only meaningful fields are selected. A logical transformation is not a foreign-key relationship; cardinality is unspecified. Entity definitions lead to implementation slides and exact code.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#925b14"/></marker></defs>
<rect width="1280" height="720" fill="#f6f8fa"/>
<g font-family="Arial,sans-serif" fill="#142638">
<text x="60" y="52" font-size="18" fill="#925b14">TECHNICAL INVENTORY · PROPOSED DESIGN / 2</text>
<text x="60" y="110" font-size="40">Show the data story, not every field</text>
<g id="authored-scope"><text x="60" y="153" font-size="22" fill="#486173">Author chooses the entities, meaningful fields and composition. No schema dump.</text><text x="60" y="191" font-size="18" fill="#925b14">ILLUSTRATIVE PDF DOMAIN · not an implemented Change Saga feature</text></g>
<g id="queue"><rect x="60" y="230" width="360" height="286" rx="14" fill="#e9f0f6" stroke="#9ab0c3"/><text x="80" y="267" font-size="20">RESOURCE · PDF generation queue</text></g>
<g id="job"><rect x="80" y="287" width="320" height="206" fill="white" stroke="#245d8c" stroke-width="2"/><path d="M80 340H400" stroke="#245d8c"/><text x="100" y="321" font-size="25">PDFGenerationJob</text><text x="100" y="373" font-size="20">jobId · identity</text><text x="100" y="408" font-size="20">reportId · correlation</text><text x="100" y="443" font-size="20">inputLocation</text><text x="100" y="476" font-size="16" fill="#486173">Logical JSON payload</text></g>
<g id="database"><rect x="860" y="230" width="360" height="286" rx="14" fill="#e9f0f6" stroke="#9ab0c3"/><text x="880" y="267" font-size="20">RESOURCE · Reporting database</text></g>
<g id="report"><rect x="880" y="287" width="320" height="206" fill="white" stroke="#245d8c" stroke-width="2"/><path d="M880 340H1200" stroke="#245d8c"/><text x="900" y="321" font-size="25">PDFReport</text><text x="900" y="373" font-size="20">reportId · identity</text><text x="900" y="408" font-size="20">outputLocation</text><text x="900" y="443" font-size="20">status</text><text x="900" y="476" font-size="16" fill="#486173">Persisted record</text></g>
<g id="transformation"><path d="M420 358H860" fill="none" stroke="#925b14" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/><text x="640" y="321" text-anchor="middle" font-size="22">produces</text><text x="640" y="400" text-anchor="middle" font-size="19" fill="#925b14">Logical transformation, not an FK</text><text x="640" y="433" text-anchor="middle" font-size="18" fill="#486173">Cardinality not specified in this example</text></g>
<g id="drill-down"><path d="M240 516V558H1040V516" fill="none" stroke="#476079" stroke-width="2"/><path d="M640 558V584" stroke="#476079" stroke-width="2"/><rect x="60" y="584" width="1160" height="80" rx="10" fill="white" stroke="#9ab0c3"/><text x="85" y="617" font-size="22">Select an entity → canonical definition → implementation slides + exact code</text><text x="85" y="646" font-size="18" fill="#486173">The expandable entity directory opens the same definitions. Slides explain feature-specific detail.</text></g>
</g></svg>
