<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Select a path, not the whole system</title><desc id="desc">Proposed evidence selection begins at a slide Item, follows a pinned System and Component, and narrows one existing code reference. Other System members and unselected source lines contribute nothing to this Item's coverage.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#245d8c"/></marker></defs>
<rect width="1280" height="720" fill="#f6f8fa"/>
<g font-family="Arial,sans-serif" fill="#142638">
<text x="60" y="52" font-size="18" fill="#925b14">TECHNICAL INVENTORY · PROPOSED DESIGN / 4</text>
<text x="60" y="110" font-size="40">Select a path, not the whole system</text>
<text x="60" y="153" font-size="22" fill="#486173">Real inventory example; selection and inherited coverage are proposed capabilities.</text>
<g id="item"><rect x="60" y="235" width="265" height="138" rx="10" fill="#fff6e8" stroke="#a56615" stroke-dasharray="8 5" stroke-width="2"/><text x="80" y="269" font-size="17" fill="#925b14">PROPOSED SELECTION</text><text x="80" y="308" font-size="24">“Write an entity”</text><text x="80" y="344" font-size="19">Pinned path + code subset</text></g>
<g id="system"><rect x="415" y="235" width="320" height="138" rx="10" fill="white" stroke="#245d8c" stroke-width="2"/><text x="435" y="269" font-size="17" fill="#245d8c">EXISTING SYSTEM · r1</text><text x="435" y="308" font-size="24">Technical documentation</text><text x="435" y="344" font-size="19">Pinned member definitions</text></g>
<g id="store"><rect x="825" y="235" width="395" height="138" rx="10" fill="white" stroke="#245d8c" stroke-width="2"/><text x="845" y="269" font-size="17" fill="#245d8c">EXISTING COMPONENT · r1</text><text x="845" y="308" font-size="24">Technical record store</text><text x="845" y="344" font-size="19">One chosen member; not all members</text></g>
<g id="path" fill="none" stroke="#245d8c" stroke-width="2"><path d="M325 300H415" marker-end="url(#arrow)"/><path d="M735 300H825" marker-end="url(#arrow)"/><path d="M1022 373V442" marker-end="url(#arrow)"/><g stroke="none" fill="#142638"><text x="341" y="288" font-size="16">pins</text><text x="747" y="288" font-size="16">selects</text><text x="1040" y="420" font-size="17">selects evidence</text></g></g>
<g id="excluded"><path d="M575 373V400H390V455H350" fill="none" stroke="#8896a4" stroke-width="2" stroke-dasharray="5 5"/><rect x="60" y="411" width="290" height="160" rx="10" fill="#edf0f3" stroke="#9aa8b5"/><text x="80" y="445" font-size="17" fill="#486173">UNSELECTED MEMBERS</text><text x="80" y="480" font-size="21">Author · query · drawer</text><text x="80" y="515" font-size="20">Still discoverable</text><text x="80" y="546" font-size="20">Zero coverage from this Item</text></g>
<g id="subset"><rect x="510" y="442" width="710" height="167" rx="10" fill="white" stroke="#245d8c" stroke-width="2"/><text x="530" y="475" font-size="20">inventory_mutation.go · pinned at fcd342210cd4</text><text x="530" y="507" font-size="18" fill="#486173">Entity reference: lines 14–96 · proposed selection: lines 14–40</text><rect x="530" y="530" width="214" height="42" fill="#dcecf8" stroke="#245d8c"/><rect x="744" y="530" width="456" height="42" fill="#edf0f3" stroke="#9aa8b5"/><text x="637" y="557" text-anchor="middle" font-size="19">14–40 selected</text><text x="972" y="557" text-anchor="middle" font-size="19" fill="#486173">41–96 excluded</text><text x="530" y="594" font-size="17">The selected bytes have their own digest; scope never expands silently.</text></g>
<g id="provenance"><text x="60" y="660" font-size="21">Coverage explains: Item → System revision → Component revision → selected source.</text><text x="60" y="692" font-size="18" fill="#486173">Reuse canonical evidence. Store the selection, not a second independent claim to all of the entity's code.</text></g>
</g></svg>
