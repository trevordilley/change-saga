<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Inventory coverage of a named code scope</title><desc id="desc">Which tracked code the current definitions account for, and what they do not.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306687"/></marker></defs><rect width="1280" height="720" fill="#f1f5f8"/><g font-family="Arial,sans-serif"><text x="50" y="48" font-size="16" fill="#47647a" font-weight="normal" text-anchor="start">TECHNICAL INVENTORY / IMPLEMENTED COVERAGE</text><text x="50" y="94" font-size="34" fill="#20384b" font-weight="bold" text-anchor="start">Inventory coverage of a named code scope</text><text x="50" y="128" font-size="19" fill="#20384b" font-weight="normal" text-anchor="start">Which tracked code the current definitions account for, and what they do not.</text><g id="scope"><rect x="50" y="160" width="330" height="170" rx="10" fill="#dce8f0" stroke="#9fb7c8" stroke-width="1.5"/><text x="64" y="188" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Named scope</text><text x="64" y="214" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">head commit + --path prefixes</text><text x="64" y="236" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">tracked text files only;</text><text x="64" y="258" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">Saga dirs excluded,</text><text x="64" y="280" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">binary files counted</text></g><path d="M380 245L450 245" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g id="owners"><rect x="450" y="160" width="400" height="170" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="464" y="188" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Current active definitions</text><text x="464" y="214" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">unique current revision only</text><text x="464" y="236" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">entity + interaction + relationship</text><text x="464" y="258" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">evidence resolved at head</text><text x="464" y="280" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">each line once, every owner kept</text></g><path d="M850 245L920 245" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g><rect x="920" y="160" width="310" height="170" rx="10" fill="#e6f3ea" stroke="#6aa57b" stroke-width="1.5"/><text x="934" y="188" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Covered / uncovered</text><text x="934" y="214" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">ranges with owners</text><text x="934" y="236" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">overlap counted separately</text></g><g id="health"><rect x="50" y="400" width="800" height="200" rx="10" fill="#fbeee6" stroke="#c98b63" stroke-width="1.5"/><text x="64" y="428" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Separate pages, never coverage</text><text x="64" y="454" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">stale references: resolution reason, no lines</text><text x="64" y="476" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">unresolved owners: competing heads</text><text x="64" y="498" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">excluded owners: retired or proposed revision</text><text x="64" y="520" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">proposed interaction / relationship evidence: counted apart</text></g><g id="denominators"><rect x="920" y="400" width="310" height="200" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="934" y="428" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Distinct denominators</text><text x="934" y="454" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">inventory coverage</text><text x="934" y="476" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">!= implementation deck</text><text x="934" y="498" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">!= pull-request review</text><text x="934" y="520" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">covered != correct</text></g></g></svg>