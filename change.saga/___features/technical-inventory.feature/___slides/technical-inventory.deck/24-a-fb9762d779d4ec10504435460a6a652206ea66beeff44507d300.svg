<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Exact selections inherit only selected lines</title><desc id="desc">A documentation pin transfers nothing; an eligible selection transfers exactly its subset.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306687"/></marker></defs><rect width="1280" height="720" fill="#f1f5f8"/><g font-family="Arial,sans-serif"><text x="50" y="48" font-size="16" fill="#47647a" font-weight="normal" text-anchor="start">TECHNICAL INVENTORY / IMPLEMENTED COVERAGE</text><text x="50" y="94" font-size="34" fill="#20384b" font-weight="bold" text-anchor="start">Exact selections inherit only selected lines</text><text x="50" y="128" font-size="19" fill="#20384b" font-weight="normal" text-anchor="start">A documentation pin transfers nothing; an eligible selection transfers exactly its subset.</text><g id="path"><rect x="50" y="160" width="560" height="150" rx="10" fill="#dce8f0" stroke="#9fb7c8" stroke-width="1.5"/><text x="64" y="188" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Saved selection path</text><text x="64" y="214" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">Item pin System:r1 -&gt; member Component:r3</text><text x="64" y="236" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">-&gt; evidence "get" lines 8-11</text><text x="64" y="258" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">-&gt; selected lines 9-10 (own digest)</text><text x="64" y="280" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">structure checked by the records resolver</text></g><path d="M610 235L690 235" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g id="eligible"><rect x="690" y="160" width="540" height="150" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="704" y="188" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Eligible at head?</text><text x="704" y="214" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">structure resolves, every pin current,</text><text x="704" y="236" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">selected bytes current</text><text x="704" y="258" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">else: contributes nothing, stays visible</text></g><path d="M960 310L960 380" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g id="labeled"><rect x="690" y="380" width="540" height="150" rx="10" fill="#e6f3ea" stroke="#6aa57b" stroke-width="1.5"/><text x="704" y="408" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Inherited deck coverage</text><text x="704" y="434" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">lines 9-10 owned by the Item, labeled</text><text x="704" y="456" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">with selection + path; no evidence file;</text><text x="704" y="478" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">lines 8 and 11 earn nothing</text></g><g id="drift"><rect x="50" y="380" width="560" height="250" rx="10" fill="#fbeee6" stroke="#c98b63" stroke-width="1.5"/><text x="64" y="408" font-size="19" fill="#20384b" font-weight="bold" text-anchor="start">Separate health</text><text x="64" y="434" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">edit line 8 (outside subset):</text><text x="64" y="456" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">  selected bytes current, containing</text><text x="64" y="478" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">  evidence stale -&gt; reassess meaning</text><text x="64" y="500" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">edit line 10 (inside subset):</text><text x="64" y="522" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">  selected bytes stale -&gt; no coverage,</text><text x="64" y="544" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">  repair through the Item</text><text x="64" y="566" font-size="15" fill="#536b7d" font-weight="normal" text-anchor="start">review Items never inherit</text></g></g></svg>