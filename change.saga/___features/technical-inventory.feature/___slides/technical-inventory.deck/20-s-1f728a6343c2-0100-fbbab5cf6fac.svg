<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Reassess the affected explanation</title><desc id="desc">A proposed inventory-aware reconciliation queue traces code changes through entity evidence to exact slide selections. Selected byte changes need evidence repair; changes outside the subset can require semantic reassessment without automatically invalidating selected bytes. Authors inspect, revise deliberately and check again. Review decisions are untouched.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#476079"/></marker></defs>
<rect width="1280" height="720" fill="#f6f8fa"/>
<g font-family="Arial,sans-serif" fill="#142638">
<text x="60" y="52" font-size="18" fill="#925b14">TECHNICAL INVENTORY · PROPOSED DESIGN / 6</text>
<text x="60" y="110" font-size="40">Reassess the affected explanation</text>
<text x="60" y="153" font-size="22" fill="#486173">Inventory-aware impact is proposed. Affected does not automatically mean stale or wrong.</text>
<g id="change"><rect x="60" y="219" width="285" height="112" rx="10" fill="white" stroke="#245d8c" stroke-width="2"/><text x="80" y="253" font-size="24">Code changes</text><text x="80" y="286" font-size="19">Named base → head</text><text x="80" y="313" font-size="17">Retain baseline debt</text></g>
<g id="reverse-path"><rect x="460" y="219" width="760" height="112" rx="10" fill="#fff6e8" stroke="#a56615" stroke-width="2" stroke-dasharray="8 5"/><text x="480" y="253" font-size="24">Source → entity → selected Item → feature</text><text x="480" y="286" font-size="19">Proposed: return exact owners, selected ranges and reasons.</text><text x="480" y="313" font-size="17">Undeclared dependencies stay unknown.</text></g>
<g id="selected-change"><rect x="60" y="393" width="490" height="124" rx="10" fill="#fff0ee" stroke="#a15348" stroke-width="2"/><text x="80" y="429" font-size="24">Selected bytes changed or disappeared</text><text x="80" y="465" font-size="20">Show stale evidence + affected Item</text><text x="80" y="497" font-size="19">No current credit for that selection</text></g>
<g id="outside-change"><rect x="665" y="393" width="555" height="124" rx="10" fill="#fff6e8" stroke="#a56615" stroke-width="2"/><text x="685" y="429" font-size="24">Entity changed outside the selected subset</text><text x="685" y="465" font-size="20">Selected bytes may remain current</text><text x="685" y="497" font-size="19">Still inspect changed meaning and definition pins</text></g>
<g id="routing" fill="none" stroke="#476079" stroke-width="2"><path d="M345 275H460" marker-end="url(#arrow)"/><path d="M840 331V359H305V393" marker-end="url(#arrow)"/><path d="M840 359H942V393" marker-end="url(#arrow)"/><path d="M305 517V550H942V517"/><path d="M610 550V577" marker-end="url(#arrow)"/></g>
<g id="repair"><rect x="60" y="577" width="1160" height="68" rx="10" fill="white" stroke="#245d8c" stroke-width="2"/><text x="80" y="606" font-size="22">Inspect meaning → revise definition / selection / explanation only as needed → recheck</text><text x="80" y="632" font-size="17">Append history. Never bulk-repin, mark reviewed, or approve merely because the report is clean.</text></g>
<g id="existing-queue"><text x="60" y="687" font-size="19" fill="#486173">Extend today's read-only queue: reasons + typed inspection/repair paths, with currency separate from review coverage.</text></g>
</g></svg>
