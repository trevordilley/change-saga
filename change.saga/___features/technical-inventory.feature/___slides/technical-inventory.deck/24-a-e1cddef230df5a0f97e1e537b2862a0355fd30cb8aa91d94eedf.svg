<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Items select exact code through saved pins</title><desc id="desc">A path of saved revisions and a stable evidence ID; no newer revision, no wider range.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306687"/></marker><marker id="warnarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a4b0f"/></marker></defs><rect width="1280" height="720" fill="#f1f5f8"/><g font-family="Arial,sans-serif"><text x="50" y="48" font-size="17" fill="#47647a">TECHNICAL INVENTORY / RECORDS IMPLEMENTATION</text><text x="50" y="97" font-size="34" fill="#20384b">Items select exact code through saved pins</text><text x="50" y="132" font-size="20" fill="#20384b">A path of saved revisions and a stable evidence ID; no newer revision, no wider range.</text><g id="item"><rect x="50" y="170" width="230" height="120" rx="10" fill="#dce8f0" stroke="#306687" stroke-width="1.5"/><text x="68" y="198" font-size="15" fill="#47647a">REVIEW OR DECK ITEM</text><text x="68" y="228" font-size="18" fill="#20384b">documentation:</text><text x="68" y="253" font-size="18" fill="#20384b">Storage r1</text></g><g id="path"><g id="hop-system"><rect x="330" y="170" width="230" height="120" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="348" y="198" font-size="15" fill="#47647a">HOP 0 · SYSTEM</text><text x="348" y="228" font-size="18" fill="#20384b">Storage r1</text><text x="348" y="253" font-size="18" fill="#20384b">members pinned</text></g><g id="hop-component"><rect x="610" y="170" width="230" height="120" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="628" y="198" font-size="15" fill="#47647a">HOP 1 · COMPONENT</text><text x="628" y="228" font-size="18" fill="#20384b">store r1</text><text x="628" y="253" font-size="18" fill="#20384b">(declared by r1)</text></g><path d="M280 230L326 230" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M560 230L606 230" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/></g><g id="authoring"><rect x="890" y="170" width="340" height="120" rx="10" fill="#e3f1e5" stroke="#306687" stroke-width="1.5"/><text x="908" y="198" font-size="15" fill="#2f6b3a">EVIDENCE id "table" L2–3</text><text x="908" y="228" font-size="18" fill="#20384b">selected L3 only; digest</text><text x="908" y="253" font-size="18" fill="#20384b">of the selected bytes</text></g><path d="M840 230L886 230" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g id="view"><rect x="50" y="330" width="560" height="160" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="68" y="358" font-size="15" fill="#47647a">HISTORICAL PIN NEEDS A SAVED VIEW</text><text x="68" y="388" font-size="17" fill="#20384b">--documentation-view &lt;commit&gt;: the Saga at that</text><text x="68" y="412" font-size="17" fill="#20384b">commit binds store r1 as its active current revision</text><text x="68" y="436" font-size="17" fill="#20384b">refusals: mismatched_view_binding, view_commit_</text><text x="68" y="460" font-size="17" fill="#20384b">unavailable, view_saga_missing (companion repo)</text></g><g id="retention"><rect x="650" y="330" width="580" height="160" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="668" y="358" font-size="15" fill="#47647a">OLD PINS SURVIVE SUCCESSION</text><text x="668" y="388" font-size="17" fill="#20384b">store r2 is published later: the Item still pins</text><text x="668" y="412" font-size="17" fill="#20384b">Storage r1 → store r1; unchanged pins, views and</text><text x="668" y="436" font-size="17" fill="#20384b">selections are retained, never repinned; a newer</text><text x="668" y="460" font-size="17" fill="#20384b">revision is never substituted in a path</text></g><g id="selection-tests"><rect x="50" y="530" width="1180" height="160" rx="10" fill="#e3f1e5" stroke="#306687" stroke-width="1.5"/><text x="68" y="558" font-size="15" fill="#2f6b3a">TESTS</text><text x="68" y="588" font-size="17" fill="#20384b">each refusal is named: outside_evidence, missing_evidence, missing_pin, undeclared_hop, selected_digest_mismatch</text><text x="68" y="612" font-size="17" fill="#20384b">review and implementation Items and apply-slide persist exact commits and digests; transaction retries replay</text><text x="68" y="636" font-size="17" fill="#20384b">saved-view admission records the full commit; validate errors if a selection stops resolving</text></g></g></svg>