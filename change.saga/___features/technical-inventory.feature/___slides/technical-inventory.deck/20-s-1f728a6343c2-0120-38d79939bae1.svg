<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Query a bounded roadmap</title><desc id="desc">Proposed query flow fixes scope and source comparison, filters independent proposal and newness axes, and returns a snapshot-bound page. Details and reverse uses expand on demand; a derived index is not authoritative.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#245d8c"/></marker></defs>
<rect width="1280" height="720" fill="#f6f8fa"/><g font-family="Arial,sans-serif" fill="#142638">
<text x="60" y="52" font-size="18" fill="#925b14">TECHNICAL INVENTORY · PROPOSED DESIGN / 8</text>
<text x="60" y="110" font-size="40">Query a bounded roadmap</text><text x="60" y="153" font-size="22" fill="#486173">Find reusable definitions and remaining work without loading the whole source graph.</text><g id="scope"><rect x="60" y="220" width="255" height="205" rx="10" fill="#fff6e8" stroke="#a56615" stroke-width="2" stroke-dasharray="8 5"/><text x="80" y="250" font-size="16" fill="#925b14">1 · FIX CONTEXT</text><text x="80" y="286" font-size="24">Scope + source view</text><text x="80" y="319" font-size="19">Feature / design links</text><text x="80" y="348" font-size="19">Selected revision pins</text><text x="80" y="377" font-size="19">Base + head for newness</text></g><g id="filters"><rect x="365" y="220" width="255" height="205" rx="10" fill="#fff6e8" stroke="#a56615" stroke-width="2" stroke-dasharray="8 5"/><text x="385" y="250" font-size="16" fill="#925b14">2 · INDEPENDENT FILTERS</text><text x="385" y="286" font-size="24">Proposed ≠ new</text><text x="385" y="319" font-size="19">Phase of selected revision</text><text x="385" y="348" font-size="19">Absent at named baseline</text><text x="385" y="377" font-size="19">Conflicts stay visible</text></g><g id="page"><rect x="670" y="220" width="255" height="205" rx="10" fill="#fff6e8" stroke="#a56615" stroke-width="2" stroke-dasharray="8 5"/><text x="690" y="250" font-size="16" fill="#925b14">3 · BOUNDED RESULT</text><text x="690" y="286" font-size="24">One stable page</text><text x="690" y="319" font-size="19">Identity + phase + health</text><text x="690" y="348" font-size="19">Scope + completeness</text><text x="690" y="377" font-size="19">Cursor bound to snapshot</text></g><g id="detail"><rect x="975" y="220" width="245" height="205" rx="10" fill="#fff6e8" stroke="#a56615" stroke-width="2" stroke-dasharray="8 5"/><text x="995" y="250" font-size="16" fill="#925b14">4 · EXPLICIT EXPANSION</text><text x="995" y="286" font-size="24">Exact details</text><text x="995" y="319" font-size="19">Code subsets + paths</text><text x="995" y="348" font-size="19">Incoming deck usages</text><text x="995" y="377" font-size="19">History and conflicts</text></g><g id="index"><rect x="60" y="488" width="565" height="112" rx="10" fill="#fff6e8" stroke="#a56615" stroke-width="2" stroke-dasharray="8 5"/><text x="80" y="518" font-size="16" fill="#925b14">DISPOSABLE REVERSE INDEX</text><text x="80" y="554" font-size="24">Snapshot + source view + query shape</text><text x="80" y="587" font-size="19">Rebuild on change; never reuse stale dependency facts.</text></g><g id="flow" fill="none" stroke="#245d8c" stroke-width="2"><path d="M315 320H365" marker-end="url(#arrow)"/><path d="M620 320H670" marker-end="url(#arrow)"/><path d="M925 320H975" marker-end="url(#arrow)"/><path d="M625 540H795V425" marker-end="url(#arrow)"/><text x="650" y="572" font-size="19" stroke="none" fill="#486173">Declared paths only; not text matches.</text></g><g id="foundation"><rect x="60" y="630" width="1160" height="70" rx="10" fill="#e6eef5"/><text x="80" y="660" font-size="21">Existing query: page first, resolve that page, reject a changed snapshot.</text><text x="80" y="687" font-size="18">Extend that boundary. New filters, data entities and reverse usage expansion are proposed.</text></g></g></svg>
