<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Propose a successor, not a duplicate</title><desc id="desc">One stable entity identity retains an implemented baseline, a proposed revision and a later evidence-backed implemented revision. The design deck remains pinned to its proposal and the delivered deck references the implemented revision. Neither implementation nor newness implies approval.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#476079"/></marker></defs>
<rect width="1280" height="720" fill="#f6f8fa"/>
<g font-family="Arial,sans-serif" fill="#142638">
<text x="60" y="52" font-size="18" fill="#925b14">TECHNICAL INVENTORY · PROPOSED DESIGN / 3</text>
<text x="60" y="110" font-size="40">Propose a successor, not a duplicate</text>
<text x="60" y="153" font-size="22" fill="#486173">A proposal changes a revision's intent; it does not erase the implemented baseline.</text>
<g id="identity"><rect x="60" y="218" width="1160" height="260" rx="14" fill="#e9f0f6" stroke="#9ab0c3"/><text x="80" y="251" font-size="21">ONE STABLE ENTITY ID · Component, System or data entity</text></g>
<g id="baseline"><rect x="85" y="290" width="285" height="150" rx="10" fill="white" stroke="#245d8c" stroke-width="2"/><text x="105" y="326" font-size="25">r1 · implemented</text><text x="105" y="366" font-size="20">Existing behavior</text><text x="105" y="403" font-size="20">Pinned code evidence</text></g>
<g id="proposal"><rect x="497" y="290" width="285" height="150" rx="10" fill="#fff6e8" stroke="#a56615" stroke-width="2" stroke-dasharray="8 5"/><text x="517" y="326" font-size="25">r2 · proposed</text><text x="517" y="366" font-size="20">Intended change</text><text x="517" y="403" font-size="20">New code not required</text></g>
<g id="implemented"><rect x="910" y="290" width="285" height="150" rx="10" fill="white" stroke="#245d8c" stroke-width="2"/><text x="930" y="326" font-size="25">r3 · implemented</text><text x="930" y="366" font-size="20">Explicit reconciliation</text><text x="930" y="403" font-size="20">Supporting exact code</text></g>
<g id="history"><path d="M370 361H497 M782 361H910" fill="none" stroke="#476079" stroke-width="2" marker-end="url(#arrow)"/><text x="395" y="347" font-size="16">propose</text><text x="798" y="347" font-size="16">implement</text><text x="80" y="467" font-size="17" fill="#486173">Append revisions; retain the original proposal and code pins. Do not silently update saved deck references.</text></g>
<g id="deck-pins"><rect x="420" y="538" width="330" height="68" rx="9" fill="#fff6e8" stroke="#a56615"/><text x="440" y="566" font-size="21">Design deck pins r2</text><text x="440" y="592" font-size="17">The plan remains inspectable</text><path d="M640 538V478" fill="none" stroke="#a56615" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="860" y="538" width="360" height="68" rx="9" fill="white" stroke="#245d8c"/><text x="880" y="566" font-size="21">Delivered deck pins r3</text><text x="880" y="592" font-size="17">Compare actual against the plan</text><path d="M1052 538V478" fill="none" stroke="#476079" stroke-width="2" marker-end="url(#arrow)"/></g>
<g id="independent-facts"><text x="60" y="658" font-size="21">“New” is relative to a named baseline. “Proposed” describes the selected revision.</text><text x="60" y="691" font-size="19" fill="#486173">Code currency, verification, integration and review approval remain separate facts.</text></g>
</g></svg>
