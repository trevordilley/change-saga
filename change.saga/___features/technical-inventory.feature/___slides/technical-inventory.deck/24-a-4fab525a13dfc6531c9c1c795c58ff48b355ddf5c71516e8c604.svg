<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Proposed and implemented share one identity</title><desc id="desc">Implementation is asserted at a delivery commit and validated before anything is written.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306687"/></marker><marker id="warnarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a4b0f"/></marker></defs><rect width="1280" height="720" fill="#f1f5f8"/><g font-family="Arial,sans-serif"><text x="50" y="48" font-size="17" fill="#47647a">TECHNICAL INVENTORY / RECORDS IMPLEMENTATION</text><text x="50" y="97" font-size="34" fill="#20384b">Proposed and implemented share one identity</text><text x="50" y="132" font-size="20" fill="#20384b">Implementation is asserted at a delivery commit and validated before anything is written.</text><g id="proposal"><rect x="50" y="175" width="330" height="175" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5" stroke-dasharray="7 5"/><text x="68" y="203" font-size="15" fill="#47647a">r1 PROPOSED (SAME IDENTITY)</text><text x="68" y="233" font-size="19" fill="#20384b">intent: proposed</text><text x="68" y="259" font-size="19" fill="#20384b">baseline: none (new)</text><text x="68" y="285" font-size="19" fill="#20384b">no code required</text><text x="68" y="311" font-size="19" fill="#20384b">r3 later: baseline = r2</text></g><g id="implemented"><rect x="900" y="175" width="330" height="175" rx="10" fill="#e3f1e5" stroke="#306687" stroke-width="1.5"/><text x="918" y="203" font-size="15" fill="#2f6b3a">r2 IMPLEMENTED</text><text x="918" y="233" font-size="19" fill="#20384b">delivery: {repository,</text><text x="918" y="259" font-size="19" fill="#20384b">  full commit OID}</text><text x="918" y="285" font-size="19" fill="#20384b">evidence ids: save …</text><text x="918" y="311" font-size="19" fill="#20384b">r1 kept in history</text></g><g id="delivery"><rect x="430" y="160" width="420" height="80" rx="10" fill="#dce8f0" stroke="#306687" stroke-width="1.5"/><text x="448" y="188" font-size="15" fill="#47647a">COMMAND BOUNDARY</text><text x="448" y="218" font-size="17" fill="#20384b">--delivery REV resolved once; repo must match</text></g><g id="policy"><rect x="430" y="252" width="420" height="118" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="448" y="280" font-size="15" fill="#47647a">technicalpolicy.ValidateCandidate</text><text x="448" y="310" font-size="16" fill="#20384b">original bytes at their commit, current at</text><text x="448" y="333" font-size="16" fill="#20384b">delivery; implemented edges need implemented</text><text x="448" y="356" font-size="16" fill="#20384b">endpoints; nothing cascades</text></g><path d="M380 262L426 262" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M850 262L896 262" stroke="#306687" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g id="publication"><rect x="430" y="385" width="420" height="115" rx="10" fill="#ffffff" stroke="#306687" stroke-width="1.5"/><text x="448" y="413" font-size="15" fill="#47647a">UNDER THE SAGA LOCK</text><text x="448" y="443" font-size="16" fill="#20384b">all current heads as parents; baseline is an</text><text x="448" y="466" font-size="16" fill="#20384b">implemented ancestor; identical retry replays;</text><text x="448" y="489" font-size="16" fill="#20384b">any refusal writes nothing</text></g><text x="900" y="390" font-size="17" fill="#20384b">Drift later = unhealthy evidence,</text><text x="900" y="414" font-size="17" fill="#20384b">never demoted to proposed.</text><text x="900" y="446" font-size="16" fill="#47647a">Intent is not verification</text><text x="900" y="468" font-size="16" fill="#47647a">or approval.</text><g id="lifecycle-test"><rect x="50" y="520" width="575" height="170" rx="10" fill="#e3f1e5" stroke="#306687" stroke-width="1.5"/><text x="68" y="548" font-size="15" fill="#2f6b3a">LIFECYCLE TEST (TEMP GIT)</text><text x="68" y="578" font-size="17" fill="#20384b">refused before adoption, no files</text><text x="68" y="602" font-size="17" fill="#20384b">code-free proposal → implemented at HEAD OID</text><text x="68" y="626" font-size="17" fill="#20384b">→ proposed successor; retry replays;</text><text x="68" y="650" font-size="17" fill="#20384b">stale baseline pin refused, current pinned</text></g><g id="policy-test"><rect x="655" y="520" width="575" height="170" rx="10" fill="#e3f1e5" stroke="#306687" stroke-width="1.5"/><text x="673" y="548" font-size="15" fill="#2f6b3a">EVIDENCE POLICY TEST</text><text x="673" y="578" font-size="17" fill="#20384b">pure movement accepted, reference unchanged</text><text x="673" y="602" font-size="17" fill="#20384b">edited bytes: stale_delivery_evidence, no writes</text><text x="673" y="626" font-size="17" fill="#20384b">forged digest and foreign repository refused</text><text x="673" y="650" font-size="17" fill="#20384b">implemented edge to proposed member refused</text></g></g></svg>