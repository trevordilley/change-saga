<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/1" aria-describedby="diagram-desc">
  <title id="diagram-title">Pages render from an in-memory Saga</title>
  <desc id="diagram-desc">Every request takes a shared stat-based freshness check; memoized Saga files, related reviews and the outline are rebuilt only when their digest changes.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}</style>
    <marker id="diagram-head-asks" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
    <marker id="diagram-head-polls" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
    <marker id="diagram-head-heads" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
    <marker id="diagram-head-keys-files" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
    <marker id="diagram-head-keys-related" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
    <marker id="diagram-head-keys-outline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 32)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve"><tspan x="0" y="34">Pages render from an in-memory Saga, checked per request</tspan></text>
  </g>
  <g id="request" data-diagram-kind="node" transform="translate(40 150)" role="group" aria-label="Request">
    <rect width="230" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">Request</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve"><tspan x="18" y="73">stamped on arrival</tspan></text>
  </g>
  <g id="background-watcher" data-diagram-kind="node" transform="translate(40 430)" role="group" aria-label="Watcher">
    <rect width="230" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">Watcher</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve"><tspan x="18" y="73">every 500 ms while</tspan><tspan x="18" y="91.75">reviewers are active</tspan></text>
  </g>
  <g id="freshness-check" data-diagram-kind="node" transform="translate(340 130)" role="group" aria-label="Shared freshness check">
    <rect width="400" height="150" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve"><tspan x="18" y="40">Shared freshness check</tspan></text>
    <text x="18" y="73" font-size="15" fill="#153869" xml:space="preserve"><tspan x="18" y="73">stat walk of the Saga, both HEADs read alongside</tspan></text>
  </g>
  <g id="git-head-reader" data-diagram-kind="node" transform="translate(340 340)" role="group" aria-label="headReader">
    <rect width="400" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">headReader</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve"><tspan x="18" y="73">HEAD from .git files, no git process</tspan></text>
  </g>
  <g id="saga-files-memo" data-diagram-kind="node" transform="translate(820 110)" role="group" aria-label="Saga files memo">
    <rect width="410" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">Saga files memo</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve"><tspan x="18" y="73">by documentation digest</tspan></text>
  </g>
  <g id="related-review-memo" data-diagram-kind="node" transform="translate(820 250)" role="group" aria-label="Related-review index">
    <rect width="410" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">Related-review index</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve"><tspan x="18" y="73">by files digest, source HEAD, attributes</tspan></text>
  </g>
  <g id="outline-scope" data-diagram-kind="node" transform="translate(820 390)" role="group" aria-label="Outline">
    <rect width="410" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">Outline</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve"><tspan x="18" y="73">shell pages skip code evidence and reviews</tspan></text>
  </g>
  <g id="asks" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="request to freshness-check" data-from="request" data-to="freshness-check">
    <path d="M270 195 L340 195" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-asks)"/>
  </g>
  <g id="polls" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="background-watcher to freshness-check" data-from="background-watcher" data-to="freshness-check">
    <path d="M270 485 L300 485 L300 250 L340 250" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-polls)"/>
  </g>
  <g id="heads" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="freshness-check to git-head-reader" data-from="freshness-check" data-to="git-head-reader">
    <path d="M540 280 L540 340" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-heads)"/>
  </g>
  <g id="keys-files" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="freshness-check to saga-files-memo" data-from="freshness-check" data-to="saga-files-memo">
    <path d="M740 165 L820 165" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-keys-files)"/>
  </g>
  <g id="keys-related" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="freshness-check to related-review-memo" data-from="freshness-check" data-to="related-review-memo">
    <path d="M740 225 L780 225 L780 305 L820 305" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-keys-related)"/>
  </g>
  <g id="keys-outline" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="freshness-check to outline-scope" data-from="freshness-check" data-to="outline-scope">
    <path d="M740 260 L760 260 L760 445 L820 445" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-keys-outline)"/>
  </g>
  <g id="writes" data-diagram-kind="text" transform="translate(60 600)" aria-hidden="true">
    <text x="0" y="15" font-size="15" fill="#526174" xml:space="preserve"><tspan x="0" y="15">Decisions and comments are written to disk; the next request's check sees them. Nothing is invalidated by hand.</tspan></text>
  </g>
</svg>
