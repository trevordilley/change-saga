<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Implemented work-plan surfaces and explicit gaps</title>
  <desc id="desc">Core mutations and read queries are implemented, but the plan CLI has no contract-state command and there is no explicit plan-status gate; progress alone is not delivery evidence.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#1f1834"/></linearGradient></defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="60" y="65" fill="#f8fafc" font-family="system-ui" font-size="34" font-weight="750">The shipped boundary is narrower than the domain</text>
  <text x="60" y="99" fill="#94a3b8" font-family="system-ui" font-size="18">Green is callable today. Red names a concrete missing public path.</text>
  <g id="core-writers" font-family="system-ui">
    <rect x="60" y="150" width="530" height="154" rx="26" fill="#0f2e32" stroke="#2dd4bf" stroke-width="2"/>
    <text x="94" y="191" fill="#5eead4" font-size="16" font-weight="800">IMPLEMENTED · CORE</text>
    <text x="94" y="229" fill="#ecfeff" font-size="23" font-weight="750">Append-only lifecycle writers</text>
    <text x="94" y="264" fill="#99f6e4" font-size="16">progress · workspace · merge · contract state</text>
  </g>
  <g id="query-surfaces" font-family="system-ui">
    <rect x="60" y="350" width="530" height="186" rx="26" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="94" y="391" fill="#7dd3fc" font-size="16" font-weight="800">IMPLEMENTED · READ API</text>
    <text x="94" y="429" fill="#e0f2fe" font-size="23" font-weight="750">Deterministic projections</text>
    <text x="94" y="464" fill="#bae6fd" font-size="16">waves · items · events · conflicts</text>
    <text x="94" y="492" fill="#bae6fd" font-size="16">traceability · readiness</text>
  </g>
  <g id="missing-contract-cli" font-family="system-ui">
    <rect x="690" y="150" width="530" height="154" rx="26" fill="#3b1d28" stroke="#fb7185" stroke-width="3"/>
    <text x="724" y="191" fill="#fb7185" font-size="16" font-weight="800">MISSING · PUBLIC MUTATION PATH</text>
    <text x="724" y="229" fill="#fff1f2" font-size="23" font-weight="750">No plan contract-state command</text>
    <text x="724" y="264" fill="#fecdd3" font-size="16">the core writer exists, but CLI dispatch omits it</text>
  </g>
  <g id="no-plan-status" font-family="system-ui">
    <rect x="690" y="350" width="530" height="186" rx="26" fill="#3b2b12" stroke="#fbbf24" stroke-width="2"/>
    <text x="724" y="391" fill="#fbbf24" font-size="16" font-weight="800">NOT A SHIPPED POLICY GATE</text>
    <text x="724" y="429" fill="#fffbeb" font-size="23" font-weight="750">No explicit plan-status command</text>
    <text x="724" y="464" fill="#fde68a" font-size="16">status may report diagnostics</text>
    <text x="724" y="492" fill="#fde68a" font-size="16">plan incompleteness does not change coverage</text>
  </g>
  <g id="delivery-boundary" font-family="system-ui">
    <rect x="60" y="590" width="1160" height="78" rx="22" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="98" y="638" fill="#f8fafc" font-size="20" font-weight="800">done ≠ delivered</text>
    <text x="295" y="638" fill="#cbd5e1" font-size="17">Progress is coordination state; readiness still requires immutable evidence.</text>
  </g>
</svg>
