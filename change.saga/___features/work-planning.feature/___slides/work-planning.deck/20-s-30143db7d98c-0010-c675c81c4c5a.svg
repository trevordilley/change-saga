<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Work-plan ownership architecture</title>
  <desc id="desc">CLI commands and query clients surround a transport-neutral work-plan core that loads feature-owned records into one app-wide graph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#13233a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="70" fill="#f8fafc" font-family="system-ui" font-size="34" font-weight="750">One graph, feature-owned records</text>
  <text x="64" y="106" fill="#94a3b8" font-family="system-ui" font-size="18">The core owns semantics; adapters own transport; features own durable packages.</text>
  <g id="cli-adapter" filter="url(#shadow)">
    <rect x="66" y="205" width="220" height="220" rx="26" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <path d="M105 250h62l20 20-20 20h-62l20-20Z" fill="#2563eb" opacity=".9"/>
    <text x="105" y="330" fill="#eff6ff" font-family="system-ui" font-size="25" font-weight="700">CLI adapter</text>
    <text x="105" y="365" fill="#bfdbfe" font-family="system-ui" font-size="16">parse flags</text>
    <text x="105" y="391" fill="#bfdbfe" font-family="system-ui" font-size="16">emit one result</text>
  </g>
  <g id="domain-core" filter="url(#shadow)">
    <rect x="390" y="154" width="500" height="338" rx="34" fill="#0f2e32" stroke="#2dd4bf" stroke-width="3"/>
    <text x="430" y="205" fill="#ccfbf1" font-family="system-ui" font-size="25" font-weight="750">internal/workplan</text>
    <text x="430" y="235" fill="#5eead4" font-family="system-ui" font-size="15">no CLI · query · server dependencies</text>
    <g fill="#134e4a" stroke="#2dd4bf">
      <rect x="430" y="275" width="176" height="72" rx="18"/><rect x="674" y="275" width="176" height="72" rx="18"/>
      <rect x="430" y="375" width="176" height="72" rx="18"/><rect x="674" y="375" width="176" height="72" rx="18"/>
    </g>
    <g fill="#ecfeff" font-family="system-ui" font-size="19" font-weight="650" text-anchor="middle">
      <text x="518" y="319">Waves</text><text x="762" y="319">Work items</text>
      <text x="518" y="419">Dependencies</text><text x="762" y="419">Contracts</text>
    </g>
  </g>
  <g id="query-projection" filter="url(#shadow)">
    <rect x="994" y="205" width="220" height="220" rx="26" fill="#3b1d28" stroke="#fb7185" stroke-width="2"/>
    <circle cx="1098" cy="269" r="31" fill="#be123c"/><path d="M1084 269l10 10 19-22" fill="none" stroke="#fff1f2" stroke-width="5"/>
    <text x="1032" y="330" fill="#fff1f2" font-family="system-ui" font-size="24" font-weight="700">Query projection</text>
    <text x="1032" y="365" fill="#fecdd3" font-family="system-ui" font-size="16">waves · items · events</text>
    <text x="1032" y="391" fill="#fecdd3" font-family="system-ui" font-size="16">conflicts · readiness</text>
  </g>
  <g id="ownership-flow" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)">
    <path d="M286 315H380"/><path d="M900 315H984"/>
  </g>
  <g id="feature-storage" filter="url(#shadow)">
    <rect x="238" y="565" width="804" height="100" rx="22" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="276" y="605" fill="#f8fafc" font-family="system-ui" font-size="20" font-weight="700">___features/&lt;feature&gt;.feature/___workplan/</text>
    <text x="276" y="636" fill="#cbd5e1" font-family="system-ui" font-size="16">separate packages merge locally; IDs remain app-wide and feature-free</text>
    <path d="M640 565V500" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
