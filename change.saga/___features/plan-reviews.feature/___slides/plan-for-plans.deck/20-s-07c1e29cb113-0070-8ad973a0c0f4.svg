<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">The review page, minus everything that needs a diff</title>
  <desc id="diagram-desc">A Plan opens on the existing review page. Surfaces that read a diff go away; a banner says nothing is built, and Roadmap and story pages link in.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-gray-accent:#475569;--diagram-gray-tint:#f1f5f9;--diagram-green-accent:#15803d;--diagram-green-ink:#052e16;--diagram-green-tint:#e7f8eb;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-on-accent:#ffffff;--diagram-title-ink:#172033;--diagram-yellow-accent:#a16207;--diagram-yellow-ink:#3f2d00;--diagram-yellow-tint:#fff8d6;}@media (prefers-color-scheme:dark){:root{--diagram-gray-accent:#9198a1;--diagram-gray-tint:#1c2128;--diagram-green-accent:#56d364;--diagram-green-ink:#d2f8d9;--diagram-green-tint:#12261e;--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-on-accent:#0d1117;--diagram-title-ink:#e6edf3;--diagram-yellow-accent:#e3b341;--diagram-yellow-ink:#fff5b1;--diagram-yellow-tint:#2b2508;}}</style>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">The review page, minus everything that needs a diff</tspan></text>
  </g>
  <g id="keep" data-diagram-kind="group" transform="translate(40 90)" role="group" aria-label="Reused as they are">
    <title>Reused as they are</title>
    <rect width="380" height="470" rx="10" fill="#e7f8eb" stroke="#15803d" stroke-width="1" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H176.484A10 10 0 0 1 186.484 10V34.5Z" fill="#15803d" style="fill:var(--diagram-green-accent,#15803d)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Reused as they are</tspan></text>
    <g id="k0" data-diagram-kind="node" transform="translate(14 44)" role="group" aria-label="GET /reviews/{id}&#10;The page, deck and Overview essay">
      <rect width="352" height="76" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="1" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="33" font-size="15" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="33">GET /reviews/{id}</tspan><tspan x="18" y="51.75">The page, deck and Overview essay</tspan></text>
    </g>
    <g id="k1" data-diagram-kind="node" transform="translate(14 127)" role="group" aria-label="GET /reviews/{id}/visual/{slide}&#10;Slide visuals">
      <rect width="352" height="76" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="1" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="33" font-size="15" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="33">GET /reviews/{id}/visual/{slide}</tspan><tspan x="18" y="51.75">Slide visuals</tspan></text>
    </g>
    <g id="k2" data-diagram-kind="node" transform="translate(14 210)" role="group" aria-label="GET /reviews/{id}/annotations&#10;Drawn comment marks">
      <rect width="352" height="76" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="1" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="33" font-size="15" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="33">GET /reviews/{id}/annotations</tspan><tspan x="18" y="51.75">Drawn comment marks</tspan></text>
    </g>
    <g id="k3" data-diagram-kind="node" transform="translate(14 293)" role="group" aria-label="GET /reviews/{id}/feedback&#10;Decisions and threads">
      <rect width="352" height="76" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="1" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="33" font-size="15" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="33">GET /reviews/{id}/feedback</tspan><tspan x="18" y="51.75">Decisions and threads</tspan></text>
    </g>
    <g id="k4" data-diagram-kind="node" transform="translate(14 376)" role="group" aria-label="POST /reviews/{id}/decision, /comment&#10;Recording them">
      <rect width="352" height="76" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="1" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="33" font-size="15" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="33">POST /reviews/{id}/decision, /comment</tspan><tspan x="18" y="51.75">Recording them</tspan></text>
    </g>
  </g>
  <g id="drop" data-diagram-kind="group" transform="translate(450 90)" role="group" aria-label="Absent for a Plan: nothing to diff">
    <title>Absent for a Plan: nothing to diff</title>
    <rect width="380" height="470" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1" style="fill:var(--diagram-gray-tint,#f1f5f9);stroke:var(--diagram-gray-accent,#475569)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H283.051A10 10 0 0 1 293.051 10V34.5Z" fill="#475569" style="fill:var(--diagram-gray-accent,#475569)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Absent for a Plan: nothing to diff</tspan></text>
    <g id="x0" data-diagram-kind="node" transform="translate(14 44)" role="group" aria-label="GET /reviews/{id}/coverage&#10;No changed lines to account for">
      <rect width="352" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">GET /reviews/{id}/coverage</tspan><tspan x="18" y="51.75">No changed lines to account for</tspan></text>
    </g>
    <g id="x1" data-diagram-kind="node" transform="translate(14 127)" role="group" aria-label="GET /reviews/{id}/item-diffs&#10;No diff">
      <rect width="352" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">GET /reviews/{id}/item-diffs</tspan><tspan x="18" y="51.75">No diff</tspan></text>
    </g>
    <g id="x2" data-diagram-kind="node" transform="translate(14 210)" role="group" aria-label="GET /reviews/{id}/code, /file-diff&#10;Nothing changed yet">
      <rect width="352" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">GET /reviews/{id}/code, /file-diff</tspan><tspan x="18" y="51.75">Nothing changed yet</tspan></text>
    </g>
    <g id="x3" data-diagram-kind="node" transform="translate(14 293)" role="group" aria-label="GET /reviews/{id}/line-threads&#10;No diff lines to comment on">
      <rect width="352" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">GET /reviews/{id}/line-threads</tspan><tspan x="18" y="51.75">No diff lines to comment on</tspan></text>
    </g>
    <g id="x4" data-diagram-kind="node" transform="translate(14 376)" role="group" aria-label="Merged detection&#10;A Plan closes by decision">
      <rect width="352" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Merged detection</tspan><tspan x="18" y="51.75">A Plan closes by decision</tspan></text>
    </g>
  </g>
  <g id="add" data-diagram-kind="group" transform="translate(860 90)" role="group" aria-label="New">
    <title>New</title>
    <rect width="380" height="470" rx="10" fill="#fff8d6" stroke="#a16207" stroke-width="1" style="fill:var(--diagram-yellow-tint,#fff8d6);stroke:var(--diagram-yellow-accent,#a16207)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H51.456A10 10 0 0 1 61.456 10V34.5Z" fill="#a16207" style="fill:var(--diagram-yellow-accent,#a16207)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">New</tspan></text>
    <g id="a0" data-diagram-kind="node" transform="translate(14 44)" role="group" aria-label="Proposal banner&#10;Says nothing here is built yet">
      <rect width="352" height="76" rx="8" fill="#fff8d6" stroke="#a16207" stroke-width="1" style="fill:var(--diagram-yellow-tint,#fff8d6);stroke:var(--diagram-yellow-accent,#a16207)"/>
      <text x="18" y="33" font-size="15" fill="#3f2d00" xml:space="preserve" style="fill:var(--diagram-yellow-ink,#3f2d00)"><tspan x="18" y="33">Proposal banner</tspan><tspan x="18" y="51.75">Says nothing here is built yet</tspan></text>
    </g>
    <g id="a1" data-diagram-kind="node" transform="translate(14 127)" role="group" aria-label="Plans in the sidebar and directory&#10;Beside Reviews, on the Review side">
      <rect width="352" height="76" rx="8" fill="#fff8d6" stroke="#a16207" stroke-width="1" style="fill:var(--diagram-yellow-tint,#fff8d6);stroke:var(--diagram-yellow-accent,#a16207)"/>
      <text x="18" y="33" font-size="15" fill="#3f2d00" xml:space="preserve" style="fill:var(--diagram-yellow-ink,#3f2d00)"><tspan x="18" y="33">Plans in the sidebar and directory</tspan><tspan x="18" y="51.75">Beside Reviews, on the Review side</tspan></text>
    </g>
    <g id="a2" data-diagram-kind="node" transform="translate(14 210)" role="group" aria-label="Plan link on feature and Roadmap&#10;Reached from the planned work">
      <rect width="352" height="76" rx="8" fill="#fff8d6" stroke="#a16207" stroke-width="1" style="fill:var(--diagram-yellow-tint,#fff8d6);stroke:var(--diagram-yellow-accent,#a16207)"/>
      <text x="18" y="33" font-size="15" fill="#3f2d00" xml:space="preserve" style="fill:var(--diagram-yellow-ink,#3f2d00)"><tspan x="18" y="33">Plan link on feature and Roadmap</tspan><tspan x="18" y="51.75">Reached from the planned work</tspan></text>
    </g>
    <g id="a3" data-diagram-kind="node" transform="translate(14 293)" role="group" aria-label="Plan link on each story&#10;With a stale marker when reworded">
      <rect width="352" height="76" rx="8" fill="#fff8d6" stroke="#a16207" stroke-width="1" style="fill:var(--diagram-yellow-tint,#fff8d6);stroke:var(--diagram-yellow-accent,#a16207)"/>
      <text x="18" y="33" font-size="15" fill="#3f2d00" xml:space="preserve" style="fill:var(--diagram-yellow-ink,#3f2d00)"><tspan x="18" y="33">Plan link on each story</tspan><tspan x="18" y="51.75">With a stale marker when reworded</tspan></text>
    </g>
    <g id="a4" data-diagram-kind="node" transform="translate(14 376)" role="group" aria-label="Delivered-by links&#10;Between a Plan and its Reviews">
      <rect width="352" height="76" rx="8" fill="#fff8d6" stroke="#a16207" stroke-width="1" style="fill:var(--diagram-yellow-tint,#fff8d6);stroke:var(--diagram-yellow-accent,#a16207)"/>
      <text x="18" y="33" font-size="15" fill="#3f2d00" xml:space="preserve" style="fill:var(--diagram-yellow-ink,#3f2d00)"><tspan x="18" y="33">Delivered-by links</tspan><tspan x="18" y="51.75">Between a Plan and its Reviews</tspan></text>
    </g>
  </g>
  <g id="foot" data-diagram-kind="text" transform="translate(40 578)" role="group" aria-label="Code: internal/server/reviews.go owns the page, appnav.go the sidebar, directories.go the Reviews table, apppages.go the feature page.">
    <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">Code: internal/server/reviews.go owns the page, appnav.go the sidebar, directories.go the Reviews table, apppages.go the feature page.</tspan></text>
  </g>
</svg>
