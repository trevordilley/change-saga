<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">A decision on a Plan goes stale when its slide changes</title>
  <desc id="diagram-desc">The currency check already compares a slide digest. A Plan only has to give it a head with no base, because its slides usually cite no code.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-ink:#172554;--diagram-blue-sticky:#c7defe;--diagram-blue-tint:#e8f1ff;--diagram-gray-accent:#475569;--diagram-gray-tint:#f1f5f9;--diagram-green-accent:#15803d;--diagram-green-ink:#052e16;--diagram-green-tint:#e7f8eb;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-on-accent:#ffffff;--diagram-pink-accent:#be185d;--diagram-pink-ink:#500724;--diagram-pink-tint:#ffe8f0;--diagram-secondary-ink:#526174;--diagram-secondary-stroke:#94a3b8;--diagram-shadow:#0f172a;--diagram-title-ink:#172033;--diagram-yellow-accent:#a16207;--diagram-yellow-tint:#fff8d6;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-ink:#cae8ff;--diagram-blue-sticky:#15315e;--diagram-blue-tint:#121d2f;--diagram-gray-accent:#9198a1;--diagram-gray-tint:#1c2128;--diagram-green-accent:#56d364;--diagram-green-ink:#d2f8d9;--diagram-green-tint:#12261e;--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-on-accent:#0d1117;--diagram-pink-accent:#f778ba;--diagram-pink-ink:#ffd6e8;--diagram-pink-tint:#2f1420;--diagram-secondary-ink:#9198a1;--diagram-secondary-stroke:#6e7681;--diagram-shadow:#010409;--diagram-title-ink:#e6edf3;--diagram-yellow-accent:#e3b341;--diagram-yellow-tint:#2b2508;}}</style>
    <marker id="diagram-head-f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <filter id="diagram-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.2" style="flood-color:var(--diagram-shadow,#0f172a)"/>
    </filter>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">A decision on a Plan goes stale when its slide changes</tspan></text>
  </g>
  <g id="g-rec" data-diagram-kind="group" transform="translate(40 90)" role="group" aria-label="Record">
    <title>Record</title>
    <rect width="520" height="250" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="1" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H74.369A10 10 0 0 1 84.369 10V34.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Record</tspan></text>
    <g id="dec" data-diagram-kind="node" transform="translate(20 60)" role="group" aria-label="Approve a slide">
      <rect width="220" height="110" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Approve a slide</tspan></text>
      <text x="18" y="73" font-size="15" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="73">review approve, or the</tspan><tspan x="18" y="91.75">slide's button</tspan></text>
    </g>
    <g id="appr2" data-diagram-kind="node" transform="translate(280 60)" role="group" aria-label="Approval record">
      <path d="M0 0H220V101.2C146.667 70.719 73.333 131.681 0 101.2Z" stroke-linejoin="round" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="110" y="30.825" font-size="17" fill="#172554" xml:space="preserve" text-anchor="middle" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="110" y="30.825">Approval record</tspan></text>
      <text x="110" y="56.075" font-size="15" fill="#172554" xml:space="preserve" text-anchor="middle" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="110" y="56.075">state, reviewer, commit,</tspan><tspan x="110" y="74.825">slide_digest</tspan></text>
    </g>
  </g>
  <g id="g-chg" data-diagram-kind="group" transform="translate(590 90)" role="group" aria-label="Later">
    <title>Later</title>
    <rect width="250" height="250" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1" style="fill:var(--diagram-gray-tint,#f1f5f9);stroke:var(--diagram-gray-accent,#475569)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H56.786A10 10 0 0 1 66.786 10V34.5Z" fill="#475569" style="fill:var(--diagram-gray-accent,#475569)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Later</tspan></text>
    <g id="edit" data-diagram-kind="node" transform="translate(20 60)" role="group" aria-label="The slide is edited">
      <rect width="210" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="35" font-size="17" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="35">The slide is edited</tspan></text>
      <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">apply-slide or diagram</tspan><tspan x="18" y="91.75">edit</tspan></text>
    </g>
  </g>
  <g id="g-cur2" data-diagram-kind="group" transform="translate(870 90)" role="group" aria-label="Reported on the next read">
    <title>Reported on the next read</title>
    <rect width="370" height="250" rx="10" fill="#e7f8eb" stroke="#15803d" stroke-width="1" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H231.88A10 10 0 0 1 241.88 10V34.5Z" fill="#15803d" style="fill:var(--diagram-green-accent,#15803d)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Reported on the next read</tspan></text>
    <g id="q" data-diagram-kind="node" transform="translate(20 40)" role="group" aria-label="Digest still matches?">
      <path d="M165 0L330 45L165 90L0 45Z" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="82.5" y="48.5" font-size="17" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="82.5" y="48.5">Digest still matches?</tspan></text>
    </g>
    <g id="cur" data-diagram-kind="node" transform="translate(20 135)" role="group" aria-label="Current">
      <rect width="150" height="105" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">Current</tspan></text>
      <text x="18" y="73" font-size="15" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="73">Decision stands</tspan></text>
    </g>
    <g id="out" data-diagram-kind="node" transform="translate(200 135)" role="group" aria-label="Out of date">
      <rect width="150" height="105" rx="8" fill="#ffe8f0" stroke="#be185d" stroke-width="1" style="fill:var(--diagram-pink-tint,#ffe8f0);stroke:var(--diagram-pink-accent,#be185d)"/>
      <text x="18" y="33" font-size="15" fill="#500724" xml:space="preserve" style="fill:var(--diagram-pink-ink,#500724)"><tspan x="18" y="33">Out of date</tspan></text>
      <text x="18" y="73" font-size="15" fill="#500724" xml:space="preserve" style="fill:var(--diagram-pink-ink,#500724)"><tspan x="18" y="73">Slide changed</tspan></text>
    </g>
  </g>
  <g id="f1" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="dec to appr2" data-from="dec" data-to="appr2">
    <path d="M280 205 L320 205" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-f1)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="f2" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="appr2 to edit" data-from="appr2" data-to="edit">
    <path d="M540 205 L610 205" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-f2)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="f3" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="edit to q" data-from="edit" data-to="q">
    <path d="M820 205 L890 175" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-f3)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="f4" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="yes" data-from="q" data-to="cur">
    <path d="M975 205 L965 225" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-f4)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="925" y="216" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="925" y="216">yes</tspan></text>
  </g>
  <g id="f5" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="no" data-from="q" data-to="out">
    <path d="M1135 205 L1145 225" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-f5)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="1165" y="216" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="1165" y="216">no</tspan></text>
  </g>
  <g id="g-code" data-diagram-kind="group" transform="translate(40 370)" role="group" aria-label="What has to change in code">
    <title>What has to change in code</title>
    <rect width="760" height="210" rx="10" fill="#fff8d6" stroke="#a16207" stroke-width="1" style="fill:var(--diagram-yellow-tint,#fff8d6);stroke:var(--diagram-yellow-accent,#a16207)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H246.781A10 10 0 0 1 256.781 10V34.5Z" fill="#a16207" style="fill:var(--diagram-yellow-accent,#a16207)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">What has to change in code</tspan></text>
    <g id="c1" data-diagram-kind="text" transform="translate(20 44)" role="group" aria-label="internal/reviewstate/reviewstate.go: ResolveRange needs a merge-base of base and head. A Plan has no base, so it resolves its head alone.">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">internal/reviewstate/reviewstate.go: ResolveRange needs a merge-base of base and head. A</tspan><tspan x="0" y="36">Plan has no base, so it resolves its head alone.</tspan></text>
    </g>
    <g id="c2" data-diagram-kind="text" transform="translate(20 96)" role="group" aria-label="currency() in the same file already works from there: it compares the digest, then compares any code cited on the slide's Items. A slide citing no code has nothing more to check.">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">currency() in the same file already works from there: it compares the digest, then compares any</tspan><tspan x="0" y="36">code cited on the slide's Items. A slide citing no code has nothing more to check.</tspan></text>
    </g>
    <g id="c3" data-diagram-kind="text" transform="translate(20 150)" role="group" aria-label="internal/reviewstore/reviewstore.go: Record and Comment already refuse a merged review; they also refuse a closed Plan.">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">internal/reviewstore/reviewstore.go: Record and Comment already refuse a merged review; they</tspan><tspan x="0" y="36">also refuse a closed Plan.</tspan></text>
    </g>
  </g>
  <g id="seat" data-diagram-kind="sticky" transform="translate(830 370)" role="group" aria-label="Each reviewer seat holds its own decision per slide. An AI approval is never shown as a human one." data-about="appr2">
    <rect width="400" height="210" rx="3" fill="#c7defe" filter="url(#diagram-shadow)" style="fill:var(--diagram-blue-sticky,#c7defe)"/>
    <text x="16" y="38" font-size="22" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="16" y="38">Each reviewer seat holds its own</tspan><tspan x="16" y="65.5">decision per slide. An AI approval</tspan><tspan x="16" y="93">is never shown as a human one.</tspan></text>
  </g>
</svg>
