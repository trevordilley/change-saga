<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">Four additions; the rest of the grammar already exists</title>
  <desc id="diagram-desc">Plans reuse the review verbs. Only the highlighted lines are new, and none of them runs today: this is a proposed grammar.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}@font-face{font-family:"Change Saga Code";src:url("/_diagram/fonts/go-mono.ttf") format("truetype")}text.diagram-code{font-family:"Change Saga Code",ui-monospace,Menlo,Consolas,monospace}:root{color-scheme:light dark;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-primary-fill:#edf5ff;--diagram-title-ink:#172033;}@media (prefers-color-scheme:dark){:root{--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-primary-fill:#0c2d6b;--diagram-title-ink:#e6edf3;}}</style>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">Four additions; the rest of the grammar already exists</tspan></text>
  </g>
  <g id="cli" data-diagram-kind="code" transform="translate(40 90)" role="group" aria-label="cli" data-language="sh">
    <title>The proposed commands for a Plan's life; lines 2, 3, 15 and 16 are new.</title>
    <rect width="1200" height="440" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="16" y="34" font-size="18" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="16" y="34">sh</tspan></text>
    <path d="M0 46.5H1200" stroke="#64748b" stroke-width="1" style="stroke:var(--diagram-normal-stroke,#64748b)"/>
    <rect data-code-highlight="2" x="1" y="77" width="1198" height="22.5" fill="#edf5ff" aria-hidden="true" style="fill:var(--diagram-primary-fill,#edf5ff)"/>
    <rect data-code-highlight="3" x="1" y="99.5" width="1198" height="22.5" fill="#edf5ff" aria-hidden="true" style="fill:var(--diagram-primary-fill,#edf5ff)"/>
    <rect data-code-highlight="15" x="1" y="369.5" width="1198" height="22.5" fill="#edf5ff" aria-hidden="true" style="fill:var(--diagram-primary-fill,#edf5ff)"/>
    <rect data-code-highlight="16" x="1" y="392" width="1198" height="22.5" fill="#edf5ff" aria-hidden="true" style="fill:var(--diagram-primary-fill,#edf5ff)"/>
    <text class="diagram-code" font-size="18" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan data-code-line="1" x="16" y="72.5"># Start a Plan: no pull request, no base, nothing to cover</tspan><tspan data-code-line="2" x="16" y="95">change-saga review create --kind plan --id plans --title "Plans" change.saga</tspan><tspan data-code-line="3" x="16" y="117.5">change-saga relation add --type plans --from PLAN --to STORY --rationale TEXT change.saga</tspan><tspan data-code-line="4" x="16" y="140"/><tspan data-code-line="5" x="16" y="162.5"># Author and read it as a review deck</tspan><tspan data-code-line="6" x="16" y="185">change-saga apply-slide --review plans --from SLIDE.json change.saga</tspan><tspan data-code-line="7" x="16" y="207.5">change-saga deck overview --review plans --file overview.json change.saga</tspan><tspan data-code-line="8" x="16" y="230">change-saga visual-qa --review plans change.saga</tspan><tspan data-code-line="9" x="16" y="252.5"/><tspan data-code-line="10" x="16" y="275"># Discuss it as a review deck</tspan><tspan data-code-line="11" x="16" y="297.5">change-saga review comment --review plans --target SLIDE --body TEXT --reviewer-kind human change.saga</tspan><tspan data-code-line="12" x="16" y="320">change-saga review approve --review plans --slide SLIDE --reviewer-kind human change.saga</tspan><tspan data-code-line="13" x="16" y="342.5"/><tspan data-code-line="14" x="16" y="365"># Link the pull request that delivers it, then close it</tspan><tspan data-code-line="15" x="16" y="387.5">change-saga review create --pr 42 --delivers plans change.saga</tspan><tspan data-code-line="16" x="16" y="410">change-saga review close --review plans --state shipped --delivered-by pr-42 change.saga</tspan></text>
  </g>
  <g id="foot" data-diagram-kind="text" transform="translate(40 548)" role="group" aria-label="review list shows a Plan's slides and decisions with no coverage line. query gets the same treatment as every other record.">
    <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">review list shows a Plan's slides and decisions with no coverage line. query gets the same treatment as every other record.</tspan></text>
  </g>
</svg>
