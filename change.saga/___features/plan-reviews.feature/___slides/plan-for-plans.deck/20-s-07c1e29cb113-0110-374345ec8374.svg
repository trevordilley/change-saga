      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">plans relation in</tspan><tspan x="18" y="51.75">internal/requirements</tspan></text>
    </g>
    <g id="l31" data-diagram-kind="node" transform="translate(12 120)" role="group" aria-label="review create --delivers">
      <rect width="268" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">review create --delivers</tspan></text>
    </g>
    <g id="l32" data-diagram-kind="node" transform="translate(12 196)" role="group" aria-label="Links on Roadmap, feature and story pages">
      <rect width="268" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Links on Roadmap, feature and</tspan><tspan x="18" y="51.75">story pages</tspan></text>
    </g>
    <g id="l33" data-diagram-kind="node" transform="translate(12 272)" role="group" aria-label="Comparison in review list">
      <rect width="268" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Comparison in review list</tspan></text>
    </g>
    <g id="st3" data-diagram-kind="text" transform="translate(14 350)" role="group" aria-label="Stories: See which stories; Compare what we said">
