      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">feature deliver leaves Plans</tspan><tspan x="18" y="51.75">alone</tspan></text>
    </g>
    <g id="l42" data-diagram-kind="node" transform="translate(12 196)" role="group" aria-label="SPEC section 8, skill route, and SKILL.md timing">
      <rect width="268" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
