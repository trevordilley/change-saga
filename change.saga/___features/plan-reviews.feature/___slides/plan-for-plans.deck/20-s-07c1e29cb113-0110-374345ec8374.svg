    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Read: a Plan exists</tspan></text>
    <g id="l10" data-diagram-kind="node" transform="translate(12 44)" role="group" aria-label="kind and optional base in review.schema.json">
      <rect width="268" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
