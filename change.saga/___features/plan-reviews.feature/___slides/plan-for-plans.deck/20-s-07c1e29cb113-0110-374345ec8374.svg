    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Discuss: agree on it</tspan></text>
    <g id="l20" data-diagram-kind="node" transform="translate(12 44)" role="group" aria-label="ResolveRange: head with no base">
      <rect width="268" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">ResolveRange: head with no</tspan><tspan x="18" y="51.75">base</tspan></text>
    </g>
    <g id="l21" data-diagram-kind="node" transform="translate(12 120)" role="group" aria-label="Approve and comment commands accept a Plan">
      <rect width="268" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Approve and comment</tspan><tspan x="18" y="51.75">commands accept a Plan</tspan></text>
    </g>
    <g id="l22" data-diagram-kind="node" transform="translate(12 196)" role="group" aria-label="Hide coverage and diff surfaces">
      <rect width="268" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Hide coverage and diff surfaces</tspan></text>
    </g>
    <g id="l23" data-diagram-kind="node" transform="translate(12 272)" role="group" aria-label="Reviews sidebar and directory list Plans">
      <rect width="268" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Reviews sidebar and directory</tspan><tspan x="18" y="51.75">list Plans</tspan></text>
    </g>
    <g id="st2" data-diagram-kind="text" transform="translate(14 350)" role="group" aria-label="Story: Settle disagreements slide by slide">
      <text x="0" y="18" font-size="18" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="18">Story: Settle disagreements</tspan><tspan x="0" y="40.5">slide by slide</tspan></text>
    </g>
  </g>
