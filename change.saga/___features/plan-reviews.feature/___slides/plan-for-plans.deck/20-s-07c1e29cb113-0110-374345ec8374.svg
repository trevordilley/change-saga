  </g>
  <g id="foot" data-diagram-kind="text" transform="translate(40 548)" role="group" aria-label="Plans stay optional throughout: no check requires one, and a Saga without them reads as it does today.">
    <text x="595" y="18" font-size="18" fill="#172033" xml:space="preserve" text-anchor="middle" style="fill:var(--diagram-title-ink,#172033)"><tspan x="595" y="18">Plans stay optional throughout: no check requires one, and a Saga without them reads as it does today.</tspan></text>
