      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">internal/saga/review.go: load into</tspan><tspan x="18" y="51.75">document.Plans</tspan></text>
    </g>
    <g id="l12" data-diagram-kind="node" transform="translate(12 196)" role="group" aria-label="review create --kind plan">
      <rect width="268" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">review create --kind plan</tspan></text>
    </g>
    <g id="l13" data-diagram-kind="node" transform="translate(12 272)" role="group" aria-label="Review page with a proposal banner">
      <rect width="268" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Review page with a proposal</tspan><tspan x="18" y="51.75">banner</tspan></text>
    </g>
    <g id="st1" data-diagram-kind="text" transform="translate(14 350)" role="group" aria-label="Story: Write down how we will build it">
      <text x="0" y="18" font-size="18" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="18">Story: Write down how we will</tspan><tspan x="0" y="40.5">build it</tspan></text>
    </g>
  </g>
