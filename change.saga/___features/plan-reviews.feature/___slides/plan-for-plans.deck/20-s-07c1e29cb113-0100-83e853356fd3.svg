<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">A Plan ends by decision, not by a merge</title>
  <desc id="diagram-desc">One Plan may span several pull requests, so no merge can close it. An author closes it as shipped or abandoned; closing freezes it and touches no story.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-ink:#172554;--diagram-blue-tint:#e8f1ff;--diagram-gray-accent:#475569;--diagram-gray-tint:#f1f5f9;--diagram-green-accent:#15803d;--diagram-green-ink:#052e16;--diagram-green-tint:#e7f8eb;--diagram-normal-ink:#172033;--diagram-on-accent:#ffffff;--diagram-pink-accent:#be185d;--diagram-pink-ink:#500724;--diagram-pink-tint:#ffe8f0;--diagram-secondary-ink:#526174;--diagram-secondary-stroke:#94a3b8;--diagram-title-ink:#172033;--diagram-yellow-accent:#a16207;--diagram-yellow-tint:#fff8d6;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-ink:#cae8ff;--diagram-blue-tint:#121d2f;--diagram-gray-accent:#9198a1;--diagram-gray-tint:#1c2128;--diagram-green-accent:#56d364;--diagram-green-ink:#d2f8d9;--diagram-green-tint:#12261e;--diagram-normal-ink:#e6edf3;--diagram-on-accent:#0d1117;--diagram-pink-accent:#f778ba;--diagram-pink-ink:#ffd6e8;--diagram-pink-tint:#2f1420;--diagram-secondary-ink:#9198a1;--diagram-secondary-stroke:#6e7681;--diagram-title-ink:#e6edf3;--diagram-yellow-accent:#e3b341;--diagram-yellow-tint:#2b2508;}}</style>
    <marker id="diagram-head-t1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-t2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">A Plan ends by decision, not by a merge</tspan></text>
  </g>
  <g id="g-st" data-diagram-kind="group" transform="translate(40 90)" role="group" aria-label="Plan state">
    <title>Plan state</title>
    <rect width="740" height="300" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="1" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H98.305A10 10 0 0 1 108.305 10V34.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Plan state</tspan></text>
    <g id="open" data-diagram-kind="node" transform="translate(40 85)" role="group" aria-label="Open">
      <rect width="170" height="115" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="3" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="40" font-size="22" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="40">Open</tspan></text>
      <text x="18" y="73" font-size="15" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="73">Listed, editable,</tspan><tspan x="18" y="91.75">discussable</tspan></text>
    </g>
    <g id="ship" data-diagram-kind="node" transform="translate(470 40)" role="group" aria-label="Shipped">
      <rect width="220" height="110" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">Shipped</tspan></text>
      <text x="18" y="73" font-size="15" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="73">Frozen; names its</tspan><tspan x="18" y="91.75">Reviews</tspan></text>
    </g>
    <g id="drop2" data-diagram-kind="node" transform="translate(470 170)" role="group" aria-label="Abandoned">
      <rect width="220" height="110" rx="8" fill="#ffe8f0" stroke="#be185d" stroke-width="1" style="fill:var(--diagram-pink-tint,#ffe8f0);stroke:var(--diagram-pink-accent,#be185d)"/>
      <text x="18" y="33" font-size="15" fill="#500724" xml:space="preserve" style="fill:var(--diagram-pink-ink,#500724)"><tspan x="18" y="33">Abandoned</tspan></text>
      <text x="18" y="73" font-size="15" fill="#500724" xml:space="preserve" style="fill:var(--diagram-pink-ink,#500724)"><tspan x="18" y="73">Frozen; states why</tspan></text>
    </g>
  </g>
  <g id="t1" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="review close --state shipped" data-from="open" data-to="ship">
    <path d="M250 190 L510 185" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-t1)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="245" y="160" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="245" y="160">review close --state shipped</tspan></text>
  </g>
  <g id="t2" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="--state abandoned --reason" data-from="open" data-to="drop2">
    <path d="M250 250 L510 315" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-t2)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="240" y="318" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="240" y="318">--state abandoned --reason</tspan></text>
  </g>
  <g id="g-not" data-diagram-kind="group" transform="translate(810 90)" role="group" aria-label="What closing does not touch">
    <title>What closing does not touch</title>
    <rect width="430" height="300" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1" style="fill:var(--diagram-gray-tint,#f1f5f9);stroke:var(--diagram-gray-accent,#475569)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H250.828A10 10 0 0 1 260.828 10V34.5Z" fill="#475569" style="fill:var(--diagram-gray-accent,#475569)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">What closing does not touch</tspan></text>
    <g id="nt1" data-diagram-kind="text" transform="translate(20 44)" role="group" aria-label="Story lifecycle: abandoning a Plan does not withdraw its stories. Someone might plan them differently.">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">Story lifecycle: abandoning a Plan does not</tspan><tspan x="0" y="36">withdraw its stories. Someone might plan them</tspan><tspan x="0" y="56">differently.</tspan></text>
    </g>
    <g id="nt2" data-diagram-kind="text" transform="translate(20 120)" role="group" aria-label="Roadmap status: feature set-plan and feature deliver stay separate steps.">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">Roadmap status: feature set-plan and feature</tspan><tspan x="0" y="36">deliver stay separate steps.</tspan></text>
    </g>
    <g id="nt3" data-diagram-kind="text" transform="translate(20 180)" role="group" aria-label="Decisions and comments: kept as they were, and no longer open to change.">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">Decisions and comments: kept as they were, and no</tspan><tspan x="0" y="36">longer open to change.</tspan></text>
    </g>
  </g>
  <g id="g-today" data-diagram-kind="group" transform="translate(40 410)" role="group" aria-label="Why today's tools cannot do this">
    <title>Why today's tools cannot do this</title>
    <rect width="1200" height="170" rx="10" fill="#fff8d6" stroke="#a16207" stroke-width="1" style="fill:var(--diagram-yellow-tint,#fff8d6);stroke:var(--diagram-yellow-accent,#a16207)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H283.62A10 10 0 0 1 293.62 10V34.5Z" fill="#a16207" style="fill:var(--diagram-yellow-accent,#a16207)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Why today's tools cannot do this</tspan></text>
    <g id="td1" data-diagram-kind="text" transform="translate(20 44)" role="group" aria-label="feature deliver moves every deck to the recipient and deletes the Roadmap feature (internal/cli/feature_deliver.go). This deck would land in Rich visual review and read as current behaviour, so today someone must remove it by hand first.">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">feature deliver moves every deck to the recipient and deletes the Roadmap feature (internal/cli/feature_deliver.go). This deck would land in Rich visual</tspan><tspan x="0" y="36">review and read as current behaviour, so today someone must remove it by hand first.</tspan></text>
    </g>
    <g id="td2" data-diagram-kind="text" transform="translate(20 104)" role="group" aria-label="repin freezes a review when its change lands (internal/cli/references.go). A Plan delivered by several pull requests has no one merge to freeze on.">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">repin freezes a review when its change lands (internal/cli/references.go). A Plan delivered by several pull requests has no one merge to freeze on.</tspan></text>
    </g>
  </g>
</svg>
