<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">A Plan is what you will do; a Review is what you did</title>
  <desc id="diagram-desc">A Plan and a Review share a deck, its decisions and its comments. A Plan explains intent before code exists; a Review explains a diff after.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-ink:#172554;--diagram-blue-tint:#e8f1ff;--diagram-gray-accent:#475569;--diagram-gray-tint:#f1f5f9;--diagram-green-accent:#15803d;--diagram-green-ink:#052e16;--diagram-green-tint:#e7f8eb;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-on-accent:#ffffff;--diagram-title-ink:#172033;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-ink:#cae8ff;--diagram-blue-tint:#121d2f;--diagram-gray-accent:#9198a1;--diagram-gray-tint:#1c2128;--diagram-green-accent:#56d364;--diagram-green-ink:#d2f8d9;--diagram-green-tint:#12261e;--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-on-accent:#0d1117;--diagram-title-ink:#e6edf3;}}</style>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">A Plan is what you will do; a Review is what you did</tspan></text>
  </g>
  <g id="plan-col" data-diagram-kind="group" transform="translate(50 90)" role="group" aria-label="Plan: what you will do (planned)">
    <title>Plan: what you will do (planned)</title>
    <rect width="370" height="510" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="1" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H282.856A10 10 0 0 1 292.856 10V34.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Plan: what you will do (planned)</tspan></text>
    <g id="p0" data-diagram-kind="node" transform="translate(20 50)" role="group" aria-label="Written before any code exists">
      <rect width="330" height="76" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Written before any code exists</tspan></text>
    </g>
    <g id="p1" data-diagram-kind="node" transform="translate(20 138)" role="group" aria-label="Explains the intended approach">
      <rect width="330" height="76" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Explains the intended approach</tspan></text>
    </g>
    <g id="p2" data-diagram-kind="node" transform="translate(20 226)" role="group" aria-label="Answers to the stories it intends to deliver">
      <rect width="330" height="76" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Answers to the stories it intends to</tspan><tspan x="18" y="56.25">deliver</tspan></text>
    </g>
    <g id="p3" data-diagram-kind="node" transform="translate(20 314)" role="group" aria-label="A decision goes stale when its slide changes">
      <rect width="330" height="76" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">A decision goes stale when its slide</tspan><tspan x="18" y="56.25">changes</tspan></text>
    </g>
    <g id="p4" data-diagram-kind="node" transform="translate(20 402)" role="group" aria-label="Ends when closed: shipped or abandoned">
      <rect width="330" height="76" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Ends when closed: shipped or</tspan><tspan x="18" y="56.25">abandoned</tspan></text>
    </g>
  </g>
  <g id="shared-col" data-diagram-kind="group" transform="translate(450 90)" role="group" aria-label="Shared: already built for reviews">
    <title>Shared: already built for reviews</title>
    <rect width="380" height="510" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1" style="fill:var(--diagram-gray-tint,#f1f5f9);stroke:var(--diagram-gray-accent,#475569)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H284.725A10 10 0 0 1 294.725 10V34.5Z" fill="#475569" style="fill:var(--diagram-gray-accent,#475569)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Shared: already built for reviews</tspan></text>
    <g id="s0" data-diagram-kind="node" transform="translate(20 50)" role="group" aria-label="Slide deck and essay">
      <rect width="340" height="104" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="35" font-size="17" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="35">Slide deck and essay</tspan></text>
      <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">Front, Back, Items, callouts, and an</tspan><tspan x="18" y="91.75">Overview report</tspan></text>
    </g>
    <g id="s1" data-diagram-kind="node" transform="translate(20 160)" role="group" aria-label="Per-slide decisions">
      <rect width="340" height="104" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="35" font-size="17" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="35">Per-slide decisions</tspan></text>
      <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">Approved or changes requested, by human</tspan><tspan x="18" y="91.75">or AI seat</tspan></text>
    </g>
    <g id="s2" data-diagram-kind="node" transform="translate(20 270)" role="group" aria-label="Comments and threads">
      <rect width="340" height="104" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="35" font-size="17" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="35">Comments and threads</tspan></text>
      <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">On a slide or Item; reply, resolve, reopen</tspan></text>
    </g>
    <g id="s3" data-diagram-kind="node" transform="translate(20 380)" role="group" aria-label="One reading surface">
      <rect width="340" height="104" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="35" font-size="17" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="35">One reading surface</tspan></text>
      <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">The review page and its slide viewer</tspan></text>
    </g>
  </g>
  <g id="review-col" data-diagram-kind="group" transform="translate(860 90)" role="group" aria-label="Review: what you did (exists today)">
    <title>Review: what you did (exists today)</title>
    <rect width="370" height="510" rx="10" fill="#e7f8eb" stroke="#15803d" stroke-width="1" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H309.669A10 10 0 0 1 319.669 10V34.5Z" fill="#15803d" style="fill:var(--diagram-green-accent,#15803d)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Review: what you did (exists today)</tspan></text>
    <g id="r0" data-diagram-kind="node" transform="translate(20 50)" role="group" aria-label="Written at the pull request">
      <rect width="330" height="76" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">Written at the pull request</tspan></text>
    </g>
    <g id="r1" data-diagram-kind="node" transform="translate(20 138)" role="group" aria-label="Explains the transition the change made">
      <rect width="330" height="76" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">Explains the transition the change</tspan><tspan x="18" y="56.25">made</tspan></text>
    </g>
    <g id="r2" data-diagram-kind="node" transform="translate(20 226)" role="group" aria-label="Answers to every changed line in its range">
      <rect width="330" height="76" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">Answers to every changed line in its</tspan><tspan x="18" y="56.25">range</tspan></text>
    </g>
    <g id="r3" data-diagram-kind="node" transform="translate(20 314)" role="group" aria-label="A decision goes stale when its slide or cited code changes">
      <rect width="330" height="76" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">A decision goes stale when its slide</tspan><tspan x="18" y="56.25">or cited code changes</tspan></text>
    </g>
    <g id="r4" data-diagram-kind="node" transform="translate(20 402)" role="group" aria-label="Ends frozen by repin after the change lands">
      <rect width="330" height="76" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">Ends frozen by repin after the change</tspan><tspan x="18" y="56.25">lands</tspan></text>
    </g>
  </g>
  <g id="rule" data-diagram-kind="text" transform="translate(50 615)" role="group" aria-label="Only the question changes: a Review asks whether the work is explained; a Plan asks whether the approach is right.">
    <text x="590" y="18" font-size="18" fill="#172033" xml:space="preserve" text-anchor="middle" style="fill:var(--diagram-title-ink,#172033)"><tspan x="590" y="18">Only the question changes: a Review asks whether the work is explained; a Plan asks whether the approach is right.</tspan></text>
  </g>
</svg>
