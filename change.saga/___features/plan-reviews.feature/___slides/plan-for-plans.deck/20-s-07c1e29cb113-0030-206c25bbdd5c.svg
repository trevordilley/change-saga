<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">We tried it today: every container gets something wrong</title>
  <desc id="diagram-desc">This Plan had to live somewhere. A UX deck was least wrong: it reads as user flows, cannot be discussed, and would ship as if it described current behaviour.</desc>
