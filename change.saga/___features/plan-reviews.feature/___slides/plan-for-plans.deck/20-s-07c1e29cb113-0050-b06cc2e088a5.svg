<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">Store a Plan as a review, but load it apart from reviews</title>
  <desc id="diagram-desc">A kind field keeps every review command working for Plans. Loading Plans into their own slice keeps the code that assumes a pull request range from seeing them.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-ink:#172554;--diagram-blue-tint:#e8f1ff;--diagram-gray-accent:#475569;--diagram-gray-tint:#f1f5f9;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-on-accent:#ffffff;--diagram-pink-accent:#be185d;--diagram-pink-ink:#500724;--diagram-pink-tint:#ffe8f0;--diagram-title-ink:#172033;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-ink:#cae8ff;--diagram-blue-tint:#121d2f;--diagram-gray-accent:#9198a1;--diagram-gray-tint:#1c2128;--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-on-accent:#0d1117;--diagram-pink-accent:#f778ba;--diagram-pink-ink:#ffd6e8;--diagram-pink-tint:#2f1420;--diagram-title-ink:#e6edf3;}}</style>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">Store a Plan as a review, but load it apart from reviews</tspan></text>
  </g>
  <g id="opta" data-diagram-kind="group" transform="translate(40 90)" role="group" aria-label="A: kind field, own slice (recommended)">
    <title>A: kind field, own slice (recommended)</title>
    <rect width="392" height="470" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="1" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H339.91A10 10 0 0 1 349.91 10V34.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">A: kind field, own slice (recommended)</tspan></text>
    <g id="a0" data-diagram-kind="node" transform="translate(14 44)" role="group" aria-label="___reviews/ID.review, kind: plan">
      <rect width="364" height="76" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">___reviews/ID.review, kind: plan</tspan></text>
    </g>
    <g id="a1" data-diagram-kind="node" transform="translate(14 127)" role="group" aria-label="Keeps the review URN, so comment and approval targets are unchanged">
      <rect width="364" height="76" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Keeps the review URN, so comment and</tspan><tspan x="18" y="56.25">approval targets are unchanged</tspan></text>
    </g>
    <g id="a2" data-diagram-kind="node" transform="translate(14 210)" role="group" aria-label="apply-slide, deck overview, approve and comment all work as they are">
      <rect width="364" height="76" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">apply-slide, deck overview, approve and</tspan><tspan x="18" y="56.25">comment all work as they are</tspan></text>
    </g>
    <g id="a3" data-diagram-kind="node" transform="translate(14 293)" role="group" aria-label="document.Plans is new; document.Reviews stays as it is">
      <rect width="364" height="76" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">document.Plans is new;</tspan><tspan x="18" y="56.25">document.Reviews stays as it is</tspan></text>
    </g>
    <g id="a4" data-diagram-kind="node" transform="translate(14 376)" role="group" aria-label="Cost: FindReview and the review page must look in both">
      <rect width="364" height="76" rx="8" fill="#ffe8f0" stroke="#be185d" stroke-width="1" style="fill:var(--diagram-pink-tint,#ffe8f0);stroke:var(--diagram-pink-accent,#be185d)"/>
      <text x="18" y="33" font-size="15" fill="#500724" xml:space="preserve" style="fill:var(--diagram-pink-ink,#500724)"><tspan x="18" y="33">Cost: FindReview and the review page must</tspan><tspan x="18" y="51.75">look in both</tspan></text>
    </g>
  </g>
  <g id="optb" data-diagram-kind="group" transform="translate(442 90)" role="group" aria-label="B: sibling ___plans directory">
    <title>B: sibling ___plans directory</title>
    <rect width="392" height="470" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1" style="fill:var(--diagram-gray-tint,#f1f5f9);stroke:var(--diagram-gray-accent,#475569)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H251.884A10 10 0 0 1 261.884 10V34.5Z" fill="#475569" style="fill:var(--diagram-gray-accent,#475569)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">B: sibling ___plans directory</tspan></text>
    <g id="b0" data-diagram-kind="node" transform="translate(14 44)" role="group" aria-label="___plans/ID.plan, a new reserved name">
      <rect width="364" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">___plans/ID.plan, a new reserved name</tspan></text>
    </g>
    <g id="b1" data-diagram-kind="node" transform="translate(14 127)" role="group" aria-label="New URN kind, and a second path through every target parser">
      <rect width="364" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">New URN kind, and a second path through</tspan><tspan x="18" y="51.75">every target parser</tspan></text>
    </g>
    <g id="b2" data-diagram-kind="node" transform="translate(14 210)" role="group" aria-label="Needs a new command noun, and change-saga plan is taken">
      <rect width="364" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Needs a new command noun, and</tspan><tspan x="18" y="51.75">change-saga plan is taken</tspan></text>
    </g>
    <g id="b3" data-diagram-kind="node" transform="translate(14 293)" role="group" aria-label="Equally safe: nothing sees a Plan unless it asks">
      <rect width="364" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Equally safe: nothing sees a Plan unless it</tspan><tspan x="18" y="51.75">asks</tspan></text>
    </g>
    <g id="b4" data-diagram-kind="node" transform="translate(14 376)" role="group" aria-label="Cost: the most new code for the same behaviour">
      <rect width="364" height="76" rx="8" fill="#ffe8f0" stroke="#be185d" stroke-width="1" style="fill:var(--diagram-pink-tint,#ffe8f0);stroke:var(--diagram-pink-accent,#be185d)"/>
      <text x="18" y="33" font-size="15" fill="#500724" xml:space="preserve" style="fill:var(--diagram-pink-ink,#500724)"><tspan x="18" y="33">Cost: the most new code for the same</tspan><tspan x="18" y="51.75">behaviour</tspan></text>
    </g>
  </g>
  <g id="optc" data-diagram-kind="group" transform="translate(844 90)" role="group" aria-label="C: kind field, one slice">
    <title>C: kind field, one slice</title>
    <rect width="392" height="470" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1" style="fill:var(--diagram-gray-tint,#f1f5f9);stroke:var(--diagram-gray-accent,#475569)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H200.453A10 10 0 0 1 210.453 10V34.5Z" fill="#475569" style="fill:var(--diagram-gray-accent,#475569)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">C: kind field, one slice</tspan></text>
    <g id="c0" data-diagram-kind="node" transform="translate(14 44)" role="group" aria-label="___reviews/ID.review, kind: plan">
      <rect width="364" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">___reviews/ID.review, kind: plan</tspan></text>
    </g>
    <g id="c1" data-diagram-kind="node" transform="translate(14 127)" role="group" aria-label="Keeps the review URN and every command">
      <rect width="364" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Keeps the review URN and every command</tspan></text>
    </g>
    <g id="c2" data-diagram-kind="node" transform="translate(14 210)" role="group" aria-label="Least new code at first">
      <rect width="364" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">Least new code at first</tspan></text>
    </g>
    <g id="c3" data-diagram-kind="node" transform="translate(14 293)" role="group" aria-label="document.Reviews now holds Plans, so each use must filter">
      <rect width="364" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="33" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="33">document.Reviews now holds Plans, so each</tspan><tspan x="18" y="51.75">use must filter</tspan></text>
    </g>
    <g id="c4" data-diagram-kind="node" transform="translate(14 376)" role="group" aria-label="Cost: a missed filter treats a Plan as a pull request">
      <rect width="364" height="76" rx="8" fill="#ffe8f0" stroke="#be185d" stroke-width="1" style="fill:var(--diagram-pink-tint,#ffe8f0);stroke:var(--diagram-pink-accent,#be185d)"/>
      <text x="18" y="33" font-size="15" fill="#500724" xml:space="preserve" style="fill:var(--diagram-pink-ink,#500724)"><tspan x="18" y="33">Cost: a missed filter treats a Plan as a pull</tspan><tspan x="18" y="51.75">request</tspan></text>
    </g>
  </g>
  <g id="foot" data-diagram-kind="text" transform="translate(40 590)" role="group" aria-label="Reversible if you disagree: nothing is built, and A and C share a file format. Only B would move files.">
    <text x="595" y="18" font-size="18" fill="#172033" xml:space="preserve" text-anchor="middle" style="fill:var(--diagram-title-ink,#172033)"><tspan x="595" y="18">Reversible if you disagree: nothing is built, and A and C share a file format. Only B would move files.</tspan></text>
  </g>
</svg>
