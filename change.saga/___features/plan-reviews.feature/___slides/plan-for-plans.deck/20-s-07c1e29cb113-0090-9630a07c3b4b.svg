<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">A Review accounts for its Plan the way it accounts for lines</title>
  <desc id="diagram-desc">A review Item can already name a record to open beside the change. Pointing Items at Plan slides yields a report of what was skipped, what was unplanned, and why.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-ink:#172554;--diagram-blue-tint:#e8f1ff;--diagram-green-accent:#15803d;--diagram-green-ink:#052e16;--diagram-green-tint:#e7f8eb;--diagram-normal-ink:#172033;--diagram-on-accent:#ffffff;--diagram-secondary-ink:#526174;--diagram-secondary-stroke:#94a3b8;--diagram-title-ink:#172033;--diagram-yellow-accent:#a16207;--diagram-yellow-tint:#fff8d6;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-ink:#cae8ff;--diagram-blue-tint:#121d2f;--diagram-green-accent:#56d364;--diagram-green-ink:#d2f8d9;--diagram-green-tint:#12261e;--diagram-normal-ink:#e6edf3;--diagram-on-accent:#0d1117;--diagram-secondary-ink:#9198a1;--diagram-secondary-stroke:#6e7681;--diagram-title-ink:#e6edf3;--diagram-yellow-accent:#e3b341;--diagram-yellow-tint:#2b2508;}}</style>
    <marker id="diagram-head-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">A Review accounts for its Plan the way it accounts for lines</tspan></text>
  </g>
  <g id="g-p" data-diagram-kind="group" transform="translate(40 90)" role="group" aria-label="What we said: Plan slides">
    <title>What we said: Plan slides</title>
    <rect width="300" height="470" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="1" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H230.564A10 10 0 0 1 240.564 10V34.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">What we said: Plan slides</tspan></text>
    <g id="ps1" data-diagram-kind="node" transform="translate(20 50)" role="group" aria-label="Load Plans apart">
      <rect width="260" height="70" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Load Plans apart</tspan></text>
    </g>
    <g id="ps2" data-diagram-kind="node" transform="translate(20 150)" role="group" aria-label="Reader surface">
      <rect width="260" height="70" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Reader surface</tspan></text>
    </g>
    <g id="ps3" data-diagram-kind="node" transform="translate(20 250)" role="group" aria-label="Decision currency">
      <rect width="260" height="70" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Decision currency</tspan></text>
    </g>
    <g id="ps4" data-diagram-kind="node" transform="translate(20 350)" role="group" aria-label="Close a Plan">
      <rect width="260" height="70" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
      <text x="18" y="35" font-size="17" fill="#172554" xml:space="preserve" style="fill:var(--diagram-blue-ink,#172554)"><tspan x="18" y="35">Close a Plan</tspan></text>
    </g>
  </g>
  <g id="g-r" data-diagram-kind="group" transform="translate(560 90)" role="group" aria-label="What we did: Review slides">
    <title>What we did: Review slides</title>
    <rect width="300" height="470" rx="10" fill="#e7f8eb" stroke="#15803d" stroke-width="1" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H244.734A10 10 0 0 1 254.734 10V34.5Z" fill="#15803d" style="fill:var(--diagram-green-accent,#15803d)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">What we did: Review slides</tspan></text>
    <g id="rs1" data-diagram-kind="node" transform="translate(20 50)" role="group" aria-label="Reviews and Plans split">
      <rect width="260" height="70" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">Reviews and Plans split</tspan></text>
    </g>
    <g id="rs2" data-diagram-kind="node" transform="translate(20 150)" role="group" aria-label="Page hides the diff">
      <rect width="260" height="70" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">Page hides the diff</tspan></text>
    </g>
    <g id="rs3" data-diagram-kind="node" transform="translate(20 250)" role="group" aria-label="Banner uses a new token">
      <rect width="260" height="70" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">Banner uses a new token</tspan></text>
    </g>
    <g id="rs4" data-diagram-kind="node" transform="translate(20 350)" role="group" aria-label="Range-free decisions">
      <rect width="260" height="70" rx="8" fill="#e7f8eb" stroke="#15803d" stroke-width="2" style="fill:var(--diagram-green-tint,#e7f8eb);stroke:var(--diagram-green-accent,#15803d)"/>
      <text x="18" y="35" font-size="17" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="18" y="35">Range-free decisions</tspan></text>
    </g>
  </g>
  <g id="m1" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="Item record" data-from="rs1" data-to="ps1">
    <path d="M580 175 L320 175" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-m1)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="390" y="164" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="390" y="164">Item record</tspan></text>
  </g>
  <g id="m2" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="Item record" data-from="rs2" data-to="ps2">
    <path d="M580 275 L320 275" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-m2)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="390" y="264" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="390" y="264">Item record</tspan></text>
  </g>
  <g id="m3" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="callout: why it changed" data-from="rs4" data-to="ps3">
    <path d="M580 475 L320 375" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#diagram-head-m3)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="340" y="486" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="340" y="486">callout: why it changed</tspan></text>
  </g>
  <g id="g-rep" data-diagram-kind="group" transform="translate(890 90)" role="group" aria-label="Example report (illustrative)">
    <title>Example report (illustrative)</title>
    <rect width="350" height="470" rx="10" fill="#fff8d6" stroke="#a16207" stroke-width="1" style="fill:var(--diagram-yellow-tint,#fff8d6);stroke:var(--diagram-yellow-accent,#a16207)"/>
    <path d="M0 34.5V10A10 10 0 0 1 10 0H245.644A10 10 0 0 1 255.644 10V34.5Z" fill="#a16207" style="fill:var(--diagram-yellow-accent,#a16207)"/>
    <text x="12" y="24" font-size="18" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="24">Example report (illustrative)</tspan></text>
    <g id="rep1" data-diagram-kind="text" transform="translate(16 44)" role="group" aria-label="Plan: plans. Delivered by: pr-42">
      <text x="0" y="18" font-size="18" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="18">Plan: plans. Delivered by: pr-42</tspan></text>
    </g>
    <g id="rep2" data-diagram-kind="text" transform="translate(16 84)" role="group" aria-label="3 of 4 Plan slides accounted for">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">3 of 4 Plan slides accounted for</tspan></text>
    </g>
    <g id="rep3" data-diagram-kind="text" transform="translate(16 124)" role="group" aria-label="Not accounted for: Close a Plan">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">Not accounted for: Close a Plan</tspan></text>
    </g>
    <g id="rep4" data-diagram-kind="text" transform="translate(16 180)" role="group" aria-label="Accounts for no Plan slide: Banner uses a new token">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">Accounts for no Plan slide: Banner uses a</tspan><tspan x="0" y="36">new token</tspan></text>
    </g>
    <g id="rep5" data-diagram-kind="text" transform="translate(16 236)" role="group" aria-label="Departed: Decision currency. Reason: 'head-only range was simpler than a synthetic base'">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">Departed: Decision currency. Reason:</tspan><tspan x="0" y="36">'head-only range was simpler than a</tspan><tspan x="0" y="56">synthetic base'</tspan></text>
    </g>
    <g id="rep6" data-diagram-kind="text" transform="translate(16 320)" role="group" aria-label="Stories: criteria with implementation evidence come from query traceability, not from this report.">
      <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">Stories: criteria with implementation</tspan><tspan x="0" y="36">evidence come from query traceability, not</tspan><tspan x="0" y="56">from this report.</tspan></text>
    </g>
    <g id="rep7" data-diagram-kind="text" transform="translate(16 404)" role="group" aria-label="Report only: no merge blocked, no decision changed.">
      <text x="0" y="18" font-size="18" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="18">Report only: no merge blocked, no</tspan><tspan x="0" y="40.5">decision changed.</tspan></text>
    </g>
  </g>
  <g id="foot" data-diagram-kind="text" transform="translate(40 578)" role="group" aria-label="Code: extend validReviewRecordReference in internal/saga/slides.go, which accepts a slide URN but not a review-scoped one, and report from review list.">
    <text x="0" y="16" font-size="16" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="0" y="16">Code: extend validReviewRecordReference in internal/saga/slides.go, which accepts a slide URN but not a review-scoped one, and report from review list.</tspan></text>
  </g>
</svg>
