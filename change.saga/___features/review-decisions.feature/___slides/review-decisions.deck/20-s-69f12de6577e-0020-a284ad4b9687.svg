<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Decision projection and currency state machine</title><desc id="desc">Two linked state machines show append-only reviewer events projected to the latest state per composite reviewer seat, then classified as current, out of date, or unknown. The seat key combines the Git or local author with direct-human or named-AI reviewer metadata.</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#d6e4ff"/></marker><marker id="r" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#ffbd8a"/></marker></defs>
  <rect width="1280" height="720" fill="#11172a"/><text x="58" y="65" fill="#f4f7ff" font-family="system-ui" font-size="35" font-weight="760">A decision changes state without losing history</text><text x="58" y="98" fill="#a8b5d0" font-family="system-ui" font-size="17">Storage is an event log. The UI is a projection plus a separate currency check.</text>
  <g id="decision" font-family="system-ui"><rect x="48" y="139" width="546" height="444" rx="28" fill="#171f38" stroke="#44557e" stroke-width="2"/><text x="78" y="178" fill="#91a8e8" font-size="16" font-weight="750" letter-spacing="1">STATE MACHINE A · REVIEWER SEAT</text>
    <circle cx="122" cy="270" r="42" fill="#26314e" stroke="#8796bd" stroke-width="3"/><text x="122" y="276" text-anchor="middle" fill="#e8edff" font-size="17" font-weight="700">none</text>
    <rect x="258" y="222" width="174" height="96" rx="48" fill="#153d31" stroke="#5ee0aa" stroke-width="3"/><text x="345" y="277" text-anchor="middle" fill="#dffff1" font-size="20" font-weight="750">approved</text>
    <rect x="248" y="408" width="194" height="96" rx="48" fill="#49272d" stroke="#ff8f9f" stroke-width="3"/><text x="345" y="450" text-anchor="middle" fill="#ffe5e9" font-size="18" font-weight="750">changes</text><text x="345" y="475" text-anchor="middle" fill="#ffe5e9" font-size="18" font-weight="750">requested</text>
    <path d="M164 258H247" stroke="#d6e4ff" stroke-width="4" marker-end="url(#a)"/><rect x="181" y="219" width="66" height="27" rx="13" fill="#171f38"/><text x="214" y="238" text-anchor="middle" fill="#b9c8eb" font-size="13">approve</text>
    <path d="M151 301Q192 386 273 419" fill="none" stroke="#d6e4ff" stroke-width="4" marker-end="url(#a)"/><rect x="130" y="355" width="118" height="27" rx="13" fill="#171f38"/><text x="189" y="374" text-anchor="middle" fill="#b9c8eb" font-size="13">request changes</text>
    <path d="M286 318Q215 352 155 300M270 425Q195 410 151 301" fill="none" stroke="#8796bd" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a)"/><rect x="177" y="319" width="76" height="27" rx="13" fill="#171f38"/><text x="215" y="338" text-anchor="middle" fill="#9faed2" font-size="13">withdraw</text>
    <path d="M431 284Q516 344 432 430M433 444Q535 360 431 299" fill="none" stroke="#d6e4ff" stroke-width="4" marker-end="url(#a)"/><rect x="451" y="345" width="92" height="28" rx="14" fill="#171f38"/><text x="497" y="364" text-anchor="middle" fill="#b9c8eb" font-size="13">later event</text>
    <text x="78" y="548" fill="#8fa0c5" font-size="15">Earlier files remain; latest wins only for the same author + seat.</text>
  </g>
  <g id="currency" font-family="system-ui"><rect x="630" y="139" width="602" height="444" rx="28" fill="#17243a" stroke="#46627c" stroke-width="2"/><text x="660" y="178" fill="#7fcbd9" font-size="16" font-weight="750" letter-spacing="1">STATE MACHINE B · DECISION CURRENCY</text>
    <rect x="683" y="229" width="164" height="92" rx="46" fill="#153d31" stroke="#5ee0aa" stroke-width="3"/><text x="765" y="283" text-anchor="middle" fill="#dffff1" font-size="20" font-weight="750">current</text>
    <rect x="1000" y="229" width="180" height="92" rx="46" fill="#4d2d22" stroke="#ff9e68" stroke-width="3"/><text x="1090" y="283" text-anchor="middle" fill="#ffe4d3" font-size="20" font-weight="750">out of date</text>
    <rect x="846" y="432" width="170" height="88" rx="44" fill="#3a3550" stroke="#b7a7e8" stroke-width="3"/><text x="931" y="484" text-anchor="middle" fill="#eee9ff" font-size="20" font-weight="750">unknown</text>
    <path d="M847 275H989" stroke="#ffbd8a" stroke-width="4" marker-end="url(#r)"/><rect x="851" y="192" width="140" height="57" rx="15" fill="#2b2430" stroke="#7c523a"/><text x="921" y="216" text-anchor="middle" fill="#ffd0ae" font-size="13">slide digest differs</text><text x="921" y="237" text-anchor="middle" fill="#ffd0ae" font-size="13">or code changes</text>
    <path d="M719 320Q752 399 850 453" fill="none" stroke="#b7a7e8" stroke-width="4" marker-end="url(#a)"/><rect x="665" y="379" width="118" height="27" rx="13" fill="#17243a"/><text x="724" y="398" text-anchor="middle" fill="#c9bfef" font-size="13">head unreadable</text>
    <path d="M1066 323Q1039 395 1004 447" fill="none" stroke="#b7a7e8" stroke-width="4" marker-end="url(#a)"/><rect x="1050" y="379" width="150" height="27" rx="13" fill="#17243a"/><text x="1125" y="398" text-anchor="middle" fill="#c9bfef" font-size="13">decision commit missing</text>
    <text x="660" y="548" fill="#89a5bb" font-size="15">No state here means “the pull request is approved.”</text>
  </g>
  <g id="attribution-gap" font-family="system-ui"><rect x="390" y="615" width="500" height="70" rx="18" fill="#183a36" stroke="#63e6be" stroke-width="3"/><text x="640" y="643" text-anchor="middle" fill="#bff8e8" font-size="16" font-weight="750">COMPOSITE REVIEWER KEY</text><text x="640" y="669" text-anchor="middle" fill="#d8fff4" font-size="14">author + kind + AI seat / agent / model keep actions distinct</text></g>
</svg>
