<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">Stale evidence is repaired from a proposal</title>
  <desc id="diagram-desc">Each stale reference gets a proposed range from the diff; accept, refresh and landing repairs check every edit before writing any.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-primary-fill:#edf5ff;--diagram-primary-ink:#153869;--diagram-primary-stroke:#2563eb;--diagram-secondary-ink:#526174;--diagram-secondary-stroke:#94a3b8;--diagram-title-ink:#172033;}@media (prefers-color-scheme:dark){:root{--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-primary-fill:#0c2d6b;--diagram-primary-ink:#cae8ff;--diagram-primary-stroke:#4493f8;--diagram-secondary-ink:#9198a1;--diagram-secondary-stroke:#6e7681;--diagram-title-ink:#e6edf3;}}</style>
    <marker id="diagram-head-proposes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-accepts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-refreshes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-counts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-accept-writes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-refresh-writes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-onto-writes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 32)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">Stale evidence is repaired from a proposal</tspan></text>
  </g>
  <g id="stale-ref" data-diagram-kind="node" transform="translate(40 150)" role="group" aria-label="Stale reference">
    <rect width="250" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Stale reference</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">an edit landed inside its range</tspan></text>
  </g>
  <g id="propose-range" data-diagram-kind="node" transform="translate(360 130)" role="group" aria-label="Propose">
    <rect width="380" height="140" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">Propose</tspan></text>
    <text x="18" y="73" font-size="15" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="73">the pinned range mapped through the diff hunks</tspan></text>
  </g>
  <g id="stale-by-change" data-diagram-kind="node" transform="translate(360 320)" role="group" aria-label="stale_by_change">
    <rect width="380" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">stale_by_change</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">made stale by this change, or older debt</tspan></text>
  </g>
  <g id="repin-onto-freeze" data-diagram-kind="node" transform="translate(360 480)" role="group" aria-label="repin --onto">
    <rect width="380" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">repin --onto</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">a landed change: re-pin, freeze, record</tspan></text>
  </g>
  <g id="accept-proposed-scope" data-diagram-kind="node" transform="translate(820 130)" role="group" aria-label="repin --accept-proposed">
    <rect width="390" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">repin --accept-proposed</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">one scope: record, target, review or all</tspan></text>
  </g>
  <g id="refresh-coverage" data-diagram-kind="node" transform="translate(820 280)" role="group" aria-label="review refresh-coverage">
    <rect width="390" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">review refresh-coverage</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">re-pins moves, reports new lines</tspan></text>
  </g>
  <g id="validate-then-write" data-diagram-kind="node" transform="translate(820 440)" role="group" aria-label="Prepare, then write">
    <rect width="390" height="150" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">Prepare, then write</tspan></text>
    <text x="18" y="73" font-size="15" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="73">every edit checked before the first is written</tspan></text>
  </g>
  <g id="proposes" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="stale-ref to propose-range" data-from="stale-ref" data-to="propose-range">
    <path d="M290 200 L360 200" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-proposes)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="accepts" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="propose-range to accept-proposed-scope" data-from="propose-range" data-to="accept-proposed-scope">
    <path d="M740 185 L820 185" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-accepts)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="refreshes" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="propose-range to refresh-coverage" data-from="propose-range" data-to="refresh-coverage">
    <path d="M740 245 L780 245 L780 335 L820 335" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-refreshes)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="counts" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="propose-range to stale-by-change" data-from="propose-range" data-to="stale-by-change">
    <path d="M550 270 L550 320" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-counts)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="accept-writes" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="accept-proposed-scope to validate-then-write" data-from="accept-proposed-scope" data-to="validate-then-write">
    <path d="M1210 185 L1250 185 L1250 515 L1210 515" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-accept-writes)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="refresh-writes" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="refresh-coverage to validate-then-write" data-from="refresh-coverage" data-to="validate-then-write">
    <path d="M1015 390 L1015 440" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-refresh-writes)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="onto-writes" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="repin-onto-freeze to validate-then-write" data-from="repin-onto-freeze" data-to="validate-then-write">
    <path d="M740 535 L820 535" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-onto-writes)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="explicit" data-diagram-kind="text" transform="translate(60 628)" aria-hidden="true">
    <text x="0" y="15" font-size="15" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="0" y="15">Accepting is explicit: a proposal says where the lines went, never that the explanation still holds.</tspan></text>
  </g>
</svg>
