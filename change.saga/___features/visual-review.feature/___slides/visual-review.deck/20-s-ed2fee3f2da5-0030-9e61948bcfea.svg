<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Review comment mutation failure boundaries</title>
  <desc id="desc">Validation and shown-snapshot refusals happen before append. A saved receipt confirms persistence; a missing receipt is uncertain and must not cause a blind retry.</desc>
  <defs>
    <style>.ui{font-family:Inter,system-ui,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,monospace}.h{font-size:30px;font-weight:750;fill:#10213d}.sub{font-size:15px;fill:#526178}.q{font-size:15px;font-weight:700;fill:#18304f}.small{font-size:13px;fill:#42536d}.status{font-size:15px;font-weight:800}.flow{stroke:#42659c;stroke-width:3;fill:none;marker-end:url(#a)}.reject{stroke:#b3384a;stroke-width:2.5;fill:none;marker-end:url(#r)}</style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#42659c"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#b3384a"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text class="ui h" x="55" y="54">Refused writes and lost confirmations are different</text>
  <text class="ui sub" x="55" y="81">Validate before append; after append, require confirmation before clearing drafts or offering another write.</text>

  <g id="bounded-input" class="ui">
    <rect x="62" y="118" width="236" height="78" rx="17" fill="#e9f1ff" stroke="#4f78b2" stroke-width="2"/>
    <text class="q" x="84" y="148">POST form parses?</text><text class="small" x="84" y="174">body capped at 256 KiB</text>
  </g>
  <path class="flow" d="M298 157H354"/>
  <path class="reject" d="M180 196V246"/><g class="ui"><rect x="107" y="246" width="146" height="48" rx="12" fill="#fff0f1" stroke="#b3384a"/><text class="status" x="145" y="276" fill="#962b3b">400</text><text class="small" x="184" y="276">invalid</text></g>

  <g id="session-token" class="ui">
    <polygon points="438,113 522,157 438,201 354,157" fill="#fff6dc" stroke="#b48632" stroke-width="2"/>
    <text class="q" x="395" y="153">token</text><text class="small" x="397" y="174">matches?</text>
  </g>
  <path class="flow" d="M522 157H575"/>
  <path class="reject" d="M438 201V246"/><g class="ui"><rect x="365" y="246" width="146" height="48" rx="12" fill="#fff0f1" stroke="#b3384a"/><text class="status" x="403" y="276" fill="#962b3b">403</text><text class="small" x="442" y="276">forbidden</text></g>

  <g id="saga-review" class="ui">
    <polygon points="659,113 743,157 659,201 575,157" fill="#fff6dc" stroke="#b48632" stroke-width="2"/>
    <text class="q" x="612" y="153">Saga valid?</text><text class="small" x="610" y="174">review exists?</text>
  </g>
  <path class="flow" d="M743 157H796"/>
  <path class="reject" d="M659 201V246"/><g class="ui"><rect x="570" y="246" width="178" height="48" rx="12" fill="#fff0f1" stroke="#b3384a"/><text class="status" x="590" y="276" fill="#962b3b">500 / 404</text><text class="small" x="680" y="276">no write</text></g>

  <g id="mutable-range" class="ui">
    <polygon points="880,113 964,157 880,201 796,157" fill="#fff6dc" stroke="#b48632" stroke-width="2"/>
    <text class="q" x="834" y="149">open review?</text><text class="small" x="829" y="171">shown view current?</text>
  </g>
  <path class="flow" d="M964 157H1017"/>
  <path class="reject" d="M880 201V246"/><g class="ui"><rect x="807" y="246" width="146" height="48" rx="12" fill="#fff0f1" stroke="#b3384a"/><text class="status" x="845" y="276" fill="#962b3b">409</text><text class="small" x="884" y="276">conflict</text></g>

  <g id="domain-validation" class="ui">
    <polygon points="1101,113 1185,157 1101,201 1017,157" fill="#fff6dc" stroke="#b48632" stroke-width="2"/>
    <text class="q" x="1053" y="145">valid target</text><text class="small" x="1055" y="166">body · state</text><text class="small" x="1055" y="183">reviewer · commit</text>
  </g>
  <path class="reject" d="M1101 201V246"/><g class="ui"><rect x="1028" y="246" width="146" height="48" rx="12" fill="#fff0f1" stroke="#b3384a"/><text class="status" x="1066" y="276" fill="#962b3b">400</text><text class="small" x="1105" y="276">rejected</text></g>

  <path class="flow" d="M1185 157H1230V387H966"/>
  <text class="ui small" x="1193" y="145" fill="#2d5b91">valid</text>
  <g id="durable-append" class="ui">
    <rect x="478" y="330" width="488" height="114" rx="22" fill="#f1ecff" stroke="#7259ab" stroke-width="3"/>
    <text class="q" x="516" y="366">Critical section</text>
    <text class="small" x="516" y="394">lock → reload → target → frozen + snapshot checks</text>
    <text class="mono small" x="516" y="420">store.WriteJSON(..., exclusive=true)</text>
  </g>
  <path class="flow" d="M722 444V508"/>
  <g id="success-outcome" class="ui">
    <rect x="478" y="508" width="488" height="112" rx="22" fill="#eaf8ef" stroke="#47815d" stroke-width="3"/>
    <text class="q" x="516" y="545">JSON receipt: saved + event ID</text>
    <text class="small" x="516" y="573">Feedback updates in place; ordinary forms still use 303.</text>
    <text class="small" x="516" y="597">Lost receipt: keep draft, check feedback, do not resubmit.</text>
  </g>
  <text class="ui sub" x="55" y="675">Every red refusal precedes publication of <tspan class="mono">comments/&lt;event&gt;.json</tspan>.</text>
</svg>
