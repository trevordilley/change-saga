<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Visual review ownership boundaries</title>
  <desc id="desc">The browser review surface calls a thin HTTP adapter. Read projection belongs to reviewstate, serialized writes to reviewstore, and durable review records to change.saga. Spatial annotations use the same comment writer and a projected annotation read route; prototype annotations remain separate requirement links.</desc>
  <defs>
    <style>
      .ui{font-family:Inter,system-ui,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,monospace}.h{font-size:30px;font-weight:750;fill:#10213d}.sub{font-size:15px;fill:#526178}.label{font-size:20px;font-weight:700;fill:#14233e}.small{font-size:14px;fill:#42526b}.micro{font-size:12px;fill:#5c6b82}.box{stroke-width:2}.arrow{fill:none;stroke:#60718d;stroke-width:3;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#60718d"/></marker>
    <pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 12L12-2M4 16L16 4" stroke="#f3a4ad" stroke-width="2"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="#f7f9fc"/>
  <text class="ui h" x="60" y="55">Visual review is a read projection plus a locked append path</text>
  <text class="ui sub" x="60" y="82">Comments and spatial annotations share durable review history; prototype requirement pins remain separate.</text>

  <g id="browser-surface">
    <rect class="box" x="60" y="112" width="1160" height="120" rx="20" fill="#e8f1ff" stroke="#4876b8"/>
    <text class="ui label" x="88" y="146">Browser review surface</text>
    <rect x="88" y="166" width="288" height="42" rx="10" fill="#fff" stroke="#9bb8de"/>
    <text class="ui small" x="108" y="192">slide visual · SVG / image / HTML</text>
    <rect x="402" y="166" width="262" height="42" rx="10" fill="#fff" stroke="#9bb8de"/>
    <text class="ui small" x="422" y="192">semantic Items + code diffs</text>
    <rect x="690" y="166" width="235" height="42" rx="10" fill="#fff" stroke="#9bb8de"/>
    <text class="ui small" x="710" y="192">thread + comment form</text>
    <rect x="951" y="166" width="241" height="42" rx="10" fill="#fff" stroke="#9bb8de"/>
    <text class="ui small" x="971" y="192">drawing tools + anchored notes</text>
  </g>

  <path class="arrow" d="M640 232V274"/>
  <g id="http-adapter">
    <rect class="box" x="385" y="274" width="510" height="92" rx="18" fill="#fff8df" stroke="#c08a25"/>
    <text class="ui label" x="414" y="308">HTTP adapter · internal/server</text>
    <text class="ui small" x="414" y="337">GET composes the page · POST gates token, review state, and current head</text>
    <text class="mono micro" x="414" y="357">/reviews/:id  ·  /visual/:slide  ·  /comment</text>
  </g>

  <path class="arrow" d="M510 366L365 414"/>
  <path class="arrow" d="M770 366L914 414"/>
  <g id="report-projection">
    <rect class="box" x="70" y="414" width="495" height="112" rx="18" fill="#eaf8ef" stroke="#45825c"/>
    <text class="ui label" x="98" y="449">Read owner · reviewstate</text>
    <text class="ui small" x="98" y="478">Resolve base..head → build slide report → group comments into threads</text>
    <text class="ui small" x="98" y="505">Range errors become diagnostics; the report remains readable.</text>
  </g>
  <g id="locked-writer">
    <rect class="box" x="715" y="414" width="495" height="112" rx="18" fill="#f2edff" stroke="#7056ad"/>
    <text class="ui label" x="743" y="449">Write owner · reviewstore</text>
    <text class="ui small" x="743" y="478">Saga lock → reload → resolve canonical target → append JSON</text>
    <text class="ui small" x="743" y="505">The writer records actions; it never computes a review verdict.</text>
  </g>

  <path class="arrow" d="M320 526L320 571L520 571"/>
  <path class="arrow" d="M960 526L960 571L760 571"/>
  <g id="git-storage">
    <rect class="box" x="390" y="558" width="500" height="102" rx="18" fill="#e8edf5" stroke="#65758e"/>
    <text class="ui label" x="418" y="593">Durable boundary · Git-backed Saga</text>
    <text class="mono small" x="418" y="620">___reviews/&lt;id&gt;.review/deck/</text>
    <text class="mono small" x="418" y="644">___reviews/&lt;id&gt;.review/comments/&lt;event&gt;.json</text>
  </g>

  <g id="missing-overlay">
    <rect x="936" y="558" width="274" height="102" rx="18" fill="#eaf8ef" stroke="#45825c" stroke-width="3"/>
    <text class="ui label" x="960" y="587" fill="#8f2032">Spatial review marks</text>
    <text class="ui micro" x="960" y="610" fill="#8f2032">anchor on comment · locked writer</text>
    <text class="ui micro" x="960" y="632" fill="#8f2032">create / update / delete events</text>
    <text class="ui micro" x="960" y="651" fill="#8f2032">GET projects current geometry</text>
  </g>
</svg>
