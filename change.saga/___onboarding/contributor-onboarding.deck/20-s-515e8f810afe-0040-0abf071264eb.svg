<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Learning the app is not reviewing a change</title><desc id="desc">Without --against the app observes the selected head, with current code references and health warnings rather than changed-line coverage. On a feature branch, --against main derives the merge-base comparison. Existing pull-request review decks hold the actual review comments and decisions; comparison alone does not create a review. Contextual comments exist, but the current implementation does not provide freehand, shape or text review overlays. Do not confuse prototype annotations with implemented review markup.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#087e83"/></marker></defs><rect width="1280" height="720" fill="#f6f4ed"/><path d="M0 0 H1280 V8 H0Z" fill="#087e83"/><text x="64" y="48" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="64" dy="0">CHANGE SAGA  /  UNDERSTAND</tspan></text><text x="1129" y="48" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1129" dy="0">05 / 12</tspan></text><text x="64" y="110" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400"><tspan x="64" dy="0">Learning the app is not reviewing a change</tspan></text><g id="docs"><rect x="64" y="174" width="550" height="343" rx="14" fill="#dfefea" stroke="#087e83" stroke-width="2"/><text x="90" y="215" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="90" dy="0">DOCUMENTATION</tspan></text><text x="90" y="260" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400"><tspan x="90" dy="0">What is true now?</tspan></text><text x="90" y="313" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="90" dy="0">Overview → feature → implementation</tspan><tspan x="90" dy="32">Terms, stories, designs and evidence</tspan><tspan x="90" dy="32">No comments or approval controls</tspan></text><text x="90" y="448" fill="#142e3a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan x="90" dy="0">./bin/change-saga open change.saga</tspan></text></g><g id="review"><rect x="650" y="174" width="566" height="343" rx="14" fill="#fffefa" stroke="#a5680c" stroke-width="2"/><text x="676" y="215" fill="#a5680c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="676" dy="0">REVIEW</tspan></text><text x="676" y="260" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400"><tspan x="676" dy="0">What changed—and why?</tspan></text><text x="676" y="313" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="676" dy="0">Pull-request deck → changed code</tspan><tspan x="676" dy="32">Comments + per-slide decisions</tspan><tspan x="676" dy="32">Human / AI attribution is explicit</tspan></text><text x="676" y="442" fill="#142e3a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan x="676" dy="0">./bin/change-saga open \</tspan><tspan x="676" dy="28">  --against main change.saga</tspan></text></g><g id="gap"><rect x="64" y="545" width="1152" height="63" rx="14" fill="#fae6df" stroke="#b3483b" stroke-width="2"/><text x="86" y="584" fill="#b3483b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="86" dy="0">Known gap: review freehand, shape and text overlays are not implemented yet.</tspan></text></g><path d="M64 647 H1216" stroke="#a8babc"/><text x="64" y="684" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="64" dy="0">Observe current documentation to learn; compare committed revisions to understand a change.</tspan></text></svg>
