<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Use the cheapest check that tells the truth</title><desc id="desc">go test ./internal/coderef is a small smoke check verified during deck authoring. For a real change select the specific affected package or test. CONTRIBUTING.md lists formatting, vet, race tests and build checks. gofmt -l must print nothing. Run relevant targeted checks early and broad checks before handoff. Use the Node version in e2e/.node-version. In e2e install locked dependencies and Chromium, then npm test. The fixture builds the real Go binary and starts isolated servers; use test:all-browsers for Firefox and WebKit too. The full suite is not claimed green by this deck. Compare a failure with the same test on the base before deciding whether it is a regression. Do not weaken an assertion merely to get a pass.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#087e83"/></marker></defs><rect width="1280" height="720" fill="#f6f4ed"/><path d="M0 0 H1280 V8 H0Z" fill="#087e83"/><text x="64" y="48" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="64" dy="0">CHANGE SAGA  /  ITERATE</tspan></text><text x="1129" y="48" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1129" dy="0">09 / 12</tspan></text><text x="64" y="110" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400"><tspan x="64" dy="0">Use the cheapest check that tells the truth</tspan></text><g id="focused"><rect x="64" y="174" width="1152" height="105" rx="14" fill="#142e3a" stroke="#142e3a" stroke-width="2"/><text x="86" y="207" fill="#a9ddd8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="86" dy="0">FAST SANITY CHECK · a small real package</tspan></text><text x="86" y="243" fill="#f6f4ed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan x="86" dy="0">go test ./internal/coderef</tspan></text></g><g id="go"><rect x="64" y="321" width="548" height="239" rx="14" fill="#142e3a" stroke="#142e3a" stroke-width="2"/><text x="86" y="354" fill="#a9ddd8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="86" dy="0">GO PREFLIGHT · repository root</tspan></text><text x="86" y="390" fill="#f6f4ed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan x="86" dy="0">gofmt -l cmd internal</tspan><tspan x="86" dy="28">go vet ./...</tspan><tspan x="86" dy="28">go test -race ./...</tspan><tspan x="86" dy="28">go build ./cmd/change-saga</tspan></text></g><g id="browser"><rect x="651" y="321" width="565" height="239" rx="14" fill="#142e3a" stroke="#142e3a" stroke-width="2"/><text x="673" y="354" fill="#a9ddd8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="673" dy="0">RENDERER CHANGES · Node 22.22.3</tspan></text><text x="673" y="390" fill="#f6f4ed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan x="673" dy="0">cd e2e</tspan><tspan x="673" dy="28">npm ci</tspan><tspan x="673" dy="28">npx playwright install chromium</tspan><tspan x="673" dy="28">npm test</tspan></text></g><g id="honest"><text x="64" y="600" fill="#b3483b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="64" dy="0">Failure? Reproduce on the base revision before attributing it to your edit.</tspan></text><text x="64" y="628" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="64" dy="0">Browser matrix: npm run test:all-browsers   ·   guidance: CONTRIBUTING.md + e2e/README.md</tspan></text></g><path d="M64 647 H1216" stroke="#a8babc"/><text x="64" y="684" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="64" dy="0">Focused tests shorten the loop; the full Go and browser suites still matter before a behavioral change is ready.</tspan></text></svg>
