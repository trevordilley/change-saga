<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Edit → test → rebuild → restart</title><desc id="desc">Source entrypoint cmd/change-saga dispatches into CLI, domain, and server packages. For UI work inspect internal/server/template.go, styles.go and appjs.go. Run tests for the behavior you change before broad checks. Tests and error output tell you whether your edit behaves as intended. The server template, CSS and JavaScript are Go constants. Build the executable again after changing them. Stop your attached server, rerun its serve command, then refresh. Refresh alone cannot load Go source changes into an old running process. This is not a separate frontend development server; Node is for the end-to-end test harness, not for normal serving.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#087e83"/></marker></defs><rect width="1280" height="720" fill="#f6f4ed"/><path d="M0 0 H1280 V8 H0Z" fill="#087e83"/><text x="64" y="48" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="64" dy="0">CHANGE SAGA  /  ITERATE</tspan></text><text x="1129" y="48" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1129" dy="0">08 / 12</tspan></text><text x="64" y="110" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400"><tspan x="64" dy="0">Edit → test → rebuild → restart</tspan></text><g id="edit"><rect x="64" y="178" width="442" height="166" rx="14" fill="#dfefea" stroke="#a8babc" stroke-width="2"/><text x="86" y="217" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="86" dy="0">1  Edit the right layer</tspan></text><text x="86" y="254" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="86" dy="0">CLI behavior: internal/cli</tspan><tspan x="86" dy="31">Browser UI: internal/server</tspan><tspan x="86" dy="31">Domain rules: owning package</tspan></text></g><g id="test"><rect x="774" y="178" width="442" height="166" rx="14" fill="#fffefa" stroke="#a8babc" stroke-width="2"/><text x="796" y="217" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="796" dy="0">2  Run a focused test</tspan></text><text x="796" y="259" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="796" dy="0">Start with the smallest relevant</tspan><tspan x="796" dy="31">package or named test.</tspan><tspan x="796" dy="31">Broaden checks before handoff.</tspan></text><path d="M506 261 H761" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/></g><g id="rebuild"><rect x="774" y="427" width="442" height="173" rx="14" fill="#142e3a" stroke="#142e3a" stroke-width="2"/><text x="796" y="466" fill="#fffefa" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="796" dy="0">3  Rebuild the executable</tspan></text><text x="796" y="512" fill="#fffefa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan x="796" dy="0">go build -o ./bin/change-saga \</tspan><tspan x="796" dy="28">  ./cmd/change-saga</tspan></text><path d="M995 344 V414" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/></g><g id="restart"><rect x="64" y="427" width="442" height="173" rx="14" fill="#fff0d4" stroke="#a8babc" stroke-width="2"/><text x="86" y="466" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="86" dy="0">4  Restart + refresh</tspan></text><text x="86" y="511" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="86" dy="0">Ctrl-C in Terminal A</tspan><tspan x="86" dy="31">Rerun the serve command</tspan><tspan x="86" dy="31">Reload the browser</tspan></text><path d="M774 514 H519" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><path d="M285 427 V357" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/></g><g id="boundary"><text x="534" y="354" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="534" dy="0">Go templates, CSS</tspan><tspan x="534" dy="27">and app JavaScript</tspan><tspan x="534" dy="27">ship in the binary.</tspan></text></g><path d="M64 647 H1216" stroke="#a8babc"/><text x="64" y="684" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="64" dy="0">There is no automatic Go hot reload: a new binary on disk does not replace the process already serving your browser.</tspan></text></svg>
