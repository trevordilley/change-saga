<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Know where each kind of knowledge lives</title><desc id="desc">Shared language and people live above the feature domains; use Terms and vocabulary whenever a name is unfamiliar. A feature groups product, design, quality and implementation as a durable domain rather than a temporary change. Product records retain prototypes, persona-focused stories, and independent acceptance criteria. Design records explain the intended experience or technical shape and address product criteria. Test cases, quality policies and result history provide criterion-level evidence. A feature implementation deck explains current code through semantic slide Items.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#087e83"/></marker></defs><rect width="1280" height="720" fill="#f6f4ed"/><path d="M0 0 H1280 V8 H0Z" fill="#087e83"/><text x="64" y="48" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="64" dy="0">CHANGE SAGA  /  UNDERSTAND</tspan></text><text x="1129" y="48" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1129" dy="0">02 / 12</tspan></text><text x="64" y="110" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400"><tspan x="64" dy="0">Know where each kind of knowledge lives</tspan></text><g id="overview"><rect x="64" y="173" width="1152" height="85" rx="14" fill="#142e3a" stroke="#142e3a" stroke-width="2"/><text x="88" y="207" fill="#a9ddd8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="88" dy="0">APP OVERVIEW</tspan></text><text x="88" y="240" fill="#fffefa" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="88" dy="0">Personas  ·  Terms and vocabulary  ·  Onboarding  ·  Design system</tspan></text></g><rect x="64" y="287" width="1152" height="302" rx="18" fill="none" stroke="#087e83" stroke-width="3"/><g id="feature"><text x="89" y="326" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="89" dy="0">FEATURE  /  one lasting product area</tspan></text></g><g id="product"><rect x="89" y="350" width="252" height="209" rx="14" fill="#fffefa" stroke="#a8babc" stroke-width="2"/><text x="111" y="389" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="111" dy="0">Product</tspan></text><text x="111" y="426" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="111" dy="0">Prototypes</tspan><tspan x="111" dy="31">Stories + criteria</tspan><tspan x="111" dy="31">What value?</tspan></text></g><g id="design"><rect x="373" y="350" width="252" height="209" rx="14" fill="#fffefa" stroke="#a8babc" stroke-width="2"/><text x="395" y="389" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="395" dy="0">Design</tspan></text><text x="395" y="426" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="395" dy="0">UX / UI / technical</tspan><tspan x="395" dy="31">Decisions + rationale</tspan><tspan x="395" dy="31">What shape?</tspan></text></g><g id="quality"><rect x="657" y="350" width="252" height="209" rx="14" fill="#fffefa" stroke="#a8babc" stroke-width="2"/><text x="679" y="389" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="679" dy="0">Quality</tspan></text><text x="679" y="426" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="679" dy="0">Tests + policies</tspan><tspan x="679" dy="31">Immutable runs</tspan><tspan x="679" dy="31">What proof?</tspan></text></g><g id="implementation"><rect x="941" y="350" width="250" height="209" rx="14" fill="#fffefa" stroke="#a8babc" stroke-width="2"/><text x="963" y="389" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="963" dy="0">Implementation</tspan></text><text x="963" y="426" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="963" dy="0">Visual deck</tspan><tspan x="963" dy="31">Element-level links</tspan><tspan x="963" dy="31">What code?</tspan></text></g><path d="M64 647 H1216" stroke="#a8babc"/><text x="64" y="684" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="64" dy="0">A feature is a durable product domain, not a branch or a pull request.</tspan></text></svg>
