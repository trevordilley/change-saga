<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Local inputs, shared models, two surfaces</title><desc id="desc">The Saga and Git checkout are local inputs; a companion repository can provide the Saga separately with explicit source context. Domain packages load records; livingapp composes product state, while reviewapp provides bounded queries and source resolution. The CLI dispatches queries and mutations and exposes structured results to agents. The Go server renders the UI with templates, styles and JavaScript compiled into the executable. CLI authoring uses domain writers; structured records are validated before publication. Querying does not mutate them.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#087e83"/></marker></defs><rect width="1280" height="720" fill="#f6f4ed"/><path d="M0 0 H1280 V8 H0Z" fill="#087e83"/><text x="64" y="48" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="64" dy="0">CHANGE SAGA  /  UNDERSTAND</tspan></text><text x="1129" y="48" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1129" dy="0">04 / 12</tspan></text><text x="64" y="110" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400"><tspan x="64" dy="0">Local inputs, shared models, two surfaces</tspan></text><g id="inputs"><rect x="64" y="187" width="296" height="292" rx="14" fill="#dfefea" stroke="#a8babc" stroke-width="2"/><text x="88" y="227" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="88" dy="0">Local source of truth</tspan></text><text x="88" y="278" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="88" dy="0">app.saga/</tspan><tspan x="88" dy="31">Versioned knowledge</tspan><tspan x="88" dy="31"></tspan><tspan x="88" dy="31">+ Git checkout</tspan><tspan x="88" dy="31">Commits + source bytes</tspan></text></g><g id="models"><rect x="462" y="222" width="337" height="218" rx="14" fill="#142e3a" stroke="#142e3a" stroke-width="2"/><text x="486" y="265" fill="#fffefa" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400"><tspan x="486" dy="0">Read + compose</tspan></text><text x="486" y="308" fill="#fffefa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21"><tspan x="486" dy="0">saga / requirements</tspan><tspan x="486" dy="29">quality / prototypes</tspan><tspan x="486" dy="29">livingapp / reviewapp</tspan><tspan x="486" dy="29">coderef / coderesolve</tspan></text><path d="M360 333 H450" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><text x="367" y="303" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="367" dy="0">validate</tspan></text></g><g id="cli"><rect x="906" y="176" width="310" height="151" rx="14" fill="#fffefa" stroke="#a8babc" stroke-width="2"/><text x="930" y="216" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400"><tspan x="930" dy="0">CLI / AI</tspan></text><text x="930" y="256" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="930" dy="0">internal/cli</tspan><tspan x="930" dy="31">Bounded JSON queries</tspan></text><path d="M799 290 H852 V251 H895" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/></g><g id="browser"><rect x="906" y="392" width="310" height="151" rx="14" fill="#fff0d4" stroke="#a8babc" stroke-width="2"/><text x="930" y="432" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400"><tspan x="930" dy="0">Browser</tspan></text><text x="930" y="472" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="930" dy="0">internal/server</tspan><tspan x="930" dy="31">Loopback HTTP + assets</tspan></text><path d="M799 367 H852 V466 H895" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/></g><g id="writes"><path d="M1060 176 V151 H210 V176" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><text x="372" y="139" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="372" dy="0">CLI writers validate records before publishing them</tspan></text><text x="64" y="572" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="64" dy="0">No hosted service or database to provision.</tspan></text></g><path d="M64 647 H1216" stroke="#a8babc"/><text x="64" y="684" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="64" dy="0">The Go executable supplies both the CLI and browser UI; Node is needed for browser tests, not for serving the app.</tspan></text></svg>
