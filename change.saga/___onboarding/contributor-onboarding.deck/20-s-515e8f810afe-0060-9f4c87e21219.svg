<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Start the app and find your way around</title><desc id="desc">From the repo root, start the local server at an explicit loopback port and leave that terminal attached. Under DevSwarm run services through hivecontrol exec service -- followed by this command. Open the printed URL, select the Overview Onboarding deck, and follow its slide thumbnails. Terms and vocabulary lets you inspect a definition, its related stories and defining code. Stop the foreground server you started with Ctrl-C. If its requested port is occupied, use a different loopback port such as 7343; do not stop someone else's process. The open command starts or reuses a managed background viewer. ./bin/change-saga serve status change.saga reports it; ./bin/change-saga serve stop change.saga stops managed viewers for that Saga.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#087e83"/></marker></defs><rect width="1280" height="720" fill="#f6f4ed"/><path d="M0 0 H1280 V8 H0Z" fill="#087e83"/><text x="64" y="48" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="64" dy="0">CHANGE SAGA  /  RUN</tspan></text><text x="1129" y="48" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1129" dy="0">07 / 12</tspan></text><text x="64" y="110" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400"><tspan x="64" dy="0">Start the app and find your way around</tspan></text><g id="serve"><rect x="64" y="172" width="1152" height="117" rx="14" fill="#142e3a" stroke="#142e3a" stroke-width="2"/><text x="86" y="205" fill="#a9ddd8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="86" dy="0">TERMINAL A · keep this running</tspan></text><text x="86" y="241" fill="#f6f4ed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan x="86" dy="0">./bin/change-saga serve --addr 127.0.0.1:7342 change.saga</tspan></text></g><g id="browse"><path d="M352 289 V337" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><text x="382" y="322" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="382" dy="0">open in your browser</tspan></text><rect x="64" y="349" width="638" height="188" rx="14" fill="#dfefea" stroke="#087e83" stroke-width="2"/><text x="90" y="394" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400"><tspan x="90" dy="0">http://127.0.0.1:7342</tspan></text><text x="90" y="440" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="90" dy="0">Overview → Onboarding → select a slide</tspan><tspan x="90" dy="31">Terms → one definition → linked story / code</tspan></text></g><g id="control"><rect x="748" y="349" width="468" height="188" rx="14" fill="#fff0d4" stroke="#a8babc" stroke-width="2"/><text x="770" y="388" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="770" dy="0">You own this process</tspan></text><text x="770" y="425" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="770" dy="0">Ctrl-C stops this foreground server.</tspan><tspan x="770" dy="31">Port in use? Pick another loopback port.</tspan><tspan x="770" dy="31">Do not kill an unrelated process.</tspan></text></g><g id="managed"><text x="64" y="587" fill="#142e3a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23"><tspan x="64" dy="0">Just reading?  ./bin/change-saga open change.saga</tspan></text><text x="64" y="619" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="64" dy="0">open manages a background server; use serve status / serve stop to manage it.</tspan></text></g><path d="M64 647 H1216" stroke="#a8babc"/><text x="64" y="684" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="64" dy="0">Use a foreground server for development so you can see errors and stop the process you started.</tspan></text></svg>
