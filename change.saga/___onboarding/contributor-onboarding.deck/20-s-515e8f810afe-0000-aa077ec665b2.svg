<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">One shared trail from intent to code</title><desc id="desc">Product managers turn discovery into stories and follow their intent into implementation. Designers translate product intent into experience and inspect how designs are used. Architects connect requirements and designs to technical decisions and concrete implementation. Developers explain changes, inspect impact, and review code in context. All four roles use one Git-native Saga whose linked records connect product intent to implementation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#087e83"/></marker></defs><rect width="1280" height="720" fill="#f6f4ed"/><path d="M0 0 H1280 V8 H0Z" fill="#087e83"/><text x="64" y="48" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="64" dy="0">CHANGE SAGA  /  UNDERSTAND</tspan></text><text x="1129" y="48" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1129" dy="0">01 / 12</tspan></text><text x="64" y="110" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400"><tspan x="64" dy="0">One shared trail from intent to code</tspan></text><g id="pm"><rect x="64" y="188" width="295" height="145" rx="14" fill="#dfefea" stroke="#a8babc" stroke-width="2"/><text x="86" y="227" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="86" dy="0">Product manager</tspan></text><text x="86" y="264" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="86" dy="0">Interviews → stories</tspan><tspan x="86" dy="31">Keep intent connected</tspan></text></g><g id="designer"><rect x="64" y="412" width="295" height="145" rx="14" fill="#dfefea" stroke="#a8babc" stroke-width="2"/><text x="86" y="451" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="86" dy="0">Designer</tspan></text><text x="86" y="488" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="86" dy="0">Stories → experience</tspan><tspan x="86" dy="31">Trace design into code</tspan></text></g><g id="architect"><rect x="923" y="188" width="293" height="145" rx="14" fill="#fff0d4" stroke="#a8babc" stroke-width="2"/><text x="945" y="227" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="945" dy="0">Architect</tspan></text><text x="945" y="264" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="945" dy="0">Design → technical vision</tspan><tspan x="945" dy="31">Inspect the implementation</tspan></text></g><g id="developer"><rect x="923" y="412" width="293" height="145" rx="14" fill="#fff0d4" stroke="#a8babc" stroke-width="2"/><text x="945" y="451" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="945" dy="0">Developer</tspan></text><text x="945" y="488" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"><tspan x="945" dy="0">Code → impact + review</tspan><tspan x="945" dy="31">Keep changes explainable</tspan></text></g><g id="shared"><rect x="460" y="222" width="360" height="283" rx="14" fill="#142e3a" stroke="#142e3a" stroke-width="2"/><text x="489" y="268" fill="#fffefa" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400"><tspan x="489" dy="0">The app’s Saga</tspan></text><text x="489" y="314" fill="#fffefa" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="489" dy="0">Product intent</tspan><tspan x="489" dy="34">Design + quality</tspan><tspan x="489" dy="34">Implementation diagrams</tspan></text><text x="489" y="454" fill="#a9ddd8" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400"><tspan x="489" dy="0">Versioned beside the code</tspan></text><path d="M359 261 H451" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><path d="M359 483 H414 V440 H451" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><path d="M923 261 H829" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><path d="M923 483 H872 V440 H829" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/></g><path d="M64 647 H1216" stroke="#a8babc"/><text x="64" y="684" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="64" dy="0">Stories explain why; diagrams explain how; code and tests keep the explanation checkable.</tspan></text></svg>
