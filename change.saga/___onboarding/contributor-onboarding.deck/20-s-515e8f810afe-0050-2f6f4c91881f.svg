<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Build the contributor’s copy</title><desc id="desc">Use Git and the Go version pinned by .go-version, currently 1.26.1. Browser tests additionally use e2e/.node-version, currently Node 22.22.3. From the repository root, check Go, build ./cmd/change-saga into ./bin/change-saga, inspect help, then validate change.saga. GOTOOLCHAIN=local can enforce the installed toolchain. Success means the build exits zero, CLI help prints, and validate --json reports a valid Saga; it is not a claim that the entire test suite passes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#087e83"/></marker></defs><rect width="1280" height="720" fill="#f6f4ed"/><path d="M0 0 H1280 V8 H0Z" fill="#087e83"/><text x="64" y="48" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="64" dy="0">CHANGE SAGA  /  RUN</tspan></text><text x="1129" y="48" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1129" dy="0">06 / 12</tspan></text><text x="64" y="110" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400"><tspan x="64" dy="0">Build the contributor’s copy</tspan></text><g id="tools"><text x="66" y="188" fill="#087e83" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="66" dy="0">PREREQUISITES</tspan></text><text x="66" y="228" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400"><tspan x="66" dy="0">Git + Go 1.26.1</tspan></text><text x="600" y="227" fill="#506773" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="600" dy="0">Exact Go pin: .go-version</tspan></text></g><g id="build"><rect x="64" y="268" width="1152" height="207" rx="14" fill="#142e3a" stroke="#142e3a" stroke-width="2"/><text x="86" y="301" fill="#a9ddd8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="86" dy="0">FROM A TRUSTED LOCAL CHECKOUT · repository root</tspan></text><text x="86" y="337" fill="#f6f4ed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan x="86" dy="0">go version</tspan><tspan x="86" dy="28">go build -o ./bin/change-saga ./cmd/change-saga</tspan><tspan x="86" dy="28">./bin/change-saga help</tspan><tspan x="86" dy="28">./bin/change-saga validate --json change.saga</tspan></text></g><g id="result"><path d="M640 475 V521" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="532" width="1152" height="73" rx="14" fill="#dfefea" stroke="#087e83" stroke-width="2"/><text x="88" y="576" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"><tspan x="88" dy="0">Checkpoint: the binary runs, and the Saga reports valid: true.</tspan></text></g><path d="M64 647 H1216" stroke="#a8babc"/><text x="64" y="684" fill="#142e3a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="64" dy="0">Run from the repository root with the pinned toolchain; the output is one local executable.</tspan></text></svg>
