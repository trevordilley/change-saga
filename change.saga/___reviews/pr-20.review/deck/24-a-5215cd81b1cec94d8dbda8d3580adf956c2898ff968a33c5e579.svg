<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">Sections, stickies, and annotations</title>
  <desc id="diagram-desc">Diagrams gain tabbed, nestable sections, shadowed stickies, and bubbles, pins, highlights, and brackets, all coloured from one fixed palette.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-blue-accent:#1d4ed8;--diagram-blue-tint:#e8f1ff;--diagram-gray-accent:#475569;--diagram-gray-ink:#0f172a;--diagram-gray-tint:#f1f5f9;--diagram-green-accent:#15803d;--diagram-green-ink:#052e16;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-on-accent:#ffffff;--diagram-purple-accent:#6d28d9;--diagram-purple-tint:#f1ebff;--diagram-secondary-ink:#526174;--diagram-shadow:#0f172a;--diagram-title-ink:#172033;--diagram-yellow-ink:#3f2d00;--diagram-yellow-mark:#facc15;--diagram-yellow-sticky:#fff3a3;}@media (prefers-color-scheme:dark){:root{--diagram-blue-accent:#58a6ff;--diagram-blue-tint:#121d2f;--diagram-gray-accent:#9198a1;--diagram-gray-ink:#e6edf3;--diagram-gray-tint:#1c2128;--diagram-green-accent:#56d364;--diagram-green-ink:#d2f8d9;--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-on-accent:#0d1117;--diagram-purple-accent:#bc8cff;--diagram-purple-tint:#1f1830;--diagram-secondary-ink:#9198a1;--diagram-shadow:#010409;--diagram-title-ink:#e6edf3;--diagram-yellow-ink:#fff5b1;--diagram-yellow-mark:#e3b341;--diagram-yellow-sticky:#4d4108;}}</style>
    <filter id="diagram-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.2" style="flood-color:var(--diagram-shadow,#0f172a)"/>
    </filter>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 28)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">The board layer, drawn with itself</tspan></text>
  </g>
  <g id="lane" data-diagram-kind="group" transform="translate(60 110)" role="group" aria-label="Section">
    <desc>A group with shape: section: a tinted frame whose label sits in a title tab inside its top-left corner. A title wider than the section is refused.</desc>
    <rect width="540" height="330" rx="10" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2" style="fill:var(--diagram-blue-tint,#e8f1ff);stroke:var(--diagram-blue-accent,#1d4ed8)"/>
    <path d="M0 39.5V10A10 10 0 0 1 10 0H90.976A10 10 0 0 1 100.976 10V39.5Z" fill="#1d4ed8" style="fill:var(--diagram-blue-accent,#1d4ed8)"/>
    <text x="12" y="28" font-size="22" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="28">Section</tspan></text>
    <g id="member" data-diagram-kind="node" transform="translate(30 80)" role="group" aria-label="Member">
      <rect width="190" height="80" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Member</tspan></text>
    </g>
    <g id="inner" data-diagram-kind="group" transform="translate(260 70)" role="group" aria-label="Nested section">
      <desc>Sections nest like any group: moving the outer section moves everything inside it.</desc>
      <rect width="255" height="230" rx="10" fill="#f1ebff" stroke="#6d28d9" stroke-width="2" style="fill:var(--diagram-purple-tint,#f1ebff);stroke:var(--diagram-purple-accent,#6d28d9)"/>
      <path d="M0 39.5V10A10 10 0 0 1 10 0H166.116A10 10 0 0 1 176.116 10V39.5Z" fill="#6d28d9" style="fill:var(--diagram-purple-accent,#6d28d9)"/>
      <text x="12" y="28" font-size="22" fill="#ffffff" xml:space="preserve" style="fill:var(--diagram-on-accent,#ffffff)"><tspan x="12" y="28">Nested section</tspan></text>
      <g id="glow" data-diagram-kind="annotation" transform="translate(15 62)" role="group" aria-label="highlight on child" data-about="child" data-annotation="highlight">
        <rect width="225" height="100" rx="6" fill="#facc15" fill-opacity="0.35" style="fill:var(--diagram-yellow-mark,#facc15)"/>
      </g>
      <g id="child" data-diagram-kind="node" transform="translate(27 72)" role="group" aria-label="Highlighted">
        <rect width="200" height="80" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
        <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Highlighted</tspan></text>
      </g>
    </g>
  </g>
  <g id="one" data-diagram-kind="annotation" transform="translate(264 174)" role="group" aria-label="Pin 1 on member" data-about="member" data-annotation="pin">
    <desc>A pin's width is its diameter; its label is at most three characters, drawn white on the palette accent.</desc>
    <circle cx="16" cy="16" r="16" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" style="fill:var(--diagram-blue-accent,#1d4ed8);stroke:var(--diagram-on-accent,#ffffff)"/>
    <text x="16" y="21.6" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" style="fill:var(--diagram-on-accent,#ffffff)">1</text>
  </g>
  <g id="store" data-diagram-kind="node" transform="translate(920 140)" role="group" aria-label="About element">
    <path d="M0 14C0 -4.667 230 -4.667 230 14V106C230 124.667 0 124.667 0 106Z" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <path d="M0 14C0 33 230 33 230 14" fill="none" stroke="#64748b" stroke-width="2" style="stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="62" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="62">About element</tspan></text>
  </g>
  <g id="two" data-diagram-kind="annotation" transform="translate(1134 124)" role="group" aria-label="Pin 2 on store" data-about="store" data-annotation="pin">
    <circle cx="16" cy="16" r="16" fill="#15803d" stroke="#ffffff" stroke-width="2" style="fill:var(--diagram-green-accent,#15803d);stroke:var(--diagram-on-accent,#ffffff)"/>
    <text x="16" y="21.6" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" style="fill:var(--diagram-on-accent,#ffffff)">2</text>
  </g>
  <g id="brace" data-diagram-kind="annotation" transform="translate(1170 140)" role="group" aria-label="Bracket" data-about="store" data-annotation="bracket">
    <path d="M0 0Q11 0 11 11L11 49Q11 60 22 60Q11 60 11 71L11 109Q11 120 0 120" fill="none" stroke="#15803d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--diagram-green-accent,#15803d)"/>
    <text x="28" y="61" font-size="15" fill="#052e16" xml:space="preserve" style="fill:var(--diagram-green-ink,#052e16)"><tspan x="28" y="61">Bracket</tspan></text>
  </g>
  <g id="bubble" data-diagram-kind="annotation" transform="translate(640 120)" role="group" aria-label="A bubble without a target points at its about element" data-about="store" data-annotation="bubble">
    <desc>Its pointer tip is the point of the about element's box nearest the bubble's centre, and must fall outside the bubble. An explicit element-local target overrides it.</desc>
    <path d="M10 0L220 0A10 10 0 0 1 230 10L230 43L280 55L230 67L230 100A10 10 0 0 1 220 110L10 110A10 10 0 0 1 0 100L0 10A10 10 0 0 1 10 0Z" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-linejoin="round" style="fill:var(--diagram-gray-tint,#f1f5f9);stroke:var(--diagram-gray-accent,#475569)"/>
    <text x="14" y="27" font-size="15" fill="#0f172a" xml:space="preserve" style="fill:var(--diagram-gray-ink,#0f172a)"><tspan x="14" y="27">A bubble without a target</tspan><tspan x="14" y="45.75">points at its about element</tspan></text>
  </g>
  <g id="sticky" data-diagram-kind="sticky" transform="translate(660 330)" role="group" aria-label="Style sets font size and stroke; colour comes from the palette." data-about="lane">
    <desc>Palette: yellow, pink, blue, green, purple, gray. Stickies and highlights default to yellow, the rest to gray. The shadow is one renderer-owned diagram-shadow filter.</desc>
    <rect width="220" height="220" rx="3" fill="#fff3a3" filter="url(#diagram-shadow)" style="fill:var(--diagram-yellow-sticky,#fff3a3)"/>
    <text x="16" y="38" font-size="22" fill="#3f2d00" xml:space="preserve" style="fill:var(--diagram-yellow-ink,#3f2d00)"><tspan x="16" y="38">Style sets font</tspan><tspan x="16" y="65.5">size and stroke;</tspan><tspan x="16" y="93">colour comes</tspan><tspan x="16" y="120.5">from the palette.</tspan></text>
  </g>
  <g id="legend" data-diagram-kind="text" transform="translate(60 600)" role="group" aria-label="Describe lists sections with their members, and every sticky and annotation as a note about its target.">
    <text x="0" y="15" font-size="15" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="0" y="15">Describe lists sections with their members, and every sticky and annotation as a note about its target.</tspan></text>
  </g>
</svg>
