<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">A browser check that fails on the old code</title>
  <desc id="desc">The new end-to-end spec opens six directory pages at a 390px touch viewport and at 1440px. It asserts the page stays at device width, the table sits in a named focusable region that scrolls without panning the page, arrow keys scroll that region, and nothing scrolls at desktop width. A Go test pins the region markup and rule. The spec passed in Chromium, Firefox and WebKit and failed on the old code.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#111827"/><stop offset="1" stop-color="#13283a"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#67e8f9"/></marker></defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="62" y="62" fill="#8ea6bf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="2">DIRECTORY WIDTH · 4 OF 4</text>
  <text x="62" y="112" fill="#f7fbff" font-family="Inter,system-ui,sans-serif" font-size="36" font-weight="750">A browser check that fails on the old code</text>
  <text x="62" y="146" fill="#aac0d5" font-family="Inter,system-ui,sans-serif" font-size="18">e2e/tests/directory-width.spec.ts plus one Go template test</text>
  <g id="narrow-check">
    <rect x="62" y="180" width="700" height="300" rx="16" fill="#0f1c2b" stroke="#67e8f9" stroke-width="2"/>
    <text x="86" y="210" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="800" text-anchor="start">390px TEST</text>
    <rect x="86" y="234" width="652" height="38" rx="8" fill="#13283a" stroke="#355a78"/><text x="104" y="259" fill="#e6edf3" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="400" text-anchor="start">for each of 6 directory pages at 390px (touch)</text>
    <path d="M412 272v10" stroke="#67e8f9" stroke-width="2"/>
    <rect x="86" y="282" width="652" height="38" rx="8" fill="#13283a" stroke="#355a78"/><text x="104" y="307" fill="#fde68a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">[innerWidth, scrollWidth] must equal [390, 390]</text>
    <path d="M412 320v10" stroke="#67e8f9" stroke-width="2"/>
    <rect x="86" y="330" width="652" height="38" rx="8" fill="#13283a" stroke="#355a78"/><text x="104" y="355" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="400" text-anchor="start">region named for the directory, tabindex 0, holds the table</text>
    <path d="M412 368v10" stroke="#67e8f9" stroke-width="2"/>
    <rect x="86" y="378" width="652" height="38" rx="8" fill="#13283a" stroke="#355a78"/><text x="104" y="403" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="400" text-anchor="start">table wider than region → region.scrollLeft > 0, page scrollX = 0</text>
    <path d="M412 416v10" stroke="#67e8f9" stroke-width="2"/>
    <rect x="86" y="426" width="652" height="38" rx="8" fill="#13283a" stroke="#355a78"/><text x="104" y="451" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="400" text-anchor="start">focus /features region, ArrowRight ×5 → it scrolls</text>
  </g>
  <g id="desktop-check">
    <rect x="62" y="498" width="700" height="72" rx="14" fill="#0f1c2b" stroke="#4b6a86" stroke-width="2"/>
    <text x="86" y="526" fill="#8ea6bf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="800" text-anchor="start">1440px TEST</text>
    <text x="86" y="552" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="400" text-anchor="start">each page: scrollWidth ≤ innerWidth and table width ≤ region width</text>
  </g>
  <g id="unit-check">
    <rect x="62" y="588" width="700" height="72" rx="14" fill="#0f1c2b" stroke="#4b6a86" stroke-width="2"/>
    <text x="86" y="616" fill="#8ea6bf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="800" text-anchor="start">GO TEST</text>
    <text x="86" y="642" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="400" text-anchor="start">TestDirectoryTableScrollsInsideItsOwnRegion: markup + CSS rule</text>
  </g>
  <g id="observed-results">
    <rect x="800" y="180" width="420" height="480" rx="16" fill="#0f2a1c" stroke="#22c55e" stroke-width="2"/>
    <text x="824" y="212" fill="#86efac" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="800" text-anchor="start">OBSERVED</text>
    <text x="824" y="250" fill="#f0fdf4" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="750" text-anchor="start">New code</text>
    <text x="824" y="280" fill="#bbf7d0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="400" text-anchor="start">chromium · firefox · webkit</text>
    <text x="824" y="306" fill="#86efac" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" text-anchor="start">6 passed</text>
    <text x="824" y="354" fill="#fecaca" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="750" text-anchor="start">Old code (fix reverted)</text>
    <text x="824" y="384" fill="#fecaca" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="400" text-anchor="start">“/features is wider than</text>
    <text x="824" y="408" fill="#fecaca" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="400" text-anchor="start"> the device”</text>
    <text x="824" y="456" fill="#f0fdf4" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="750" text-anchor="start">Neighbouring specs</text>
    <text x="824" y="486" fill="#bbf7d0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="400" text-anchor="start">section-directories (axe),</text>
    <text x="824" y="510" fill="#bbf7d0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="400" text-anchor="start">technical-inventory-ui, terms</text>
    <text x="824" y="534" fill="#86efac" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" text-anchor="start">10 passed (chromium)</text>
    <text x="824" y="590" fill="#bbf7d0" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="start">Firefox has no mobile viewport to</text>
    <text x="824" y="612" fill="#bbf7d0" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="start">emulate; there the page’s own scroll</text>
    <text x="824" y="634" fill="#bbf7d0" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="start">width carries the same check.</text>
  </g>
</svg>
