<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Three gates, no publication</title><desc id="desc">Implemented helper; not yet connected to public authoring or coverage.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306687"/></marker></defs><rect width="1280" height="720" fill="#f1f5f8"/><g font-family="Arial,sans-serif"><text x="50" y="48" font-size="17" fill="#47647a">TECHNICAL INVENTORY / INTERNAL FOUNDATION</text><text x="50" y="97" font-size="36" fill="#20384b">Three gates, no publication</text><text x="50" y="134" font-size="21" fill="#20384b">Implemented helper; not yet connected to public authoring or coverage.</text><g id="boundary"><rect x="50" y="161" width="1180" height="76" rx="10" fill="#dce8f0"/><text x="70" y="190" font-size="16" fill="#20384b">CALLER PRECONDITIONS</text><text x="70" y="219" font-size="22" fill="#20384b">Resolve saved views + exact endpoints; bind canonical source; own persistence and locks.</text></g><g id="pins"><rect x="50" y="253" width="1180" height="101" rx="10" fill="#ffffff"/><text x="70" y="281" font-size="17" fill="#47647a">NEW LINK</text><text x="70" y="315" font-size="22" fill="#20384b">Exact requested pin</text><path d="M380 308H431" stroke="#306687" stroke-width="2.5" marker-end="url(#arrow)"/><text x="455" y="315" font-size="22" fill="#20384b">Current OR saved view</text><path d="M788 308H838" stroke="#306687" stroke-width="2.5" marker-end="url(#arrow)"/><text x="860" y="315" font-size="22" fill="#20384b">Admit / refuse</text><text x="70" y="341" font-size="16" fill="#536b7d">Saved-view admission keeps global health separate. No view means no historical exception.</text></g><g id="evidence"><rect x="50" y="369" width="1180" height="101" rx="10" fill="#ffffff"/><text x="70" y="397" font-size="17" fill="#47647a">IMPLEMENTATION EVIDENCE</text><text x="70" y="431" font-size="22" fill="#20384b">Original commit + digest</text><path d="M380 424H431" stroke="#306687" stroke-width="2.5" marker-end="url(#arrow)"/><text x="455" y="431" font-size="22" fill="#20384b">Author THEN Resolve</text><path d="M788 424H838" stroke="#306687" stroke-width="2.5" marker-end="url(#arrow)"/><text x="860" y="431" font-size="22" fill="#20384b">Named delivery OID</text><text x="70" y="457" font-size="16" fill="#536b7d">Both checks must pass. Pure movement is valid; recovery from a missing original is refused.</text></g><g id="intent"><rect x="50" y="485" width="1180" height="101" rx="10" fill="#ffffff"/><text x="70" y="513" font-size="17" fill="#47647a">ENTITY / RELATIONSHIP</text><text x="70" y="547" font-size="22" fill="#20384b">Explicit owner intent</text><path d="M380 540H431" stroke="#306687" stroke-width="2.5" marker-end="url(#arrow)"/><text x="455" y="547" font-size="22" fill="#20384b">Each implemented edge</text><path d="M788 540H838" stroke="#306687" stroke-width="2.5" marker-end="url(#arrow)"/><text x="860" y="547" font-size="22" fill="#20384b">Endpoints + own code</text><text x="70" y="573" font-size="16" fill="#536b7d">Proposed edges remain proposed. No promotion cascades; retained implemented edges are rechecked.</text></g></g></svg>