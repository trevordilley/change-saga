<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">The sidebar draws the same tree; addresses stay</title><desc id="desc">The flat list of every definition becomes three nested sections, and every existing link keeps working.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17324d"/></marker></defs>
<rect width="1280" height="720" fill="#f6f8fa"/>
<text x="60" y="52" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8a5a00" letter-spacing="1">REVIEW · TECHNICAL DESIGN SUB-PAGES / 2</text>
<text x="60" y="104" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#17324d">The sidebar draws the same tree; addresses stay</text>
<text x="60" y="146" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#4d6278">The areas reuse navSection rows; links keep the addresses readers already have.</text>
<g id="sidebar"><rect x="60" y="185" width="300" height="400" rx="10" fill="#fdf1f1" stroke="#9e1f1f" stroke-width="2" stroke-dasharray="8 5"/>
<text x="78" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#9e1f1f" letter-spacing="1">BEFORE · FLAT</text>
<text x="78" y="246" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#17324d">▾ Technical design</text>
<text x="102" y="276" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">3 Systems</text>
<text x="102" y="302" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">12 Components</text>
<text x="102" y="328" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">1 ERD</text>
<text x="102" y="354" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">20 data entities</text>
<text x="78" y="396" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">36 rows in one list,</text>
<text x="78" y="418" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">all shown whenever it opened</text>
<rect x="400" y="185" width="420" height="400" rx="10" fill="white" stroke="#1f5f9e" stroke-width="2"/>
<text x="418" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f5f9e" letter-spacing="1">AFTER · NESTED</text>
<text x="418" y="246" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#17324d">▾ Technical design</text>
<text x="442" y="276" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#17324d">▾ ERD</text>
<text x="472" y="304" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">Code reference</text>
<rect x="464" y="314" width="330" height="28" rx="5" fill="#e6eef6"/>
<text x="472" y="334" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f5f9e" font-weight="bold">Item · aria-current="page"</text>
<text x="472" y="362" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">… one row per data entity</text>
<text x="442" y="394" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#17324d">▸ Systems</text>
<text x="442" y="424" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#17324d">▸ Components</text>
<text x="418" y="470" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">Area rows open their page; twisties disclose rows.</text>
<text x="418" y="494" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">Ancestors of the current row open, others stay shut.</text>
<text x="418" y="518" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">ERD and overlay pages mark the ERD row current.</text>
</g>
<path d="M360 385L400 385" stroke="#17324d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g id="addresses"><rect x="860" y="185" width="360" height="400" rx="10" fill="#fff8ec" stroke="#1f5f9e" stroke-width="2" stroke-dasharray="8 5"/>
<text x="878" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f5f9e" letter-spacing="1">KEPT</text>
<text x="878" y="248" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#17324d">/technical/{kind}/{id}</text>
<text x="878" y="276" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">and ?revision= pins: unchanged,</text>
<text x="878" y="298" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">no redirect</text>
<text x="878" y="340" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#17324d">Breadcrumb</text>
<text x="878" y="366" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">Overview / Technical design /</text>
<text x="878" y="388" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">ERD / Item</text>
<text x="878" y="430" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#17324d">Old fragments</text>
<text x="878" y="456" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">#technical-systems-section</text>
<text x="878" y="478" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">and siblings are now ids of the</text>
<text x="878" y="500" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4d6278">landing page's area entries</text>
</g>
<rect x="60" y="610" width="1160" height="60" rx="10" fill="#e6eef6"/><text x="84" y="646" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#17324d">Slides, drawers and reviews link definition pages, so those addresses could not move.</text>
</svg>
