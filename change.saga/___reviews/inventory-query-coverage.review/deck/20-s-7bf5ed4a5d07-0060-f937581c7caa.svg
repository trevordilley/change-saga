<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Public contract and proof</title><desc id="desc">What agents can rely on, and how the behavior is exercised.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306687"/></marker></defs><rect width="1280" height="720" fill="#f1f5f8"/><g font-family="Arial,sans-serif"><text x="50" y="48" font-size="16" fill="#47647a">REVIEW / CONTRACT AND VERIFICATION</text><text x="50" y="94" font-size="34" fill="#20384b" font-weight="bold">Public contract and proof</text><text x="50" y="128" font-size="19" fill="#20384b">Three new query operations, one reconcile section; tests from pure fixtures to real CLI Sagas.</text><g id="contract"><rect x="50" y="160" width="560" height="200" rx="10" fill="#dce8f0" stroke="#9fb7c8" stroke-width="1.5"/><text x="64" y="188" font-size="19" fill="#20384b" font-weight="bold">Public contract</text><text x="64" y="214" font-size="15" fill="#536b7d">query inventory: new flags + response fields</text><text x="64" y="236" font-size="15" fill="#536b7d">new ops: inventory-uses, inventory-coverage,</text><text x="64" y="258" font-size="15" fill="#536b7d">inventory-selections; schema paths + pages</text><text x="64" y="280" font-size="15" fill="#536b7d">skill references regenerated and revised</text><text x="64" y="302" font-size="15" fill="#536b7d">(map realignment in query.go is gofmt)</text></g><g id="unit-tests"><rect x="670" y="160" width="560" height="200" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="684" y="188" font-size="19" fill="#20384b" font-weight="bold">Projection tests</text><text x="684" y="214" font-size="15" fill="#536b7d">temporary Git repos: movement, inside vs</text><text x="684" y="236" font-size="15" fill="#536b7d">outside edits, deletion, digest mismatch,</text><text x="684" y="258" font-size="15" fill="#536b7d">conflicts, cycles, depth cuts, legacy IDs,</text><text x="684" y="280" font-size="15" fill="#536b7d">status parity with LinkStatus</text></g><g id="cli-fixtures"><rect x="50" y="390" width="360" height="230" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="64" y="418" font-size="19" fill="#20384b" font-weight="bold">CLI fixtures</text><text x="64" y="444" font-size="15" fill="#536b7d">Saga committed in its repo:</text><text x="64" y="466" font-size="15" fill="#536b7d">absent / unreadable / base / head</text><text x="64" y="488" font-size="15" fill="#536b7d">filters under conflicts, pages,</text><text x="64" y="510" font-size="15" fill="#536b7d">coverage overlap and staleness,</text><text x="64" y="532" font-size="15" fill="#536b7d">reconcile debt classes</text></g><g id="e2e"><rect x="460" y="390" width="360" height="230" rx="10" fill="#e6f3ea" stroke="#6aa57b" stroke-width="1.5"/><text x="474" y="418" font-size="19" fill="#20384b" font-weight="bold">Format-2 end to end</text><text x="474" y="444" font-size="15" fill="#536b7d">records fixture via real writers</text><text x="474" y="466" font-size="15" fill="#536b7d">+ add-item selections: intent,</text><text x="474" y="488" font-size="15" fill="#536b7d">newness, scope, uses, exact</text><text x="474" y="510" font-size="15" fill="#536b7d">inherited lines, drift -> Item task,</text><text x="474" y="532" font-size="15" fill="#536b7d">no pseudo evidence anywhere</text></g><g id="bench"><rect x="870" y="390" width="360" height="110" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="884" y="418" font-size="19" fill="#20384b" font-weight="bold">Benchmarks</text><text x="884" y="444" font-size="15" fill="#536b7d">index, uses, counts, scope</text><text x="884" y="466" font-size="15" fill="#536b7d">to 8,000 records</text></g><g id="docs"><rect x="870" y="510" width="360" height="110" rx="10" fill="#ffffff" stroke="#9fb7c8" stroke-width="1.5"/><text x="884" y="538" font-size="19" fill="#20384b" font-weight="bold">Implementation note</text><text x="884" y="564" font-size="15" fill="#536b7d">delivered behavior + measurements</text></g></g></svg>