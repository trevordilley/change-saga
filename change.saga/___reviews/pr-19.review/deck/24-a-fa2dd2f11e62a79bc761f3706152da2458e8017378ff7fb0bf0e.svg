<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/1" aria-describedby="diagram-desc">
  <title id="diagram-title">A diagram unfolds only when a reader opens its slide</title>
  <desc id="diagram-desc">One opt-in document field fades a diagram in by step; without the reveal fragment, every other surface sees the finished drawing.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}</style>
    <style>@media (prefers-reduced-motion:no-preference){#diagram-reveal:target~* [data-reveal-step],#diagram-reveal:target~[data-reveal-step]{animation-name:diagram-reveal-fade;animation-duration:500ms;animation-timing-function:ease-out;animation-fill-mode:backwards}#diagram-reveal-replay:target~* [data-reveal-step],#diagram-reveal-replay:target~[data-reveal-step]{animation-name:diagram-reveal-replay-fade;animation-duration:500ms;animation-timing-function:ease-out;animation-fill-mode:backwards}[data-reveal-step="2"]{animation-delay:350ms}[data-reveal-step="3"]{animation-delay:700ms}[data-reveal-step="4"]{animation-delay:1050ms}[data-reveal-step="5"]{animation-delay:1400ms}}@keyframes diagram-reveal-fade{from{opacity:0}}@keyframes diagram-reveal-replay-fade{from{opacity:0}}</style>
    <marker id="diagram-head-to-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
    <marker id="diagram-head-to-svg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
    <marker id="diagram-head-to-viewer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
    <marker id="diagram-head-to-finished" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g id="diagram-reveal"/>
  <g id="diagram-reveal-replay"/>
  <rect width="1280" height="720" fill="#fafaf8"/>
  <g id="heading" data-diagram-kind="text" transform="translate(40 28)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve"><tspan x="0" y="34">Opt-in reveal: source to viewer</tspan></text>
  </g>
  <g id="source" data-diagram-kind="node" transform="translate(40 150)" data-reveal-step="1" role="group" aria-label="Source">
    <desc>Set with the canvas operation; a step without a reveal is refused by name, so describe never shows a dead field.</desc>
    <rect width="270" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">Source</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve"><tspan x="18" y="73">"reveal": "fade" plus an optional</tspan><tspan x="18" y="91.75">per-element step</tspan></text>
  </g>
  <g id="to-plan" data-diagram-kind="edge" transform="translate(0 0)" data-reveal-step="2" role="group" aria-label="source to plan" data-from="source" data-to="plan">
    <path d="M310 220 L350 220" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-to-plan)"/>
  </g>
  <g id="plan" data-diagram-kind="node" transform="translate(350 150)" data-reveal-step="2" role="group" aria-label="Reveal plan">
    <desc>Steps are ranked, so 10 and 900 play as two consecutive steps. A decorative element without a step enters with its group, or is there from the start.</desc>
    <rect width="270" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">Reveal plan</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve"><tspan x="18" y="73">Reading order by default; no</tspan><tspan x="18" y="91.75">element before its group</tspan></text>
  </g>
  <g id="to-svg" data-diagram-kind="edge" transform="translate(0 0)" data-reveal-step="3" role="group" aria-label="plan to svg" data-from="plan" data-to="svg">
    <path d="M620 220 L660 220" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-to-svg)"/>
  </g>
  <g id="svg" data-diagram-kind="node" transform="translate(660 150)" data-reveal-step="3" role="group" aria-label="SVG keyframes">
    <desc>No script and no author CSS: the renderer writes one &lt;style&gt;, two empty anchor groups, and a data-reveal-step per animated element. A static diagram renders byte for byte as before.</desc>
    <rect width="270" height="140" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve"><tspan x="18" y="40">SVG keyframes</tspan></text>
    <text x="18" y="73" font-size="15" fill="#153869" xml:space="preserve"><tspan x="18" y="73">CSS keyed to :target of anchors;</tspan><tspan x="18" y="91.75">none under reduced motion</tspan></text>
  </g>
  <g id="to-viewer" data-diagram-kind="edge" transform="translate(0 0)" data-reveal-step="4" role="group" aria-label="svg to viewer" data-from="svg" data-to="viewer">
    <path d="M930 220 L970 220" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-to-viewer)"/>
  </g>
  <g id="viewer" data-diagram-kind="node" transform="translate(970 150)" data-reveal-step="4" role="group" aria-label="Viewer">
    <rect width="270" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">Viewer</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve"><tspan x="18" y="73">Each newly shown slide retargets</tspan><tspan x="18" y="91.75">its SVG frames</tspan></text>
  </g>
  <g id="to-finished" data-diagram-kind="edge" transform="translate(0 0)" data-reveal-step="5" role="group" aria-label="no fragment" data-from="svg" data-to="finished">
    <path d="M795 290 L795 390" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-to-finished)"/>
    <text x="805" y="344" font-size="18" fill="#526174" xml:space="preserve"><tspan x="805" y="344">no fragment</tspan></text>
  </g>
  <g id="finished" data-diagram-kind="node" transform="translate(660 390)" data-reveal-step="5" role="group" aria-label="Finished drawing">
    <desc>An element landmark sets the frame's fragment to its element after the viewer's replay, so a direct link always shows the whole drawing.</desc>
    <rect width="270" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">Finished drawing</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve"><tspan x="18" y="73">Thumbnails, exports, visual QA,</tspan><tspan x="18" y="91.75">and landmark links</tspan></text>
  </g>
  <g id="caption" data-diagram-kind="text" transform="translate(40 600)" aria-hidden="true">
    <text x="0" y="15" font-size="15" fill="#526174" xml:space="preserve"><tspan x="0" y="15">Order: source, plan, SVG, viewer, then the finished state every other surface shows.</tspan></text>
  </g>
</svg>
