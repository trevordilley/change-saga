<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/1" aria-describedby="diagram-desc">
  <title id="diagram-title">A diff shows its lines, not its hunk</title>
  <desc id="diagram-desc">A reference's diff is cut to its lines plus three either side, so a reference into a newly added file shows that part, not the file.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}</style>
    <marker id="diagram-head-cut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
    <marker id="diagram-head-show" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(60 28)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve"><tspan x="0" y="34">A diff shows its lines, not its hunk</tspan></text>
  </g>
  <g id="hunk" data-diagram-kind="node" transform="translate(60 260)" role="group" aria-label="Hunk: may be a new file">
    <rect width="320" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">Hunk: may be a new file</tspan></text>
  </g>
  <g id="trim" data-diagram-kind="node" transform="translate(480 260)" role="group" aria-label="trimDiffToRange: lines ±3">
    <rect width="320" height="110" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve"><tspan x="18" y="40">trimDiffToRange: lines ±3</tspan></text>
  </g>
  <g id="panel" data-diagram-kind="node" transform="translate(900 260)" role="group" aria-label="Diff in the drawer">
    <rect width="320" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">Diff in the drawer</tspan></text>
  </g>
  <g id="oracle" data-diagram-kind="node" transform="translate(480 490)" role="group" aria-label="Oracle test mirrors the trim">
    <rect width="320" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">Oracle test mirrors the trim</tspan></text>
  </g>
  <g id="cut" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="hunk to trim" data-from="hunk" data-to="trim">
    <path d="M380 315 L480 315" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-cut)"/>
  </g>
  <g id="show" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="trim to panel" data-from="trim" data-to="panel">
    <path d="M800 315 L900 315" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-show)"/>
  </g>
</svg>
