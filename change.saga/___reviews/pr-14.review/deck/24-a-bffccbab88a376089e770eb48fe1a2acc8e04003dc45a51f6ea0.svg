<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">The popover lives on the page, not in the frame</title>
  <desc id="diagram-desc">The server renders each note into an inert template; the page script measures a copy of the SVG and shows one popover beside the hotspot.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-boundary-fill:#f0f3f6;--diagram-boundary-stroke:#c3cdd8;--diagram-canvas:#fafaf8;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-primary-fill:#edf5ff;--diagram-primary-ink:#153869;--diagram-primary-stroke:#2563eb;--diagram-secondary-ink:#526174;--diagram-secondary-stroke:#94a3b8;--diagram-title-ink:#172033;--diagram-warning-fill:#fff7e6;--diagram-warning-ink:#805015;--diagram-warning-stroke:#b7791f;}@media (prefers-color-scheme:dark){:root{--diagram-boundary-fill:#161b22;--diagram-boundary-stroke:#30363d;--diagram-canvas:#0d1117;--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-primary-fill:#0c2d6b;--diagram-primary-ink:#cae8ff;--diagram-primary-stroke:#4493f8;--diagram-secondary-ink:#9198a1;--diagram-secondary-stroke:#6e7681;--diagram-title-ink:#e6edf3;--diagram-warning-fill:#2d240c;--diagram-warning-ink:#f2cc60;--diagram-warning-stroke:#d29922;}}</style>
    <marker id="diagram-head-sanitize" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-clone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-measure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-show" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#fafaf8" style="fill:var(--diagram-canvas,#fafaf8)"/>
  <g id="title" data-diagram-kind="text" transform="translate(60 28)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">The popover lives on the page, not in the frame</tspan></text>
  </g>
  <g id="loader" data-diagram-kind="node" transform="translate(60 140)" role="group" aria-label="Load slide notes">
    <rect width="320" height="100" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">Load slide notes</tspan></text>
  </g>
  <g id="templates" data-diagram-kind="node" transform="translate(520 140)" role="group" aria-label="Templates by landmarks">
    <rect width="340" height="100" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">Templates by landmarks</tspan></text>
  </g>
  <g id="badge" data-diagram-kind="node" transform="translate(940 140)" role="group" aria-label="Surprise badge">
    <desc>When a callout and another Item select the same element, the callout's hotspot lets clicks through; only its badge takes the pointer.</desc>
    <rect width="290" height="100" rx="8" fill="#fff7e6" stroke="#b7791f" stroke-width="2" style="fill:var(--diagram-warning-fill,#fff7e6);stroke:var(--diagram-warning-stroke,#b7791f)"/>
    <text x="18" y="37" font-size="19" fill="#805015" xml:space="preserve" style="fill:var(--diagram-warning-ink,#805015)"><tspan x="18" y="37">Surprise badge</tspan></text>
    <text x="18" y="73" font-size="15" fill="#805015" xml:space="preserve" style="fill:var(--diagram-warning-ink,#805015)"><tspan x="18" y="73">bottom-left, never covering</tspan></text>
  </g>
  <g id="frame" data-diagram-kind="group" transform="translate(60 360)" role="group" aria-label="Sandboxed slide frame">
    <desc>Still sandbox="allow-scripts" on an opaque origin. No note enters it, so authored script never runs on the app origin.</desc>
    <rect width="360" height="220" rx="10" fill="#f0f3f6" stroke="#c3cdd8" stroke-width="1" stroke-dasharray="7 6" style="fill:var(--diagram-boundary-fill,#f0f3f6);stroke:var(--diagram-boundary-stroke,#c3cdd8)"/>
    <text x="18" y="30" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="18" y="30">Sandboxed slide frame</tspan></text>
    <g id="svg" data-diagram-kind="node" transform="translate(40 80)" role="group" aria-label="Slide SVG">
      <rect width="280" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
      <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Slide SVG</tspan></text>
    </g>
  </g>
  <g id="script" data-diagram-kind="node" transform="translate(540 420)" role="group" aria-label="Page script">
    <rect width="300" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Page script</tspan></text>
  </g>
  <g id="popover" data-diagram-kind="node" transform="translate(940 420)" role="group" aria-label="One popover">
    <rect width="290" height="100" rx="8" fill="#fff7e6" stroke="#b7791f" stroke-width="2" style="fill:var(--diagram-warning-fill,#fff7e6);stroke:var(--diagram-warning-stroke,#b7791f)"/>
    <text x="18" y="37" font-size="19" fill="#805015" xml:space="preserve" style="fill:var(--diagram-warning-ink,#805015)"><tspan x="18" y="37">One popover</tspan></text>
    <text x="18" y="73" font-size="15" fill="#805015" xml:space="preserve" style="fill:var(--diagram-warning-ink,#805015)"><tspan x="18" y="73">beside the hotspot, never blocking</tspan></text>
  </g>
  <g id="tests" data-diagram-kind="text" transform="translate(60 630)" role="group" aria-label="Tests: sanitized server output, browser hover, keyboard, tap">
    <text x="0" y="15" font-size="15" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="0" y="15">Tests: sanitized server output, browser hover, keyboard, tap</tspan></text>
  </g>
  <g id="sanitize" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="sanitize" data-from="loader" data-to="templates">
    <desc>markdownWithAnchors, the goldmark renderer authored fragments already use: raw HTML is escaped and unsafe links are neutralized, even if a source on disk skipped validation.</desc>
    <path d="M380 190 L520 190" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-sanitize)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="396" y="170" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="396" y="170">sanitize</tspan></text>
  </g>
  <g id="clone" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="clone" data-from="templates" data-to="script">
    <path d="M690 240 L690 420" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-clone)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="705" y="334" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="705" y="334">clone</tspan></text>
  </g>
  <g id="measure" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="measure" data-from="svg" data-to="script">
    <desc>Fetches a copy of the SVG into an inert shadow root, as Item hotspots already did, to find each noted element's box.</desc>
    <path d="M380 490 L540 490" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-measure)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="424" y="470" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="424" y="470">measure</tspan></text>
  </g>
  <g id="show" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="show" data-from="script" data-to="popover">
    <desc>- Hover: opens, and lets the pointer through
- Focus, click, or tap: pins it, so its links take focus and clicks
- Escape, moving away, or a slide change: closes</desc>
    <path d="M840 470 L940 470" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-show)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="856" y="450" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="856" y="450">show</tspan></text>
  </g>
</svg>
