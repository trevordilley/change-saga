<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/1" aria-describedby="diagram-desc">
  <title id="diagram-title">Notes are depth on demand</title>
  <desc id="diagram-desc">The spec defines the note contract; the skill tells authors to use notes for the why a label cannot hold, and to keep surprises in callouts.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}</style>
    <marker id="diagram-head-guides" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
    <marker id="diagram-head-details" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#fafaf8"/>
  <g id="title" data-diagram-kind="text" transform="translate(60 28)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve"><tspan x="0" y="34">Notes are depth on demand</tspan></text>
  </g>
  <g id="spec" data-diagram-kind="node" transform="translate(60 260)" role="group" aria-label="SPEC.md">
    <rect width="320" height="110" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve"><tspan x="18" y="40">SPEC.md</tspan></text>
    <text x="18" y="73" font-size="15" fill="#153869" xml:space="preserve"><tspan x="18" y="73">the note contract</tspan></text>
  </g>
  <g id="fast-path" data-diagram-kind="node" transform="translate(480 260)" role="group" aria-label="Skill fast path">
    <rect width="320" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">Skill fast path</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve"><tspan x="18" y="73">when to add a note</tspan></text>
  </g>
  <g id="reference" data-diagram-kind="node" transform="translate(900 260)" role="group" aria-label="Diagrams reference">
    <desc>Its review-slide example now carries a note on the miss edge, and a test keeps that example rendering.</desc>
    <rect width="320" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve"><tspan x="18" y="40">Diagrams reference</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve"><tspan x="18" y="73">rules and the example</tspan></text>
  </g>
  <g id="guides" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="spec to fast-path" data-from="spec" data-to="fast-path">
    <path d="M380 315 L480 315" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-guides)"/>
  </g>
  <g id="details" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="fast-path to reference" data-from="fast-path" data-to="reference">
    <path d="M800 315 L900 315" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-details)"/>
  </g>
  <g id="rule" data-diagram-kind="text" transform="translate(60 470)" role="group" aria-label="Surprises stay in callouts; a note is never padding.">
    <desc>Omit a note when there is nothing to add. Never manufacture detail to fill one.</desc>
    <text x="0" y="15" font-size="15" fill="#526174" xml:space="preserve"><tspan x="0" y="15">Surprises stay in callouts; a note is never padding.</tspan></text>
  </g>
</svg>
